<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MyMessenger</title>

<style>
:root {
    --bg: #080d14;
    --sidebar: #0d141d;
    --panel: #111b27;
    --panel2: #172333;
    --input: #1b2939;
    --border: rgba(255,255,255,.07);
    --text: #f3f7fb;
    --muted: #8190a1;
    --blue: #229ed9;
    --blue2: #168ac0;
    --green: #35c759;
    --red: #ff4d5e;
    --shadow: 0 15px 50px rgba(0,0,0,.28);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #17283a 0,
            var(--bg) 35%
        );

    color: var(--text);
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* =====================================================
AUTH
===================================================== */

.auth {
    width: 420px;
    max-width: calc(100% - 30px);

    margin: 8vh auto;

    padding: 32px;

    border: 1px solid var(--border);
    border-radius: 26px;

    background:
        linear-gradient(
            145deg,
            rgba(23,34,49,.96),
            rgba(10,17,25,.96)
        );

    box-shadow: var(--shadow);
}

.auth-logo {
    width: 74px;
    height: 74px;

    margin: 0 auto 18px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            #4bc5ff
        );

    box-shadow:
        0 10px 35px rgba(34,158,217,.3);
}

.auth h1 {
    text-align: center;
    margin: 0;
}

.auth-subtitle {
    text-align: center;
    color: var(--muted);
    margin: 8px 0 24px;
}

.auth input {
    width: 100%;

    padding: 14px 15px;
    margin: 6px 0;

    color: white;
    background: var(--input);

    border: 1px solid transparent;
    border-radius: 13px;

    outline: none;

    transition: .2s;
}

.auth input:focus {
    border-color: rgba(34,158,217,.7);
    box-shadow: 0 0 0 3px rgba(34,158,217,.1);
}

.auth button {
    width: 100%;

    padding: 13px;

    margin-top: 9px;

    border: 0;
    border-radius: 13px;

    color: white;
    background: var(--blue);

    transition: .2s;
}

.auth button:hover {
    background: var(--blue2);
    transform: translateY(-1px);
}

/* =====================================================
APP
===================================================== */

#app {
    display: none;

    width: 100%;
    height: 100vh;
}

.sidebar {
    width: 330px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        linear-gradient(
            180deg,
            #101a25,
            #0b121b
        );

    border-right: 1px solid var(--border);
}

.logo {
    padding: 20px;

    font-size: 21px;
    font-weight: 800;

    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 38px;
    height: 38px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--blue);
}

.search-wrap {
    padding: 0 14px 14px;
}

.search {
    width: 100%;

    padding: 12px 15px;

    color: white;
    background: var(--input);

    border: 1px solid transparent;
    border-radius: 13px;

    outline: none;
}

.search:focus {
    border-color: rgba(34,158,217,.5);
}

.users {
    overflow-y: auto;
    padding-bottom: 15px;
}

.user {
    margin: 3px 8px;
    padding: 11px;

    display: flex;
    align-items: center;
    gap: 12px;

    border-radius: 14px;

    cursor: pointer;

    transition: .18s;
}

.user:hover {
    background: rgba(255,255,255,.055);
}

.user.active {
    background: rgba(34,158,217,.16);
}

.avatar {
    width: 47px;
    height: 47px;

    border-radius: 50%;

    object-fit: cover;

    background:
        linear-gradient(
            135deg,
            #1e9bd7,
            #17638d
        );

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    color: white;
    font-weight: 700;
}

.user-name {
    font-weight: 700;
}

.user-username {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

/* =====================================================
MAIN
===================================================== */

.main {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}

.topbar {
    height: 68px;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(13,20,29,.86);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid var(--border);
}

.page-title {
    display: flex;
    align-items: center;
    gap: 9px;
}

.top-actions {
    display: flex;
    gap: 7px;
}

.icon-button {
    width: 42px;
    height: 42px;

    border: 1px solid var(--border);
    border-radius: 12px;

    color: white;
    background: var(--panel2);

    transition: .2s;
}

.icon-button:hover {
    background: #21354a;
    transform: translateY(-1px);
}

.content {
    flex: 1;
    min-height: 0;

    position: relative;
}

.view {
    height: 100%;
    overflow-y: auto;
    padding: 25px;
}

/* =====================================================
CHAT
===================================================== */

.chat {
    height: 100%;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            rgba(26,51,73,.15),
            transparent 55%
        );
}

.chat-header {
    padding: 14px 20px;

    background: rgba(17,27,39,.9);

    border-bottom: 1px solid var(--border);

    font-weight: 700;
}

.messages {
    flex: 1;

    padding: 24px;

    overflow-y: auto;
}

.message {
    position: relative;

    width: fit-content;
    max-width: min(600px, 70%);

    margin: 8px 0;

    padding: 10px 13px;

    background: #172333;

    border-radius: 15px 15px 15px 5px;

    box-shadow: 0 4px 15px rgba(0,0,0,.12);

    animation: messageIn .18s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Свои сообщения справа */
.message.mine {
    margin-left: auto;
    margin-right: 0;

    background:
        linear-gradient(
            135deg,
            #197bb1,
            #176b9c
        );

    border-radius: 15px 15px 5px 15px;
}

.message-text {
    white-space: pre-wrap;
    word-break: break-word;
}

.time {
    color: rgba(255,255,255,.58);

    font-size: 11px;

    text-align: right;

    margin-top: 5px;
}

.message-actions {
    display: none;

    position: absolute;

    right: 6px;
    top: -35px;

    background: #101a25;

    border: 1px solid var(--border);

    border-radius: 10px;

    padding: 4px;

    box-shadow: var(--shadow);

    gap: 3px;
}

.message:hover .message-actions {
    display: flex;
}

.message-actions button {
    border: 0;
    background: transparent;
    color: white;

    padding: 6px 8px;

    border-radius: 7px;
}

.message-actions button:hover {
    background: rgba(255,255,255,.1);
}

.composer {
    padding: 14px;

    display: flex;
    gap: 9px;

    background: rgba(13,20,29,.94);

    border-top: 1px solid var(--border);
}

.composer input {
    flex: 1;

    min-width: 0;

    padding: 13px 16px;

    border: 1px solid transparent;
    border-radius: 14px;

    outline: none;

    color: white;
    background: var(--input);
}

.composer input:focus {
    border-color: rgba(34,158,217,.5);
}

.send {
    width: 51px;

    border: 0;
    border-radius: 14px;

    color: white;
    background: var(--blue);

    font-size: 19px;
}

.send:hover {
    background: var(--blue2);
}

/* =====================================================
FEED
===================================================== */

.feed {
    max-width: 760px;
    margin: auto;
}

.post-box,
.post {
    background:
        linear-gradient(
            145deg,
            rgba(22,34,48,.96),
            rgba(15,24,35,.96)
        );

    border: 1px solid var(--border);

    border-radius: 19px;

    padding: 17px;

    margin-bottom: 16px;

    box-shadow: 0 7px 30px rgba(0,0,0,.12);
}

.post-box textarea {
    width: 100%;

    min-height: 90px;

    resize: vertical;

    padding: 13px;

    color: white;
    background: var(--input);

    border: 1px solid transparent;
    border-radius: 13px;

    outline: none;
}

.post-box textarea:focus {
    border-color: rgba(34,158,217,.5);
}

.post-tools {
    display: flex;
    gap: 8px;
    margin-top: 11px;
}

.post-tools button,
.post-tools label {
    border: 0;

    padding: 10px 14px;

    border-radius: 11px;

    color: white;
    background: var(--blue);

    cursor: pointer;

    transition: .2s;
}

.post-tools button:hover,
.post-tools label:hover {
    background: var(--blue2);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 11px;

    cursor: pointer;
}

.post-author {
    font-weight: 750;
}

.post-username {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.post-text {
    white-space: pre-wrap;

    line-height: 1.55;

    margin: 15px 0;
}

.post-media {
    width: 100%;
    max-height: 600px;

    object-fit: contain;

    border-radius: 14px;

    background: #070b10;
}

.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;

    margin-top: 12px;
}

.post-actions button {
    border: 0;

    color: #dbe9f5;
    background: #1c2b3b;

    padding: 8px 12px;

    border-radius: 10px;

    transition: .15s;
}

.post-actions button:hover {
    background: #263c51;
}

.comments {
    margin-top: 13px;

    border-top: 1px solid var(--border);

    padding-top: 10px;
}

.comment {
    padding: 10px;

    margin-top: 7px;

    border-radius: 11px;

    background: rgba(255,255,255,.045);

    line-height: 1.4;
}

.comment small {
    color: var(--muted);
}

.comment-input {
    display: flex;
    gap: 7px;

    margin-top: 9px;
}

.comment-input input {
    flex: 1;

    min-width: 0;

    border: 0;

    padding: 10px 12px;

    border-radius: 10px;

    color: white;
    background: var(--input);

    outline: none;
}

.comment-input button {
    border: 0;

    padding: 0 14px;

    border-radius: 10px;

    color: white;
    background: var(--blue);
}

/* =====================================================
PROFILE
===================================================== */

.profile {
    max-width: 620px;
    margin: auto;
}

.profile-card {
    background:
        linear-gradient(
            145deg,
            #172638,
            #101a26
        );

    border: 1px solid var(--border);

    border-radius: 23px;

    padding: 30px;

    text-align: center;

    box-shadow: var(--shadow);
}

.big-avatar {
    width: 120px;
    height: 120px;

    border-radius: 50%;

    object-fit: cover;

    margin: 0 auto 18px;

    display: block;

    border: 4px solid rgba(255,255,255,.08);

    background:
        url("https://i.imgur.com/7NFHga3.png")
        center/cover;
}

.profile input,
.profile textarea {
    width: 100%;

    margin: 7px 0;

    padding: 13px;

    border: 1px solid transparent;
    border-radius: 12px;

    color: white;
    background: var(--input);

    outline: none;
}

.profile textarea {
    min-height: 100px;
    resize: vertical;
}

.profile input:focus,
.profile textarea:focus {
    border-color: rgba(34,158,217,.5);
}

.primary {
    background: var(--blue);

    border: 0;

    color: white;

    padding: 11px 16px;

    border-radius: 11px;

    margin-top: 8px;
}

.primary:hover {
    background: var(--blue2);
}

.danger {
    background: #b93242;

    border: 0;

    color: white;

    padding: 11px 16px;

    border-radius: 11px;

    margin-top: 10px;
}

/* =====================================================
SCROLLBAR
===================================================== */

::-webkit-scrollbar {
    width: 7px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #263747;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #355069;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width: 800px) {

    .sidebar {
        width: 78px;
    }

    .logo {
        justify-content: center;
        padding: 15px 5px;
    }

    .logo-text {
        display: none;
    }

    .search-wrap {
        padding: 5px;
    }

    .search {
        font-size: 0;
        padding: 12px 5px;
    }

    .user {
        justify-content: center;
        margin: 3px;
        padding: 9px 4px;
    }

    .user-info {
        display: none;
    }

    .view {
        padding: 10px;
    }

    .message {
        max-width: 85%;
    }

    .topbar {
        padding: 0 10px;
    }

    .profile-card {
        padding: 20px;
    }
}

@media(max-width: 500px) {

    .top-actions {
        gap: 3px;
    }

    .icon-button {
        width: 38px;
        height: 38px;
    }

    .messages {
        padding: 14px;
    }

    .post-box,
    .post {
        border-radius: 15px;
        padding: 13px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
AUTH
===================================================== -->

<div class="auth" id="auth">

    <div class="auth-logo">
        💬
    </div>

    <h1>MyMessenger</h1>

    <div class="auth-subtitle">
        Общайся с друзьями по всему миру
    </div>

    <input
        id="username"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
    >

    <button onclick="login()">
        Войти
    </button>

    <button onclick="register()">
        Создать аккаунт
    </button>

    <p id="authError"></p>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                💬
            </div>

            <span class="logo-text">
                MyMessenger
            </span>

        </div>

        <div class="search-wrap">

            <input
                class="search"
                id="search"
                placeholder="🔎 Поиск пользователей..."
                oninput="searchUsers()"
            >

        </div>

        <div
            class="users"
            id="users"
        ></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong
                class="page-title"
                id="pageTitle"
            >
                📰 Лента
            </strong>

            <div class="top-actions">

                <button
                    class="icon-button"
                    onclick="showFeed()"
                    title="Лента"
                >
                    📰
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                    title="Профиль"
                >
                    👤
                </button>

                <button
                    class="icon-button"
                    onclick="logout()"
                    title="Выйти"
                >
                    🚪
                </button>

            </div>

        </div>


        <div class="content">

            <!-- =================================================
            FEED
            ================================================= -->

            <section
                class="view"
                id="feedView"
            >

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button
                                onclick="publishPost()"
                            >
                                📝 Опубликовать
                            </button>

                            <label>

                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                >

                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- =================================================
            CHAT
            ================================================= -->

            <section
                class="view"
                id="chatView"
                style="display:none;padding:0"
            >

                <div class="chat">

                    <div
                        class="chat-header"
                        id="chatHeader"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        class="messages"
                        id="messages"
                    ></div>

                    <div class="composer">

                        <input
                            id="messageInput"
                            placeholder="Написать сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- =================================================
            PROFILE
            ================================================= -->

            <section
                class="view"
                id="profileView"
                style="display:none"
            >

                <div class="profile">

                    <div class="profile-card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            src="https://i.imgur.com/7NFHga3.png"
                            alt="Avatar"
                        >

                        <h2>
                            ⚙️ Профиль
                        </h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>
                            🖼️ Новый аватар
                        </p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить профиль
                        </button>

                        <br>

                        <button
                            class="danger"
                            onclick="logout()"
                        >
                            🚪 Выйти из аккаунта
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script>

/* =====================================================
CONFIG
===================================================== */

const API = "";


/* =====================================================
STATE
===================================================== */

let token =
    localStorage.getItem("token");

let currentUser = null;

let selectedUser = null;

let socket = null;


/* =====================================================
API
===================================================== */

function api(path) {
    return API + path;
}


async function request(
    path,
    options = {}
) {

    options.headers =
        options.headers || {};

    if (token) {

        options.headers.Authorization =
            "Bearer " + token;

    }

    return fetch(
        api(path),
        options
    );

}


/* =====================================================
AUTH
===================================================== */

async function register() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/register"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Ошибка регистрации"
            );

        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).innerText =
            error.message;

    }

}


async function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/login"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Ошибка входа"
            );

        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).innerText =
            error.message;

    }

}


/* =====================================================
START
===================================================== */

async function startApp() {

    const response =
        await request(
            "/api/me"
        );

    if (!response.ok) {

        logout();

        return;

    }

    currentUser =
        await response.json();

    document.getElementById(
        "auth"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "flex";

    connectWebSocket();

    searchUsers();

    showFeed();

}


/* =====================================================
LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "token"
    );

    token = null;

    if (socket) {

        try {
            socket.close();
        } catch {}

    }

    location.reload();

}


/* =====================================================
WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!currentUser) return;

    let base;

    if (API) {

        base = API;

    } else {

        base =
            location.protocol === "https:"
                ? "https://" + location.host
                : "http://" + location.host;

    }

    const wsBase =
        base
            .replace(
                "https://",
                "wss://"
            )
            .replace(
                "http://",
                "ws://"
            );

    socket =
        new WebSocket(
            wsBase +
            "/ws/" +
            currentUser.id
        );

    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );

            if (
                data.type === "message"
            ) {

                const message =
                    data.message;

                if (
                    selectedUser &&
                    (
                        (
                            message.sender_id ===
                            currentUser.id &&
                            message.receiver_id ===
                            selectedUser.id
                        )
                        ||
                        (
                            message.sender_id ===
                            selectedUser.id &&
                            message.receiver_id ===
                            currentUser.id
                        )
                    )
                ) {

                    addMessage(
                        message
                    );

                }

            }

        };

    socket.onclose =
        () => {

            setTimeout(
                connectWebSocket,
                3000
            );

        };

}


/* =====================================================
USERS
===================================================== */

async function searchUsers() {

    const q =
        document.getElementById(
            "search"
        ).value;

    const response =
        await request(
            "/api/users?q=" +
            encodeURIComponent(q)
        );

    if (!response.ok) return;

    const users =
        await response.json();

    const container =
        document.getElementById(
            "users"
        );

    container.innerHTML = "";

    users.forEach(
        user => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "user";

            element.innerHTML = `

                ${
                    user.avatar_url
                    ?
                    `<img
                        class="avatar"
                        src="${mediaUrl(
                            user.avatar_url
                        )}"
                    >`
                    :
                    `<img
                        class="avatar"
                        src="https://i.imgur.com/7NFHga3.png"
                    >`
                }

                <div class="user-info">

                    <div class="user-name">
                        ${escapeHtml(
                            user.display_name ||
                            user.username
                        )}
                    </div>

                    <div class="user-username">
                        @${escapeHtml(
                            user.username
                        )}
                    </div>

                </div>
            `;

            element.onclick =
                () => openChat(user);

            container.appendChild(
                element
            );

        }
    );

}


/* =====================================================
CHAT
===================================================== */

async function openChat(user) {

    selectedUser = user;

    document.getElementById(
        "feedView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "none";

    document.getElementById(
        "chatView"
    ).style.display = "block";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "💬 " +
        (
            user.display_name ||
            user.username
        );

    document.getElementById(
        "chatHeader"
    ).innerText =
        "👤 " +
        (
            user.display_name ||
            user.username
        );

    const response =
        await request(
            "/api/messages/" +
            user.id
        );

    if (!response.ok) return;

    const history =
        await response.json();

    const messages =
        document.getElementById(
            "messages"
        );

    messages.innerHTML = "";

    history.forEach(
        addMessage
    );

}


function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );

    const element =
        document.createElement(
            "div"
        );

    const mine =
        message.sender_id ===
        currentUser.id;

    element.className =
        "message " +
        (
            mine
            ? "mine"
            : ""
        );

    const date =
        new Date(
            message.created_at
        );

    element.innerHTML = `

        <div class="message-text">
            ${escapeHtml(
                message.text
            )}
        </div>

        <div class="time">

            ${date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}

            ${mine ? " ✓✓" : ""}

        </div>
    `;

    container.appendChild(
        element
    );

    container.scrollTop =
        container.scrollHeight;

}


async function sendMessage() {

    if (!selectedUser) {

        alert(
            "Выбери пользователя"
        );

        return;

    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    const response =
        await request(
            "/api/messages",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    receiver_id:
                        selectedUser.id,

                    text
                })
            }
        );

    if (!response.ok) {

        try {

            const data =
                await response.json();

            alert(
                data.detail ||
                "Ошибка"
            );

        } catch {

            alert(
                "Ошибка отправки"
            );

        }

    }

}


function messageKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/* =====================================================
FEED
===================================================== */

function showFeed() {

    document.getElementById(
        "feedView"
    ).style.display = "block";

    document.getElementById(
        "chatView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "none";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "📰 Лента";

    loadFeed();

}


async function loadFeed() {

    const response =
        await request(
            "/api/feed"
        );

    if (!response.ok) return;

    const posts =
        await response.json();

    const container =
        document.getElementById(
            "feed"
        );

    container.innerHTML = "";

    posts.forEach(
        renderPost
    );

}


function renderPost(post) {

    const container =
        document.getElementById(
            "feed"
        );

    const element =
        document.createElement(
            "article"
        );

    element.className =
        "post";

    const avatar =
        post.avatar_url
        ?
        `<img
            class="avatar"
            src="${mediaUrl(
                post.avatar_url
            )}"
        >`
        :
        `<img
            class="avatar"
            src="https://i.imgur.com/7NFHga3.png"
        >`;

    let media = "";

    if (
        post.media_url &&
        post.media_type === "image"
    ) {

        media = `
            <img
                class="post-media"
                src="${mediaUrl(
                    post.media_url
                )}"
            >
        `;

    }

    if (
        post.media_url &&
        post.media_type === "video"
    ) {

        media = `
            <video
                class="post-media"
                controls
                src="${mediaUrl(
                    post.media_url
                )}"
            ></video>
        `;

    }

    element.innerHTML = `

        <div class="post-header">

            ${avatar}

            <div>

                <div class="post-author">
                    ${escapeHtml(
                        post.display_name ||
                        post.username
                    )}
                </div>

                <div class="post-username">
                    @${escapeHtml(
                        post.username
                    )}
                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="post-text">
                ${escapeHtml(
                    post.text
                )}
            </div>`
            :
            ""
        }

        ${media}

        <div class="post-actions">

            <button
                onclick="likePost(${post.id})"
            >
                ❤️ ${post.likes}
            </button>

            <button
                onclick="showComments(${post.id})"
            >
                💬 ${post.comments}
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                🔗 Поделиться
            </button>

            ${
                post.author_id ===
                currentUser.id
                ?
                `<button
                    onclick="deletePost(${post.id})"
                >
                    🗑️
                </button>`
                :
                ""
            }

        </div>

        <div
            class="comments"
            id="comments-${post.id}"
        ></div>

    `;

    container.appendChild(
        element
    );

}


/* =====================================================
SHARE
===================================================== */

async function sharePost(postId) {

    const url =
        location.origin +
        "/?post=" +
        postId;

    try {

        if (
            navigator.share
        ) {

            await navigator.share({
                title: "MyMessenger",
                text: "Посмотри этот пост",
                url
            });

        } else {

            await navigator.clipboard.writeText(
                url
            );

            alert(
                "Ссылка скопирована!"
            );

        }

    } catch {}

}


/* =====================================================
PUBLISH
===================================================== */

async function publishPost() {

    const text =
        document.getElementById(
            "postText"
        ).value.trim();

    const file =
        document.getElementById(
            "mediaFile"
        ).files[0];

    if (!text && !file) {

        alert(
            "Добавь текст, фото или видео"
        );

        return;

    }

    try {

        if (file) {

            const form =
                new FormData();

            form.append(
                "file",
                file
            );

            form.append(
                "text",
                text
            );

            const response =
                await request(
                    "/api/posts/media",
                    {
                        method: "POST",
                        body: form
                    }
                );

            if (!response.ok) {

                const data =
                    await response.json();

                throw new Error(
                    data.detail
                );

            }

        } else {

            const response =
                await request(
                    "/api/posts",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            text
                        })
                    }
                );

            if (!response.ok) {

                const data =
                    await response.json();

                throw new Error(
                    data.detail
                );

            }

        }

        document.getElementById(
            "postText"
        ).value = "";

        document.getElementById(
            "mediaFile"
        ).value = "";

        await loadFeed();

    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =====================================================
LIKES
===================================================== */

async function likePost(postId) {

    await request(
        "/api/posts/" +
        postId +
        "/like",
        {
            method: "POST"
        }
    );

    loadFeed();

}


/* =====================================================
COMMENTS
===================================================== */

async function showComments(postId) {

    const container =
        document.getElementById(
            "comments-" +
            postId
        );

    if (
        container.innerHTML
    ) {

        container.innerHTML = "";

        return;

    }

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments"
        );

    if (!response.ok) return;

    const comments =
        await response.json();

    container.innerHTML = `

        <div class="comment-input">

            <input
                id="comment-${postId}"
                placeholder="Написать комментарий..."
            >

            <button
                onclick="sendComment(${postId})"
            >
                ➤
            </button>

        </div>

    `;

    comments.forEach(
        comment => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "comment";

            div.innerHTML = `
                <b>
                    ${escapeHtml(
                        comment.display_name ||
                        comment.username
                    )}
                </b>

                <br>

                ${escapeHtml(
                    comment.text
                )}
            `;

            container.appendChild(
                div
            );

        }
    );

}


async function sendComment(postId) {

    const input =
        document.getElementById(
            "comment-" +
            postId
        );

    const text =
        input.value.trim();

    if (!text) return;

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text
                })
            }
        );

    if (!response.ok) return;

    await showComments(
        postId
    );

}


/* =====================================================
DELETE POST
===================================================== */

async function deletePost(postId) {

    if (
        !confirm(
            "Удалить этот пост?"
        )
    ) return;

    await request(
        "/api/posts/" +
        postId,
        {
            method: "DELETE"
        }
    );

    loadFeed();

}


/* =====================================================
PROFILE
===================================================== */

function showProfile() {

    document.getElementById(
        "feedView"
    ).style.display = "none";

    document.getElementById(
        "chatView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "block";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "⚙️ Профиль";

    document.getElementById(
        "profileUsername"
    ).value =
        currentUser.username;

    document.getElementById(
        "profileName"
    ).value =
        currentUser.display_name ||
        currentUser.username;

    document.getElementById(
        "profileBio"
    ).value =
        currentUser.bio || "";

    setAvatar(
        currentUser.avatar_url
    );

}


function setAvatar(url) {

    const image =
        document.getElementById(
            "bigAvatar"
        );

    if (url) {

        image.src =
            mediaUrl(url);

    } else {

        image.src =
            "https://i.imgur.com/7NFHga3.png";

    }

}


async function saveProfile() {

    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();

    const display_name =
        document.getElementById(
            "profileName"
        ).value.trim();

    const bio =
        document.getElementById(
            "profileBio"
        ).value.trim();

    try {

        const response =
            await request(
                "/api/profile",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        display_name,
                        bio
                    })
                }
            );

        if (!response.ok) {

            const data =
                await response.json();

            throw new Error(
                data.detail
            );

        }

        const file =
            document.getElementById(
                "avatarFile"
            ).files[0];

        if (file) {

            const form =
                new FormData();

            form.append(
                "file",
                file
            );

            const avatarResponse =
                await request(
                    "/api/avatar",
                    {
                        method: "POST",
                        body: form
                    }
                );

            if (!avatarResponse.ok) {

                const data =
                    await avatarResponse.json();

                throw new Error(
                    data.detail
                );

            }

        }

        const me =
            await request(
                "/api/me"
            );

        currentUser =
            await me.json();

        alert(
            "Профиль сохранён!"
        );

        searchUsers();

        showProfile();

    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =====================================================
HELPERS
===================================================== */

function mediaUrl(url) {

    if (!url) return "";

    if (
        url.startsWith("http")
    ) {

        return url;

    }

    return API + url;

}


function escapeHtml(text) {

    return String(text ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
