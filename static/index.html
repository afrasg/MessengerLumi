<!-- =========================================================
     MESSENGER LUMI — CHAT
========================================================= -->

<section
    id="chatView"
    class="view hidden"
    style="padding:0"
>

    <div class="chat">

        <div
            id="chatHeader"
            class="chat-header"
        >
            Выберите пользователя
        </div>

        <div
            id="messages"
            class="messages"
        ></div>

        <div class="composer">

            <input
                id="messageInput"
                placeholder="Сообщение..."
                onkeydown="messageKey(event)"
                autocomplete="off"
            >

            <!-- СТАРАЯ КНОПКА -->
            <button
                class="send-message-button"
                type="button"
                onclick="sendMessage()"
            >
                Отправить сообщение ➤
            </button>

        </div>

    </div>

</section>


<script>

/* =========================================================
   MESSENGER LUMI
========================================================= */

const APP_NAME = "Messenger Lumi";


/* =========================================================
   ОТПРАВКА СООБЩЕНИЯ
========================================================= */

function messageKey(event) {

    if (event.key !== "Enter") {
        return;
    }

    if (event.shiftKey) {
        return;
    }

    event.preventDefault();

    sendMessage();
}


/* =========================================================
   СТАРАЯ КНОПКА "ОТПРАВИТЬ СООБЩЕНИЕ"
========================================================= */

const sendButton =
    document.querySelector(
        ".send-message-button"
    );

if (sendButton) {

    sendButton.textContent =
        "Отправить сообщение ➤";
}


/* =========================================================
   НАЗВАНИЕ ПРИЛОЖЕНИЯ
========================================================= */

document
    .querySelectorAll(
        ".logo, .auth-card h1"
    )
    .forEach(
        element => {

            element.innerHTML =
                element.innerHTML.replace(
                    /MyMessenger/g,
                    "Messenger Lumi"
                );
        }
    );


/* =========================================================
   ВЕРХНИЕ КНОПКИ — БЕЗ ЦВЕТНОГО ФОНА
========================================================= */

const topButtons =
    document.querySelectorAll(
        ".top-actions .icon-button"
    );

topButtons.forEach(
    button => {

        button.style.background =
            "transparent";

        button.style.backgroundColor =
            "transparent";

        button.style.border =
            "none";

        button.style.boxShadow =
            "none";

        button.style.color =
            "inherit";

        button.style.cursor =
            "pointer";
    }
);


/* =========================================================
   СТИЛЬ СТАРОЙ КНОПКИ ОТПРАВКИ
========================================================= */

const style =
    document.createElement(
        "style"
    );

style.textContent = `

.send-message-button {
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    background: #5865f2;
    color: white;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: opacity .15s ease,
                transform .05s ease;
}

.send-message-button:hover {
    opacity: .9;
}

.send-message-button:active {
    transform: scale(.98);
}

.composer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
}

.composer #messageInput {
    flex: 1;
    min-width: 0;
}

/* Старое расположение пузырьков */

.messages {
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
}

.message {
    max-width: 75%;
    width: fit-content;
    padding: 9px 12px;
    border-radius: 14px;
    word-break: break-word;
}

.message.mine {
    align-self: flex-end;
    border-bottom-right-radius: 5px;
}

.message.other {
    align-self: flex-start;
    border-bottom-left-radius: 5px;
}

/* Верхние кнопки */

.top-actions .icon-button {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
}

`;

document.head.appendChild(
    style
);


/* =========================================================
   ЕСЛИ КНОПКА БЫЛА СТАРОЙ .send — ПЕРЕВОДИМ ЕЁ
========================================================= */

const oldSend =
    document.querySelector(
        ".composer .send"
    );

if (oldSend) {

    oldSend.classList.remove(
        "send"
    );

    oldSend.classList.add(
        "send-message-button"
    );

    oldSend.textContent =
        "Отправить сообщение ➤";
}


/* =========================================================
   ОБНОВЛЯЕМ TITLE
========================================================= */

if (
    document.title ===
    "MyMessenger"
) {

    document.title =
        "Messenger Lumi";
}

</script>
