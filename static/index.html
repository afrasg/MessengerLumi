<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messenger Lumi</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        body {
            background: #101114;
            color: #fff;
        }
        .hidden {
            display: none !important;
        }
        button,
        input,
        textarea,
        select {
            font: inherit;
        }
        button {
            cursor: pointer;
        }
        input,
        textarea,
        select {
            background: #191b21;
            color: #fff;
            border: 1px solid #30333b;
            border-radius: 10px;
            padding: 11px;
            outline: none;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #5865f2;
        }
        #auth {
            position: fixed;
            inset: 0;
            z-index: 2000;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101114;
            overflow: auto;
        }
        #auth.hidden {
            display: none !important;
        }
        .auth-card {
            width: min(420px, calc(100% - 30px));
            background: #181a20;
            border: 1px solid #292c34;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }
        .auth-card h1 {
            margin-top: 0;
            text-align: center;
        }
        .auth-card input {
            display: block;
            width: 100%;
            margin: 10px 0;
        }
        .auth-card button {
            width: 100%;
            margin-top: 8px;
        }
        .primary {
            background: #5865f2;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
        }
        .secondary {
            background: #30333b;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
        }
        .danger-button {
            background: #d84a4a;
            color: white;
            border: 0;
            border-radius: 10px;
            padding: 11px 15px;
            width: 100%;
            margin-top: 8px;
        }
        .error {
            color: #ff6868;
            min-height: 20px;
        }
        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: #17191e;
            border-right: 1px solid #292c34;
            padding: 15px;
            overflow-y: auto;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .search {
            width: 100%;
            margin-bottom: 12px;
        }
        .users {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
        }
        .user-item:hover {
            background: #23262d;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
        }
        .user-info {
            min-width: 0;
        }
        .user-info strong,
        .user-info small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-info small {
            color: #8d929e;
        }
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid #292c34;
            background: #15171c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-button {
            background: transparent !important;
            border: 0 !important;
            color: #b9bec9;
            padding: 6px;
            border-radius: 8px;
            font-size: 19px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 0;
        }
        .icon-button:hover {
            background: #23262d !important;
            color: #fff;
        }
        .icon-button img {
            width: 22px;
            height: 22px;
            display: block;
            opacity: 0.85;
            filter: brightness(0) invert(1);
        }
        .icon-button:hover img {
            opacity: 1;
        }
        .ui-icon {
            width: 18px;
            height: 18px;
            vertical-align: -3px;
            display: inline-block;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }
        .ui-icon.ui-icon-lg {
            width: 22px;
            height: 22px;
            vertical-align: -4px;
        }
        .content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        .view {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 18px;
        }
        .feed {
            width: min(800px, 100%);
            margin: 0 auto;
        }
        .post-box,
        .post,
        .card {
            background: #181a20;
            border: 1px solid #292c34;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 14px;
        }
        .post-box textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
        }
        .post-tools {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .post-tools label {
            cursor: pointer;
        }
        .post-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
        }
        .post-text {
            white-space: pre-wrap;
            margin: 15px 0;
            line-height: 1.45;
        }
        .post-media {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
        }
        .post-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .post-actions button {
            background: #23262d;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 7px 10px;
        }
        .chat {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #101114;
        }
        .chat-header {
            padding: 14px 18px;
            border-bottom: 1px solid #292c34;
            background: #15171c;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .chat-header:hover {
            background: #1e2128;
        }
        .chat-header-title-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .chat-header-title {
            font-weight: 700;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-header-subtitle {
            font-size: 13px;
            color: #8d929e;
            font-weight: 400;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .message-row {
            width: 100%;
            display: flex;
        }
        .message-row.mine {
            justify-content: flex-end;
        }
        .message-row.theirs {
            justify-content: flex-start;
        }
        .message-bubble {
            position: relative;
            max-width: min(70%, 600px);
            padding: 9px 12px;
            border-radius: 14px;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message-row.mine .message-bubble {
            background: #5865f2;
            border-bottom-right-radius: 4px;
        }
        .message-row.theirs .message-bubble {
            background: #25282f;
            border-bottom-left-radius: 4px;
        }
        .message-text {
            line-height: 1.4;
        }
        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            font-size: 11px;
            opacity: .75;
        }
        .message-status {
            font-size: 11px;
        }
        .message-status.unread {
            color: #ffd166;
        }
        .message-status.read {
            color: #cfd3dc;
        }
        .message-deleted {
            opacity: .6;
            font-style: italic;
        }
        .composer {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #292c34;
            background: #15171c;
        }
        .composer input {
            flex: 1;
            min-width: 0;
        }
        .send {
            background: #5865f2;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 0 18px;
            min-width: 170px;
            font-weight: 600;
        }
        .send:hover {
            background: #4752c4;
        }
        .message-context {
            position: fixed;
            z-index: 1000;
            min-width: 190px;
            background: #1b1e24;
            border: 1px solid #343740;
            border-radius: 10px;
            padding: 5px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .45);
        }
        .message-context button {
            width: 100%;
            display: block;
            text-align: left;
            background: transparent;
            color: #fff;
            border: 0;
            border-radius: 7px;
            padding: 9px 11px;
        }
        .message-context button:hover {
            background: #2a2d35;
        }
        .message-context .delete {
            color: #ff7070;
        }
        .profile {
            width: min(700px, 100%);
            margin: 0 auto;
        }
        .card h2,
        .card h3 {
            margin-top: 0;
        }
        .card input,
        .card textarea,
        .card select {
            width: 100%;
            margin: 6px 0;
        }
        .card textarea {
            min-height: 100px;
            resize: vertical;
        }
        .big-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
            display: block;
            margin-bottom: 12px;
        }
        .setting {
            padding: 12px 0;
            border-bottom: 1px solid #292c34;
        }
        .setting:last-child {
            border-bottom: 0;
        }
        .setting label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .setting select {
            width: auto;
        }
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal {
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #181a20;
            border: 1px solid #30333b;
            border-radius: 15px;
            padding: 20px;
        }
        .modal input,
        .modal textarea {
            width: 100%;
            margin-bottom: 8px;
        }
        .comment {
            background: #20232a;
            padding: 10px;
            border-radius: 9px;
            margin-top: 8px;
        }
        @media (max-width: 700px) {
            .sidebar {
                width: 220px;
            }
            .message-bubble {
                max-width: 82%;
            }
            .send {
                min-width: 52px;
                padding: 0 12px;
                font-size: 0;
            }
            .send::after {
                content: "➤";
                font-size: 18px;
            }
        }
        .dialog-item .last-msg {
            color: #8d929e;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .dialog-item .unread-badge {
            background: #5865f2;
            color: #fff;
            font-size: 11px;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            margin-left: auto;
        }
        #toastStack {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: min(360px, calc(100vw - 24px));
        }
        .toast {
            background: #1b1e24;
            border: 1px solid #343740;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
            cursor: pointer;
            animation: toastIn .25s ease;
        }
        .toast strong {
            display: block;
            margin-bottom: 4px;
        }
        .toast span {
            color: #b9bec9;
            font-size: 13px;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
        #blockedBar {
            display: none;
            padding: 12px;
            border-top: 1px solid #292c34;
            background: #15171c;
        }
        #blockedBar button {
            width: 100%;
        }
        .voice-rec-active {
            outline: 2px solid #d84a4a !important;
            background: rgba(216, 74, 74, .15) !important;
        }
        .settings-tabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #292c34;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .settings-tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 8px 12px;
            border-radius: 8px 8px 0 0;
            border: 0;
            color: #8d929e;
            background: transparent;
            cursor: pointer;
        }
        .settings-tab-btn.active {
            background: #5865f2;
            color: #fff;
        }
        .settings-tab {
            display: none;
        }
        .settings-tab.active {
            display: block;
        }
        #callOverlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(8, 10, 14, .92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #callOverlay:not(.hidden) {
            display: flex;
        }
        #callOverlay .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
        }
        #callOverlay .call-title {
            font-size: 22px;
            font-weight: 700;
        }
        #callOverlay .call-status {
            color: #9095a3;
            font-size: 16px;
        }
        #callOverlay .call-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        #callOverlay .call-actions button {
            padding: 14px 20px;
            border: 0;
            border-radius: 50%;
            font-size: 24px;
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #callOverlay .call-actions .call-end {
            background: #d84a4a;
            color: white;
        }
        #callOverlay .call-actions .call-mute {
            background: #30333b;
            color: white;
        }
        #callOverlay .call-actions .call-mute.active {
            background: #d84a4a;
        }
        #callOverlay .call-actions .call-speaker {
            background: #30333b;
            color: white;
        }
        #callOverlay .call-actions .call-speaker.active {
            background: #5865f2;
        }
        #callOverlay video {
            border-radius: 16px;
            background: #111;
        }
        #callOverlay .local-video {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            background: #222;
            position: absolute;
            bottom: 140px;
            right: 20px;
            border: 2px solid #30333b;
        }
        #callOverlay .remote-video {
            width: min(90vw, 500px);
            max-height: 50vh;
            object-fit: contain;
            border-radius: 12px;
            background: #111;
        }
        #callOverlay .call-duration {
            color: #b9bec9;
            font-size: 14px;
            margin-top: 4px;
        }
        #incomingCallOverlay {
            position: fixed;
            inset: 0;
            z-index: 3500;
            background: rgba(8, 10, 14, .88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #incomingCallOverlay:not(.hidden) {
            display: flex;
        }
        #incomingCallOverlay .call-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #30333b;
        }
        #incomingCallOverlay .call-title {
            font-size: 24px;
            font-weight: 700;
        }
        #incomingCallOverlay .call-sub {
            color: #9095a3;
            font-size: 16px;
        }
        #incomingCallOverlay .call-actions {
            display: flex;
            gap: 30px;
            margin-top: 16px;
        }
        #incomingCallOverlay .call-actions button {
            padding: 16px 24px;
            border: 0;
            border-radius: 50%;
            font-size: 28px;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #incomingCallOverlay .call-actions .call-answer {
            background: #2ea85d;
            color: white;
        }
        #incomingCallOverlay .call-actions .call-decline {
            background: #d84a4a;
            color: white;
        }
        #attachPreview {
            padding: 8px 12px;
            border-top: 1px solid #292c34;
            background: #15171c;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #attachPreview:not(.hidden) {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="toastStack"></div>
    <div id="auth">
        <div class="auth-card">
            <h1>💬 Messenger Lumi</h1>
            <input id="username" placeholder="Username" autocomplete="username">
            <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
            <button class="primary" onclick="login()">Войти</button>
            <button class="secondary" onclick="register()">Создать аккаунт</button>
            <button class="secondary" onclick="showCodeLogin()" style="margin-top:8px">Войти по коду</button>
            <div id="codeLoginBox" class="hidden" style="margin-top:14px">
                <input id="codeUsername" placeholder="Username">
                <input id="codeValue" placeholder="Код от бота Lumi">
                <button class="primary" style="width:100%;margin-top:8px" onclick="loginByCode()">Войти по коду</button>
                <button class="secondary" style="width:100%;margin-top:8px" onclick="requestLoginCode()">Получить код у бота</button>
            </div>
            <p id="authError" class="error"></p>
        </div>
    </div>
    <div id="app" class="hidden">
        <aside class="sidebar">
            <div class="logo">💬 Messenger Lumi</div>

        async function request(url, options = {}) {
            const headers = Object.assign({}, options.headers || {});
            if (token) {
                headers["Authorization"] = "Bearer " + token;
            }
            if (options.body instanceof FormData) {
                delete headers["Content-Type"];
                delete headers["content-type"];
            }
            options.headers = headers;
            return fetch(API + url, options);
        }

            error.textContent = "";
            if (!username || !password) {

            const response = await fetch(API + "/api/login", {

            const data = await safeJson(response);

            }
            token = data.token;
            localStorage.setItem("token", token);
            await startApp();

        async function loadUsers(query = "") {
            const container = document.getElementById("users");
            if (!container) return;
            query = (query || "").trim();
            const requestId = ++searchRequestId;
            container.innerHTML = "";
            if (!query) {
                if (requestId !== searchRequestId) return;
                await refreshSidebarLists();
                return;
            }
            const response = await request("/api/search?q=" + encodeURIComponent(query));
            if (requestId !== searchRequestId) return;
            if (!response.ok) {
                await refreshSidebarLists();
                return;
            }
            const data = await safeJson(response);
            if (requestId !== searchRequestId) return;
            container.innerHTML = "";
            const users = (data.users || []).filter(u => Number(u.id) !== Number(currentUser.id));
            const channels = data.channels || [];
            const groups = data.groups || [];
            const communities = data.communities || [];
            const total = users.length + channels.length + groups.length + communities.length;
            if (!total) {
                const empty = document.createElement("div");
                empty.style.cssText =
                    "padding:12px 10px;color:#8d929e;font-size:13px;text-align:center;line-height:1.3";
                empty.textContent = "Ничего не найдено";
                container.appendChild(empty);
                return;
            }
            if (users.length) {
                container.appendChild(sidebarSectionHeader("Люди"));
                users.forEach(user => {
                    const div = document.createElement("div");
                    div.className = "user-item";
                    const avatar = document.createElement("img");
                    avatar.className = "user-avatar";
                    avatar.style.cursor = "pointer";
                    if (user.avatar_url) {
                        avatar.src = mediaUrl(user.avatar_url);
                    }
                    avatar.onclick = (e) => {
                        e.stopPropagation();
                        openUserProfile(user.id);
                    };
                    const info = document.createElement("div");
                    info.className = "user-info";
                    info.innerHTML = "<strong>" + escapeHtml(user.display_name || user.username) +
                        "</strong><small>@" + escapeHtml(user.username) + "</small>";
                    div.appendChild(avatar);
                    div.appendChild(info);
                    div.onclick = () => openChat(user);
                    container.appendChild(div);
                });
            }
            if (channels.length) {
                container.appendChild(sidebarSectionHeader("Каналы"));
                channels.forEach(channel => {
                    const div = document.createElement("div");
                    div.className = "user-item";
                    div.innerHTML =
                        `<div class="user-avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px;background:#30333b">📢</div><div class="user-info"><strong>${escapeHtml(channel.name)}</strong><small>@${escapeHtml(channel.username)}${channel.joined ? " · вы подписаны" : ""}</small></div>`;
                    div.onclick = async () => {
                        if (!channel.joined) {
                            const res = await request("/api/channels/" + channel.id + "/join", { method: "POST" });
                            if (!res.ok) {
                                const err = await safeJson(res);
                                alert(err.detail || "Не удалось подписаться");

                            channel.joined = true;
                        }
                        openChannelChat(channel.id, channel.name, !!channel.is_owner);
                    };
                    container.appendChild(div);
                });
            }
            if (groups.length) {
                container.appendChild(sidebarSectionHeader("Группы"));
                groups.forEach(group => {
                    const div = document.createElement("div");
                    div.className = "user-item";
                    div.innerHTML =

        function updateChatSubtitle(user) {
            const sub = document.getElementById("chatHeaderSubtitle");
            if (!sub) return;
            if (!user) {
                sub.textContent = "";
                return;
            }
            if (user.is_bot || user.username === "lumi") {
                sub.textContent = "🤖 Бот";
                return;
            }
            if (Number(user.id) === Number(currentUser?.id)) {
                sub.textContent = "Это вы";
                return;
            }
            const lastSeen = user.last_seen;
            if (lastSeen) {
                const time = formatTimeLocal(lastSeen);
                sub.textContent = "был(а) в сети " + time;
            } else {
                sub.textContent = "";
            }
        }

        function formatTimeLocal(isoString) {
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return "";
                const now = new Date();
                const diff = Math.floor((now - date) / 1000);
                if (diff < 60) return "только что";
                if (diff < 3600) {
                    const m = Math.floor(diff / 60);
                    return m + " " + getMinutesWord(m) + " назад";
                }
                if (diff < 86400) {
                    const h = Math.floor(diff / 3600);
                    return h + " " + getHoursWord(h) + " назад";
                }
                if (diff < 172800) return "вчера";
                if (diff < 604800) {
                    const days = Math.floor(diff / 86400);
                    return days + " " + getDaysWord(days) + " назад";
                }
                return date.toLocaleDateString([], { day: 'numeric', month: 'short' });
            } catch {
                return "";
            }
        }

        function getMinutesWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return "минуту";
            if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "минуты";
            return "минут";
        }

        function getHoursWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return "час";
            if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "часа";
            return "часов";
        }

        function getDaysWord(n) {
            if (n % 10 === 1 && n % 100 !== 11) return "день";
            if ([2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100)) return "дня";
            return "дней";
        }

        function renderMessage(message) {
            const container = document.getElementById("messages");
            const mine = Number(message.sender_id) === Number(currentUser.id);
            const row = document.createElement("div");
            row.className = "message-row " + (mine ? "mine" : "theirs");
            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.dataset.id = message.id;
            const text = document.createElement("div");
            text.className = "message-text";
            if (message.deleted) {
                text.className += " message-deleted";
                text.textContent = "Сообщение удалено";
            } else {
                text.textContent = message.text || "";
            }
            bubble.appendChild(text);
            if (message.media_url && !message.deleted) {
                const url = mediaUrl(message.media_url);
                if (message.media_type === "image") {
                    const img = document.createElement("img");
                    img.src = url;
                    img.style.cssText =
                        "max-width:100%;border-radius:10px;margin-top:6px;cursor:pointer";
                    img.onclick = () => window.open(url, "_blank");
                    bubble.appendChild(img);
                } else if (message.media_type === "voice") {
                    const audio = document.createElement("audio");
                    audio.controls = true;
                    audio.src = url;
                    audio.style.cssText = "width:100%;margin-top:6px";
                    bubble.appendChild(audio);
                } else {
                    const a = document.createElement("a");
                    a.href = url;
                    a.target = "_blank";
                    a.textContent = "📎 Файл";
                    a.style.cssText = "display:inline-block;margin-top:6px;color:#9db7ff";
                    bubble.appendChild(a);
                }
            }
            if (message.invite_id && message.invite_status === "pending" && !mine) {
                const box = document.createElement("div");
                box.style.cssText = "display:flex;gap:8px;margin-top:8px";
                const acc = document.createElement("button");
                acc.className = "primary";
                acc.style.cssText = "flex:1;padding:8px";
                acc.textContent = "Вступить";
                acc.onclick = (e) => { e.stopPropagation();
                    respondInvite(message.invite_id, "accept"); };
                const dec = document.createElement("button");
                dec.className = "secondary";
                dec.style.cssText = "flex:1;padding:8px";
                dec.textContent = "Отказаться";
                dec.onclick = (e) => { e.stopPropagation();
                    respondInvite(message.invite_id, "decline"); };
                box.appendChild(acc);
                box.appendChild(dec);
                bubble.appendChild(box);
            } else if (message.invite_status && message.invite_status !== "pending") {
                const st = document.createElement("div");
                st.style.cssText = "font-size:12px;opacity:.7;margin-top:4px";
                st.textContent = message.invite_status === "accepted" ? "✓ Принято" : "✗ Отклонено";
                bubble.appendChild(st);
            }
            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.innerHTML = "<span>" + escapeHtml(formatTimeLocal(message.created_at)) + "</span>";
            if (mine) {
                const status = document.createElement("span");
                status.className = "message-status " + (message.read || message.is_read ? "read" :
                    "unread");
                status.textContent = (message.read || message.is_read) ? "прочитано" : "не прочитано";
                meta.appendChild(status);
            }
            bubble.appendChild(meta);
            row.appendChild(bubble);
            container.appendChild(row);
            if (mine && !message.deleted) {
                bubble.addEventListener("click", event => {
                    event.stopPropagation();
                    if (favoritePickMode) {
                        request("/api/messages/" + message.id + "/favorite", { method: "POST" }).then(
                            () => alert("Добавлено в избранное"));
                        return;
                    }
                    openMessageContext(message, bubble);
                });
            } else if (!mine && !message.deleted) {
                bubble.addEventListener("click", event => {
                    if (favoritePickMode) {
                        event.stopPropagation();
                        request("/api/messages/" + message.id + "/favorite", { method: "POST" }).then(
                            () => alert("Добавлено в избранное"));
                    }
                });
            }
        }

        function openMessageContext(message, element) {
            closeMessageContext();
            const menu = document.createElement("div");
            menu.id = "messageContext";
            menu.className = "message-context";
            const edit = document.createElement("button");
            edit.textContent = "✏️ Изменить";

                openEditMessage(message); };
            const copy = document.createElement("button");
            copy.textContent = "📋 Копировать";
            copy.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(message.text || "");
                } catch {}
                closeMessageContext();
            };
            const del = document.createElement("button");
            del.className = "delete";
            del.textContent = "🗑️ Удалить";
            del.onclick = () => { closeMessageContext();
                selectedMessageId = message.id;
                deleteSelectedMessage(); };
            menu.appendChild(edit);
            menu.appendChild(copy);
            menu.appendChild(del);
            document.body.appendChild(menu);
            const rect = element.getBoundingClientRect();
            let left = rect.left;
            let top = rect.bottom + 5;
            if (left + 200 > window.innerWidth) {
                left = window.innerWidth - 210;
            }
            if (top + 130 > window.innerHeight) {
                top = rect.top - 135;
            }
            menu.style.left = Math.max(5, left) + "px";
            menu.style.top = Math.max(5, top) + "px";
            setTimeout(() => {
                document.addEventListener("click", closeMessageContext, { once: true });
            }, 0);
        }

        function renderPost(post) {
            const container = document.getElementById("feed");
            const article = document.createElement("article");
            article.className = "post";
            article.dataset.postId = post.id;
            const head = document.createElement("div");
            head.className = "post-head";
            const avatar = document.createElement("img");
            avatar.className = "avatar";
            if (post.avatar_url) avatar.src = mediaUrl(post.avatar_url);
            avatar.style.cursor = "pointer";
            avatar.onclick = () => openUserProfile(post.author_id);
            const author = document.createElement("div");
            author.innerHTML =
                "<strong style='cursor:pointer'>" + escapeHtml(post.display_name || post.username) +
                "</strong><div style='color:#9095a3;font-size:12px'>@" + escapeHtml(post.username) +
                "</div>";
            author.querySelector("strong").onclick = () => openUserProfile(post.author_id);
            head.appendChild(avatar);
            head.appendChild(author);
            article.appendChild(head);
            if (post.text) {
                const text = document.createElement("div");
                text.className = "post-text";
                text.textContent = post.text;
                article.appendChild(text);
            }
            if (post.media_url) {
                if (post.media_type === "video") {
                    const video = document.createElement("video");
                    video.className = "post-media";
                    video.controls = true;
                    video.src = mediaUrl(post.media_url);
                    article.appendChild(video);
                } else {
                    const img = document.createElement("img");
                    img.className = "post-media";
                    img.src = mediaUrl(post.media_url);
                    article.appendChild(img);
                }
            }
            const actions = document.createElement("div");
            actions.className = "post-actions";
            const like = document.createElement("button");
            like.textContent = "❤️ " + (post.likes || 0);
            like.onclick = async () => {
                const response = await request("/api/posts/" + post.id + "/like", { method: "POST" });
                const data = await safeJson(response);
                if (response.ok) {
                    like.textContent = "❤️ " + data.likes;
                }
            };
            actions.appendChild(like);
            const commentsBtn = document.createElement("button");
            commentsBtn.textContent = "💬 " + (post.comments_count || 0);
            commentsBtn.onclick = () => toggleComments(post.id, article, commentsBtn);
            actions.appendChild(commentsBtn);
            const shareBtn = document.createElement("button");
            shareBtn.textContent = "🔗 Поделиться";
            shareBtn.onclick = () => sharePost(post);
            actions.appendChild(shareBtn);
            if (Number(post.author_id) === Number(currentUser.id)) {
                const del = document.createElement("button");
                del.textContent = "🗑️";
                del.onclick = async () => {
                    if (!confirm("Удалить пост?")) return;
                    const response = await request("/api/posts/" + post.id, { method: "DELETE" });
                    if (response.ok) article.remove();
                };
                actions.appendChild(del);
            }
            article.appendChild(actions);
            const commentsBox = document.createElement("div");
            commentsBox.id = "comments-" + post.id;
            commentsBox.style.display = "none";
            commentsBox.style.marginTop = "12px";
            article.appendChild(commentsBox);
            container.appendChild(article);
        }

        async function toggleComments(postId, article, btn) {
            const box = document.getElementById("comments-" + postId);
            if (!box) return;
            if (box.style.display !== "none") {
                box.style.display = "none";
                return;
            }
            box.style.display = "block";
            box.innerHTML = "<div style='color:#9095a3;font-size:13px;padding:8px 0'>Загрузка...</div>";
            const response = await request("/api/posts/" + postId + "/comments");
            if (!response.ok) {
                box.innerHTML = "<div style='color:#ff5c7a'>Не удалось загрузить</div>";
                return;
            }
            const comments = await safeJson(response);
            box.innerHTML = "";
            if (!comments.length) {
                box.innerHTML =
                    "<div style='color:#9095a3;font-size:13px;padding:6px 0'>Комментариев пока нет</div>";
            }
            comments.forEach(c => {
                const div = document.createElement("div");
                div.className = "comment";
                div.style.padding = "8px 0";
                div.style.borderBottom = "1px solid #2a2b30";
                const replyTo = c.reply_to_username ?
                    `<span style="color:#6c8cff">@${escapeHtml(c.reply_to_username)}</span> ` :
                    "";
                div.innerHTML =
                    `<div style="font-size:12px;color:#9095a3;margin-bottom:2px"><strong style="cursor:pointer;color:#e8eaed" onclick="openUserProfile(${c.user_id})">${escapeHtml(c.display_name || c.username)}</strong> · ${formatTimeLocal(c.created_at)}</div><div>${replyTo}${escapeHtml(c.text)}</div>`;
                if (Number(c.user_id) === Number(currentUser.id)) {
                    const delBtn = document.createElement("button");
                    delBtn.textContent = "🗑️";
                    delBtn.style.cssText =
                        "margin-top:4px;background:transparent;border:none;color:#ff5c7a;cursor:pointer;font-size:12px";
                    delBtn.onclick = async () => {
                        if (!confirm("Удалить комментарий?")) return;
                        await request("/api/comments/" + c.id, { method: "DELETE" });
                        box.style.display = "none";
                        toggleComments(postId, article, btn);
                        const num = Math.max(0, (parseInt(btn.textContent.replace(/\D/g, "")) || 1) -
                            1);
                        btn.textContent = "💬 " + num;
                    };
                    div.appendChild(delBtn);
                }
                box.appendChild(div);
            });
            const form = document.createElement("div");
            form.style.cssText = "display:flex;gap:8px;margin-top:10px";
            form.innerHTML =
                `<input id="commentInput-${postId}" placeholder="Написать комментарий..." style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid #2a2b30;background:#121316;color:#fff" maxlength="2000"><button class="primary" onclick="sendComment(${postId})">➤</button>`;
            box.appendChild(form);
        }

        async function sendComment(postId) {
            const input = document.getElementById("commentInput-" + postId);
            const text = (input?.value || "").trim();
            if (!text) return;
            const response = await request("/api/posts/" + postId + "/comments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });
            const data = await safeJson(response);
            if (!response.ok) {
                alert(data.detail || "Ошибка");
                return;
            }
            const article = document.querySelector(`article[data-post-id="${postId}"]`);
            const btn = article?.querySelector(".post-actions button:nth-child(2)");
            if (btn) {
                const current = parseInt(btn.textContent.replace(/\D/g, "")) || 0;
                btn.textContent = "💬 " + (current + 1);
            }
            if (article && btn) {
                const box = document.getElementById("comments-" + postId);
                if (box) box.style.display = "none";
                toggleComments(postId, article, btn);
            }
        }

            if (!password) return;
            try {
                const response = await request("/api/account", {
                    method: "DELETE",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ password })
                });
                const data = await safeJson(response);
                if (!response.ok) {
                    alert(data.detail || "Не удалось удалить аккаунт");
                    return;
                }
                const accounts = JSON.parse(localStorage.getItem("accounts") || "[]");
                const filtered = accounts.filter(account => account.token !== token);
                localStorage.setItem("accounts", JSON.stringify(filtered));
                localStorage.removeItem("token");
                token = "";
                location.reload();
            } catch (err) {
                alert("Ошибка при удалении аккаунта: " + err.message);
            }
        }

        // ============================================================
        // WEBSOCKET
        // ============================================================

        function connectWebSocket() {
            if (!token || !currentUser) return;
            try {
                const protocol = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(protocol + "//" + location.host + "/ws?token=" + encodeURIComponent(
                    token));
                ws.onmessage = async event => {
                    let data;
                    try { data = JSON.parse(event.data); } catch { return; }
                    if (data.type === "call_signal") {
                        await handleCallSignal(data);
                        return;
                    }
                    if (data.type === "message" && data.message) {
                        playNotificationSound();
                        notifyNewMessage(data.message, "private");
                        if (selectedUserId && (Number(data.message.sender_id) === Number(
                                selectedUserId) || Number(data.message.receiver_id) === Number(
                                selectedUserId))) {
                            await loadMessages(selectedUserId);
                        }
                        await loadDialogs();
                        return;
                    }
                    if (data.type === "group_message" && data.message) {
                        playNotificationSound();
                        notifyNewMessage(data.message, "group");
                        if (selectedGroupId && Number(selectedGroupId) === Number(data.message
                                .group_id)) {
                            await loadGroupMessages(selectedGroupId);
                        }
                        return;
                    }
                    if (data.type === "channel_message" && data.message) {
                        playNotificationSound();
                        notifyNewMessage(data.message, "channel");
                        if (selectedChannelId && Number(selectedChannelId) === Number(data.message
                                .channel_id)) {
                            await loadChannelMessages(selectedChannelId);
                        }
                        return;
                    }
                    if (data.type === "community_message" && data.message) {
                        playNotificationSound();
                        notifyNewMessage(data.message, "community");
                        if (selectedCommunityChatId && Number(selectedCommunityChatId) === Number(
                                data.message.chat_id)) {
                            await loadCommunityChatMessages(selectedCommunityChatId);
                        }
                        return;
                    }
                    if (selectedUserId) {
                        await loadMessages(selectedUserId);
                    } else if (selectedGroupId) {
                        await loadGroupMessages(selectedGroupId);
                    } else if (selectedChannelId) {
                        await loadChannelMessages(selectedChannelId);
                    } else if (selectedCommunityChatId) {
                        await loadCommunityChatMessages(selectedCommunityChatId);
                    }
                };
                ws.onclose = () => {
                    if (token) {
                        setTimeout(connectWebSocket, 3000);
                    }
                };
            } catch {}
        }

        function renderGroupMessages(messages) {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            if (!messages.length) {
                container.innerHTML =
                    "<div style='color:#9095a3;padding:20px;text-align:center'>Пока нет сообщений</div>";
                return;
            }
            messages.forEach(message => {
                const mine = Number(message.sender_id) === Number(currentUser.id);
                const row = document.createElement("div");
                row.className = "message-row " + (mine ? "mine" : "theirs");
                const bubble = document.createElement("div");
                bubble.className = "message-bubble";
                bubble.dataset.id = message.id;
                if (!mine && (message.sender_name || message.username)) {
                    const name = document.createElement("div");
                    name.style.cssText = "font-size:11px;color:#a0a8b8;margin-bottom:3px;font-weight:600";
                    name.textContent = message.sender_name || message.username || "";
                    bubble.appendChild(name);
                }
                const text = document.createElement("div");
                text.className = "message-text";
                if (message.deleted) {
                    text.className += " message-deleted";
                    text.textContent = "Сообщение удалено";
                } else {
                    text.textContent = message.text || "";
                }
                bubble.appendChild(text);
                const meta = document.createElement("div");
                meta.className = "message-meta";
                meta.innerHTML = "<span>" + escapeHtml(formatTimeLocal(message.created_at)) + "</span>";
                bubble.appendChild(meta);
                row.appendChild(bubble);
                container.appendChild(row);
            });
            scrollMessages();
        }

        // Переопределяем sendMessage для групп
        const originalSendMessage = sendMessage;
        sendMessage = async function() {
            const input = document.getElementById("messageInput");
            const text = (input?.value || "").trim();
            if (!text) return;
            playSendSound();
            if (selectedGroupId) {
                const response = await request("/api/groups/" + selectedGroupId + "/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await safeJson(response);
                if (!response.ok) {
                    alert(data.detail || "Не удалось отправить");
                    return;
                }
                input.value = "";
                await loadGroupMessages(selectedGroupId);
                return;
            }
            if (selectedChannelId) {
                if (!selectedChannelIsOwner) {
                    alert("В канал может писать только создатель");
                    return;
                }
                const response = await request("/api/channels/" + selectedChannelId + "/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await safeJson(response);
                if (!response.ok) {
                    alert(data.detail || "Не удалось отправить");
                    return;
                }
                input.value = "";
                await loadChannelMessages(selectedChannelId);
                return;
            }
            if (selectedCommunityChatId) {
                const response = await request("/api/community-chats/" + selectedCommunityChatId +
                    "/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text })
                    });
                const data = await safeJson(response);
                if (!response.ok) {
                    alert(data.detail || "Не удалось отправить");
                    return;
                }
                input.value = "";
                await loadCommunityChatMessages(selectedCommunityChatId);
                return;
            }
            return originalSendMessage();
        };

                        else if (d.last_message.media_type === "file") lastText = "📎 Файл";

        function showToast(title, body, onClick) {
            const stack = document.getElementById("toastStack");
            if (!stack) return;
            const el = document.createElement("div");
            el.className = "toast";
            el.innerHTML = "<strong>" + escapeHtml(title) + "</strong><span>" + escapeHtml(body || "") +
                "</span>";
            el.onclick = () => {
                el.remove();
                if (onClick) onClick();
            };
            stack.appendChild(el);
            setTimeout(() => { try { el.remove(); } catch {} }, 6000);
        }

        function notifyNewMessage(message, kind) {
            if (!message || Number(message.sender_id) === Number(currentUser?.id)) return;
            const chatKind = kind || message.chat_kind || "private";
            if (chatKind === "private" && selectedUserId && Number(selectedUserId) === Number(message
                    .sender_id)) {
                loadDialogs();
                return;
            }
            if (chatKind === "group" && selectedGroupId && Number(selectedGroupId) === Number(message
                    .group_id)) return;
            if (chatKind === "channel" && selectedChannelId && Number(selectedChannelId) === Number(
                    message.channel_id)) return;
            if (chatKind === "community" && selectedCommunityChatId && Number(selectedCommunityChatId) ===
                Number(message.chat_id)) return;
            let preview = message.text || "";
            if (message.media_type === "voice") preview = "🎤 Голосовое сообщение";
            else if (message.media_type === "image") preview = "📷 Фото";
            else if (message.media_type === "file") preview = "📎 Файл";
            if (preview.length > 100) preview = preview.slice(0, 100) + "…";
            const uname = message.sender_name || message.sender_username || "user";
            let title = "",
                body = "";
            if (chatKind === "group") {
                title = message.group_name || "Группа";
                body = uname + ": " + preview;
            } else if (chatKind === "channel") {
                title = message.channel_name || "Канал";
                body = preview;
            } else if (chatKind === "community") {
                title = (message.community_name || "Сообщество") + " · " + (message.chat_name || "Чат");
                body = uname + ": " + preview;
            } else {
                title = uname;
                body = preview;
            }
            showToast(title, body, () => {
                if (chatKind === "private") {
                    openChat({
                        id: message.sender_id,
                        username: message.sender_username || "user",
                        display_name: uname,
                        is_bot: false,
                        last_seen: null
                    });
                } else if (chatKind === "group" && message.group_id) {
                    openGroupChat(message.group_id, message.group_name || "Группа");
                } else if (chatKind === "channel" && message.channel_id) {
                    openChannelChat(message.channel_id, message.channel_name || "Канал", false);
                } else if (chatKind === "community" && message.chat_id) {
                    openCommunityChat(message.chat_id, message.chat_name || "Чат", message
                        .community_name || "");
                }
            });
            if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                try {
                    const n = new Notification(title, { body: body, silent: true });
                    n.onclick = () => window.focus();
                } catch {}
            }
            loadDialogs();
        }

        function requestNotifyPermission() {
            if (typeof Notification !== "undefined" && Notification.permission === "default") {
                Notification.requestPermission().catch(() => {});
            }
        }

        function previewDmFile() {

        async function sendPendingDmFile() {

            const text = (document.getElementById("messageInput")?.value || "").trim();

        async function startVoiceRec(e) {
            if (e) { e.preventDefault();
                e.stopPropagation(); }
            if (!selectedUserId || voiceRecording) return;
            try {
                voiceStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true
                    }
                });
                voiceChunks = [];
                let mime = "audio/webm;codecs=opus";
                if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mime)) {
                    mime = "audio/webm";
                    if (window.MediaRecorder && !MediaRecorder.isTypeSupported(mime)) { mime = ""; }
                }
                mediaRecorder = mime ? new MediaRecorder(voiceStream, { mimeType: mime }) :
                    new MediaRecorder(voiceStream);
                mediaRecorder.ondataavailable = (ev) => {
                    if (ev.data && ev.data.size > 0) voiceChunks.push(ev.data);
                };
                mediaRecorder.onstop = async () => {
                    try { if (voiceStream) voiceStream.getTracks().forEach(t => t.stop()); } catch {}
                    voiceStream = null;
                    const duration = Date.now() - voiceStartTs;
                    const blobType = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
                    const blob = new Blob(voiceChunks, { type: blobType });
                    voiceChunks = [];
                    mediaRecorder = null;
                    if (duration < 300 || blob.size < 200) return;
                    const ext = blobType.includes("ogg") ? "ogg" : "webm";
                    const file = new File([blob], "voice." + ext, { type: blobType.split(";")[0] });
                    await uploadDmMedia(file, "");
                };
                voiceStartTs = Date.now();
                mediaRecorder.start(100);
                voiceRecording = true;
                const btn = document.getElementById("btnVoiceRec");
                if (btn) {
                    btn.classList.add("voice-rec-active");
                    try { if (e && e.pointerId != null) btn.setPointerCapture(e.pointerId); } catch {}
                }
            } catch (err) {
                console.error(err);
                alert("Нет доступа к микрофону. Разрешите доступ в браузере.");
            }
        }

        function stopVoiceRec(e) {
            if (e) { e.preventDefault();
                e.stopPropagation(); }
            if (!voiceRecording) return;
            voiceRecording = false;
            const btn = document.getElementById("btnVoiceRec");
            if (btn) btn.classList.remove("voice-rec-active");
            try {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.requestData();
                    mediaRecorder.stop();
                }
            } catch (err) { console.error(err); }
        }

        async function uploadDmMedia(file, text) {
            if (!selectedUserId) {
                alert("Сначала откройте чат");
                return;
            }
            if (!file) return;
            const form = new FormData();
            form.append("file", file, file.name || "file.bin");
            form.append("text", text || "");
            try {
                const response = await request(
                    "/api/messages/media?receiver_id=" + encodeURIComponent(selectedUserId), {
                        method: "POST",
                        body: form
                    });
                const data = await safeJson(response);
                if (!response.ok) {
                    const detail = data.detail;
                    const msg = typeof detail === "string" ? detail : (detail ? JSON.stringify(
                        detail) : "Ошибка отправки файла");
                    alert(msg);
                    return;
                }
                clearDmFile();
                await loadMessages(selectedUserId);
                await loadDialogs();
            } catch (err) {
                console.error(err);
                alert("Не удалось отправить файл");
            }
        }
