<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMessenger</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background: #101114;
    color: #fff;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* AUTH */

#auth {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.auth-card {
    width: min(390px, 100%);
    background: #191b21;
    border: 1px solid #292c35;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 60px #0007;
}

.auth-card h1 {
    margin: 0 0 22px;
    text-align: center;
}

.auth-card input {
    width: 100%;
    margin-bottom: 10px;
    padding: 12px 14px;
    border: 1px solid #30333d;
    border-radius: 10px;
    background: #111319;
    color: white;
    outline: none;
}

.auth-card button {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #5865f2;
    color: white;
    font-weight: 600;
}

.auth-card button.secondary {
    background: #292c35;
}

.error {
    color: #ff6b6b;
    min-height: 20px;
}


/* APP */

#app {
    width: 100%;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #17191e;
    border-right: 1px solid #292c35;
    display: flex;
    flex-direction: column;
}

.logo {
    padding: 20px;
    font-size: 19px;
    font-weight: bold;
}

.search {
    margin: 0 12px 12px;
    padding: 10px 12px;
    border: 1px solid #30333d;
    border-radius: 10px;
    background: #101218;
    color: white;
    outline: none;
}

.users {
    overflow-y: auto;
    padding: 0 8px 10px;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
}

.user:hover {
    background: #242730;
}

.avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: #30333d;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.user-name {
    min-width: 0;
}

.user-name strong,
.user-name span {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.user-name span {
    color: #9095a3;
    font-size: 12px;
    margin-top: 2px;
}


/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 62px;
    flex-shrink: 0;
    padding: 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #292c35;
    background: #15171c;
}

.top-actions {
    display: flex;
    gap: 5px;
}

.icon-button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: white;
}

.icon-button:hover {
    background: #292c35;
}

.content {
    flex: 1;
    min-height: 0;
    overflow: auto;
}

.view {
    min-height: 100%;
    padding: 20px;
}

.feed {
    max-width: 750px;
    margin: 0 auto;
}

.post-box,
.card {
    background: #191b21;
    border: 1px solid #292c35;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
}

textarea,
input,
select {
    background: #101218;
    color: white;
    border: 1px solid #30333d;
    border-radius: 9px;
    padding: 10px;
    outline: none;
}

.post-box textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
}

.post-tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.primary,
.send {
    border: 0;
    border-radius: 9px;
    padding: 10px 14px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.post {
    background: #191b21;
    border: 1px solid #292c35;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
}

.post-head {
    display: flex;
    gap: 10px;
    align-items: center;
}

.post-text {
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 12px;
}

.post-media {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 12px;
    background: #0b0c0f;
}

.post-actions {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

.post-actions button {
    background: #292c35;
    color: white;
    border: 0;
    padding: 7px 10px;
    border-radius: 8px;
}


/* CHAT */

.chat {
    height: calc(100vh - 62px);
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid #292c35;
    font-weight: bold;
    flex-shrink: 0;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.message-row {
    display: flex;
    width: 100%;
}

.message-row.own {
    justify-content: flex-end;
}

.message-bubble {
    max-width: min(70%, 460px);
    width: fit-content;
    padding: 7px 11px;
    border-radius: 14px;
    background: #292c35;
    color: white;
    font-size: 14px;
    line-height: 1.35;
    overflow-wrap: anywhere;
}

.message-row.own .message-bubble {
    background: #5865f2;
}

.message-text {
    white-space: pre-wrap;
    word-break: break-word;
}

.message-meta {
    font-size: 10px;
    opacity: .62;
    text-align: right;
    margin-top: 3px;
}

.message-deleted {
    opacity: .6;
    font-style: italic;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 10px;
    border-top: 1px solid #292c35;
    background: #15171c;
}

.composer input {
    flex: 1;
    min-width: 0;
}

.send {
    width: 44px;
    padding: 0;
}


/* PROFILE */

.profile {
    max-width: 700px;
    margin: auto;
}

.card input,
.card textarea,
.card select {
    width: 100%;
    margin-bottom: 9px;
}

.big-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    background: #292c35;
    display: block;
    margin-bottom: 15px;
}

.setting {
    padding: 12px 0;
    border-bottom: 1px solid #292c35;
}

.setting label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}


/* MODAL */

#modalBg {
    position: fixed;
    inset: 0;
    background: #0009;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: min(480px, 100%);
    max-height: 90vh;
    overflow: auto;
    background: #191b21;
    border: 1px solid #30333d;
    border-radius: 15px;
    padding: 20px;
}


/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        width: 220px;
    }

    .message-bubble {
        max-width: 82%;
    }
}

@media (max-width: 560px) {
    .sidebar {
        width: 75px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo:first-letter {
        font-size: 25px;
    }

    .search {
        margin: 8px;
    }

    .user-name {
        display: none;
    }

    .user {
        justify-content: center;
    }

    .topbar strong {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     AUTH
===================================================== -->

<section id="auth">

    <div class="auth-card">

        <h1>💬 MyMessenger</h1>

        <input
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Войти
        </button>

        <button
            class="secondary"
            onclick="register()"
        >
            Создать аккаунт
        </button>

        <p
            id="authError"
            class="error"
        ></p>

    </div>

</section>


<!-- =====================================================
     APP
===================================================== -->

<section
    id="app"
    class="hidden"
>

    <aside class="sidebar">

        <div class="logo">
            💬 MyMessenger
        </div>

        <input
            id="search"
            class="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div
            id="users"
            class="users"
        ></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong id="pageTitle">
                📰 Лента
            </strong>

            <div class="top-actions">

                <button
                    class="icon-button"
                    onclick="showFeed()"
                >
                    📰
                </button>

                <button
                    class="icon-button"
                    onclick="showFavorites()"
                >
                    ⭐
                </button>

                <button
                    class="icon-button"
                    onclick="showSettings()"
                >
                    ⚙️
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                >
                    👤
                </button>

            </div>

        </div>


        <div class="content">

            <!-- FEED -->

            <section
                id="feedView"
                class="view"
            >

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button
                                class="primary"
                                onclick="publishPost()"
                            >
                                📝 Опубликовать
                            </button>

                            <label class="primary">
                                📷 Фото / видео
                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                    onchange="publishMediaPost()"
                                >
                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- CHAT -->

            <section
                id="chatView"
                class="view hidden"
                style="padding:0"
            >

                <div class="chat">

                    <div
                        id="chatHeader"
                        class="chat-header"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        id="messages"
                        class="messages"
                    ></div>

                    <div class="composer">

                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- PROFILE -->

            <section
                id="profileView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            alt=""
                        >

                        <h2>
                            👤 Профиль
                        </h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>🖼️ Аватар</p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить
                        </button>

                    </div>


                    <div class="card">

                        <h3>👥 Аккаунт</h3>

                        <button
                            class="primary"
                            onclick="openCreateAccount()"
                        >
                            ➕ Добавить аккаунт
                        </button>

                        <button
                            class="primary"
                            onclick="switchAccount()"
                        >
                            🔄 Переключить аккаунт
                        </button>

                        <button
                            style="
                                background:#d84a4a;
                                color:white;
                                border:0;
                                padding:11px;
                                border-radius:10px;
                                margin-top:8px;
                                width:100%;
                            "
                            onclick="logout()"
                        >
                            🚪 Выйти
                        </button>

                    </div>

                </div>

            </section>


            <!-- SETTINGS -->

            <section
                id="settingsView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <h2>⚙️ Настройки</h2>

                        <div class="setting">
                            <label>
                                <span>🌐 Язык</span>

                                <select
                                    id="language"
                                    onchange="saveSettings()"
                                >
                                    <option value="ru">Русский</option>
                                    <option value="en">English</option>
                                    <option value="be">Беларуская</option>
                                    <option value="kk">Қазақша</option>
                                </select>
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                <span>🎨 Тема</span>

                                <select
                                    id="theme"
                                    onchange="saveSettings()"
                                >
                                    <option value="dark">Тёмная</option>
                                    <option value="light">Светлая</option>
                                    <option value="blue">Синяя</option>
                                </select>
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🔔 Уведомления

                                <input
                                    id="notifications"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🟢 Показывать онлайн

                                <input
                                    id="showOnline"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🕒 Показывать время последнего визита

                                <input
                                    id="showLastSeen"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>

                    </div>


                    <div class="card">

                        <h3>👥 Группы</h3>

                        <button
                            class="primary"
                            onclick="openCreateGroup()"
                        >
                            ➕ Создать группу
                        </button>

                        <div id="groups"></div>

                    </div>


                    <div class="card">

                        <h3>📢 Каналы</h3>

                        <button
                            class="primary"
                            onclick="openCreateChannel()"
                        >
                            ➕ Создать канал
                        </button>

                        <div id="channels"></div>

                    </div>

                </div>

            </section>


            <!-- FAVORITES -->

            <section
                id="favoritesView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <h2>
                            ⭐ Избранные сообщения
                        </h2>

                        <div id="favorites"></div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</section>


<!-- MODAL -->

<div
    id="modalBg"
    class="hidden"
    onclick="closeModal(event)"
>
    <div
        id="modal"
        class="modal"
        onclick="event.stopPropagation()"
    ></div>
</div>


<script>
"use strict";


/* =========================================================
   GLOBALS
========================================================= */

const API = window.location.origin;

let token =
    localStorage.getItem("token") || "";

let currentUser = null;

let currentChatUser = null;

let socket = null;

let socketReconnectTimer = null;

let selectedMessageId = null;


/* =========================================================
   REQUEST
========================================================= */

async function request(
    url,
    options = {}
) {
    const headers = {
        ...(options.headers || {})
    };

    if (token) {
        headers.Authorization =
            "Bearer " + token;
    }

    return fetch(
        API + url,
        {
            ...options,
            headers
        }
    );
}


async function safeJson(response) {
    try {
        return await response.json();
    } catch {
        return {};
    }
}


/* =========================================================
   AUTH
========================================================= */

async function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const error =
        document.getElementById(
            "authError"
        );

    error.textContent = "";

    if (!username || !password) {
        error.textContent =
            "Заполни логин и пароль";
        return;
    }

    try {

        const response =
            await fetch(
                API + "/api/login",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        const data =
            await safeJson(response);

        if (!response.ok) {
            error.textContent =
                data.detail ||
                "Ошибка входа";
            return;
        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).textContent =
            "Сервер недоступен";

        console.error(error);
    }
}


async function register() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const error =
        document.getElementById(
            "authError"
        );

    error.textContent = "";

    try {

        const response =
            await fetch(
                API + "/api/register",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );

        const data =
            await safeJson(response);

        if (!response.ok) {
            error.textContent =
                data.detail ||
                "Ошибка регистрации";
            return;
        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).textContent =
            "Сервер недоступен";

        console.error(error);
    }
}


function logout() {

    if (socket) {
        try {
            socket.close();
        } catch {}
    }

    socket = null;
    token = "";
    currentUser = null;
    currentChatUser = null;

    localStorage.removeItem(
        "token"
    );

    location.reload();
}


/* =========================================================
   START APP
========================================================= */

async function startApp() {

    if (!token) {
        return;
    }

    const response =
        await request(
            "/api/me"
        );

    if (!response.ok) {

        localStorage.removeItem(
            "token"
        );

        token = "";

        document.getElementById(
            "auth"
        ).classList.remove(
            "hidden"
        );

        document.getElementById(
            "app"
        ).classList.add(
            "hidden"
        );

        return;
    }

    currentUser =
        await safeJson(response);

    document.getElementById(
        "auth"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "app"
    ).classList.remove(
        "hidden"
    );

    connectWebSocket();

    await searchUsers();

    await loadFeed();

    await loadSettings();

    await loadGroups();

    await loadChannels();
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (!currentUser || !token) {
        return;
    }

    if (socket) {
        try {
            socket.close();
        } catch {}
    }

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    /*
     * ВАЖНО:
     * токен обязательно передаётся в URL.
     * Именно этого не хватало при 403.
     */

    const url =
        protocol +
        "//" +
        location.host +
        "/ws/" +
        currentUser.id +
        "?token=" +
        encodeURIComponent(token);

    socket =
        new WebSocket(url);

    socket.onopen = () => {

        console.log(
            "WebSocket connected"
        );

        clearTimeout(
            socketReconnectTimer
        );
    };

    socket.onmessage = event => {

        try {

            const payload =
                JSON.parse(
                    event.data
                );

            handleSocketMessage(
                payload
            );

        } catch (error) {
            console.error(
                "WS message error",
                error
            );
        }
    };

    socket.onclose = () => {

        console.log(
            "WebSocket disconnected"
        );

        if (
            token &&
            currentUser
        ) {
            clearTimeout(
                socketReconnectTimer
            );

            socketReconnectTimer =
                setTimeout(
                    connectWebSocket,
                    2000
                );
        }
    };

    socket.onerror = error => {
        console.error(
            "WebSocket error",
            error
        );
    };
}


function handleSocketMessage(
    payload
) {

    if (
        payload.type ===
        "message"
    ) {

        const message =
            payload.message;

        /*
         * Если открыт именно этот чат,
         * вставляем сообщение.
         *
         * ВАЖНО:
         * addMessageToChat() проверяет ID.
         * Поэтому сообщение, которое уже было
         * добавлено сразу после POST, не дублируется.
         */

        if (
            currentChatUser &&
            (
                (
                    message.sender_id ===
                    currentUser.id &&
                    message.receiver_id ===
                    currentChatUser.id
                )
                ||
                (
                    message.sender_id ===
                    currentChatUser.id &&
                    message.receiver_id ===
                    currentUser.id
                )
            )
        ) {

            addMessageToChat(
                message,
                false
            );
        }

        return;
    }


    if (
        payload.type ===
        "message_updated"
    ) {

        updateMessageInDom(
            payload.message
        );

        return;
    }


    if (
        payload.type ===
        "message_deleted"
    ) {

        updateMessageInDom(
            payload.message
        );

        return;
    }
}

async function openChat(user) {

    currentChatUser = user;

    document.getElementById(
        "pageTitle"
    ).textContent =

        (
            user.display_name ||
            user.username

        document.getElementById(

        "";

        await request(

            user.id
        );

    if (!response.ok) {
        return;
    }

    const data =
        await safeJson(response);

    data.forEach(

function messageKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


async function sendMessage() {

    if (!currentChatUser) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    /*
     * Очищаем поле сразу.
     */

    input.value = "";

    try {

        const response =
            await request(
                "/api/messages",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            receiver_id:
                                currentChatUser.id,
                            text
                        })
                }
            );

        const data =
            await safeJson(response);

        if (!response.ok) {

            input.value = text;

            alert(
                data.detail ||
                "Ошибка отправки"
            );

            return;
        }

        /*
         * ГЛАВНОЕ ИСПРАВЛЕНИЕ:
         *
         * Не ждём WebSocket.
         * POST уже вернул созданное сообщение.
         * Поэтому добавляем его прямо сейчас.
         */

        if (data.message) {

            addMessageToChat(
                data.message,
                true
            );
        }

    } catch (error) {

        input.value = text;

        console.error(error);

        alert(
            "Не удалось отправить сообщение"
        );
    }
}


function addMessageToChat(
    message,
    scroll = true
) {

    const container =
        document.getElementById(
            "messages"
        );

    /*
     * Защита от дублей.
     *
     * POST добавил сообщение.
     * Потом тот же message приходит через WS.
     * Второй раз оно уже не добавляется.
     */

    const existing =
        document.querySelector(
            '[data-message-id="' +
            message.id +
            '"]'
        );

    if (existing) {
        return;
    }

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row";

    if (
        Number(message.sender_id) ===
        Number(currentUser.id)
    ) {
        row.classList.add(
            "own"
        );
    }

    row.dataset.messageId =
        message.id;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    if (message.deleted) {

        bubble.innerHTML =
            '<div class="message-deleted">' +
            "Сообщение удалено" +
            "</div>";

    } else {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            message.text || "";

        const meta =
            document.createElement(
                "div"
            );

        meta.className =
            "message-meta";

        meta.textContent =
            formatTime(
                message.created_at
            ) +
            (
                message.edited_at
                    ? " · изменено"
                    : ""
            );

        bubble.appendChild(
            text
        );

        bubble.appendChild(
            meta
        );

        /*
         * Контекстное меню / выбор сообщения.
         */

        bubble.onclick =
            () => {

                selectedMessageId =
                    message.id;

                openMessageMenu(
                    message
                );
            };
    }

    row.appendChild(
        bubble
    );

    container.appendChild(
        row
    );

    if (scroll) {
        scrollMessages();
    }
}


function updateMessageInDom(
    message
) {

    const row =
        document.querySelector(
            '[data-message-id="' +
            message.id +
            '"]'
        );

    if (!row) {
        return;
    }

    const bubble =
        row.querySelector(
            ".message-bubble"
        );

    if (!bubble) {
        return;
    }

    if (message.deleted) {

        bubble.innerHTML =
            '<div class="message-deleted">' +
            "Сообщение удалено" +
            "</div>";

        return;
    }

    bubble.innerHTML = "";

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    text.textContent =
        message.text || "";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    meta.textContent =
        formatTime(
            message.created_at
        ) +
        " · изменено";

    bubble.appendChild(
        text
    );

    bubble.appendChild(
        meta
    );
}


function scrollMessages() {

    const container =
        document.getElementById(
            "messages"
        );

    requestAnimationFrame(
        () => {
            container.scrollTop =
                container.scrollHeight;
        }
    );
}

async function getSelectedMessage() {

    if (!selectedMessageId) {
        return null;
    }

    const row =
        document.querySelector(
            '[data-message-id="' +
            selectedMessageId +
            '"]'
        );

    if (!row) {
        return null;
    }

    return {
        id: selectedMessageId,
        text:
            row.querySelector(
                ".message-text"
            )?.textContent || ""
    };
}


async function copySelectedMessage() {

    const message =
        await getSelectedMessage();

    if (!message) {
        closeModal();
        return;
    }

    try {
        await navigator.clipboard.writeText(
            message.text
        );
    } catch {}

    closeModal();
}

function renderPost(post) {

    const container =
        document.getElementById(
            "feed"
        );

    const article =
        document.createElement(
            "article"
        );

    article.className =
        "post";

    const head =
        document.createElement(
            "div"
        );

    head.className =
        "post-head";

    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "avatar";

    if (post.avatar_url) {
        avatar.src =
            mediaUrl(
                post.avatar_url
            );
    }

    const author =
        document.createElement(
            "div"
        );

    author.innerHTML =
        "<strong>" +
        escapeHtml(
            post.display_name ||
            post.username
        ) +
        "</strong>" +
        "<div style='color:#9095a3;font-size:12px'>" +
        "@" +
        escapeHtml(
            post.username
        ) +
        "</div>";

    head.appendChild(
        avatar
    );

    head.appendChild(
        author
    );

    article.appendChild(
        head
    );

    if (post.text) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "post-text";

        text.textContent =
            post.text;

        article.appendChild(
            text
        );
    }

    if (post.media_url) {

        if (
            post.media_type ===
            "video"
        ) {

            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "post-media";

            video.controls = true;

            video.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                video
            );

        } else {

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "post-media";

            img.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                img
            );
        }
    }

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "post-actions";

    const like =
        document.createElement(
            "button"
        );

    like.textContent =
        "❤️ " +
        (post.likes || 0);

    like.onclick =
        async () => {

            const response =
                await request(
                    "/api/posts/" +
                    post.id +
                    "/like",
                    {
                        method: "POST"
                    }
                );

            const data =
                await safeJson(
                    response
                );

            if (response.ok) {
                like.textContent =
                    "❤️ " +
                    data.likes;
            }
        };

    actions.appendChild(
        like
    );

    if (
        Number(post.author_id) ===
        Number(currentUser.id)
    ) {

        const del =
            document.createElement(
                "button"
            );

        del.textContent =
            "🗑️";

        del.onclick =
            async () => {

                if (
                    !confirm(
                        "Удалить пост?"
                    )
                ) {
                    return;
                }

                const response =
                    await request(
                        "/api/posts/" +
                        post.id,
                        {
                            method: "DELETE"
                        }
                    );

                if (response.ok) {
                    article.remove();
                }
            };

        actions.appendChild(
            del
        );
    }

    article.appendChild(
        actions
    );

    container.appendChild(
        article
    );
}

async function createChannel() {

    const name =
        document.getElementById(
            "newChannelName"
        ).value.trim();

    const username =
        document.getElementById(
            "newChannelUsername"
        ).value.trim();

    const description =
        document.getElementById(
            "newChannelDescription"
        ).value.trim();

    const response =
        await request(
            "/api/channels",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        name,
                        username,
                        description
                    })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    closeModal();

    loadChannels();
}


async function loadChannels() {

    const response =
        await request(
            "/api/channels"
        );

    if (!response.ok) {
        return;
    }

    const channels =
        await safeJson(response);

    const container =
        document.getElementById(
            "channels"
        );

    container.innerHTML = "";

    channels.forEach(
        channel => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "post";

            div.innerHTML =
                "<b>📢 " +
                escapeHtml(
                    channel.name
                ) +
                "</b>" +
                "<div style='color:#9095a3;margin-top:5px'>" +
                "@" +
                escapeHtml(
                    channel.username
                ) +
                "</div>" +
                "<div style='margin-top:5px'>" +
                escapeHtml(
                    channel.description ||
                    ""
                ) +
                "</div>";

            container.appendChild(
                div
            );
        }
    );
}


/* =========================================================
   SECOND ACCOUNT
========================================================= */

function openCreateAccount() {

    openModal(`

        <h2>
            ➕ Новый аккаунт
        </h2>

        <input
            id="secondUsername"
            placeholder="Username"
            style="width:100%;margin-bottom:8px"
        >

        <input
            id="secondPassword"
            type="password"
            placeholder="Пароль"
            style="width:100%;margin-bottom:8px"
        >

        <button
            class="primary"
            style="width:100%"
            onclick="createSecondAccount()"
        >
            Создать
        </button>

    `);
}


async function createSecondAccount() {

    const username =
        document.getElementById(
            "secondUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "secondPassword"
        ).value;

    const response =
        await fetch(
            API + "/api/register",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        username,
                        password
                    })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    const accounts =
        JSON.parse(
            localStorage.getItem(
                "accounts"
            ) || "[]"
        );

    accounts.push({
        username,
        token: data.token
    });

    localStorage.setItem(
        "accounts",
        JSON.stringify(
            accounts
        )
    );

    alert(
        "Аккаунт создан"
    );

    closeModal();
}


function switchAccount() {

    const accounts =
        JSON.parse(
            localStorage.getItem(
                "accounts"
            ) || "[]"
        );

    if (!accounts.length) {

        alert(
            "Дополнительных аккаунтов пока нет"
        );

        return;
    }

    openModal(`

        <h2>
            🔄 Переключение аккаунта
        </h2>

        <div id="accountList"></div>

    `);

    const list =
        document.getElementById(
            "accountList"
        );

    accounts.forEach(
        account => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "primary";

            button.style.width =
                "100%";

            button.style.margin =
                "5px 0";

            button.textContent =
                "@" +
                account.username;

            button.onclick =
                () => {

                    token =
                        account.token;

                    localStorage.setItem(
                        "token",
                        token
                    );

                    location.reload();
                };

            list.appendChild(
                button
            );
        }
    );
}

/* =========================================================
   MODALS
========================================================= */

function openModal(html) {

    document.getElementById(
        "modal"
    ).innerHTML =
        html;

    document.getElementById(
        "modalBg"
    ).classList.remove(
        "hidden"
    );
}


function closeModal(event) {

    if (
        event &&
        event.target !==
        document.getElementById(
            "modalBg"
        )
    ) {
        return;
    }

    document.getElementById(
        "modalBg"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "modal"
    ).innerHTML =
        "";

    selectedMessageId =
        null;
}


/* =========================================================
   HELPERS
========================================================= */

function mediaUrl(url) {

    if (!url) {
        return "";
    }

    if (
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ) {
        return url;
    }

    return API + url;
}


function escapeHtml(text) {

    return String(
        text ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


function formatTime(value) {

    if (!value) {
        return "";
    }

    let date =
        new Date(
            value
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        date =
            new Date(
                value + "Z"
            );
    }

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}
