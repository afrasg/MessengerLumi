<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messenger Lumi</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0a0a0f;color:#fff;overflow:hidden}
        .hidden{display:none!important}
        button,input,textarea,select{font:inherit}
        button{cursor:pointer;border:none;background:none;color:inherit}
        input,textarea,select{background:#1a1a24;color:#fff;border:1px solid #2a2a38;border-radius:12px;padding:12px 16px;outline:none;width:100%}
        input:focus,textarea:focus,select:focus{border-color:#5865f2}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:4px}
        ::-webkit-scrollbar-thumb:hover{background:#3a3a4a}
        #splashScreen{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity 0.5s ease,transform 0.5s ease}
        #splashScreen.hidden{opacity:0;transform:scale(1.1);pointer-events:none}
        #splashScreen svg{width:80px;height:80px;animation:splashPulse 1.2s ease-in-out infinite}
        #splashScreen svg path{fill:#5865f2}
        #splashScreen .loader{width:40px;height:4px;background:#e0e0e0;border-radius:4px;overflow:hidden}
        #splashScreen .loader span{display:block;height:100%;width:30%;background:#5865f2;border-radius:4px;animation:loaderMove 1s ease-in-out infinite}
        @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
        @keyframes loaderMove{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
        #auth{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0a0a0f;overflow:auto;padding:20px}
        #auth.hidden{display:none!important}
        .auth-card{width:min(420px,100%);background:#14141e;border:1px solid #2a2a38;border-radius:24px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        .auth-card .logo{text-align:center;margin-bottom:24px}
        .auth-card .logo img{width:48px;height:48px;vertical-align:middle}
        .auth-card .logo span{font-size:24px;font-weight:700;margin-left:10px;vertical-align:middle;color:#fff}
        .auth-card input{margin-bottom:12px}
        .auth-card button{width:100%;margin-top:8px;padding:14px;border-radius:12px;font-weight:600;font-size:15px}
        .primary{background:#5865f2;color:#fff}
        .primary:hover{background:#4752c4}
        .secondary{background:#2a2a38;color:#fff}
        .secondary:hover{background:#3a3a4a}
        .danger-button{background:#e74c4c;color:#fff}
        .danger-button:hover{background:#c0392b}
        .error{color:#e74c4c;min-height:20px;font-size:14px;margin-top:8px;text-align:center}
        .auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6a6a7a;font-size:13px}
        .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:#2a2a38}
        #app{display:flex;width:100%;height:100%}
        #app.hidden{display:none!important}
        .sidebar{width:300px;flex-shrink:0;background:#0f0f17;border-right:1px solid #1a1a24;display:flex;flex-direction:column;height:100%;overflow:hidden}
        .sidebar-header{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a24;flex-shrink:0}
        .sidebar-header .logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
        .sidebar-header .logo img{width:32px;height:32px}
        .sidebar-header .logo span{color:#fff}
        .sidebar-search{padding:10px 16px;flex-shrink:0}
        .sidebar-search input{padding:10px 14px;font-size:14px;background:#1a1a24;border:1px solid #2a2a38;border-radius:10px}
        .sidebar-search input::placeholder{color:#6a6a7a}
        .sidebar-users{flex:1;overflow-y:auto;padding:8px 10px}
        .user-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background 0.15s}
        .user-item:hover{background:#1a1a24}
        .user-item .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#2a2a38}
        .user-item .info{flex:1;min-width:0}
        .user-item .info .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .user-item .info .name .verified{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-left:4px}
        .user-item .info .name .verified svg{width:16px;height:16px;display:block}
        .user-item .info .sub{font-size:13px;color:#8a8a9a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .user-item .badge{background:#5865f2;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;font-weight:600;flex-shrink:0}
        .user-item .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid #0f0f17}
        .user-item .status-dot.online{background:#2ecc71}
        .user-item .status-dot.offline{background:#6a6a7a}
        .section-header{padding:12px 12px 6px;font-size:12px;font-weight:600;color:#6a6a7a;text-transform:uppercase;letter-spacing:0.5px}
        .main{flex:1;min-width:0;display:flex;flex-direction:column;background:#0a0a0f}
        .topbar{height:60px;flex-shrink:0;border-bottom:1px solid #1a1a24;background:#0f0f17;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
        .topbar .title{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px;color:#fff}
        .topbar .title img{width:24px;height:24px;vertical-align:middle}
        .top-actions{display:flex;align-items:center;gap:4px}
        .top-actions .icon-btn{padding:8px;border-radius:10px;transition:background 0.15s;display:flex;align-items:center;justify-content:center;background:transparent!important;color:#b0b0c0!important}
        .top-actions .icon-btn:hover{background:#1a1a24!important;color:#fff!important}
        .top-actions .icon-btn img{width:22px;height:22px;opacity:0.7;filter:brightness(0) invert(1)}
        .top-actions .icon-btn:hover img{opacity:1}
        .content{flex:1;min-height:0;overflow:hidden;position:relative}
        .view{width:100%;height:100%;overflow-y:auto;padding:20px;position:absolute;top:0;left:0;background:#0a0a0f}
        .view.hidden{display:none!important}
        .feed-container{max-width:700px;margin:0 auto}
        .post-box{background:#14141e;border:1px solid #1a1a24;border-radius:16px;padding:16px;margin-bottom:16px}
        .post-box textarea{min-height:80px;resize:vertical;background:transparent;border:none;padding:8px 0;font-size:15px;color:#fff}
        .post-box textarea::placeholder{color:#6a6a7a}
        .post-box .tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .post-box .tools button,.post-box .tools label{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;background:#1a1a24;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
        .post-box .tools .primary-btn{background:#5865f2}
        .post-box .tools .primary-btn:hover{background:#4752c4}
        .post-box .tools label:hover{background:#2a2a38}
        .post-box .tools input[type="file"]{display:none}
        .post{background:#14141e;border:1px solid #1a1a24;border-radius:16px;padding:16px;margin-bottom:14px}
        .post .head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
        .post .head .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#2a2a38;cursor:pointer}
        .post .head .author{font-weight:600;cursor:pointer;color:#fff}
        .post .head .author:hover{color:#8a8aff}
        .post .head .username{font-size:13px;color:#8a8a9a}
        .post .text{white-space:pre-wrap;line-height:1.5;margin-bottom:10px;font-size:15px;color:#fff}
        .post .media{width:100%;max-height:500px;object-fit:contain;border-radius:12px;margin-bottom:10px;background:#0a0a0f}
        .post .actions{display:flex;gap:12px;flex-wrap:wrap}
        .post .actions button{padding:6px 14px;border-radius:8px;background:#1a1a24;color:#c0c0d0;font-size:13px;display:flex;align-items:center;gap:6px;transition:background 0.15s}
        .post .actions button:hover{background:#2a2a38}
        .post .actions button.liked{color:#ff6b6b}
        .post .comments-box{margin-top:12px;padding-top:12px;border-top:1px solid #1a1a24}
        .post .comments-box .comment{padding:8px 0;border-bottom:1px solid #1a1a24;font-size:14px;color:#c0c0d0}
        .post .comments-box .comment:last-child{border-bottom:none}
        .post .comments-box .comment .cname{font-weight:600;cursor:pointer;color:#8a8aff}
        .post .comments-box .comment .ctime{font-size:12px;color:#6a6a7a;margin-left:8px}
        .post .comments-box .comment .reply-btn{font-size:12px;color:#5865f2;cursor:pointer;margin-left:8px}
        .post .comments-box .comment .reply-btn:hover{text-decoration:underline}
        .post .comments-box .comment .replies{margin-left:20px;margin-top:6px;padding-left:10px;border-left:2px solid #2a2a38}
        .post .comments-box .comment .replies .comment{padding:4px 0;font-size:13px}
        .post .comments-box .comment-form{display:flex;gap:8px;margin-top:10px}
        .post .comments-box .comment-form input{flex:1;padding:10px 14px;border-radius:10px;background:#1a1a24;border:1px solid #2a2a38;font-size:14px;color:#fff}
        .post .comments-box .comment-form button{padding:10px 18px;border-radius:10px;background:#5865f2;color:#fff;font-weight:600}
        .chat-container{display:flex;flex-direction:column;height:100%;background:#0a0a0f}
        .chat-header{padding:14px 20px;border-bottom:1px solid #1a1a24;background:#0f0f17;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;cursor:pointer;transition:background 0.15s}
        .chat-header:hover{background:#14141e}
        .chat-header .left{display:flex;align-items:center;gap:12px;min-width:0}
        .chat-header .left .avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#2a2a38}
        .chat-header .left .info{min-width:0}
        .chat-header .left .info .name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
        .chat-header .left .info .name .verified{display:inline-block;width:16px;height:16px;vertical-align:middle;margin-left:4px}
        .chat-header .left .info .name .verified svg{width:16px;height:16px;display:block}
        .chat-header .left .info .status{font-size:13px;color:#8a8a9a}
        .chat-header .left .info .status.online{color:#2ecc71}
        .chat-header .left .info .status.offline{color:#6a6a7a}
        .chat-header .left .info .status.typing{color:#5865f2;animation:typingDots 1.2s ease-in-out infinite}
        @keyframes typingDots{0%,20%{opacity:0.3}40%{opacity:1}60%,100%{opacity:0.3}}
        .chat-header .actions{display:flex;align-items:center;gap:4px}
        .chat-header .actions button{padding:6px;border-radius:8px;font-size:18px;transition:background 0.15s;background:transparent!important;color:#b0b0c0!important}
        .chat-header .actions button:hover{background:#1a1a24!important;color:#fff!important}
        .messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
        .message-row{display:flex;width:100%}
        .message-row.mine{justify-content:flex-end}
        .message-row.theirs{justify-content:flex-start}
        .message-bubble{max-width:min(70%,500px);padding:8px 14px;border-radius:16px;word-break:break-word;font-size:15px;line-height:1.4;position:relative}
        .message-row.mine .message-bubble{background:#5865f2;color:#fff;border-bottom-right-radius:4px}
        .message-row.theirs .message-bubble{background:#1a1a24;color:#fff;border-bottom-left-radius:4px}
        .message-bubble .meta{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;opacity:0.7;justify-content:flex-end;color:#c0c0d0}
        .message-bubble .meta .status{font-size:11px}
        .message-bubble .meta .status.read{color:#8a8aff}
        .message-bubble .meta .status.unread{color:#f1c40f}
        .message-bubble .deleted{opacity:0.5;font-style:italic;color:#8a8a9a}
        .message-bubble .media{max-width:100%;border-radius:10px;margin-top:6px;cursor:pointer}
        .message-bubble .media-audio{width:100%;margin-top:6px}
        .message-bubble .media-file{display:inline-block;margin-top:6px;color:#8a8aff;text-decoration:none}
        .composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #1a1a24;background:#0f0f17;flex-shrink:0;align-items:center}
        .composer input{flex:1;padding:10px 16px;border-radius:12px;background:#1a1a24;border:1px solid #2a2a38;font-size:15px;color:#fff}
        .composer input:disabled{opacity:0.5;cursor:not-allowed}
        .composer input::placeholder{color:#6a6a7a}
        .composer .send-btn{padding:10px 20px;border-radius:12px;background:#5865f2;color:#fff;font-weight:600;font-size:15px;white-space:nowrap;min-width:120px}
        .composer .send-btn:hover{background:#4752c4}
        .composer .send-btn:disabled{opacity:0.5;cursor:not-allowed}
        .composer .icon-btn{padding:8px;border-radius:10px;font-size:20px;transition:background 0.15s;background:transparent!important;color:#b0b0c0!important}
        .composer .icon-btn:hover{background:#1a1a24!important;color:#fff!important}
        .composer .icon-btn.recording{outline:2px solid #e74c4c;background:rgba(231,76,76,0.15)!important}
        .composer .icon-btn img{width:24px;height:24px;filter:brightness(0) invert(0.7)}
        .composer .icon-btn:hover img{filter:brightness(0) invert(1)}
        #attachPreview{padding:8px 16px;border-top:1px solid #1a1a24;background:#0f0f17;display:none;align-items:center;gap:10px;flex-shrink:0}
        #attachPreview:not(.hidden){display:flex}
        #attachPreview img{max-height:120px;border-radius:8px}
        #attachPreview .file-info{flex:1;font-size:14px;color:#c0c0d0}
        #blockedBar{padding:12px 16px;border-top:1px solid #1a1a24;background:#0f0f17;display:none;flex-shrink:0}
        #blockedBar:not(.hidden){display:block}
        #blockedBar button{width:100%;padding:10px;border-radius:10px;background:#e74c4c;color:#fff;font-weight:600}
        .reels-container{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;padding:0;background:#000}
        .reels-container .reel{height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#0a0a0f;padding:20px}
        .reels-container .reel .reel-media{max-height:80vh;max-width:100%;border-radius:16px;object-fit:contain;background:#000}
        .reels-container .reel .reel-info{position:absolute;bottom:80px;left:20px;right:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.8)}
        .reels-container .reel .reel-info .author{font-weight:700;font-size:18px;cursor:pointer;color:#fff}
        .reels-container .reel .reel-info .text{font-size:15px;margin-top:4px;opacity:0.9;color:#fff}
        .reels-container .reel .reel-actions{position:absolute;right:16px;bottom:120px;display:flex;flex-direction:column;gap:16px;align-items:center}
        .reels-container .reel .reel-actions button{background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);border:none;border-radius:50%;width:48px;height:48px;font-size:24px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 0.15s}
        .reels-container .reel .reel-actions button:hover{transform:scale(1.1)}
        .reels-container .reel .reel-actions button .count{font-size:12px;margin-top:2px;display:block;color:#fff}
        .reels-container .reel .reel-actions button.liked{color:#ff6b6b}
        .reels-container .reel .reel-profile{position:absolute;top:60px;right:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
        .reels-container .reel .reel-profile .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;cursor:pointer}
        .reels-container .reel .reel-profile .username{font-size:12px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8)}
        .reels-profile{max-width:600px;margin:0 auto;padding:20px}
        .reels-profile .header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
        .reels-profile .header .avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #5865f2}
        .reels-profile .header .info .name{font-size:22px;font-weight:700;color:#fff}
        .reels-profile .header .info .username{color:#8a8a9a;font-size:15px}
        .reels-profile .header .info .bio{margin-top:4px;font-size:14px;color:#c0c0d0}
        .reels-profile .stats{display:flex;gap:30px;margin-bottom:20px;padding:12px 0;border-top:1px solid #1a1a24;border-bottom:1px solid #1a1a24}
        .reels-profile .stats div{text-align:center}
        .reels-profile .stats div .num{font-size:18px;font-weight:700;color:#fff}
        .reels-profile .stats div .label{font-size:13px;color:#8a8a9a}
        .reels-profile .reels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
        .reels-profile .reels-grid .item{aspect-ratio:1;background:#1a1a24;border-radius:4px;overflow:hidden;cursor:pointer;position:relative}
        .reels-profile .reels-grid .item img,.reels-profile .reels-grid .item video{width:100%;height:100%;object-fit:cover}
        .reels-profile .reels-grid .item .overlay{position:absolute;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;color:#fff}
        .reels-profile .reels-grid .item:hover .overlay{opacity:1}
        .profile-container{max-width:700px;margin:0 auto}
        .card{background:#14141e;border:1px solid #1a1a24;border-radius:16px;padding:20px;margin-bottom:16px}
        .card h2{font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;color:#fff}
        .card h2 img{width:24px;height:24px}
        .card h3{font-size:16px;margin-bottom:12px;color:#c0c0d0}
        .card .field{margin-bottom:12px}
        .card .field label{display:block;font-size:13px;color:#8a8a9a;margin-bottom:4px}
        .card .field input,.card .field textarea,.card .field select{padding:10px 14px;border-radius:10px;background:#1a1a24;border:1px solid #2a2a38;font-size:14px;color:#fff}
        .card .field textarea{min-height:80px;resize:vertical}
        .card .big-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#2a2a38;margin-bottom:12px}
        .card .btn-row{display:flex;gap:8px;flex-wrap:wrap}
        .card .btn-row button{padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;flex:1;min-width:120px;color:#fff}
        .card .btn-row .primary{background:#5865f2;color:#fff}
        .card .btn-row .primary:hover{background:#4752c4}
        .card .btn-row .danger{background:#e74c4c;color:#fff}
        .card .btn-row .danger:hover{background:#c0392b}
        .card .btn-row .secondary{background:#2a2a38;color:#fff}
        .card .btn-row .secondary:hover{background:#3a3a4a}
        .settings-tabs{display:flex;gap:4px;border-bottom:1px solid #1a1a24;margin-bottom:20px;flex-wrap:wrap}
        .settings-tabs button{padding:10px 16px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;color:#8a8a9a;background:transparent;transition:all 0.15s;border:none;cursor:pointer}
        .settings-tabs button.active{color:#fff;background:#1a1a24}
        .settings-tabs button:hover{color:#fff}
        .settings-tab{display:none}
        .settings-tab.active{display:block}
        .setting{padding:12px 0;border-bottom:1px solid #1a1a24}
        .setting:last-child{border-bottom:none}
        .setting label{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px;color:#c0c0d0}
        .setting label select,.setting label input[type="checkbox"]{width:auto;flex-shrink:0;color:#fff;background:#1a1a24}
        .setting label input[type="checkbox"]{width:18px;height:18px;accent-color:#5865f2}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
        .modal-bg.hidden{display:none!important}
        .modal{width:min(500px,100%);max-height:90vh;overflow-y:auto;background:#14141e;border:1px solid #2a2a38;border-radius:20px;padding:24px}
        .modal h2{font-size:20px;margin-bottom:16px;color:#fff}
        .modal .close-btn{float:right;font-size:24px;color:#8a8a9a;background:none;border:none;cursor:pointer}
        .modal .close-btn:hover{color:#fff}
        .modal input,.modal textarea,.modal select{background:#1a1a24;color:#fff;border:1px solid #2a2a38;border-radius:10px;padding:10px;width:100%}
        .modal .primary{background:#5865f2;color:#fff;padding:10px;border-radius:10px;width:100%;border:none;cursor:pointer;font-weight:600}
        .modal .primary:hover{background:#4752c4}
        .modal .secondary{background:#2a2a38;color:#fff;padding:10px;border-radius:10px;width:100%;border:none;cursor:pointer}

        // WEBSOCKET
        function connectWS() {
            if (!token || !currentUser) return;
            try {
                var proto = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(proto + "//" + location.host + "/ws?token=" + encodeURIComponent(token));
                ws.onmessage = async function(e) {
                    var data;
                    try { data = JSON.parse(e.data); } catch(ex) { return; }
                    if (data.type === "call_signal") { await handleCallSignal(data); return; }
                    if (data.type === "message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "private");
                        if (selectedUserId && (Number(data.message.sender_id) === Number(selectedUserId) || Number(data.message.receiver_id) === Number(selectedUserId))) {
                            await loadMessages(selectedUserId);
                        }
                        await loadDialogs();
                        return;
                    }
                    if (data.type === "group_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "group");
                        if (selectedGroupId && Number(selectedGroupId) === Number(data.message.group_id)) {
                            await loadGroupMessages(selectedGroupId);
                        }
                        return;
                    }
                    if (data.type === "channel_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "channel");
                        if (selectedChannelId && Number(selectedChannelId) === Number(data.message.channel_id)) {
                            await loadChannelMessages(selectedChannelId);
                        }
                        return;
                    }
                    if (data.type === "community_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "community");
                        if (selectedCommunityChatId && Number(selectedCommunityChatId) === Number(data.message.chat_id)) {
                            await loadCommunityChatMessages(selectedCommunityChatId);
                        }
                        return;
                    }
                    if (data.type === "typing" && selectedUserId && data.user_id == selectedUserId) {
                        document.getElementById("chatStatus").innerHTML = '<span class="typing">печатает...</span>';
                        clearTimeout(window.typingTimeout);
                        window.typingTimeout = setTimeout(function(){ updateChatStatus(currentChatPeer); }, 3000);
                        return;
                    }
                    if (selectedUserId) { await loadMessages(selectedUserId); }
                    else if (selectedGroupId) { await loadGroupMessages(selectedGroupId); }
                    else if (selectedChannelId) { await loadChannelMessages(selectedChannelId); }
                    else if (selectedCommunityChatId) { await loadCommunityChatMessages(selectedCommunityChatId); }
                };
                ws.onclose = function(){ if(token) setTimeout(connectWS,3000); };
            } catch(ex) {}
        }

        async function toggleComments(postId, article, btn) {

                    ' <span class="reply-btn" onclick="openReplyComment('+postId+','+c.id+',\''+escapeHtml(c.username)+'\')">Ответить</span>';

                    var del = document.createElement("button"); del.textContent = "🗑️";
                    del.style.cssText = "background:none;border:none;color:#e74c4c;cursor:pointer;font-size:12px;margin-left:8px";

                        if (!confirm("Удалить комментарий?")) return;
                        await req("/api/comments/" + c.id, { method: "DELETE" });

        // NOTIFICATIONS
        function requestNotifyPermission() {
            if (typeof Notification !== "undefined" && Notification.permission === "default") {
                Notification.requestPermission().catch(function(){});
            }
        }
        function notifyNewMessage(message, kind) {
            if (!message || Number(message.sender_id) === Number(currentUser?.id)) return;
            var chatKind = kind || message.chat_kind || "private";
            if (chatKind === "private" && selectedUserId && Number(selectedUserId) === Number(message.sender_id)) { loadDialogs(); return; }
            if (chatKind === "group" && selectedGroupId && Number(selectedGroupId) === Number(message.group_id)) return;
            if (chatKind === "channel" && selectedChannelId && Number(selectedChannelId) === Number(message.channel_id)) return;
            if (chatKind === "community" && selectedCommunityChatId && Number(selectedCommunityChatId) === Number(message.chat_id)) return;
            var preview = message.text || "";
            if (message.media_type === "voice") preview = "Голосовое";
            else if (message.media_type === "image") preview = "Фото";
            else if (message.media_type === "file") preview = "Файл";
            if (preview.length > 100) preview = preview.slice(0,100) + "…";
            var uname = message.sender_name || message.sender_username || "user";
            var title = "", body = "";
            if (chatKind === "group") { title = message.group_name || "Группа"; body = uname + ": " + preview; }
            else if (chatKind === "channel") { title = message.channel_name || "Канал"; body = preview; }
            else if (chatKind === "community") { title = (message.community_name || "Сообщество") + " · " + (message.chat_name || "Чат"); body = uname + ": " + preview; }
            else { title = uname; body = preview; }
            showToast(title, body, function(){
                if (chatKind === "private") { openChat({ id: message.sender_id, username: message.sender_username || "user", display_name: uname, is_bot: false, last_seen: null }); }
                else if (chatKind === "group" && message.group_id) { openGroupChat(message.group_id, message.group_name || "Группа"); }
                else if (chatKind === "channel" && message.channel_id) { openChannelChat(message.channel_id, message.channel_name || "Канал", false); }
                else if (chatKind === "community" && message.chat_id) { openCommunityChat(message.chat_id, message.chat_name || "Чат", message.community_name || ""); }
            });
            if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                try { var n = new Notification(title, { body: body, silent: true }); n.onclick = function(){ window.focus(); }; } catch(ex) {}
            }
            loadDialogs();
        }

        // FILES & VOICE
        var pendingFile = null;
        function previewFile() {
            var input = document.getElementById("dmFile");
            var file = input.files && input.files[0];
            if (!file) return;
            pendingFile = file;
            var box = document.getElementById("attachPreview");
            box.classList.remove("hidden");
            var info = box.querySelector(".file-info");
            if (file.type.startsWith("image/")) {
                var url = URL.createObjectURL(file);

                mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) voiceChunks.push(e.data); };
                mediaRecorder.onstop = async function(){
                    try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(ex) {}
                    var duration = Date.now() - voiceStart;
                    if (duration < 300 || voiceChunks.length === 0) return;
                    var blob = new Blob(voiceChunks, { type: mime });
                    var ext = mime.includes("ogg") ? "ogg" : "webm";
                    var file = new File([blob], "voice." + ext, { type: mime.split(";")[0] });
                    await uploadMedia(file, "");

                };
                voiceStart = Date.now();

        async function setupCall(isCallerSide) {
            try {
                if (!callTargetId) return;
                var constraints = { audio: true };
                if (callIsVideo) constraints.video = { width: { ideal: 640 }, height: { ideal: 480 } };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (callIsVideo) {
                    document.getElementById("localVideo").srcObject = localStream;
                    document.getElementById("localVideo").style.display = "block";
                }
                pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
                localStream.getTracks().forEach(function(t){ pc.addTrack(t, localStream); });
                pc.ontrack = function(e){
                    var stream = e.streams[0];
                    if (stream) {
                        if (callIsVideo) {
                            document.getElementById("remoteVideo").srcObject = stream;
                            document.getElementById("remoteVideo").style.display = "block";
                        } else {
                            document.getElementById("remoteAudio").srcObject = stream;
                        }
                        document.getElementById("callStatus").textContent = "В разговоре";
                        startCallTimer();
                    }
                };
                pc.onicecandidate = function(e){
                    if (e.candidate && callTargetId) {
                        req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: callTargetId, signal_type: "ice", payload: { candidate: e.candidate } }) }).catch(function(){});
                    }
                };
                pc.oniceconnectionstatechange = function(){
                    if (!pc) return;
                    var state = pc.iceConnectionState;
                    if (state === "connected" || state === "completed") {
                        document.getElementById("callStatus").textContent = "Соединено";
                    } else if (state === "disconnected" || state === "failed") {
                        if (document.getElementById("callStatus").textContent !== "Завершено") {
                            document.getElementById("callStatus").textContent = "Соединение потеряно";
                            setTimeout(function(){ endCall(); }, 3000);
                        }
                    }
                };
                if (isCallerSide) {
                    var offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    await req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: callTargetId, signal_type: "offer", payload: { sdp: offer, video: callIsVideo } }) });
                }
            } catch(err) {
                console.error(err);
                alert("Ошибка доступа к микрофону/камере");
                endCall();
            }
        }
        async function handleCallSignal(data) {
            var fromId = data.from_id;
            var type = data.signal_type;
            var payload = data.payload || {};
            if (fromId === currentUser?.id) return;
            if (type === "offer-request") {
                if (callTargetId || incomingCallData) {
                    await req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: fromId, signal_type: "busy", payload: {} }) });
                    return;
                }
                incomingCallData = { fromId: fromId, video: payload.video || false, sdp: null };
                pendingIceCandidates = [];
                try {
                    var r = await req("/api/users/" + fromId);
                    if (r.ok) {
                        var user = await safeJson(r);
                        document.getElementById("incomingCallName").textContent = user.display_name || user.username;
                        document.getElementById("incomingCallAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) : "";
                        document.getElementById("incomingCallSub").textContent = (payload.video ? "Видеозвонок" : "Аудиозвонок") + " от " + (user.display_name || user.username);
                    }
                } catch(ex) {}
                document.getElementById("incomingCallOverlay").classList.remove("hidden");
                playRing();
                if (incomingCallTimeout) clearTimeout(incomingCallTimeout);
                incomingCallTimeout = setTimeout(function(){
                    if (document.getElementById("incomingCallOverlay").classList.contains("hidden")) return;
                    declineIncomingCall();
                }, 30000);
                return;
            }
            if (type === "busy") {
                stopRing();
                document.getElementById("callStatus").textContent = "Абонент занят";
                setTimeout(function(){ endCall(); }, 2000);
                return;
            }
            if (type === "offer") {
                // Сохраняем SDP, НЕ скрываем меню принятия
                if (!incomingCallData && !callTargetId) {
                    incomingCallData = { fromId: fromId, video: payload.video || false, sdp: payload.sdp || null };
                    pendingIceCandidates = [];
                    try {
                        var r2 = await req("/api/users/" + fromId);
                        if (r2.ok) {
                            var user2 = await safeJson(r2);
                            document.getElementById("incomingCallName").textContent = user2.display_name || user2.username;
                            document.getElementById("incomingCallAvatar").src = user2.avatar_url ? mediaUrl(user2.avatar_url) : "";
                            document.getElementById("incomingCallSub").textContent = (payload.video ? "Видеозвонок" : "Аудиозвонок") + " от " + (user2.display_name || user2.username);
                        }
                    } catch(ex) {}
                    document.getElementById("incomingCallOverlay").classList.remove("hidden");
                    playRing();
                    if (incomingCallTimeout) clearTimeout(incomingCallTimeout);
                    incomingCallTimeout = setTimeout(function(){
                        if (document.getElementById("incomingCallOverlay").classList.contains("hidden")) return;
                        declineIncomingCall();
                    }, 30000);
                    return;
                }
                if (incomingCallData && Number(incomingCallData.fromId) === Number(fromId)) {
                    if (payload.sdp) incomingCallData.sdp = payload.sdp;
                    if (payload.video !== undefined) incomingCallData.video = payload.video;
                    // если пользователь уже нажал «Принять», а SDP только сейчас пришёл
                    if (incomingCallData.answered && pc && payload.sdp) {
                        try {
                            await pc.setRemoteDescription(payload.sdp);
                            for (var j = 0; j < pendingIceCandidates.length; j++) {
                                try { await pc.addIceCandidate(pendingIceCandidates[j]); } catch(e) {}
                            }
                            pendingIceCandidates = [];
                            var ans = await pc.createAnswer();
                            await pc.setLocalDescription(ans);
                            await req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: fromId, signal_type: "answer", payload: { sdp: ans } }) });
                            document.getElementById("callStatus").textContent = "Соединено";
                            incomingCallData = null;
                        } catch(err) { console.error(err); }
                    }
                }
                return;
            }
            if (type === "answer") {
                stopRing();
                if (pc && payload.sdp) {
                    try {
                        await pc.setRemoteDescription(payload.sdp);
                        // добавить отложенные ICE
                        for (var i = 0; i < pendingIceCandidates.length; i++) {
                            try { await pc.addIceCandidate(pendingIceCandidates[i]); } catch(e) {}
                        }
                        pendingIceCandidates = [];
                        document.getElementById("callStatus").textContent = "Соединено";
                        startCallTimer();
                    } catch(err) { console.error(err); }
                }
                return;
            }
            if (type === "ice") {
                if (payload.candidate) {
                    if (pc && pc.remoteDescription) {
                        try { await pc.addIceCandidate(payload.candidate); } catch(err) { console.error(err); }
                    } else {
                        pendingIceCandidates.push(payload.candidate);
                    }
                }
                return;
            }
            if (type === "hangup") {
                if (incomingCallTimeout) { clearTimeout(incomingCallTimeout); incomingCallTimeout = null; }
                if (!document.getElementById("incomingCallOverlay").classList.contains("hidden")) {
                    document.getElementById("incomingCallOverlay").classList.add("hidden");
                    stopRing();
                    incomingCallData = null;
                    pendingIceCandidates = [];
                }
                if (callTargetId || pc) {
                    document.getElementById("callStatus").textContent = "Собеседник завершил звонок";
                    setTimeout(function(){ endCall(); }, 1500);
                }
                return;
            }
        }

        async function answerIncomingCall() {
            if (!incomingCallData) return;
            if (incomingCallTimeout) { clearTimeout(incomingCallTimeout); incomingCallTimeout = null; }
            var data = incomingCallData;
            var fromId = data.fromId;
            var sdp = data.sdp;
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            stopRing();
            callTargetId = fromId;
            callIsVideo = data.video || false;
            isCaller = false;
            showCallOverlay();
            try {
                var r = await req("/api/users/" + fromId);
                if (r.ok) {
                    var user = await safeJson(r);
                    document.getElementById("callName").textContent = user.display_name || user.username;
                    document.getElementById("callAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) : "";
                }
            } catch(ex) {}
            document.getElementById("callStatus").textContent = "Соединение...";
            try {
                await setupCall(false);
                // SDP мог обновиться пока setupCall работал
                if (incomingCallData && incomingCallData.sdp) sdp = incomingCallData.sdp;
                if (pc && sdp) {
                    await pc.setRemoteDescription(sdp);
                    for (var i = 0; i < pendingIceCandidates.length; i++) {
                        try { await pc.addIceCandidate(pendingIceCandidates[i]); } catch(e) {}
                    }
                    pendingIceCandidates = [];
                    var answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: fromId, signal_type: "answer", payload: { sdp: answer } }) });
                    document.getElementById("callStatus").textContent = "Соединено";
                    incomingCallData = null;
                } else {
                    // SDP ещё не пришёл — пометим, что уже ответили, handleCallSignal доделает
                    incomingCallData = { fromId: fromId, video: data.video, sdp: null, answered: true };
                    document.getElementById("callStatus").textContent = "Ожидание соединения...";
                }
            } catch(err) {
                console.error(err);
                alert("Ошибка при ответе на звонок");
                endCall();
            }
        }
        function endCall() {
            stopRing();
            if (incomingCallTimeout) { clearTimeout(incomingCallTimeout); incomingCallTimeout = null; }
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            document.getElementById("callOverlay").classList.add("hidden");
            stopCallTimer();
            if (callTargetId) {
                req("/api/calls/signal", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target_id: callTargetId, signal_type: "hangup", payload: {} }) }).catch(function(){});
            }
            if (pc) { try { pc.close(); } catch(ex) {} }
            pc = null;
            if (localStream) { localStream.getTracks().forEach(function(t){ t.stop(); }); localStream = null; }
            document.getElementById("localVideo").srcObject = null;
            document.getElementById("remoteVideo").srcObject = null;
            document.getElementById("remoteAudio").srcObject = null;
            document.getElementById("localVideo").style.display = "none";
            document.getElementById("remoteVideo").style.display = "none";
            callTargetId = null; callStartTime = null; incomingCallData = null; isCaller = false; micMuted = false; speakerMuted = false;
            pendingIceCandidates = [];
            document.getElementById("muteBtn").innerHTML = '<img width="32" height="32" src="https://img.icons8.ru/ios-filled/50/microphone--v1.png" alt="microphone">';
            document.getElementById("muteBtn").classList.remove("active");
            document.getElementById("speakerBtn").innerHTML = '<img width="32" height="32" src="https://img.icons8.ru/ios-filled/50/speaker.png" alt="speaker">';
            document.getElementById("speakerBtn").classList.remove("active");
        }

        // START
        document.getElementById("auth").classList.remove("hidden");
        document.getElementById("app").classList.add("hidden");
        if (localStorage.getItem("token")) {
            checkAuth();
        }
    </script>
</body>
