<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>MyMessenger</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0e1621;
    color: white;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.auth {
    width: 380px;
    max-width: calc(100% - 30px);
    margin: 80px auto;
    background: #17212b;
    padding: 30px;
    border-radius: 18px;
}

.auth h1 {
    text-align: center;
}

.auth input {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 0;
    border-radius: 10px;
    background: #242f3a;
    color: white;
    outline: none;
}

.auth button {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: #2aabee;
    color: white;
}

#app {
    display: none;
    height: 100vh;
}

.sidebar {
    width: 300px;
    background: #17212b;
    border-right: 1px solid #263746;
    display: flex;
    flex-direction: column;
}

.logo {
    padding: 18px;
    font-size: 21px;
    font-weight: bold;
}

.search {
    margin: 0 12px 12px;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #242f3a;
    color: white;
    outline: none;
}

.users {
    overflow-y: auto;
}

.user {
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    cursor: pointer;
}

.user:hover {
    background: #202f3d;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    background: #2aabee;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.user-name {
    font-weight: bold;
}

.user-username {
    color: #8295a5;
    font-size: 12px;
    margin-top: 3px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 62px;
    background: #17212b;
    border-bottom: 1px solid #263746;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

.top-actions {
    display: flex;
    gap: 7px;
}

.icon-button {
    border: 0;
    background: #243342;
    color: white;
    border-radius: 9px;
    padding: 9px 12px;
}

.content {
    flex: 1;
    overflow: hidden;
    position: relative;
}

.view {
    height: 100%;
    overflow-y: auto;
    padding: 20px;
}

.chat {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 15px 20px;
    background: #17212b;
    border-bottom: 1px solid #263746;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.message {
    width: fit-content;
    max-width: 70%;
    background: #182533;
    padding: 9px 12px;
    margin: 7px 0;
    border-radius: 12px;
}

.message.mine {
    margin-left: auto;
    background: #2b5278;
}

.time {
    color: #a8bac8;
    font-size: 11px;
    text-align: right;
    margin-top: 4px;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #17212b;
}

.composer input {
    flex: 1;
    border: 0;
    border-radius: 12px;
    padding: 13px;
    background: #242f3a;
    color: white;
    outline: none;
}

.send {
    width: 52px;
    border: 0;
    border-radius: 12px;
    background: #2aabee;
    color: white;
}

.feed {
    max-width: 700px;
    margin: auto;
}

.post-box,
.post {
    background: #17212b;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
}

.post-box textarea {
    width: 100%;
    resize: vertical;
    min-height: 80px;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    background: #242f3a;
    color: white;
    outline: none;
}

.post-tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.post-tools button,
.post-tools label {
    border: 0;
    background: #2aabee;
    color: white;
    padding: 9px 13px;
    border-radius: 9px;
}

.post-header {
    display: flex;
    gap: 10px;
    align-items: center;
}

.post-author {
    font-weight: bold;
}

.post-username {
    color: #8295a5;
    font-size: 12px;
}

.post-text {
    white-space: pre-wrap;
    margin: 14px 0;
}

.post-media {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    border-radius: 12px;
    background: #0e1621;
}

.post-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.post-actions button {
    border: 0;
    border-radius: 8px;
    background: #243342;
    color: white;
    padding: 8px 12px;
}

.comments {
    margin-top: 12px;
}

.comment {
    background: #202d39;
    padding: 10px;
    border-radius: 9px;
    margin-top: 7px;
}

.comment.reply {
    margin-left: 30px;
    background: #253644;
}

.comment-top {
    display: flex;
    gap: 8px;
    align-items: center;
}

.comment-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    background: #2aabee;
}

.comment-user {
    font-weight: bold;
}

.comment-date {
    color: #8295a5;
    font-size: 11px;
}

.comment-text {
    margin-top: 7px;
    white-space: pre-wrap;
}

.comment-buttons {
    display: flex;
    gap: 5px;
    margin-top: 7px;
}

.comment-buttons button {
    border: 0;
    background: #304454;
    color: white;
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 12px;
}

.comment-input {
    display: flex;
    gap: 6px;
    margin-top: 8px;
}

.comment-input input {
    flex: 1;
    background: #242f3a;
    border: 0;
    padding: 9px;
    color: white;
    border-radius: 8px;
    outline: none;
}

.comment-input button {
    border: 0;
    background: #2aabee;
    color: white;
    border-radius: 8px;
    padding: 0 14px;
}

.reply-label {
    color: #2aabee;
    font-size: 12px;
    margin-top: 5px;
}

.profile {
    max-width: 600px;
    margin: auto;
}

.profile-card {
    background: #17212b;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
}

.big-avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    background: #2aabee;
    margin: auto;
}

.profile input,
.profile textarea {
    width: 100%;
    margin: 7px 0;
    border: 0;
    padding: 12px;
    border-radius: 9px;
    background: #242f3a;
    color: white;
    outline: none;
}

.primary {
    background: #2aabee;
    border: 0;
    color: white;
    padding: 11px 15px;
    border-radius: 9px;
}

.danger {
    background: #d84a4a;
    border: 0;
    color: white;
    padding: 11px 15px;
    border-radius: 9px;
    margin-top: 10px;
}

.share-copy {
    color: #2aabee;
    font-size: 12px;
    margin-top: 7px;
    display: none;
}

@media(max-width:750px) {

    .sidebar {
        width: 85px;
    }

    .logo {
        font-size: 13px;
        padding: 12px 5px;
    }

    .user {
        padding: 10px 5px;
        justify-content: center;
    }

    .user > div:last-child {
        display: none;
    }

    .search {
        margin: 5px;
    }

    .view {
        padding: 10px;
    }

    .message {
        max-width: 85%;
    }

    .comment.reply {
        margin-left: 15px;
    }
}

</style>

</head>

<body>


<!-- =====================================================
AUTH
===================================================== -->

<div class="auth" id="auth">

    <h1>💬 MyMessenger</h1>

    <input
        id="username"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
    >

    <button onclick="login()">
        Войти
    </button>

    <button onclick="register()">
        Создать аккаунт
    </button>

    <p id="authError"></p>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            💬 MyMessenger
        </div>

        <input
            class="search"
            id="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div
            class="users"
            id="users"
        ></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong id="pageTitle">
                📰 Лента
            </strong>

            <div class="top-actions">

                <button
                    class="icon-button"
                    onclick="showFeed()"
                >
                    📰
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                >
                    👤
                </button>

                <button
                    class="icon-button"
                    onclick="logout()"
                >
                    🚪
                </button>

            </div>

        </div>


        <div class="content">


            <!-- =================================================
            FEED
            ================================================= -->

            <section
                class="view"
                id="feedView"
            >

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button onclick="publishPost()">
                                📝 Опубликовать
                            </button>

                            <label>

                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                >

                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- =================================================
            CHAT
            ================================================= -->

            <section
                class="view"
                id="chatView"
                style="display:none;padding:0"
            >

                <div class="chat">

                    <div
                        class="chat-header"
                        id="chatHeader"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        class="messages"
                        id="messages"
                    ></div>

                    <div class="composer">

                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- =================================================
            PROFILE
            ================================================= -->

            <section
                class="view"
                id="profileView"
                style="display:none"
            >

                <div class="profile">

                    <div class="profile-card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            src=""
                        >

                        <h2>
                            ⚙️ Профиль
                        </h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>
                            🖼️ Новый аватар
                        </p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить профиль
                        </button>

                        <br>

                        <button
                            class="danger"
                            onclick="logout()"
                        >
                            🚪 Выйти из аккаунта
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script>


// =========================================================
// CONFIG
// =========================================================
//
// Если frontend и backend находятся на Render
// и этот index.html лежит в static,
// оставь:
//
// const API = "";
//
// Если index.html находится на Netlify,
// впиши сюда адрес своего Render backend:
//
// const API = "https://ТВОЙ-СЕРВЕР.onrender.com";
//
// =========================================================

const API = "";


let token =
    localStorage.getItem("token");

let currentUser = null;

let selectedUser = null;

let socket = null;


// =========================================================
// API
// =========================================================

function api(path) {

    return API + path;

}


async function request(
    path,
    options = {}
) {

    options.headers =
        options.headers || {};

    if (token) {

        options.headers.Authorization =
            "Bearer " + token;

    }

    return fetch(
        api(path),
        options
    );

}


// =========================================================
// AUTH
// =========================================================

async function register() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/register"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Ошибка регистрации"
            );

        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).innerText =
            error.message;

    }

}


async function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/login"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Ошибка входа"
            );

        }

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        await startApp();

    } catch (error) {

        document.getElementById(
            "authError"
        ).innerText =
            error.message;

    }

}


// =========================================================
// START
// =========================================================

async function startApp() {

    try {

        const response =
            await request(
                "/api/me"
            );

        if (!response.ok) {

            logout();

            return;

        }

        currentUser =
            await response.json();

        document.getElementById(
            "auth"
        ).style.display = "none";

        document.getElementById(
            "app"
        ).style.display = "flex";

        connectWebSocket();

        searchUsers();

        showFeed();

        // Если открыта ссылка на конкретный пост
        const params =
            new URLSearchParams(
                window.location.search
            );

        const postId =
            params.get("post");

        if (postId) {

            setTimeout(
                () => openSharedPost(postId),
                300
            );

        }

    } catch (error) {

        console.error(error);

    }

}


// =========================================================
// LOGOUT
// =========================================================

function logout() {

    localStorage.removeItem(
        "token"
    );

    token = null;

    if (socket) {

        try {
            socket.close();
        } catch {}

    }

    location.reload();

}


// =========================================================
// WEBSOCKET
// =========================================================

function connectWebSocket() {

    if (!currentUser) return;

    let base;

    if (API) {

        base = API;

    } else {

        base =
            location.protocol === "https:"
                ? "https://" + location.host
                : "http://" + location.host;

    }

    const wsBase =
        base.replace(
            "https://",
            "wss://"
        ).replace(
            "http://",
            "ws://"
        );

    socket =
        new WebSocket(
            wsBase +
            "/ws/" +
            currentUser.id
        );

    socket.onmessage =
        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );

                if (
                    data.type === "message"
                ) {

                    const message =
                        data.message;

                    if (
                        selectedUser &&
                        (
                            (
                                message.sender_id ===
                                currentUser.id &&
                                message.receiver_id ===
                                selectedUser.id
                            )
                            ||
                            (
                                message.sender_id ===
                                selectedUser.id &&
                                message.receiver_id ===
                                currentUser.id
                            )
                        )
                    ) {

                        addMessage(
                            message
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "WebSocket error:",
                    error
                );

            }

        };

    socket.onclose =
        () => {

            setTimeout(
                connectWebSocket,
                3000
            );

        };

}


// =========================================================
// USERS
// =========================================================

async function searchUsers() {

    try {

        const q =
            document.getElementById(
                "search"
            ).value;

        const response =
            await request(
                "/api/users?q=" +
                encodeURIComponent(q)
            );

        if (!response.ok) return;

        const users =
            await response.json();

        const container =
            document.getElementById(
                "users"
            );

        container.innerHTML = "";

        users.forEach(
            user => {

                const element =
                    document.createElement(
                        "div"
                    );

                element.className =
                    "user";

                element.innerHTML = `

                    ${
                        user.avatar_url
                        ?
                        `<img
                            class="avatar"
                            src="${mediaUrl(user.avatar_url)}"
                        >`
                        :
                        `<div class="avatar">
                            👤
                        </div>`
                    }

                    <div>

                        <div class="user-name">
                            ${escapeHtml(
                                user.display_name ||
                                user.username
                            )}
                        </div>

                        <div class="user-username">
                            @${escapeHtml(
                                user.username
                            )}
                        </div>

                    </div>
                `;

                element.onclick =
                    () => openChat(user);

                container.appendChild(
                    element
                );

            }
        );

    } catch (error) {

        console.error(error);

    }

}


// =========================================================
// CHAT
// =========================================================

async function openChat(user) {

    selectedUser = user;

    document.getElementById(
        "feedView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "none";

    document.getElementById(
        "chatView"
    ).style.display = "block";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "💬 " +
        (
            user.display_name ||
            user.username
        );

    document.getElementById(
        "chatHeader"
    ).innerText =
        "👤 " +
        (
            user.display_name ||
            user.username
        );

    const response =
        await request(
            "/api/messages/" +
            user.id
        );

    if (!response.ok) return;

    const history =
        await response.json();

    const messages =
        document.getElementById(
            "messages"
        );

    messages.innerHTML = "";

    history.forEach(
        addMessage
    );

}


function addMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );

    const element =
        document.createElement(
            "div"
        );

    const mine =
        message.sender_id ===
        currentUser.id;

    element.className =
        "message " +
        (
            mine
            ? "mine"
            : ""
        );

    const date =
        new Date(
            message.created_at
        );

    element.innerHTML = `

        <div>
            ${escapeHtml(
                message.text
            )}
        </div>

        <div class="time">

            ${date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}

            ${mine ? " ✓✓" : ""}

        </div>
    `;

    container.appendChild(
        element
    );

    container.scrollTop =
        container.scrollHeight;

}


async function sendMessage() {

    if (!selectedUser) {

        alert(
            "Выбери пользователя"
        );

        return;

    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    const response =
        await request(
            "/api/messages",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    receiver_id:
                        selectedUser.id,

                    text
                })
            }
        );

    if (!response.ok) {

        try {

            const data =
                await response.json();

            alert(
                data.detail ||
                "Ошибка"
            );

        } catch {

            alert(
                "Ошибка отправки"
            );

        }

    }

}


function messageKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


// =========================================================
// FEED
// =========================================================

function showFeed() {

    document.getElementById(
        "feedView"
    ).style.display = "block";

    document.getElementById(
        "chatView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "none";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "📰 Лента";

    loadFeed();

}


async function loadFeed() {

    const response =
        await request(
            "/api/feed"
        );

    if (!response.ok) return;

    const posts =
        await response.json();

    const container =
        document.getElementById(
            "feed"
        );

    container.innerHTML = "";

    posts.forEach(
        renderPost
    );

}


async function openSharedPost(postId) {

    const response =
        await request(
            "/api/posts/" +
            postId
        );

    if (!response.ok) {

        alert(
            "Пост не найден"
        );

        return;

    }

    const post =
        await response.json();

    showFeed();

    const container =
        document.getElementById(
            "feed"
        );

    container.innerHTML = "";

    renderPost(
        post
    );

    setTimeout(
        () => {

            const postElement =
                document.querySelector(
                    `[data-post-id="${post.id}"]`
                );

            if (postElement) {

                postElement.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }

        },
        100
    );

}


function renderPost(post) {

    const container =
        document.getElementById(
            "feed"
        );

    const element =
        document.createElement(
            "article"
        );

    element.className =
        "post";

    element.dataset.postId =
        post.id;

    const avatar =
        post.avatar_url
        ?
        `<img
            class="avatar"
            src="${mediaUrl(
                post.avatar_url
            )}"
        >`
        :
        `<div class="avatar">
            👤
        </div>`;

    let media = "";

    if (
        post.media_url &&
        post.media_type === "image"
    ) {

        media = `
            <img
                class="post-media"
                src="${mediaUrl(
                    post.media_url
                )}"
            >
        `;

    }

    if (
        post.media_url &&
        post.media_type === "video"
    ) {

        media = `
            <video
                class="post-media"
                controls
                src="${mediaUrl(
                    post.media_url
                )}"
            ></video>
        `;

    }

    element.innerHTML = `

        <div class="post-header">

            ${avatar}

            <div>

                <div class="post-author">
                    ${escapeHtml(
                        post.display_name ||
                        post.username
                    )}
                </div>

                <div class="post-username">
                    @${escapeHtml(
                        post.username
                    )}
                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="post-text">
                ${escapeHtml(
                    post.text
                )}
            </div>`
            :
            ""
        }

        ${media}

        <div class="post-actions">

            <button
                onclick="likePost(${post.id})"
            >
                ❤️ ${post.likes}
            </button>

            <button
                onclick="showComments(${post.id})"
            >
                💬 ${post.comments}
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                🔗 Поделиться
            </button>

            ${
                post.author_id ===
                currentUser.id
                ?
                `<button
                    onclick="deletePost(${post.id})"
                >
                    🗑️
                </button>`
                :
                ""
            }

        </div>

        <div
            class="share-copy"
            id="share-${post.id}"
        >
            🔗 Ссылка скопирована
        </div>

        <div
            class="comments"
            id="comments-${post.id}"
        ></div>

    `;

    container.appendChild(
        element
    );

}


// =========================================================
// PUBLISH POST
// =========================================================

async function publishPost() {

    const text =
        document.getElementById(
            "postText"
        ).value.trim();

    const file =
        document.getElementById(
            "mediaFile"
        ).files[0];

    if (!text && !file) {

        alert(
            "Добавь текст, фото или видео"
        );

        return;

    }

    try {

        if (file) {

            const form =
                new FormData();

            form.append(
                "file",
                file
            );

            form.append(
                "text",
                text
            );

            const response =
                await request(
                    "/api/posts/media",
                    {
                        method: "POST",
                        body: form
                    }
                );

            if (!response.ok) {

                const data =
                    await response.json();

                throw new Error(
                    data.detail ||
                    "Ошибка"
                );

            }

        } else {

            const response =
                await request(
                    "/api/posts",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            text
                        })
                    }
                );

            if (!response.ok) {

                const data =
                    await response.json();

                throw new Error(
                    data.detail ||
                    "Ошибка"
                );

            }

        }

        document.getElementById(
            "postText"
        ).value = "";

        document.getElementById(
            "mediaFile"
        ).value = "";

        await loadFeed();

    } catch (error) {

        alert(
            error.message
        );

    }

}


// =========================================================
// SHARE
// =========================================================

async function sharePost(postId) {

    const url =
        new URL(
            window.location.href
        );

    url.search = "";
    url.searchParams.set(
        "post",
        postId
    );

    const shareUrl =
        url.toString();

    try {

        if (
            navigator.share
        ) {

            await navigator.share({
                title: "MyMessenger",
                text: "Посмотри этот пост",
                url: shareUrl
            });

            return;

        }

    } catch (error) {

        if (
            error.name ===
            "AbortError"
        ) {

            return;

        }

    }

    try {

        await navigator.clipboard.writeText(
            shareUrl
        );

        const label =
            document.getElementById(
                "share-" + postId
            );

        if (label) {

            label.style.display =
                "block";

            setTimeout(
                () => {
                    label.style.display =
                        "none";
                },
                2500
            );

        }

    } catch {

        prompt(
            "Скопируй ссылку:",
            shareUrl
        );

    }

}


// =========================================================
// LIKES
// =========================================================

async function likePost(postId) {

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/like",
            {
                method: "POST"
            }
        );

    if (!response.ok) return;

    loadFeed();

}


// =========================================================
// COMMENTS
// =========================================================

async function showComments(postId) {

    const container =
        document.getElementById(
            "comments-" +
            postId
        );

    if (
        container.innerHTML.trim()
    ) {

        container.innerHTML = "";

        return;

    }

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments"
        );

    if (!response.ok) return;

    const comments =
        await response.json();

    container.innerHTML = "";

    const inputBox =
        document.createElement(
            "div"
        );

    inputBox.className =
        "comment-input";

    inputBox.innerHTML = `

        <input
            id="comment-${postId}"
            placeholder="Написать комментарий..."
        >

        <button
            onclick="sendComment(${postId}, null)"
        >
            ➤
        </button>

    `;

    container.appendChild(
        inputBox
    );

    const list =
        document.createElement(
            "div"
        );

    list.id =
        "comment-list-" +
        postId;

    container.appendChild(
        list
    );

    renderComments(
        postId,
        comments
    );

}


function renderComments(
    postId,
    comments
) {

    const list =
        document.getElementById(
            "comment-list-" +
            postId
        );

    if (!list) return;

    list.innerHTML = "";

    const roots =
        comments.filter(
            comment =>
                !comment.parent_id
        );

    roots.forEach(
        root => {

            renderCommentTree(
                postId,
                root,
                comments,
                list,
                0
            );

        }
    );

}


function renderCommentTree(
    postId,
    comment,
    allComments,
    parentContainer,
    level
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "comment" +
        (
            level > 0
            ? " reply"
            : ""
        );

    const avatar =
        comment.avatar_url
        ?
        `<img
            class="comment-avatar"
            src="${mediaUrl(
                comment.avatar_url
            )}"
        >`
        :
        `<div class="comment-avatar">
            👤
        </div>`;

    const date =
        new Date(
            comment.created_at
        );

    div.innerHTML = `

        <div class="comment-top">

            ${avatar}

            <div>

                <div class="comment-user">
                    ${escapeHtml(
                        comment.display_name ||
                        comment.username
                    )}
                </div>

                <div class="comment-date">
                    @${escapeHtml(
                        comment.username
                    )}
                    ·
                    ${date.toLocaleString()}
                </div>

            </div>

        </div>

        <div class="comment-text">
            ${escapeHtml(
                comment.text
            )}
        </div>

        <div class="comment-buttons">

            <button
                onclick="replyToComment(
                    ${postId},
                    ${comment.id},
                    '${escapeJs(
                        comment.username
                    )}'
                )"
            >
                ↩️ Ответить
            </button>

        </div>

        <div
            id="reply-box-${comment.id}"
        ></div>

        <div
            id="children-${comment.id}"
        ></div>

    `;

    parentContainer.appendChild(
        div
    );

    const children =
        allComments.filter(
            child =>
                child.parent_id ===
                comment.id
        );

    const childContainer =
        div.querySelector(
            "#children-" +
            comment.id
        );

    children.forEach(
        child => {

            renderCommentTree(
                postId,
                child,
                allComments,
                childContainer,
                level + 1
            );

        }
    );

}


function replyToComment(
    postId,
    commentId,
    username
) {

    const box =
        document.getElementById(
            "reply-box-" +
            commentId
        );

    if (!box) return;

    if (
        box.innerHTML.trim()
    ) {

        box.innerHTML = "";

        return;

    }

    box.innerHTML = `

        <div class="reply-label">
            Ответ для @${escapeHtml(username)}
        </div>

        <div class="comment-input">

            <input
                id="reply-input-${commentId}"
                placeholder="Написать ответ..."
            >

            <button
                onclick="sendComment(
                    ${postId},
                    ${commentId}
                )"
            >
                ➤
            </button>

        </div>
    `;

    const input =
        document.getElementById(
            "reply-input-" +
            commentId
        );

    if (input) {

        input.focus();

    }

}


async function sendComment(
    postId,
    parentId
) {

    let input;

    if (parentId) {

        input =
            document.getElementById(
                "reply-input-" +
                parentId
            );

    } else {

        input =
            document.getElementById(
                "comment-" +
                postId
            );

    }

    if (!input) return;

    const text =
        input.value.trim();

    if (!text) return;

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text,
                    parent_id:
                        parentId || null
                })
            }
        );

    if (!response.ok) {

        try {

            const data =
                await response.json();

            alert(
                data.detail ||
                "Ошибка"
            );

        } catch {

            alert(
                "Ошибка комментария"
            );

        }

        return;

    }

    input.value = "";

    await showComments(
        postId
    );

    await showComments(
        postId
    );

}


// =========================================================
// DELETE POST
// =========================================================

async function deletePost(postId) {

    if (
        !confirm(
            "Удалить этот пост?"
        )
    ) return;

    const response =
        await request(
            "/api/posts/" +
            postId,
            {
                method: "DELETE"
            }
        );

    if (!response.ok) {

        alert(
            "Не удалось удалить пост"
        );

        return;

    }

    loadFeed();

}


// =========================================================
// PROFILE
// =========================================================

function showProfile() {

    document.getElementById(
        "feedView"
    ).style.display = "none";

    document.getElementById(
        "chatView"
    ).style.display = "none";

    document.getElementById(
        "profileView"
    ).style.display = "block";

    document.getElementById(
        "pageTitle"
    ).innerText =
        "⚙️ Профиль";

    document.getElementById(
        "profileUsername"
    ).value =
        currentUser.username;

    document.getElementById(
        "profileName"
    ).value =
        currentUser.display_name ||
        currentUser.username;

    document.getElementById(
        "profileBio"
    ).value =
        currentUser.bio || "";

    setAvatar(
        currentUser.avatar_url
    );

}


function setAvatar(url) {

    const image =
        document.getElementById(
            "bigAvatar"
        );

    if (url) {

        image.src =
            mediaUrl(url);

    } else {

        image.removeAttribute(
            "src"
        );

        image.style.background =
            "#2aabee";

    }

}


async function saveProfile() {

    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();

    const display_name =
        document.getElementById(
            "profileName"
        ).value.trim();

    const bio =
        document.getElementById(
            "profileBio"
        ).value.trim();

    try {

        const response =
            await request(
                "/api/profile",
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        display_name,
                        bio
                    })
                }
            );

        if (!response.ok) {

            const data =
                await response.json();

            throw new Error(
                data.detail ||
                "Ошибка"
            );

        }

        const file =
            document.getElementById(
                "avatarFile"
            ).files[0];

        if (file) {

            const form =
                new FormData();

            form.append(
                "file",
                file
            );

            const avatarResponse =
                await request(
                    "/api/avatar",
                    {
                        method: "POST",
                        body: form
                    }
                );

            if (!avatarResponse.ok) {

                const data =
                    await avatarResponse.json();

                throw new Error(
                    data.detail ||
                    "Ошибка аватара"
                );

            }

        }

        const me =
            await request(
                "/api/me"
            );

        currentUser =
            await me.json();

        document.getElementById(
            "avatarFile"
        ).value = "";

        alert(
            "Профиль сохранён!"
        );

        searchUsers();

        showProfile();

    } catch (error) {

        alert(
            error.message
        );

    }

}


// =========================================================
// HELPERS
// =========================================================

function mediaUrl(url) {

    if (!url) return "";

    if (
        url.startsWith("http")
    ) {

        return url;

    }

    return API + url;

}


function escapeHtml(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeJs(text) {

    return String(text)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}
