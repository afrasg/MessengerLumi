<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Messenger Lumi</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background: #101114;
    color: #fff;
}

.hidden {
    display: none !important;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

input,
textarea,
select {
    background: #191b21;
    color: #fff;
    border: 1px solid #30333b;
    border-radius: 10px;
    padding: 11px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #5865f2;
}

/* =========================
   AUTH
========================= */

#auth {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.auth-card {
    width: min(420px, calc(100% - 30px));
    background: #181a20;
    border: 1px solid #292c34;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.auth-card h1 {
    margin-top: 0;
    text-align: center;
}

.auth-card input {
    display: block;
    width: 100%;
    margin: 10px 0;
}

.auth-card button {
    width: 100%;
    margin-top: 8px;
}

.primary {
    background: #5865f2;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 11px 15px;
}

.secondary {
    background: #30333b;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 11px 15px;
}

.danger-button {
    background: #d84a4a;
    color: white;
    border: 0;
    border-radius: 10px;
    padding: 11px 15px;
    width: 100%;
    margin-top: 8px;
}

.error {
    color: #ff6868;
    min-height: 20px;
}

/* =========================
   APP
========================= */

#app {
    display: flex;
    width: 100%;
    height: 100%;
}

.sidebar {
    width: 280px;
    flex-shrink: 0;
    background: #17191e;
    border-right: 1px solid #292c34;
    padding: 15px;
    overflow-y: auto;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 15px;
}

.search {
    width: 100%;
    margin-bottom: 12px;
}

.users {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
}

.user-item:hover {
    background: #23262d;
}

.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #30333b;
}

.user-info {
    min-width: 0;
}

.user-info strong,
.user-info small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.user-info small {
    color: #8d929e;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 60px;
    flex-shrink: 0;
    border-bottom: 1px solid #292c34;
    background: #15171c;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* БЕЗ ЦВЕТНОГО ФОНА */

.icon-button {
    background: transparent !important;
    border: 0 !important;
    color: #b9bec9;
    padding: 6px;
    border-radius: 8px;
    font-size: 19px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
}

.icon-button:hover {
    background: #23262d !important;
    color: #fff;
}

.icon-button img {
    width: 22px;
    height: 22px;
    display: block;
    opacity: 0.85;
    filter: brightness(0) invert(1);
}

.icon-button:hover img {
    opacity: 1;
}

.content {
    flex: 1;
    min-height: 0;
    overflow: hidden;
}

.view {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 18px;
}

/* =========================
   FEED
========================= */

.feed {
    width: min(800px, 100%);
    margin: 0 auto;
}

.post-box,
.post,
.card {
    background: #181a20;
    border: 1px solid #292c34;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 14px;
}

.post-box textarea {
    width: 100%;
    min-height: 100px;
    resize: vertical;
}

.post-tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.post-tools label {
    cursor: pointer;
}

.post-head {
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #30333b;
}

.post-text {
    white-space: pre-wrap;
    margin: 15px 0;
    line-height: 1.45;
}

.post-media {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    border-radius: 10px;
    margin-top: 10px;
}

.post-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.post-actions button {
    background: #23262d;
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 7px 10px;
}

/* =========================
   CHAT
========================= */

.chat {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #101114;
}

.chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid #292c34;
    background: #15171c;
    font-weight: 700;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

/*
   СТАРОЕ РАСПОЛОЖЕНИЕ ПУЗЫРЬКОВ:
   свои справа, чужие слева
*/

.message-row {
    width: 100%;
    display: flex;
}

.message-row.mine {
    justify-content: flex-end;
}

.message-row.theirs {
    justify-content: flex-start;
}

.message-bubble {
    position: relative;
    max-width: min(70%, 600px);
    padding: 9px 12px;
    border-radius: 14px;
    word-break: break-word;
    white-space: pre-wrap;
}

.message-row.mine .message-bubble {
    background: #5865f2;
    border-bottom-right-radius: 4px;
}

.message-row.theirs .message-bubble {
    background: #25282f;
    border-bottom-left-radius: 4px;
}

.message-text {
    line-height: 1.4;
}

.message-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    font-size: 11px;
    opacity: .75;
}

.message-status {
    font-size: 11px;
}

.message-status.unread {
    color: #ffd166;
}

.message-status.read {
    color: #cfd3dc;
}

.message-deleted {
    opacity: .6;
    font-style: italic;
}

.composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #292c34;
    background: #15171c;
}

/*
   ВОТ СТАРАЯ КНОПКА:
   "Отправить сообщение" + ➤
*/

.composer input {
    flex: 1;
    min-width: 0;
}

.send {
    background: #5865f2;
    color: #fff;
    border: 0;
    border-radius: 10px;
    padding: 0 18px;
    min-width: 170px;
    font-weight: 600;
}

.send:hover {
    background: #4752c4;
}

/* =========================
   MESSAGE CONTEXT
========================= */

.message-context {
    position: fixed;
    z-index: 1000;
    min-width: 190px;
    background: #1b1e24;
    border: 1px solid #343740;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.message-context button {
    width: 100%;
    display: block;
    text-align: left;
    background: transparent;
    color: #fff;
    border: 0;
    border-radius: 7px;
    padding: 9px 11px;
}

.message-context button:hover {
    background: #2a2d35;
}

.message-context .delete {
    color: #ff7070;
}

/* =========================
   PROFILE / SETTINGS
========================= */

.profile {
    width: min(700px, 100%);
    margin: 0 auto;
}

.card h2,
.card h3 {
    margin-top: 0;
}

.card input,
.card textarea,
.card select {
    width: 100%;
    margin: 6px 0;
}

.card textarea {
    min-height: 100px;
    resize: vertical;
}

.big-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    background: #30333b;
    display: block;
    margin-bottom: 12px;
}

.setting {
    padding: 12px 0;
    border-bottom: 1px solid #292c34;
}

.setting:last-child {
    border-bottom: 0;
}

.setting label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.setting select {
    width: auto;
}

/* =========================
   MODAL
========================= */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal {
    width: min(500px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #181a20;
    border: 1px solid #30333b;
    border-radius: 15px;
    padding: 20px;
}

.modal input,
.modal textarea {
    width: 100%;
    margin-bottom: 8px;
}

.comment {
    background: #20232a;
    padding: 10px;
    border-radius: 9px;
    margin-top: 8px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .sidebar {
        width: 220px;
    }

    .message-bubble {
        max-width: 82%;
    }

    .send {
        min-width: 52px;
        padding: 0 12px;
        font-size: 0;
    }

    .send::after {
        content: "➤";
        font-size: 18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<div id="auth">

    <div class="auth-card">

        <h1>💬 Messenger Lumi</h1>

        <input
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Войти
        </button>

        <button
            class="secondary"
            onclick="register()"
        >
            Создать аккаунт
        </button>

        <p id="authError" class="error"></p>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    <aside class="sidebar">

        <div class="logo">
            💬 Messenger Lumi
        </div>

        <input
            id="search"
            class="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div id="users" class="users"></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong id="pageTitle">
                📰 Лента

                <button

                </button>

                <button
                    class="icon-button"
                    onclick="showSettings()"
                    title="Настройки"
                >
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAACXBIWXMAAAsTAAALEwEAmpwYAAAB8UlEQVR4nO1W3UpCQRD+8MoCyQt7AdMuCuopIgLtymfoKi3synqGnqK/B7B7QfEV+nmD0EBToTKzWPoWhmGPZ0+aQfTBwtnZmfl2Z8/sDPCPYCyoeRNAI0RnapQAjADkOM8C+OAw3wa71NmfJfExSfoA6gB6grhH2YDzyjRESZ4yBSAO4FoQhY0qbZYBHNCXN0p00gXQikBqR4u25rvoT/t10o7D4Q03tSFkG5TdOvQ79OWNuDrpM3ceEzp2zSLG0L6okxtfoSjxR5J3+gpgy6GriS22aSPv/IS+nVhkOuhwPQAoRCAu0Eb7eZuU53mmjFWWG6kB2ASwAuBKyM13mmu1ANu+eAMCURcGZQB74r5HKodlLluiFm3KYr0eRrqqHK9RbnLxlOEy8ncAZxxjEcpTkbframPZINKm4yQJpfNIuSG0OKfMrEkkHP4aLuKGB3F7AnHbg7gedOpMSKiHlI9JeCFCPQwJdQZz+rmOovxceY90Sqt0uvRIpwHL5q88ICNyOFFkPa2qJ3M7AvGO48ms+DYIukiYh//Qo0iUFWkrajuUCiiLd6xAuiyaTd079LtsCObaCHS+0wgkeScphuo7rU+KPpaiEGtUJjR7T5T1Z9HsaRSZDibPbTGxxPZFyv1EewtHDjYcL9LMG3r8GXwCWVtNc8Ye75UAAAAASUVORK5CYII=" alt="Настройки">
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                    title="Профиль"
                >
                    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAB4AAAAeCAYAAAA7MK6iAAAACXBIWXMAAAsTAAALEwEAmpwYAAAA7ElEQVR4nO2UPQrCQBBGHwhJIXgBGz1BSnsPIXgH41VEvZM/ldprJ1aiiBaKRWRhAiJods3ESMiDD5Zkdh+T7C6U/Ck+0AdmwEVixqG8y4Q6sASiN1lIjSp+gvRZrtp530Iap6cpnjuIp5ris4PY1KoROSaXjk+F+MdhXrvalzNqc449lKknyDO5uWI8+ZRT2XAmE3mm3mnJT6kAbSD4UBNIjalNTQMYAHvZuVdgBLSAqsSMx8BNavYyx8x1piaC+xf3dBwzdyhrWdEENimEr1nLmomsFKVxljbiXQbirY24CxwVpQegYyMuKRYP4K3qdvJRSZ4AAAAASUVORK5CYII=" alt="Профиль">
                </button>

            </div>

        </div>


        <div class="content">

            <!-- FEED -->

            <section
                id="feedView"
                class="view"
            >

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button
                                class="primary"
                                onclick="publishPost()"
                            >
                                📝 Опубликовать
                            </button>

                            <label class="primary">

                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                    onchange="publishMediaPost()"
                                >

                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- CHAT -->

            <section
                id="chatView"
                class="view hidden"
                style="padding:0"
            >

                <div class="chat">

                    <div
                        id="chatHeader"
                        class="chat-header"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        id="messages"
                        class="messages"
                    ></div>

                    <div class="composer">

                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            Отправить сообщение ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- PROFILE -->

            <section
                id="profileView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            alt=""
                        >

                        <h2>👤 Профиль</h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>🖼️ Аватар</p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить
                        </button>

                    </div>


                    <div class="card">

                        <h3>👥 Аккаунт</h3>

                        <button
                            class="primary"
                            style="width:100%"
                            onclick="openCreateAccount()"
                        >
                            ➕ Добавить аккаунт
                        </button>

                        <button
                            class="primary"
                            style="width:100%;margin-top:8px"
                            onclick="switchAccount()"
                        >
                            🔄 Переключить аккаунт
                        </button>

                        <button
                            class="danger-button"
                            onclick="logout()"
                        >
                            🚪 Выйти
                        </button>

                        <button
                            class="danger-button"
                            onclick="deleteAccount()"
                        >
                            🗑️ Удалить этот аккаунт
                        </button>

                    </div>

                </div>

            </section>


            <!-- SETTINGS -->

            <section
                id="settingsView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <h2>⚙️ Настройки</h2>

                        <div class="setting">

                            <label>

                                <span>🌐 Язык</span>

                                <select
                                    id="language"
                                    onchange="saveSettings()"
                                >
                                    <option value="ru">
                                        Русский
                                    </option>

                                    <option value="en">
                                        English
                                    </option>

                                    <option value="be">
                                        Беларуская
                                    </option>

                                    <option value="kk">
                                        Қазақша
                                    </option>
                                </select>

                            </label>

                        </div>


                        <div class="setting">

                            <label>

                                <span>🎨 Тема</span>

                                <select
                                    id="theme"
                                    onchange="saveSettings()"
                                >
                                    <option value="dark">
                                        Тёмная
                                    </option>

                                    <option value="light">
                                        Светлая
                                    </option>

                                    <option value="blue">
                                        Синяя
                                    </option>
                                </select>

                            </label>

                        </div>


                        <div class="setting">

                            <label>
                                🔔 Уведомления

                                <input
                                    id="notifications"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>

                        </div>


                        <div class="setting">

                            <label>
                                🟢 Показывать онлайн

                                <input
                                    id="showOnline"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>

                        </div>


                        <div class="setting">

                            <label>
                                🕒 Показывать время последнего визита

                                <input
                                    id="showLastSeen"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>

                        </div>

                    </div>


                    <div class="card">

                        <h3>👥 Группы</h3>

                        <button
                            class="primary"
                            onclick="openCreateGroup()"
                        >
                            ➕ Создать группу
                        </button>

                        <div id="groups"></div>

                    </div>


                    <div class="card">

                        <h3>📢 Каналы</h3>

                        <button
                            class="primary"
                            onclick="openCreateChannel()"
                        >
                            ➕ Создать канал
                        </button>

                        <div id="channels"></div>

                    </div>

                </div>

            </section>


            <!-- FAVORITES -->

            <section
                id="favoritesView"
                class="view hidden"
            >

                <div class="profile">

                    <div class="card">

                        <h2>
                            ⭐ Избранные сообщения
                        </h2>

                        <div id="favorites"></div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<!-- MODAL -->

<div
    id="modalBg"
    class="modal-bg hidden"
    onclick="closeModal(event)"
>

    <div
        id="modal"
        class="modal"
        onclick="event.stopPropagation()"
    ></div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API = "";

let token =
    localStorage.getItem("token") || "";

let currentUser = null;

let selectedUserId = null;

let selectedGroupId = null;

let selectedChannelId = null;

let selectedChannelIsOwner = false;

let selectedMessageId = null;

let ws = null;


/* =====================================================
   REQUEST
===================================================== */

async function request(
    url,
    options = {}
) {

    const headers =
        options.headers || {};

    if (token) {
        headers["Authorization"] =
            "Bearer " + token;
    }

    options.headers = headers;

    return fetch(
        API + url,
        options
    );
}


async function safeJson(
    response
) {

    try {
        return await response.json();
    } catch {
        return {};
    }
}


/* =====================================================
   AUTH
===================================================== */

async function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const error =
        document.getElementById(
            "authError"
        );

    error.textContent = "";

    if (!username || !password) {

        error.textContent =
            "Введите username и пароль";

        return;
    }

    const response =
        await fetch(
            API + "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        error.textContent =
            data.detail ||
            "Ошибка входа";

        return;
    }

    token =
        data.token;

    localStorage.setItem(
        "token",
        token
    );

    await startApp();
}


async function register() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;

    const error =
        document.getElementById(
            "authError"
        );

    if (!username || !password) {

        error.textContent =
            "Введите username и пароль";

        return;
    }

    const response =
        await fetch(
            API + "/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        error.textContent =
            data.detail ||
            "Ошибка регистрации";

        return;
    }

    token =
        data.token;

    localStorage.setItem(
        "token",
        token
    );

    await startApp();
}


/* =====================================================
   START
===================================================== */

async function checkAuth() {

    if (!token) {

        document
            .getElementById("auth")
            .classList.remove("hidden");

        document
            .getElementById("app")
            .classList.add("hidden");

        return;
    }

    await startApp();
}


async function startApp() {

    const response =
        await request(
            "/api/me"
        );

    if (!response.ok) {

        token = "";

        localStorage.removeItem(
            "token"
        );

        document
            .getElementById("auth")
            .classList.remove("hidden");

        document
            .getElementById("app")
            .classList.add("hidden");

        return;
    }

    currentUser =
        await safeJson(response);

    document
        .getElementById("auth")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    await loadFeed();

    // Sidebar: only groups & channels by default (no users until search)
    await refreshSidebarLists();

    connectWebSocket();
}


/* =====================================================
   USERS
===================================================== */

let searchRequestId = 0;
let searchDebounceTimer = null;

function searchUsers() {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        loadUsers(
            document.getElementById("search").value.trim()
        );
    }, 200);
}


async function refreshSidebarLists() {
    // Перерисовать только группы и каналы (настройки + сайдбар)
    await loadGroups();
    await loadChannels();
}


async function loadUsers(query = "") {
    const container = document.getElementById("users");
    if (!container) return;

    query = (query || "").trim();
    const requestId = ++searchRequestId;

    // Полная очистка сайдбара перед отрисовкой
    container.innerHTML = "";

    // Пустой поиск — только группы и каналы, без «Ничего не найдено»
    if (!query) {
        if (requestId !== searchRequestId) return;
        await refreshSidebarLists();
        return;
    }

    const response = await request(
        "/api/users?q=" + encodeURIComponent(query)
    );

    if (requestId !== searchRequestId) return;

    if (!response.ok) {
        await refreshSidebarLists();
        return;
    }

    const users = await safeJson(response);
    if (requestId !== searchRequestId) return;

    // Снова очищаем (на случай гонок) и рисуем один раз
    container.innerHTML = "";

    const seen = new Set();
    const found = [];
    for (const user of users) {
        const id = Number(user.id);
        if (id === Number(currentUser.id) || seen.has(id)) continue;
        seen.add(id);
        found.push(user);
    }

    if (!found.length) {
        const empty = document.createElement("div");
        empty.className = "search-empty";
        empty.style.cssText =
            "padding:12px 10px;color:#8d929e;font-size:13px;text-align:center;line-height:1.3";
        empty.textContent = "Ничего не найдено";
        container.appendChild(empty);
    } else {
        found.forEach(user => {
            const div = document.createElement("div");
            div.className = "user-item";

            const avatar = document.createElement("img");
            avatar.className = "user-avatar";
            avatar.style.cursor = "pointer";
            if (user.avatar_url) {
                avatar.src = mediaUrl(user.avatar_url);
            }
            // Клик по аватару — профиль, по строке — чат
            avatar.onclick = (e) => {
                e.stopPropagation();
                openUserProfile(user.id);
            };

            const info = document.createElement("div");
            info.className = "user-info";
            info.innerHTML =
                "<strong>" +
                escapeHtml(user.display_name || user.username) +
                "</strong>" +
                "<small>@" +
                escapeHtml(user.username) +
                "</small>";

            div.appendChild(avatar);
            div.appendChild(info);
            div.onclick = () => openChat(user);
            container.appendChild(div);
        });
    }

    if (requestId !== searchRequestId) return;

    // Группы и каналы под результатами поиска
    await refreshSidebarLists();
}


/* =====================================================
   CHAT
===================================================== */

async function openChat(
    user
) {

    selectedUserId =
        Number(user.id);

    selectedGroupId = null;
    selectedChannelId = null;
    selectedChannelIsOwner = false;
    setComposerEnabled(true);

    showOnly(
        "chatView"
    );

    document.getElementById(
        "pageTitle"
    ).textContent =
        "💬 " +
        (
            user.display_name ||
            user.username
        );

    document.getElementById(
        "chatHeader"
    ).textContent =
        (
            user.display_name ||
            user.username
        );

    await loadMessages(
        selectedUserId
    );
}


async function loadMessages(
    userId
) {

    const response =
        await request(
            "/api/messages/" +
            userId
        );

    if (!response.ok) {
        return;
    }

    const messages =
        await safeJson(response);

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    messages.forEach(
        renderMessage
    );

    scrollMessages();
}


function renderMessage(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );

    const mine =
        Number(
            message.sender_id
        ) ===
        Number(
            currentUser.id
        );

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message-row " +
        (
            mine
                ? "mine"
                : "theirs"
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";

    bubble.dataset.id =
        message.id;

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "message-text";

    if (message.deleted) {

        text.className +=
            " message-deleted";

        text.textContent =
            "Сообщение удалено";

    } else {

        text.textContent =
            message.text || "";
    }

    bubble.appendChild(
        text
    );


    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "message-meta";

    meta.innerHTML =
        "<span>" +
        escapeHtml(
            formatTime(
                message.created_at
            )
        ) +
        "</span>";


    if (mine) {

        const status =
            document.createElement(
                "span"
            );

        status.className =
            "message-status " +
            (
                message.read
                    ? "read"
                    : "unread"
            );

        status.textContent =
            message.read
                ? "прочитано"
                : "не прочитано";

        meta.appendChild(
            status
        );
    }

    bubble.appendChild(
        meta
    );

    row.appendChild(
        bubble
    );

    container.appendChild(
        row
    );


    /*
       ЛКМ по своему сообщению
       открывает маленькую вкладку
    */

    if (mine && !message.deleted) {

        bubble.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openMessageContext(
                    message,
                    bubble
                );
            }
        );
    }
}


function openMessageContext(
    message,
    element
) {

    closeMessageContext();

    const menu =
        document.createElement(
            "div"
        );

    menu.id =
        "messageContext";

    menu.className =
        "message-context";


    const edit =
        document.createElement(
            "button"
        );

    edit.textContent =
        "✏️ Изменить";

    edit.onclick =
        () => {

            closeMessageContext();

            openEditMessage(
                message
            );
        };


    const copy =
        document.createElement(
            "button"
        );

    copy.textContent =
        "📋 Копировать";

    copy.onclick =
        async () => {

            try {

                await navigator.clipboard.writeText(
                    message.text || ""
                );

            } catch {}

            closeMessageContext();
        };


    const del =
        document.createElement(
            "button"
        );

    del.className =
        "delete";

    del.textContent =
        "🗑️ Удалить";

    del.onclick =
        () => {

            closeMessageContext();

            selectedMessageId =
                message.id;

            deleteSelectedMessage();
        };


    menu.appendChild(
        edit
    );

    menu.appendChild(
        copy
    );

    menu.appendChild(
        del
    );

    document.body.appendChild(
        menu
    );


    const rect =
        element.getBoundingClientRect();

    let left =
        rect.left;

    let top =
        rect.bottom + 5;

    if (
        left + 200 >
        window.innerWidth
    ) {
        left =
            window.innerWidth - 210;
    }

    if (
        top + 130 >
        window.innerHeight
    ) {
        top =
            rect.top - 135;
    }

    menu.style.left =
        Math.max(
            5,
            left
        ) + "px";

    menu.style.top =
        Math.max(
            5,
            top
        ) + "px";


    setTimeout(
        () => {

            document.addEventListener(
                "click",
                closeMessageContext,
                {
                    once: true
                }
            );

        },
        0
    );
}


function closeMessageContext() {

    const menu =
        document.getElementById(
            "messageContext"
        );

    if (menu) {
        menu.remove();
    }
}


/* =====================================================
   SEND
===================================================== */

function messageKey(
    event
) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


async function sendMessage() {

    if (!selectedUserId) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    const response =
        await request(
            "/api/messages",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    receiver_id:
                        selectedUserId,

                    text
                })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Не удалось отправить сообщение"
        );

        return;
    }

    input.value = "";

    await loadMessages(
        selectedUserId
    );
}


/* =====================================================
   EDIT
===================================================== */

function openEditMessage(
    message
) {

    selectedMessageId =
        message.id;

    openModal(`

        <h2>✏️ Изменить сообщение</h2>

        <textarea
            id="editText"
            style="
                width:100%;
                min-height:100px;
            "
        >${escapeHtml(
            message.text || ""
        )}</textarea>

        <button
            class="primary"
            style="
                margin-top:10px;
                width:100%;
            "
            onclick="saveEditedMessage()"
        >
            Сохранить
        </button>

    `);
}


async function saveEditedMessage() {

    const text =
        document
            .getElementById(
                "editText"
            )
            .value
            .trim();

    if (!text) {
        return;
    }

    const response =
        await request(
            "/api/messages/" +
            selectedMessageId,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text
                })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    closeModal();

    await loadMessages(
        selectedUserId
    );
}


/* =====================================================
   DELETE MESSAGE
===================================================== */

async function deleteSelectedMessage() {

    if (!selectedMessageId) {
        return;
    }

    if (
        !confirm(
            "Удалить сообщение?"
        )
    ) {
        return;
    }

    const response =
        await request(
            "/api/messages/" +
            selectedMessageId,
            {
                method: "DELETE"
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    selectedMessageId =
        null;

    await loadMessages(
        selectedUserId
    );
}


/* =====================================================
   FEED
===================================================== */

async function loadFeed() {

    const response =
        await request(
            "/api/feed"
        );

    if (!response.ok) {
        return;
    }

    const posts =
        await safeJson(response);

    const container =
        document.getElementById(
            "feed"
        );

    container.innerHTML = "";

    posts.forEach(
        renderPost
    );
}


function renderPost(
    post
) {

    const container =
        document.getElementById(
            "feed"
        );

    const article =
        document.createElement(
            "article"
        );

    article.className =
        "post";

    article.dataset.postId =
        post.id;


    const head =
        document.createElement(
            "div"
        );

    head.className =
        "post-head";


    const avatar =
        document.createElement(
            "img"
        );

    avatar.className =
        "avatar";

    if (post.avatar_url) {

        avatar.src =
            mediaUrl(
                post.avatar_url
            );
    }

    avatar.style.cursor = "pointer";
    avatar.onclick = () => openUserProfile(post.author_id);


    const author =
        document.createElement(
            "div"
        );

    author.innerHTML =
        "<strong style='cursor:pointer'>" +
        escapeHtml(
            post.display_name ||
            post.username
        ) +
        "</strong>" +

        "<div style='color:#9095a3;font-size:12px'>" +
        "@" +
        escapeHtml(
            post.username
        ) +
        "</div>";

    author.querySelector("strong").onclick =
        () => openUserProfile(post.author_id);


    head.appendChild(
        avatar
    );

    head.appendChild(
        author
    );

    article.appendChild(
        head
    );


    if (post.text) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "post-text";

        text.textContent =
            post.text;

        article.appendChild(
            text
        );
    }


    if (post.media_url) {

        if (
            post.media_type ===
            "video"
        ) {

            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "post-media";

            video.controls =
                true;

            video.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                video
            );

        } else {

            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "post-media";

            img.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                img
            );
        }
    }


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "post-actions";


    const like =
        document.createElement(
            "button"
        );

    like.textContent =
        "❤️ " +
        (post.likes || 0);

    like.onclick =
        async () => {

            const response =
                await request(
                    "/api/posts/" +
                    post.id +
                    "/like",
                    {
                        method: "POST"
                    }
                );

            const data =
                await safeJson(
                    response
                );

            if (response.ok) {

                like.textContent =
                    "❤️ " +
                    data.likes;
            }
        };


    actions.appendChild(
        like
    );


    // Comments button
    const commentsBtn =
        document.createElement(
            "button"
        );

    commentsBtn.textContent =
        "💬 " +
        (post.comments_count || 0);

    commentsBtn.onclick =
        () => toggleComments(
            post.id,
            article,
            commentsBtn
        );

    actions.appendChild(
        commentsBtn
    );


    // Share button
    const shareBtn =
        document.createElement(
            "button"
        );

    shareBtn.textContent =
        "🔗 Поделиться";

    shareBtn.onclick =
        () => sharePost(post);

    actions.appendChild(
        shareBtn
    );


    if (
        Number(post.author_id) ===
        Number(currentUser.id)
    ) {

        const del =
            document.createElement(
                "button"
            );

        del.textContent =
            "🗑️";

        del.onclick =
            async () => {

                if (
                    !confirm(
                        "Удалить пост?"
                    )
                ) {
                    return;
                }

                const response =
                    await request(
                        "/api/posts/" +
                        post.id,
                        {
                            method: "DELETE"
                        }
                    );

                if (response.ok) {
                    article.remove();
                }
            };

        actions.appendChild(
            del
        );
    }


    article.appendChild(
        actions
    );


    // Comments container (hidden by default)
    const commentsBox =
        document.createElement(
            "div"
        );

    commentsBox.id =
        "comments-" + post.id;

    commentsBox.style.display =
        "none";

    commentsBox.style.marginTop =
        "12px";

    article.appendChild(
        commentsBox
    );


    container.appendChild(
        article
    );
}


async function publishPost() {

    const textarea =
        document.getElementById(
            "postText"
        );

    const text =
        textarea.value.trim();

    if (!text) {
        return;
    }

    const response =
        await request(
            "/api/posts",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    text
                })
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    textarea.value = "";

    await loadFeed();
}


async function publishMediaPost() {

    const fileInput =
        document.getElementById(
            "mediaFile"
        );

    const file =
        fileInput.files[0];

    if (!file) {
        return;
    }

    const text =
        document
            .getElementById(
                "postText"
            )
            .value
            .trim();

    const form =
        new FormData();

    form.append(
        "text",
        text
    );

    form.append(
        "file",
        file
    );

    const response =
        await request(
            "/api/posts/media",
            {
                method: "POST",
                body: form
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Ошибка загрузки"
        );

        return;
    }

    document.getElementById(
        "postText"
    ).value = "";

    fileInput.value = "";

    await loadFeed();
}


/* =====================================================
   PROFILE
===================================================== */

async function showProfile() {

    showOnly(
        "profileView"
    );

    document.getElementById(
        "pageTitle"
    ).textContent =
        "👤 Профиль";

    const response =
        await request(
            "/api/me"
        );

    if (!response.ok) {
        return;
    }

    const user =
        await safeJson(response);

    document.getElementById(
        "profileUsername"
    ).value =
        user.username || "";

    document.getElementById(
        "profileName"
    ).value =
        user.display_name || "";

    document.getElementById(
        "profileBio"
    ).value =
        user.bio || "";

    const avatar =
        document.getElementById(
            "bigAvatar"
        );

    if (user.avatar_url) {

        avatar.src =
            mediaUrl(
                user.avatar_url
            );

    } else {

        avatar.removeAttribute(
            "src"
        );
    }
}


async function saveProfile() {

    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();

    const display_name =
        document.getElementById(
            "profileName"
        ).value.trim();

    const bio =
        document.getElementById(
            "profileBio"
        ).value.trim();

    const response =
        await request(
            "/api/profile",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

async function deleteAccount() {

    if (
        !confirm(
            "Удалить этот аккаунт навсегда?"
        )
    ) {
        return;
    }

    const response =
        await request(
            "/api/account",
            {
                method: "DELETE"
            }
        );

    const data =
        await safeJson(response);

    if (!response.ok) {

        alert(
            data.detail ||
            "Не удалось удалить аккаунт"
        );

        return;
    }

    /*
       Убираем именно текущий аккаунт
       из сохранённых аккаунтов устройства.
    */

    const accounts =
        JSON.parse(
            localStorage.getItem(
                "accounts"
            ) || "[]"
        );

    const filtered =
        accounts.filter(
            account =>
                account.token !==
                token
        );

    localStorage.setItem(
        "accounts",
        JSON.stringify(
            filtered
        )
    );

    localStorage.removeItem(
        "token"
    );

    token = "";

    location.reload();
}

/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

    if (!token || !currentUser) {
        return;
    }

    try {

        const protocol =
            location.protocol === "https:"
                ? "wss:"
                : "ws:";

        ws =
            new WebSocket(
                protocol +
                "//" +
                location.host +
                "/ws?token=" +
                encodeURIComponent(
                    token
                )
            );


        ws.onmessage =
            async event => {

                let data;

                try {

                    data =
                        JSON.parse(
                            event.data
                        );

                } catch {

                    return;
                }


                /*
                   При новом сообщении обновляем
                   открытый диалог / группу / канал.
                */

                if (selectedUserId) {
                    await loadMessages(selectedUserId);
                } else if (selectedGroupId) {
                    await loadGroupMessages(selectedGroupId);
                } else if (selectedChannelId) {
                    await loadChannelMessages(selectedChannelId);
                }
            };


        ws.onclose =
            () => {

                /*
                   Переподключение только если
                   пользователь всё ещё авторизован.
                */

                if (token) {

                    setTimeout(
                        connectWebSocket,
                        3000
                    );
                }
            };

    } catch {}
}


/* =====================================================
   HELPERS
===================================================== */

function scrollMessages() {

    const container =
        document.getElementById(
            "messages"
        );

    container.scrollTop =
        container.scrollHeight;
}


function mediaUrl(
    url
) {

    if (!url) {
        return "";
    }

    if (
        url.startsWith(
            "http://"
        ) ||
        url.startsWith(
            "https://"
        )
    ) {
        return url;
    }

    return API + url;
}


function escapeHtml(
    text
) {

    return String(
        text ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


function formatTime(
    value
) {

    if (!value) {
        return "";
    }

    let date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        date =
            new Date(
                value + "Z"
            );
    }

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

/* =====================================================
   COMMENTS
===================================================== */

async function toggleComments(postId, article, btn) {
    const box = document.getElementById("comments-" + postId);
    if (!box) return;

    if (box.style.display !== "none") {
        box.style.display = "none";
        return;
    }

    box.style.display = "block";
    box.innerHTML = "<div style='color:#9095a3;font-size:13px;padding:8px 0'>Загрузка...</div>";

    const response = await request("/api/posts/" + postId + "/comments");
    if (!response.ok) {
        box.innerHTML = "<div style='color:#ff5c7a'>Не удалось загрузить</div>";
        return;
    }

    const comments = await safeJson(response);
    box.innerHTML = "";

    if (!comments.length) {
        box.innerHTML = "<div style='color:#9095a3;font-size:13px;padding:6px 0'>Комментариев пока нет</div>";
    }

    comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";
        div.style.padding = "8px 0";
        div.style.borderBottom = "1px solid #2a2b30";

        const replyTo = c.reply_to_username
            ? `<span style="color:#6c8cff">@${escapeHtml(c.reply_to_username)}</span> `
            : "";

        div.innerHTML = `
            <div style="font-size:12px;color:#9095a3;margin-bottom:2px">
                <strong style="cursor:pointer;color:#e8eaed" onclick="openUserProfile(${c.user_id})">
                    ${escapeHtml(c.display_name || c.username)}
                </strong>
                · ${formatTime(c.created_at)}
            </div>
            <div>${replyTo}${escapeHtml(c.text)}</div>
        `;

        if (Number(c.user_id) === Number(currentUser.id)) {
            const delBtn = document.createElement("button");
            delBtn.textContent = "🗑️";
            delBtn.style.cssText = "margin-top:4px;background:transparent;border:none;color:#ff5c7a;cursor:pointer;font-size:12px";
            delBtn.onclick = async () => {
                if (!confirm("Удалить комментарий?")) return;
                await request("/api/comments/" + c.id, { method: "DELETE" });
                // reload comments
                box.style.display = "none";
                toggleComments(postId, article, btn);
                // update counter
                const num = Math.max(0, (parseInt(btn.textContent.replace(/\D/g, "")) || 1) - 1);
                btn.textContent = "💬 " + num;
            };
            div.appendChild(delBtn);
        }

        box.appendChild(div);
    });

    // Form for new comment
    const form = document.createElement("div");
    form.style.cssText = "display:flex;gap:8px;margin-top:10px";
    form.innerHTML = `
        <input id="commentInput-${postId}"
               placeholder="Написать комментарий..."
               style="flex:1;padding:8px 12px;border-radius:8px;border:1px solid #2a2b30;background:#121316;color:#fff"
               maxlength="2000">
        <button class="primary" onclick="sendComment(${postId})">➤</button>
    `;
    box.appendChild(form);
}


async function sendComment(postId) {
    const input = document.getElementById("commentInput-" + postId);
    const text = (input?.value || "").trim();
    if (!text) return;

    const response = await request("/api/posts/" + postId + "/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
    });

    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Ошибка");
        return;
    }

    // Update counter and reload comments
    const article = document.querySelector(`article[data-post-id="${postId}"]`);
    const btn = article?.querySelector(".post-actions button:nth-child(2)");
    if (btn) {
        const current = parseInt(btn.textContent.replace(/\D/g, "")) || 0;
        btn.textContent = "💬 " + (current + 1);
    }
    if (article && btn) {
        const box = document.getElementById("comments-" + postId);
        if (box) box.style.display = "none";
        toggleComments(postId, article, btn);
    }
}

            ${avatarSrc
                ? `<img src="${avatarSrc}" style="width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 14px;display:block;border:3px solid #2a2d35">`
                : `<div style="width:110px;height:110px;border-radius:50%;background:#2a2b30;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;border:3px solid #2a2d35">👤</div>`
            }
            <div style="font-size:20px;font-weight:700;margin-bottom:2px">${displayName}</div>
            <div style="color:#6c8cff;font-size:14px;margin-bottom:14px">@${username}</div>

            <div style="text-align:left;background:#121316;border-radius:12px;padding:12px 14px;margin-bottom:12px">
                <div style="font-size:11px;color:#8d929e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">О себе</div>
                <div style="white-space:pre-wrap;line-height:1.45;color:${bio ? '#e8eaed' : '#6a6f7a'};font-size:14px">
                    ${bio ? escapeHtml(bio) : "Нет описания"}
                </div>
            </div>

            <div style="text-align:left;background:#121316;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:#9095a3">
                <div style="display:flex;justify-content:space-between;padding:4px 0">
                    <span>Был(а) в сети</span>
                    <span style="color:#cfd3dc">${formatTime(user.last_seen) || "—"}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #1e2026;margin-top:4px;padding-top:8px">
                    <span>Аккаунт создан</span>
                    <span style="color:#cfd3dc">${formatTime(user.created_at) || "—"}</span>
                </div>
            </div>

            ${!isMe ? `
                <button class="primary" style="width:100%"
                    onclick="closeModal(); openChat({id:${user.id}, username:'${username}', display_name:'${displayName}'})">
                    💬 Написать сообщение
                </button>
            ` : `
                <button class="secondary" style="width:100%" onclick="closeModal(); showProfile()">
                    ✏️ Редактировать профиль
                </button>
            `}
            <button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">
                Закрыть
            </button>
        </div>
    `);
}


/* =====================================================
   GROUPS & CHANNELS IN CHATS + INVITE
===================================================== */

function setComposerEnabled(enabled, placeholder) {
    const input = document.getElementById("messageInput");
    const btn = document.querySelector(".composer .send");
    if (input) {
        input.disabled = !enabled;
        input.placeholder = placeholder || "Сообщение...";
    }
    if (btn) {
        btn.disabled = !enabled;
        btn.style.opacity = enabled ? "1" : "0.45";
        btn.style.cursor = enabled ? "pointer" : "not-allowed";
    }
}


function loadGroupsInSidebar(groups) {
    document.querySelectorAll(".group-item").forEach(el => el.remove());

    const container = document.getElementById("users");
    if (!container || !groups || !groups.length) return;

    const header = document.createElement("div");
    header.className = "group-item";
    header.style.cssText = "padding:8px 10px;color:#8d929e;font-size:12px;font-weight:600;margin-top:10px";
    header.textContent = "👥 ГРУППЫ";
    container.appendChild(header);

    groups.forEach(group => {
        const div = document.createElement("div");
        div.className = "user-item group-item";
        div.innerHTML = `
            <div class="user-avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px;background:#30333b">👥</div>
            <div class="user-info">
                <strong>${escapeHtml(group.name)}</strong>
                <small>группа</small>
            </div>
        `;
        div.onclick = () => openGroupChat(group.id, group.name);
        container.appendChild(div);
    });
}


function loadChannelsInSidebar(channels) {
    document.querySelectorAll(".channel-item").forEach(el => el.remove());

    const container = document.getElementById("users");
    if (!container || !channels || !channels.length) return;

    const header = document.createElement("div");
    header.className = "channel-item";
    header.style.cssText = "padding:8px 10px;color:#8d929e;font-size:12px;font-weight:600;margin-top:10px";
    header.textContent = "📢 КАНАЛЫ";
    container.appendChild(header);

    channels.forEach(channel => {
        const div = document.createElement("div");
        div.className = "user-item channel-item";
        div.innerHTML = `
            <div class="user-avatar" style="display:flex;align-items:center;justify-content:center;font-size:18px;background:#30333b">📢</div>
            <div class="user-info">
                <strong>${escapeHtml(channel.name)}</strong>
                <small>@${escapeHtml(channel.username)}</small>
            </div>
        `;
        div.onclick = () => openChannelChat(
            channel.id,
            channel.name,
            !!channel.is_owner
        );
        container.appendChild(div);
    });
}


async function openGroupChat(groupId, groupName) {
    selectedGroupId = Number(groupId);
    selectedUserId = null;
    selectedChannelId = null;
    selectedChannelIsOwner = false;
    setComposerEnabled(true);

    showOnly("chatView");

    document.getElementById("pageTitle").textContent = "👥 " + groupName;
    document.getElementById("chatHeader").textContent = "👥 " + groupName;

    await loadGroupMessages(groupId);
}


async function openChannelChat(channelId, channelName, isOwner) {
    selectedChannelId = Number(channelId);
    selectedChannelIsOwner = !!isOwner;
    selectedUserId = null;
    selectedGroupId = null;

    // Only creator can write in channel
    setComposerEnabled(
        selectedChannelIsOwner,
        selectedChannelIsOwner
            ? "Сообщение в канал..."
            : "Только создатель может писать в канал"
    );

    showOnly("chatView");

    document.getElementById("pageTitle").textContent = "📢 " + channelName;
    document.getElementById("chatHeader").textContent = "📢 " + channelName;

    await loadChannelMessages(channelId);
}


async function loadGroupMessages(groupId) {
    const response = await request("/api/groups/" + groupId + "/messages");
    if (!response.ok) {
        document.getElementById("messages").innerHTML =
            "<div style='color:#9095a3;padding:20px;text-align:center'>Нет сообщений</div>";
        return;
    }

    const messages = await safeJson(response);
    renderGroupMessages(messages);
}


async function loadChannelMessages(channelId) {
    const response = await request("/api/channels/" + channelId + "/messages");
    if (!response.ok) {
        document.getElementById("messages").innerHTML =
            "<div style='color:#9095a3;padding:20px;text-align:center'>Нет сообщений</div>";
        return;
    }

    const messages = await safeJson(response);
    renderGroupMessages(messages); // same bubble layout
}


function renderGroupMessages(messages) {
    const container = document.getElementById("messages");
    container.innerHTML = "";

    if (!messages.length) {
        container.innerHTML =
            "<div style='color:#9095a3;padding:20px;text-align:center'>Пока нет сообщений</div>";
        return;
    }

    messages.forEach(message => {
        const mine = Number(message.sender_id) === Number(currentUser.id);

        const row = document.createElement("div");
        row.className = "message-row " + (mine ? "mine" : "theirs");

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.dataset.id = message.id;

        if (!mine && (message.sender_name || message.username)) {
            const name = document.createElement("div");
            name.style.cssText = "font-size:11px;color:#a0a8b8;margin-bottom:3px;font-weight:600";
            name.textContent = message.sender_name || message.username || "";
            bubble.appendChild(name);
        }

        const text = document.createElement("div");
        text.className = "message-text";
        if (message.deleted) {
            text.className += " message-deleted";
            text.textContent = "Сообщение удалено";
        } else {
            text.textContent = message.text || "";
        }
        bubble.appendChild(text);

        const meta = document.createElement("div");
        meta.className = "message-meta";
        meta.innerHTML = "<span>" + escapeHtml(formatTime(message.created_at)) + "</span>";
        bubble.appendChild(meta);

        row.appendChild(bubble);
        container.appendChild(row);
    });

    scrollMessages();
}


// Override sendMessage to support groups & channels
const originalSendMessage = sendMessage;
sendMessage = async function () {
    const input = document.getElementById("messageInput");
    const text = (input?.value || "").trim();
    if (!text) return;

    if (selectedGroupId) {
        const response = await request("/api/groups/" + selectedGroupId + "/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });

        const data = await safeJson(response);
        if (!response.ok) {
            alert(data.detail || "Не удалось отправить");
            return;
        }

        input.value = "";
        await loadGroupMessages(selectedGroupId);
        return;
    }

    if (selectedChannelId) {
        if (!selectedChannelIsOwner) {
            alert("В канал может писать только создатель");
            return;
        }

        const response = await request("/api/channels/" + selectedChannelId + "/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });

        const data = await safeJson(response);
        if (!response.ok) {
            alert(data.detail || "Не удалось отправить");
            return;
        }

        input.value = "";
        await loadChannelMessages(selectedChannelId);
        return;
    }

    // private chat
    return originalSendMessage();
};


function openInviteToGroup(groupId, groupName) {
    openModal(`
        <h2>➕ Пригласить в группу</h2>
        <p style="color:#9095a3;margin-top:0">Группа: <b>${escapeHtml(groupName)}</b></p>
        <input id="inviteUsername" placeholder="Username пользователя" style="width:100%;margin:10px 0">
        <button class="primary" style="width:100%" onclick="inviteToGroup(${groupId})">
            Пригласить
        </button>
        <button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">
            Отмена
        </button>
    `);
}


async function inviteToGroup(groupId) {
    const username = document.getElementById("inviteUsername")?.value.trim();
    if (!username) {
        alert("Введите username");
        return;
    }

    const response = await request("/api/groups/" + groupId + "/invite", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
    });

    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Не удалось пригласить");
        return;
    }

    alert("Пользователь добавлен в группу!");
    closeModal();
}
