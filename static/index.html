        async function startCall(video) {
            if (!selectedUserId) return;
            if (callTargetId) { alert("Уже есть звонок"); return; }
            isCaller = true;
            callIsVideo = !!video;
            callTargetId = selectedUserId;

                }

            document.getElementById("callDuration").textContent = "00:00";
            await req("/api/calls/signal", {
                method: "POST",

                body: JSON.stringify({

                })
            });

        }

        async function setupCall(isCallerSide) {
            try {
                if (!callTargetId) return;
                const constraints = { audio: true };
                if (callIsVideo) constraints.video = { width: { ideal: 640 }, height: { ideal: 480 } };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (callIsVideo) {
                    document.getElementById("localVideo").srcObject = localStream;
                    document.getElementById("localVideo").style.display = "block";
                }
                pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
                pc.ontrack = (e) => {
                    const stream = e.streams[0];
                    if (stream) {
                        if (callIsVideo) {
                            document.getElementById("remoteVideo").srcObject = stream;
                            document.getElementById("remoteVideo").style.display = "block";
                        } else {
                            document.getElementById("remoteAudio").srcObject = stream;
                        }
                        document.getElementById("callStatus").textContent = "В разговоре";
                        startCallTimer();
                    }
                };
                pc.onicecandidate = (e) => {
                    if (e.candidate && callTargetId) {
                        req("/api/calls/signal", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                target_id: callTargetId,
                                signal_type: "ice",
                                payload: { candidate: e.candidate }
                            })
                        }).catch(() => {});
                    }
                };
                pc.oniceconnectionstatechange = () => {
                    if (!pc) return;
                    const state = pc.iceConnectionState;
                    if (state === "connected" || state === "completed") {
                        document.getElementById("callStatus").textContent = "Соединено";
                    } else if (state === "disconnected" || state === "failed") {
                        if (document.getElementById("callStatus").textContent !== "Завершено") {
                            document.getElementById("callStatus").textContent = "Соединение потеряно";
                            setTimeout(() => endCall(), 3000);
                        }
                    }
                };
                if (isCallerSide) {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    await req("/api/calls/signal", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            target_id: callTargetId,
                            signal_type: "offer",
                            payload: { sdp: offer, video: callIsVideo }
                        })
                    });
                }
            } catch (err) {
                console.error(err);
                alert("Ошибка доступа к микрофону/камере");
                endCall();
            }
        }

        async function handleCallSignal(data) {
            const fromId = data.from_id;
            const type = data.signal_type;
            const payload = data.payload || {};
            if (fromId === currentUser?.id) return;
            if (type === "offer-request") {
                if (callTargetId) {
                    await req("/api/calls/signal", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            target_id: fromId,
                            signal_type: "busy",
                            payload: {}
                        })
                    });
                    return;
                }
                incomingCallData = { fromId, video: payload.video || false };
                try {
                    const res = await req("/api/users/" + fromId);
                    if (res.ok) {
                        const user = await safeJson(res);
                        document.getElementById("incomingCallName").textContent = user.display_name || user.username;
                        document.getElementById("incomingCallAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) :
                            "";
                        document.getElementById("incomingCallSub").textContent = (payload.video ? "📹 Видеозвонок" :
                            "🎧 Аудиозвонок") + " от " + (user.display_name || user.username);
                    }
                } catch {}
                document.getElementById("incomingCallOverlay").classList.remove("hidden");
                playRing();
                setTimeout(() => {
                    if (document.getElementById("incomingCallOverlay").classList.contains("hidden")) return;
                    declineIncomingCall();
                }, 30000);
                return;
            }
            if (type === "busy") {
                stopRing();
                document.getElementById("callStatus").textContent = "Абонент занят";
                setTimeout(() => endCall(), 2000);
                return;
            }
            if (type === "offer") {
                if (!incomingCallData) return;
                isCaller = false;
                callTargetId = fromId;
                callIsVideo = payload.video || false;
                document.getElementById("incomingCallOverlay").classList.add("hidden");
                stopRing();
                showCallOverlay();
                try {
                    const res = await req("/api/users/" + fromId);
                    if (res.ok) {
                        const user = await safeJson(res);
                        document.getElementById("callName").textContent = user.display_name || user.username;
                        document.getElementById("callAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) : "";
                    }
                } catch {}
                document.getElementById("callStatus").textContent = "Соединение...";
                await setupCall(false);
                if (pc && payload.sdp) {
                    try {
                        await pc.setRemoteDescription(payload.sdp);
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        await req("/api/calls/signal", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                target_id: fromId,
                                signal_type: "answer",
                                payload: { sdp: answer }
                            })
                        });
                    } catch (err) { console.error(err); }
                }
                return;
            }
            if (type === "answer") {
                stopRing();
                if (pc && payload.sdp) {
                    try {
                        await pc.setRemoteDescription(payload.sdp);
                        document.getElementById("callStatus").textContent = "Соединено";
                        startCallTimer();
                    } catch (err) { console.error(err); }
                }
                return;
            }
            if (type === "ice") {
                if (pc && payload.candidate) {
                    try { await pc.addIceCandidate(payload.candidate); } catch (err) { console.error(err); }
                }
                return;
            }
            if (type === "hangup") {
                if (!document.getElementById("incomingCallOverlay").classList.contains("hidden")) {
                    document.getElementById("incomingCallOverlay").classList.add("hidden");
                    stopRing();
                }
                document.getElementById("callStatus").textContent = "Собеседник завершил звонок";
                setTimeout(() => endCall(), 2000);
                return;
            }
        }

        function showCallOverlay() {
            document.getElementById("callOverlay").classList.remove("hidden");
            if (!callIsVideo) {
                document.getElementById("remoteVideo").style.display = "none";
                document.getElementById("localVideo").style.display = "none";
            }
        }

        function startCallTimer() {
            callStartTime = Date.now();
            if (callTimer) clearInterval(callTimer);
            callTimer = setInterval(() => {
                if (!callStartTime) return;
                const diff = Math.floor((Date.now() - callStartTime) / 1000);
                document.getElementById("callDuration").textContent =
                    String(Math.floor(diff / 60)).padStart(2, "0") + ":" + String(diff % 60).padStart(2, "0");
            }, 1000);
        }

        function stopCallTimer() {
            if (callTimer) { clearInterval(callTimer);
                callTimer = null; }
        }

        function toggleMute() {
            if (!localStream) return;
            micMuted = !micMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
            const btn = document.getElementById("muteBtn");
            btn.textContent = micMuted ? "🔇" : "🎤";
            btn.classList.toggle("active", micMuted);
        }

        function toggleSpeaker() {
            speakerMuted = !speakerMuted;
            const audio = document.getElementById("remoteAudio");
            if (audio) audio.muted = speakerMuted;
            const btn = document.getElementById("speakerBtn");
            btn.textContent = speakerMuted ? "🔇" : "🔊";
            btn.classList.toggle("active", speakerMuted);
        }

        function declineIncomingCall() {
            if (!incomingCallData) return;
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            stopRing();
            req("/api/calls/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    target_id: incomingCallData.fromId,
                    signal_type: "hangup",
                    payload: {}
                })
            }).catch(() => {});
            incomingCallData = null;
        }

        function answerIncomingCall() {
            if (!incomingCallData) return;
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            stopRing();
            if (incomingCallData) {
                callTargetId = incomingCallData.fromId;
                callIsVideo = incomingCallData.video || false;
                isCaller = false;
                showCallOverlay();
                try {
                    req("/api/users/" + incomingCallData.fromId).then(async (r) => {
                        if (r.ok) {
                            const user = await safeJson(r);
                            document.getElementById("callName").textContent = user.display_name || user.username;
                            document.getElementById("callAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) :
                                "";
                        }
                    });
                } catch {}
                document.getElementById("callStatus").textContent = "Соединение...";
            }
            incomingCallData = null;
        }

        function endCall() {
            stopRing();
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            document.getElementById("callOverlay").classList.add("hidden");
            stopCallTimer();
            if (callTargetId) {
                req("/api/calls/signal", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        target_id: callTargetId,
                        signal_type: "hangup",
                        payload: {}
                    })
                }).catch(() => {});
            }
            if (pc) { try { pc.close(); } catch {} }
            pc = null;
            if (localStream) { localStream.getTracks().forEach(t => t.stop());
                localStream = null; }
            document.getElementById("localVideo").srcObject = null;
            document.getElementById("remoteVideo").srcObject = null;
            document.getElementById("remoteAudio").srcObject = null;
            document.getElementById("localVideo").style.display = "none";
            document.getElementById("remoteVideo").style.display = "none";
            callTargetId = null;
            callStartTime = null;
            incomingCallData = null;
            isCaller = false;
            micMuted = false;
            speakerMuted = false;
            document.getElementById("muteBtn").textContent = "🎤";
            document.getElementById("muteBtn").classList.remove("active");
            document.getElementById("speakerBtn").textContent = "🔊";
            document.getElementById("speakerBtn").classList.remove("active");
        }

        // ============================================================
        // START
        // ============================================================
        checkAuth();
    </script>
</body>
</html>
