<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>
        Messenger Lumi
    </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            background: #101114;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           AUTH
        ===================================================== */

        #authView {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #1c1d22;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        input,
        textarea,
        select {
            background: #2a2b32;
            border: 1px solid #3a3b44;
            border-radius: 10px;
            color: #fff;
            padding: 12px 14px;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #5b8def;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 500;
        }

        .primary {
            background: #5b8def;
            color: #fff;
        }

        .primary:hover {
            background: #4a7de0;
        }

        .secondary {
            background: #2a2b32;
            color: #fff;
        }

        .danger-button {
            background: #e05b5b;
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }

        .error {
            color: #e05b5b;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        /* =====================================================
           LAYOUT
        ===================================================== */

        #app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 320px;
            background: #1c1d22;
            border-right: 1px solid #2a2b32;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .logo {
            padding: 18px 16px;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #2a2b32;
        }

        .search {
            margin: 12px;
            width: calc(100% - 24px);
        }

        .users {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 12px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .user-item:hover,
        .user-item.active {
            background: #2a2b32;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #3a3b44;
            flex-shrink: 0;
            cursor: pointer;
        }

        .avatar:hover {
            opacity: 0.85;
        }

        .user-info {
            overflow: hidden;
        }

        .user-info strong {
            display: block;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-info span {
            font-size: 12px;
            color: #9095a3;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #2a2b32;
            background: #1c1d22;
            flex-shrink: 0;
        }

        .top-actions {
            display: flex;
            gap: 6px;
        }

        .icon-button {
            background: transparent;
            font-size: 20px;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .icon-button:hover {
            background: #2a2b32;
        }

        .content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .view {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
        }

        /* =====================================================
           FEED
        ===================================================== */

        .feed {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post-box {
            background: #1c1d22;
            border-radius: 14px;
            padding: 16px;
        }

        .post-tools {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .post {
            background: #1c1d22;
            border-radius: 14px;
            padding: 16px;
        }

        .post-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .post-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
            margin-bottom: 12px;
        }

        .post-media {
            width: 100%;
            max-height: 420px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #0d0e11;
        }

        .post-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .post-actions button {
            background: #2a2b32;
            color: #fff;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
        }

        .post-actions button:hover {
            background: #3a3b44;
        }

        /* =====================================================
           COMMENTS
        ===================================================== */

        .comments-section {
            margin-top: 14px;
            border-top: 1px solid #2a2b32;
            padding-top: 12px;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            max-height: 320px;
            overflow-y: auto;
        }

        .comment {
            background: #25262c;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .comment-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            background: #3a3b44;
            cursor: pointer;
        }

        .comment-meta {
            font-size: 12px;
            color: #9095a3;
        }

        .comment-text {
            white-space: pre-wrap;
            word-break: break-word;
            margin-top: 2px;
        }

        .comment-actions {
            margin-top: 6px;
            display: flex;
            gap: 8px;
        }

        .comment-actions button {
            background: transparent;
            color: #9095a3;
            font-size: 12px;
            padding: 2px 6px;
        }

        .comment-actions button:hover {
            color: #fff;
        }

        .comment-form {
            display: flex;
            gap: 8px;
        }

        .comment-form input {
            flex: 1;
        }

        .comment-form button {
            flex-shrink: 0;
            padding: 10px 14px;
        }

        .reply-hint {
            font-size: 12px;
            color: #5b8def;
            margin-bottom: 6px;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2b32;
            background: #1c1d22;
            font-weight: 600;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 14px;
            position: relative;
            word-break: break-word;
        }

        .message.mine {
            align-self: flex-end;
            background: #5b8def;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: #2a2b32;
            border-bottom-left-radius: 4px;
        }

        .message.deleted {
            opacity: 0.6;
            font-style: italic;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .message-actions {
            position: absolute;
            top: -8px;
            right: 0;
            display: none;
            gap: 4px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-actions button {
            background: #1c1d22;
            color: #fff;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .composer {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #2a2b32;
            background: #1c1d22;
        }

        .composer input {
            flex: 1;
        }

        .send {
            background: #5b8def;
            color: #fff;
            white-space: nowrap;
        }

        /* =====================================================
           PROFILE / SETTINGS / FAVORITES
        ===================================================== */

        .profile {
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: #1c1d22;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .big-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #3a3b44;
            align-self: center;
            margin-bottom: 8px;
        }

        .setting label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .setting select {
            width: auto;
            min-width: 140px;
        }

        /* =====================================================
           MODAL
        ===================================================== */

        #modalBg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }

        #modal {
            background: #1c1d22;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        #modal h2 {
            margin-bottom: 14px;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            font-size: 20px;
            color: #9095a3;
            padding: 4px 8px;
        }

        .profile-modal-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #3a3b44;
            display: block;
            margin: 0 auto 14px;
        }

        .profile-modal-info {
            text-align: center;
            margin-bottom: 16px;
        }

        .profile-modal-info h3 {
            font-size: 20px;
            margin-bottom: 2px;
        }

        .profile-modal-info .uname {
            color: #9095a3;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .profile-modal-info .bio {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .profile-modal-meta {
            font-size: 13px;
            color: #9095a3;
            text-align: left;
            background: #25262c;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2b32;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 2000;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                z-index: 50;
                height: 100%;
            }

            .sidebar.collapsed {
                display: none;
            }

            .main {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- =====================================================
     AUTH
===================================================== -->

<div id="authView">
    <div class="auth-card">
        <h1>
            💬 Messenger Lumi
        </h1>

        <input
            id="username"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Войти
        </button>

        <button
            class="secondary"
            onclick="register()"
        >
            Создать аккаунт
        </button>

        <p
            id="authError"
            class="error"
        ></p>
    </div>
</div>

<!-- =====================================================
     APP
===================================================== -->

<div
    id="app"
    class="hidden"
>
    <aside
        class="sidebar"
        id="sidebar"
    >
        <div class="logo">
            💬 Messenger Lumi
        </div>

        <input
            id="search"
            class="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div
            id="users"
            class="users"
        ></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <strong id="pageTitle">
                📰 Лента
            </strong>

            <div class="top-actions">
                <button
                    class="icon-button"
                    onclick="showFeed()"
                    title="Лента"
                >
                    📰
                </button>

                <button
                    class="icon-button"
                    onclick="showFavorites()"
                    title="Избранное"
                >
                    ⭐
                </button>

                <button
                    class="icon-button"
                    onclick="showSettings()"
                    title="Настройки"
                >
                    ⚙️
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                    title="Профиль"
                >
                    👤
                </button>
            </div>
        </div>

        <div class="content">

            <!-- FEED -->

            <section
                id="feedView"
                class="view"
            >
                <div class="feed">
                    <div class="post-box">
                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">
                            <button
                                class="primary"
                                onclick="publishPost()"
                            >
                                📝 Опубликовать
                            </button>

                            <label class="primary">
                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                    onchange="publishMediaPost()"
                                >
                            </label>
                        </div>
                    </div>

                    <div id="feed"></div>
                </div>
            </section>

            <!-- CHAT -->

            <section
                id="chatView"
                class="view hidden"
                style="padding:0"
            >
                <div class="chat">
                    <div
                        id="chatHeader"
                        class="chat-header"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        id="messages"
                        class="messages"
                    ></div>

                    <div class="composer">
                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            Отправить сообщение ➤
                        </button>
                    </div>
                </div>
            </section>

            <!-- PROFILE -->

            <section
                id="profileView"
                class="view hidden"
            >
                <div class="profile">
                    <div class="card">
                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            alt=""
                        >

                        <h2>
                            👤 Профиль
                        </h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>
                            🖼️ Аватар
                        </p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить
                        </button>
                    </div>

                    <div class="card">
                        <h3>
                            👥 Аккаунт
                        </h3>

                        <button
                            class="primary"
                            style="width:100%"
                            onclick="openCreateAccount()"
                        >
                            ➕ Добавить аккаунт
                        </button>

                        <button
                            class="primary"
                            style="width:100%;margin-top:8px"
                            onclick="switchAccount()"
                        >
                            🔄 Переключить аккаунт
                        </button>

                        <button
                            class="danger-button"
                            onclick="logout()"
                        >
                            🚪 Выйти
                        </button>

                        <button
                            class="danger-button"
                            onclick="deleteAccount()"
                        >
                            🗑️ Удалить этот аккаунт
                        </button>
                    </div>
                </div>
            </section>

            <!-- SETTINGS -->

            <section
                id="settingsView"
                class="view hidden"
            >
                <div class="profile">
                    <div class="card">
                        <h2>
                            ⚙️ Настройки
                        </h2>

                        <div class="setting">
                            <label>
                                <span>
                                    🌐 Язык
                                </span>

                                <select
                                    id="language"
                                    onchange="saveSettings()"
                                >
                                    <option value="ru">
                                        Русский
                                    </option>

                                    <option value="en">
                                        English
                                    </option>

                                    <option value="be">
                                        Беларуская
                                    </option>

                                    <option value="kk">
                                        Қазақша
                                    </option>
                                </select>
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                <span>
                                    🎨 Тема
                                </span>

                                <select
                                    id="theme"
                                    onchange="saveSettings()"
                                >
                                    <option value="dark">
                                        Тёмная
                                    </option>

                                    <option value="light">
                                        Светлая
                                    </option>

                                    <option value="blue">
                                        Синяя
                                    </option>
                                </select>
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🔔 Уведомления

                                <input
                                    id="notifications"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🟢 Показывать онлайн

                                <input
                                    id="showOnline"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>

                        <div class="setting">
                            <label>
                                🕒 Показывать время последнего визита

                                <input
                                    id="showLastSeen"
                                    type="checkbox"
                                    onchange="saveSettings()"
                                >
                            </label>
                        </div>
                    </div>

                    <div class="card">
                        <h3>
                            👥 Группы
                        </h3>

                        <button
                            class="primary"
                            onclick="openCreateGroup()"
                        >
                            ➕ Создать группу
                        </button>

                        <div id="groups"></div>
                    </div>

                    <div class="card">
                        <h3>
                            📢 Каналы
                        </h3>

                        <button
                            class="primary"
                            onclick="openCreateChannel()"
                        >
                            ➕ Создать канал
                        </button>

                        <div id="channels"></div>
                    </div>
                </div>
            </section>

            <!-- FAVORITES -->

            <section
                id="favoritesView"
                class="view hidden"
            >
                <div class="profile">
                    <div class="card">
                        <h2>
                            ⭐ Избранные сообщения
                        </h2>

                        <div id="favorites"></div>
                    </div>
                </div>
            </section>

        </div>
    </main>
</div>

<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modalBg"
    class="hidden"
    onclick="closeModal(event)"
>
    <div
        id="modal"
        class="modal"
        onclick="event.stopPropagation()"
    ></div>
</div>

<div
    id="toast"
    class="toast"
></div>

<script>
const API = "";

let token =
    localStorage.getItem(
        "token"
    ) || "";

let currentUser =
    null;

let selectedUserId =
    null;

let selectedMessageId =
    null;

let ws =
    null;

let replyToCommentId =
    null;

let openComments =
    {};

/* =====================================================
   REQUEST HELPERS
===================================================== */

async function request(
    url,
    options = {}
) {
    const headers =
        options.headers ||
        {};

    if (
        token
    ) {
        headers[
            "Authorization"
        ] =
            "Bearer " +
            token;
    }

    return fetch(
        API +
        url,
        {
            ...options,
            headers,
            credentials:
                "include"
        }
    );
}

async function safeJson(
    response
) {
    try {
        return await response.json();
    } catch {
        return {};
    }
}

function showToast(
    text
) {
    const el =
        document.getElementById(
            "toast"
        );

    el.textContent =
        text;

    el.classList.add(
        "show"
    );

    setTimeout(
        () => {
            el.classList.remove(
                "show"
            );
        },
        2200
    );
}

/* =====================================================
   AUTH
===================================================== */

async function checkAuth() {
    if (
        !token
    ) {
        const response =
            await request(
                "/api/me"
            );

        if (
            response.ok
        ) {
            currentUser =
                await safeJson(
                    response
                );

            token =
                localStorage.getItem(
                    "token"
                ) ||
                "cookie";

            showApp();

            return;
        }

        showAuth();

        return;
    }

    const response =
        await request(
            "/api/me"
        );

    if (
        !response.ok
    ) {
        token =
            "";

        localStorage.removeItem(
            "token"
        );

        showAuth();

        return;
    }

    currentUser =
        await safeJson(
            response
        );

    showApp();
}

            .trim();

    const response =
        await request(
            "/api/users?q=" +
            encodeURIComponent(
                q
            )
        );

    if (
        !response.ok
    ) {
        return;
    }

    const users =
        await safeJson(
            response
        );

    const container =
        document.getElementById(
            "users"
        );

    container.innerHTML =
        "";

    users.forEach(
        user => {
            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "user-item" +
                (
                    selectedUserId ===
                    user.id
                        ? " active"
                        : ""
                );

            div.onclick =
                () => {
                    openChat(
                        user
                    );
                };

            const avatar =
                document.createElement(
                    "img"
                );

                "avatar";

            if (
                user.avatar_url
            ) {
                avatar.src =
                    mediaUrl(
                        user.avatar_url
                    );
            }

            avatar.onclick =
                (
                    e
                ) => {
                    e.stopPropagation();

                    openUserProfile(
                        user.id
                    );
                };

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "user-info";

                "<strong>" +
                escapeHtml(
                    user.display_name ||
                    user.username
                ) +

                "<span>@" +
                escapeHtml(
                    user.username
                ) +

            div.appendChild(

                div

async function loadMessages(
    otherUserId
) {
    const response =
        await request(
            "/api/messages/" +
            otherUserId
        );

    if (
        !response.ok
    ) {
        return;
    }

    const messages =
        await safeJson(
            response
        );

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML =
        "";

    messages.forEach(
        msg => {
            const div =
                document.createElement(
                    "div"
                );

            const isMine =
                Number(
                    msg.sender_id
                ) ===
                Number(
                    currentUser.id
                );

            div.className =
                "message " +
                (
                    isMine
                        ? "mine"
                        : "theirs"
                );

            if (
                msg.deleted
            ) {
                div.classList.add(
                    "deleted"
                );
            }

            const text =
                document.createElement(
                    "div"
                );

            text.textContent =
                msg.deleted
                    ? "Сообщение удалено"
                    : msg.text;

            div.appendChild(
                text
            );

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "message-time";

            time.textContent =
                formatTime(
                    msg.created_at
                ) +
                (
                    msg.edited_at
                        ? " (изм.)"
                        : ""
                );

            div.appendChild(
                time
            );

            if (
                isMine &&
                !msg.deleted
            ) {
                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "message-actions";

                const editBtn =
                    document.createElement(
                        "button"
                    );

                    "✏️";

                    (
                        e
                    ) => {
                        e.stopPropagation();

                        selectedMessageId =
                            msg.id;

                        openEditMessage(
                            msg.text
                        );
                    };

                const delBtn =
                    document.createElement(
                        "button"
                    );

                delBtn.textContent =
                    "🗑️";

                delBtn.onclick =
                    (
                        e
                    ) => {

                            msg.id;

                    };

                    document.createElement(
                        "button"
                    );

                favBtn.textContent =
                    "⭐";

                favBtn.onclick =
                    async (
                        e
                    ) => {
                        e.stopPropagation();

                        await request(
                            "/api/messages/" +
                            msg.id +
                            "/favorite",
                            {
                                method:
                                    "POST"
                            }
                        );

                        showToast(
                            "Избранное обновлено"
                        );
                    };

                actions.appendChild(
                    editBtn
                );

                actions.appendChild(
                    delBtn
                );

                actions.appendChild(
                    favBtn
                );

                div.appendChild(
                    actions
                );

            } else if (
                !msg.deleted
            ) {
                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "message-actions";

                const favBtn =
                    document.createElement(
                        "button"
                    );

                favBtn.textContent =
                    "⭐";

                favBtn.onclick =
                    async (
                        e
                    ) => {
                        e.stopPropagation();

                        await request(
                            "/api/messages/" +
                            msg.id +
                            "/favorite",
                            {
                                method:
                                    "POST"
                            }
                        );

                        showToast(

                    };

                    favBtn
                );

function renderPost(

        document.createElement(

        post.avatar_url

            mediaUrl(
                post.avatar_url
            );
    }

    avatar.title =
        "Открыть профиль";

    avatar.onclick =
        () => {
            openUserProfile(
                post.author_id
            );
        };

    const author =
        document.createElement(
            "div"
        );

    author.style.cursor =
        "pointer";

    author.onclick =
        () => {
            openUserProfile(
                post.author_id
            );
        };

    author.innerHTML =

        escapeHtml(
            post.display_name ||
            post.username
        ) +
        "</strong>" +

        "<div style='color:#9095a3;font-size:12px'>" +
        "@" +
        escapeHtml(
            post.username
        ) +
        "</div>";

    head.appendChild(
        avatar
    );

    head.appendChild(
        author
    );

    article.appendChild(
        head
    );

    // TEXT

    if (
        post.text
    ) {
        const text =
            document.createElement(

            );

        text.className =
            "post-text";

        text.textContent =
            post.text;

        article.appendChild(
            text
        );
    }

    // MEDIA

    if (
        post.media_url
    ) {
        if (
            post.media_type ===
            "video"
        ) {
            const video =
                document.createElement(
                    "video"
                );

            video.className =
                "post-media";

            video.controls =
                true;

            video.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                video
            );

        } else {
            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "post-media";

            img.src =
                mediaUrl(
                    post.media_url
                );

            article.appendChild(
                img
            );
        }
    }

    // ACTIONS

    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "post-actions";

    // Like

    const like =
        document.createElement(
            "button"
        );

    like.textContent =
        "❤️ " +
        (
            post.likes ||
            0
        );

    like.onclick =
        async () => {
            const response =
                await request(
                    "/api/posts/" +
                    post.id +
                    "/like",
                    {
                        method:
                            "POST"
                    }
                );

            const data =
                await safeJson(
                    response
                );

            if (
                response.ok
            ) {
                like.textContent =
                    "❤️ " +
                    data.likes;
            }
        };

    actions.appendChild(
        like
    );

    // Comments toggle

    const commentsBtn =
        document.createElement(
            "button"
        );

    commentsBtn.textContent =
        "💬 " +
        (
            post.comments ||
            0
        );

    commentsBtn.onclick =
        () => {
            toggleComments(
                post.id,
                article,
                commentsBtn
            );
        };

    actions.appendChild(
        commentsBtn
    );

    // Copy link

    const copyBtn =
        document.createElement(
            "button"
        );

    copyBtn.textContent =
        "🔗 Ссылка";

    copyBtn.onclick =
        () => {
            copyPostLink(
                post.id
            );

        copyBtn
    );

    // Share

        document.createElement(
            "button"
        );

    shareBtn.onclick =
        () => {
            sharePost(

    if (
        Number(
            post.author_id
        ) ===
        Number(
            currentUser.id
        )
    ) {
        const del =
            document.createElement(
                "button"
            );

        del.textContent =
            "🗑️";

        del.onclick =
            async () => {
                if (
                    !confirm(
                        "Удалить пост?"
                    )
                ) {
                    return;
                }

                const response =
                    await request(
                        "/api/posts/" +
                        post.id,
                        {
                            method:
                                "DELETE"
                        }
                    );

                if (
                    response.ok
                ) {
                    article.remove();
                }
            };

        actions.appendChild(
            del
        );
    }

    article.appendChild(
        actions
    );

    // Comments section

    const commentsSection =
        document.createElement(
            "div"
        );

    commentsSection.className =
        "comments-section hidden";

    commentsSection.id =
        "comments-" +
        post.id;

        document.createElement(
            "div"
        );

    commentsList.className =
        "comments-list";

        document.createElement(
            "div"
        );

        <div
            class="reply-hint hidden"
            id="reply-hint-${post.id}"
        ></div>

        <div class="comment-form">
            <input
                id="comment-input-${post.id}"
                placeholder="Написать комментарий..."
            >

            <button
                class="primary"
                onclick="submitComment(${post.id})"
            >
                ➤
            </button>
        </div>
    `;

    commentsSection.appendChild(
        commentsList
    );

    commentsSection.appendChild(
        formWrap
    );

    article.appendChild(
        commentsSection
    );

    container.appendChild(
        article
    );

    if (
        openComments[
            post.id
        ]
    ) {
        commentsSection.classList.remove(
            "hidden"
        );

        loadComments(
            post.id
        );
    }
}

function toggleComments(
    postId,
    article,
    btn
) {
    const section =
        document.getElementById(
            "comments-" +
            postId
        );

    if (
        !section
    ) {
        return;
    }

    if (
        section.classList.contains(
            "hidden"
        )
    ) {
        section.classList.remove(
            "hidden"
        );

        openComments[
            postId
        ] =
            true;

        loadComments(
            postId
        );

    } else {
        section.classList.add(
            "hidden"
        );

        openComments[
            postId
        ] =
            false;

        replyToCommentId =
            null;

        const hint =
            document.getElementById(
                "reply-hint-" +
                postId
            );

        if (
            hint
        ) {
            hint.classList.add(
                "hidden"
            );

            hint.textContent =
                "";
        }
    }
}
