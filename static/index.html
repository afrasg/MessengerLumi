<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Messenger Lumi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
        }
        .hidden {
            display: none !important;
        }
        button,
        input,
        textarea,
        select {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        input,
        textarea,
        select {
            background: #1a1a24;
            color: #fff;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            padding: 12px 16px;
            outline: none;
            width: 100%;
        }
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #5865f2;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a38;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a3a4a;
        }

        /* =========================
           АНИМАЦИЯ ВХОДА
        ========================= */
        #splashScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #splashScreen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }
        #splashScreen svg {
            width: 80px;
            height: 80px;
            animation: splashPulse 1.5s ease-in-out infinite;
        }
        #splashScreen svg path {
            fill: #5865f2;
        }
        #splashScreen .loader {
            width: 40px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        #splashScreen .loader span {
            display: block;
            height: 100%;
            width: 30%;
            background: #5865f2;
            border-radius: 4px;
            animation: loaderMove 1.2s ease-in-out infinite;
        }
        @keyframes splashPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }
        @keyframes loaderMove {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(400%);
            }
        }

        /* =========================
           AUTH
        ========================= */
        #auth {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: auto;
            padding: 20px;
        }
        #auth.hidden {
            display: none !important;
        }
        .auth-card {
            width: min(420px, 100%);
            background: #14141e;
            border: 1px solid #2a2a38;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .auth-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-card .logo img {
            width: 48px;
            height: 48px;
            vertical-align: middle;
        }
        .auth-card .logo span {
            font-size: 24px;
            font-weight: 700;
            margin-left: 10px;
            vertical-align: middle;
            color: #fff;
        }
        .auth-card input {
            margin-bottom: 12px;
        }
        .auth-card button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
        }
        .primary {
            background: #5865f2;
            color: #fff;
        }
        .primary:hover {
            background: #4752c4;
        }
        .secondary {
            background: #2a2a38;
            color: #fff;
        }
        .secondary:hover {
            background: #3a3a4a;
        }
        .danger-button {
            background: #e74c4c;
            color: #fff;
        }
        .danger-button:hover {
            background: #c0392b;
        }
        .error {
            color: #e74c4c;
            min-height: 20px;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: #6a6a7a;
            font-size: 13px;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #2a2a38;
        }

        /* =========================
           APP LAYOUT
        ========================= */
        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }
        #app.hidden {
            display: none !important;
        }

        /* =========================
           SIDEBAR
        ========================= */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: #0f0f17;
            border-right: 1px solid #1a1a24;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 16px 18px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1a1a24;
            flex-shrink: 0;
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
        }
        .sidebar-header .logo img {
            width: 32px;
            height: 32px;
        }
        .sidebar-header .logo span {
            color: #fff;
        }
        .sidebar-search {
            padding: 10px 16px;
            flex-shrink: 0;
        }
        .sidebar-search input {
            padding: 10px 14px;
            font-size: 14px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            border-radius: 10px;
        }
        .sidebar-search input::placeholder {
            color: #6a6a7a;
        }
        .sidebar-users {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
        }
        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .user-item:hover {
            background: #1a1a24;
        }
        .user-item .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #2a2a38;
        }
        .user-item .info {
            flex: 1;
            min-width: 0;
        }
        .user-item .info .name {
            font-weight: 600;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-item .info .name .verified {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-left: 4px;
        }
        .user-item .info .name .verified svg {
            width: 16px;
            height: 16px;
            display: block;
        }
        .user-item .info .sub {
            font-size: 13px;
            color: #8a8a9a;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .user-item .badge {
            background: #5865f2;
            color: #fff;
            font-size: 11px;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .user-item .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid #0f0f17;
        }
        .user-item .status-dot.online {
            background: #2ecc71;
        }
        .user-item .status-dot.offline {
            background: #6a6a7a;
        }
        .section-header {
            padding: 12px 12px 6px;
            font-size: 12px;
            font-weight: 600;
            color: #6a6a7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* =========================
           MAIN
        ========================= */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #0a0a0f;
        }
        .topbar {
            height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid #1a1a24;
            background: #0f0f17;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .topbar .title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar .title img {
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .top-actions .icon-btn {
            padding: 8px;
            border-radius: 10px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-actions .icon-btn:hover {
            background: #1a1a24;
        }
        .top-actions .icon-btn img {
            width: 22px;
            height: 22px;
            opacity: 0.8;
            filter: brightness(0) invert(1);
        }
        .top-actions .icon-btn:hover img {
            opacity: 1;
        }

        .content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }
        .view {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            background: #0a0a0f;
        }
        .view.hidden {
            display: none !important;
        }

        /* =========================
           FEED
        ========================= */
        .feed-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .post-box {
            background: #14141e;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .post-box textarea {
            min-height: 80px;
            resize: vertical;
            background: transparent;
            border: none;
            padding: 8px 0;
            font-size: 15px;
        }
        .post-box textarea::placeholder {
            color: #6a6a7a;
        }
        .post-box .tools {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .post-box .tools button,
        .post-box .tools label {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            background: #1a1a24;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .post-box .tools .primary-btn {
            background: #5865f2;
        }
        .post-box .tools .primary-btn:hover {
            background: #4752c4;
        }
        .post-box .tools label:hover {
            background: #2a2a38;
        }
        .post-box .tools input[type="file"] {
            display: none;
        }

        .post {
            background: #14141e;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .post .head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .post .head .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a38;
            cursor: pointer;
        }
        .post .head .author {
            font-weight: 600;
            cursor: pointer;
        }
        .post .head .author:hover {
            color: #8a8aff;
        }
        .post .head .username {
            font-size: 13px;
            color: #8a8a9a;
        }
        .post .text {
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .post .media {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 10px;
            background: #0a0a0f;
        }
        .post .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .post .actions button {
            padding: 6px 14px;
            border-radius: 8px;
            background: #1a1a24;
            color: #c0c0d0;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }
        .post .actions button:hover {
            background: #2a2a38;
        }
        .post .actions button.liked {
            color: #ff6b6b;
        }
        .post .comments-box {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1a1a24;
        }
        .post .comments-box .comment {
            padding: 8px 0;
            border-bottom: 1px solid #1a1a24;
            font-size: 14px;
        }
        .post .comments-box .comment:last-child {
            border-bottom: none;
        }
        .post .comments-box .comment .cname {
            font-weight: 600;
            cursor: pointer;
            color: #8a8aff;
        }
        .post .comments-box .comment .ctime {
            font-size: 12px;
            color: #6a6a7a;
            margin-left: 8px;
        }
        .post .comments-box .comment-form {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .post .comments-box .comment-form input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            font-size: 14px;
        }
        .post .comments-box .comment-form button {
            padding: 10px 18px;
            border-radius: 10px;
            background: #5865f2;
            color: #fff;
            font-weight: 600;
        }

        /* =========================
           CHAT
        ========================= */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0a0a0f;
        }
        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid #1a1a24;
            background: #0f0f17;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-header:hover {
            background: #14141e;
        }
        .chat-header .left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .chat-header .left .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a38;
        }
        .chat-header .left .info {
            min-width: 0;
        }
        .chat-header .left .info .name {
            font-weight: 600;
            font-size: 16px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-header .left .info .name .verified {
            display: inline-block;
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-left: 4px;
        }
        .chat-header .left .info .name .verified svg {
            width: 16px;
            height: 16px;
            display: block;
        }
        .chat-header .left .info .status {
            font-size: 13px;
            color: #8a8a9a;
        }
        .chat-header .left .info .status .typing {
            color: #5865f2;
            animation: typingDots 1.2s ease-in-out infinite;
        }
        @keyframes typingDots {
            0%,
            20% {
                opacity: 0.3;
            }
            40% {
                opacity: 1;
            }
            60%,
            100% {
                opacity: 0.3;
            }
        }
        .chat-header .actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-header .actions button {
            padding: 6px;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.15s;
        }
        .chat-header .actions button:hover {
            background: #1a1a24;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .message-row {
            display: flex;
            width: 100%;
        }
        .message-row.mine {
            justify-content: flex-end;
        }
        .message-row.theirs {
            justify-content: flex-start;
        }
        .message-bubble {
            max-width: min(70%, 500px);
            padding: 8px 14px;
            border-radius: 16px;
            word-break: break-word;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }
        .message-row.mine .message-bubble {
            background: #5865f2;
            border-bottom-right-radius: 4px;
        }
        .message-row.theirs .message-bubble {
            background: #1a1a24;
            border-bottom-left-radius: 4px;
        }
        .message-bubble .meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 11px;
            opacity: 0.7;
            justify-content: flex-end;
        }
        .message-bubble .meta .status {
            font-size: 11px;
        }
        .message-bubble .meta .status.read {
            color: #8a8aff;
        }
        .message-bubble .meta .status.unread {
            color: #f1c40f;
        }
        .message-bubble .deleted {
            opacity: 0.5;
            font-style: italic;
        }
        .message-bubble .media {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 6px;
            cursor: pointer;
        }
        .message-bubble .media-audio {
            width: 100%;
            margin-top: 6px;
        }
        .message-bubble .media-file {
            display: inline-block;
            margin-top: 6px;
            color: #8a8aff;
            text-decoration: none;
        }

        .composer {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            border-top: 1px solid #1a1a24;
            background: #0f0f17;
            flex-shrink: 0;
            align-items: center;
        }
        .composer input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            font-size: 15px;
        }
        .composer input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .composer .send-btn {
            padding: 10px 20px;
            border-radius: 12px;
            background: #5865f2;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            min-width: 120px;
        }
        .composer .send-btn:hover {
            background: #4752c4;
        }
        .composer .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .composer .icon-btn {
            padding: 8px;
            border-radius: 10px;
            font-size: 20px;
            transition: background 0.15s;
        }
        .composer .icon-btn:hover {
            background: #1a1a24;
        }
        .composer .icon-btn.recording {
            outline: 2px solid #e74c4c;
            background: rgba(231, 76, 76, 0.15);
        }
        #attachPreview {
            padding: 8px 16px;
            border-top: 1px solid #1a1a24;
            background: #0f0f17;
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #attachPreview:not(.hidden) {
            display: flex;
        }
        #attachPreview img {
            max-height: 120px;
            border-radius: 8px;
        }
        #attachPreview .file-info {
            flex: 1;
            font-size: 14px;
            color: #c0c0d0;
        }

        #blockedBar {
            padding: 12px 16px;
            border-top: 1px solid #1a1a24;
            background: #0f0f17;
            display: none;
            flex-shrink: 0;
        }
        #blockedBar:not(.hidden) {
            display: block;
        }
        #blockedBar button {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: #e74c4c;
            color: #fff;
            font-weight: 600;
        }

        /* =========================
           PROFILE / SETTINGS
        ========================= */
        .profile-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .card {
            background: #14141e;
            border: 1px solid #1a1a24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 img {
            width: 24px;
            height: 24px;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #c0c0d0;
        }
        .card .field {
            margin-bottom: 12px;
        }
        .card .field label {
            display: block;
            font-size: 13px;
            color: #8a8a9a;
            margin-bottom: 4px;
        }
        .card .field input,
        .card .field textarea,
        .card .field select {
            padding: 10px 14px;
            border-radius: 10px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            font-size: 14px;
        }
        .card .field textarea {
            min-height: 80px;
            resize: vertical;
        }
        .card .big-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a38;
            margin-bottom: 12px;
        }
        .card .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card .btn-row button {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
        }
        .card .btn-row .primary {
            background: #5865f2;
            color: #fff;
        }
        .card .btn-row .primary:hover {
            background: #4752c4;
        }
        .card .btn-row .danger {
            background: #e74c4c;
            color: #fff;
        }
        .card .btn-row .danger:hover {
            background: #c0392b;
        }
        .card .btn-row .secondary {
            background: #2a2a38;
            color: #fff;
        }
        .card .btn-row .secondary:hover {
            background: #3a3a4a;
        }

        .settings-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #1a1a24;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .settings-tabs button {
            padding: 10px 16px;
            border-radius: 10px 10px 0 0;
            font-weight: 600;
            font-size: 14px;
            color: #8a8a9a;
            background: transparent;
            transition: all 0.15s;
        }
        .settings-tabs button.active {
            color: #fff;
            background: #1a1a24;
        }
        .settings-tabs button:hover {
            color: #fff;
        }
        .settings-tab {
            display: none;
        }
        .settings-tab.active {
            display: block;
        }
        .setting {
            padding: 12px 0;
            border-bottom: 1px solid #1a1a24;
        }
        .setting:last-child {
            border-bottom: none;
        }
        .setting label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            font-size: 14px;
        }
        .setting label select,
        .setting label input[type="checkbox"] {
            width: auto;
            flex-shrink: 0;
        }
        .setting label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #5865f2;
        }

        /* =========================
           REELS (TikTok-like)
        ========================= */
        .reels-container {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding: 0;
            background: #000;
        }
        .reels-container .reel {
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0a0a0f;
            padding: 20px;
        }
        .reels-container .reel .reel-media {
            max-height: 80vh;
            max-width: 100%;
            border-radius: 16px;
            object-fit: contain;
            background: #000;
        }
        .reels-container .reel .reel-info {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }
        .reels-container .reel .reel-info .author {
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
        }
        .reels-container .reel .reel-info .text {
            font-size: 15px;
            margin-top: 4px;
            opacity: 0.9;
        }
        .reels-container .reel .reel-actions {
            position: absolute;
            right: 16px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }
        .reels-container .reel .reel-actions button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        .reels-container .reel .reel-actions button:hover {
            transform: scale(1.1);
        }
        .reels-container .reel .reel-actions button .count {
            font-size: 12px;
            margin-top: 2px;
            display: block;
        }
        .reels-container .reel .reel-actions button.liked {
            color: #ff6b6b;
        }
        .reels-container .reel .reel-profile {
            position: absolute;
            top: 60px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .reels-container .reel .reel-profile .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            cursor: pointer;
        }
        .reels-container .reel .reel-profile .username {
            font-size: 12px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Reels Profile */
        .reels-profile {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .reels-profile .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .reels-profile .header .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #5865f2;
        }
        .reels-profile .header .info .name {
            font-size: 22px;
            font-weight: 700;
        }
        .reels-profile .header .info .username {
            color: #8a8a9a;
            font-size: 15px;
        }
        .reels-profile .header .info .bio {
            margin-top: 4px;
            font-size: 14px;
            color: #c0c0d0;
        }
        .reels-profile .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            padding: 12px 0;
            border-top: 1px solid #1a1a24;
            border-bottom: 1px solid #1a1a24;
        }
        .reels-profile .stats div {
            text-align: center;
        }
        .reels-profile .stats div .num {
            font-size: 18px;
            font-weight: 700;
        }
        .reels-profile .stats div .label {
            font-size: 13px;
            color: #8a8a9a;
        }
        .reels-profile .reels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .reels-profile .reels-grid .item {
            aspect-ratio: 1;
            background: #1a1a24;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .reels-profile .reels-grid .item img,
        .reels-profile .reels-grid .item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reels-profile .reels-grid .item .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .reels-profile .reels-grid .item:hover .overlay {
            opacity: 1;
        }

        /* =========================
           MODAL
        ========================= */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-bg.hidden {
            display: none !important;
        }
        .modal {
            width: min(500px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #14141e;
            border: 1px solid #2a2a38;
            border-radius: 20px;
            padding: 24px;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .modal .close-btn {
            float: right;
            font-size: 24px;
            color: #8a8a9a;
            background: none;
            border: none;
            cursor: pointer;
        }
        .modal .close-btn:hover {
            color: #fff;
        }

        /* =========================
           TOASTS
        ========================= */
        #toastStack {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
            width: calc(100% - 32px);
        }
        .toast {
            background: #1a1a24;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            animation: toastIn 0.25s ease;
        }
        .toast strong {
            display: block;
            font-size: 14px;
        }
        .toast span {
            font-size: 13px;
            color: #8a8a9a;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* =========================
           CALL OVERLAY
        ========================= */
        #callOverlay {
            position: fixed;
            inset: 0;
            z-index: 3000;
            background: rgba(8, 8, 16, 0.95);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #callOverlay:not(.hidden) {
            display: flex;
        }
        #callOverlay .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a38;
        }
        #callOverlay .name {
            font-size: 24px;
            font-weight: 700;
        }
        #callOverlay .status {
            color: #8a8a9a;
            font-size: 16px;
        }
        #callOverlay .duration {
            color: #6a6a7a;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
        }
        #callOverlay .actions {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }
        #callOverlay .actions button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            transition: transform 0.15s;
        }
        #callOverlay .actions button:hover {
            transform: scale(1.05);
        }
        #callOverlay .actions .end {
            background: #e74c4c;
            color: #fff;
        }
        #callOverlay .actions .mute {
            background: #2a2a38;
            color: #fff;
        }
        #callOverlay .actions .mute.active {
            background: #e74c4c;
        }
        #callOverlay .actions .speaker {
            background: #2a2a38;
            color: #fff;
        }
        #callOverlay .actions .speaker.active {
            background: #5865f2;
        }
        #callOverlay video {
            border-radius: 16px;
            background: #0a0a0f;
        }
        #callOverlay .local-video {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            background: #1a1a24;
            position: absolute;
            bottom: 140px;
            right: 20px;
            border: 2px solid #2a2a38;
        }
        #callOverlay .remote-video {
            width: min(90vw, 500px);
            max-height: 50vh;
            object-fit: contain;
            border-radius: 12px;
            background: #0a0a0f;
        }

        #incomingCallOverlay {
            position: fixed;
            inset: 0;
            z-index: 3500;
            background: rgba(8, 8, 16, 0.92);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #incomingCallOverlay:not(.hidden) {
            display: flex;
        }
        #incomingCallOverlay .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #2a2a38;
        }
        #incomingCallOverlay .name {
            font-size: 22px;
            font-weight: 700;
        }
        #incomingCallOverlay .sub {
            color: #8a8a9a;
            font-size: 15px;
        }
        #incomingCallOverlay .actions {
            display: flex;
            gap: 30px;
        }
        #incomingCallOverlay .actions button {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            font-size: 30px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }
        #incomingCallOverlay .actions button:hover {
            transform: scale(1.05);
        }
        #incomingCallOverlay .actions .answer {
            background: #2ecc71;
            color: #fff;
        }
        #incomingCallOverlay .actions .decline {
            background: #e74c4c;
            color: #fff;
        }

        /* =========================
           MESSAGE CONTEXT MENU
        ========================= */
        .context-menu {
            position: fixed;
            z-index: 1000;
            min-width: 180px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .context-menu button {
            width: 100%;
            display: block;
            text-align: left;
            padding: 10px 14px;
            border-radius: 8px;
            background: transparent;
            color: #fff;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .context-menu button:hover {
            background: #2a2a38;
        }
        .context-menu .danger {
            color: #e74c4c;
        }

        /* =========================
           RESPONSIVE
        ========================= */
        @media (max-width: 700px) {
            .sidebar {
                width: 240px;
            }
            .message-bubble {
                max-width: 85%;
            }
            .composer .send-btn {
                min-width: 60px;
                font-size: 0;
                padding: 10px 14px;
            }
            .composer .send-btn::after {
                content: "➤";
                font-size: 18px;
            }
            .reels-container .reel .reel-actions {
                right: 8px;
                bottom: 100px;
            }
            .reels-container .reel .reel-actions button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .reels-container .reel .reel-profile {
                top: 50px;
                right: 8px;
            }
            .reels-container .reel .reel-profile .avatar {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>

    <script>
        // ============================================================

        const API = "";
        const VERIFIED_SVG =
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width:16px;height:16px"><path fill="#32BEA6" d="M504.1,256C504.1,119,393,7.9,256,7.9C119,7.9,7.9,119,7.9,256C7.9,393,119,504.1,256,504.1C393,504.1,504.1,393,504.1,256z"/><path fill="#FFF" d="M392.6,172.9c-5.8-15.1-17.7-12.7-30.6-10.1c-7.7,1.6-42,11.6-96.1,68.8c-22.5,23.7-37.3,42.6-47.1,57c-6-7.3-12.8-15.2-20-22.3C176.7,244.2,152,229,151,228.4c-10.3-6.3-23.8-3.1-30.2,7.3c-6.3,10.3-3.1,23.8,7.2,30.2c0.2,0.1,21.4,13.2,39.6,31.5c18.6,18.6,35.5,43.8,35.7,44.1c4.1,6.2,11,9.8,18.3,9.8c1.2,0,2.5-0.1,3.8-0.3c8.6-1.5,15.4-7.9,17.5-16.3c0.1-0.2,8.8-24.3,54.7-72.7c37-39.1,61.7-51.5,70.3-54.9c0.1,0,0.1,0,0.3,0c0,0,0.3-0.1,0.8-0.4c1.5-0.6,2.3-0.8,2.3-0.8c-0.4,0.1-0.6,0.1-0.6,0.1l0-0.1c4-1.7,11.4-4.9,11.5-5C393.3,196.1,397,184.1,392.6,172.9z"/></svg>`;

        let token = localStorage.getItem("token") || "";
        let currentUser = null;
        let ws = null;
        let selectedUserId = null;
        let selectedGroupId = null;
        let selectedChannelId = null;
        let selectedChannelIsOwner = false;
        let selectedCommunityId = null;
        let selectedCommunityChatId = null;
        let selectedMessageId = null;
        let currentChatPeer = null;
        let favoritePickMode = false;

        // Звуки
        let notifyAudio = null;
        let sendAudio = null;
        let ringAudio = null;

        // Звонки
        let pc = null;
        let localStream = null;
        let callTargetId = null;
        let callIsVideo = false;
        let micMuted = false;
        let speakerMuted = false;
        let callStartTime = null;
        let callTimer = null;
        let incomingCallData = null;
        let isCaller = false;

        // Voice
        let mediaRecorder = null;
        let voiceChunks = [];
        let isRecording = false;
        let voiceStream = null;

        // ============================================================
        // SPLASH
        // ============================================================
        setTimeout(() => {
            document.getElementById("splashScreen").classList.add("hidden");
            setTimeout(() => {
                document.getElementById("splashScreen").style.display = "none";
            }, 800);
        }, 1500);

        // ============================================================
        // HELPERS
        // ============================================================
        function escapeHtml(text) {
            return String(text ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        }

        function mediaUrl(url) {
            if (!url) return "";
            if (url.startsWith("http://") || url.startsWith("https://")) return url;
            return API + url;
        }

        function getStatusDot(isOnline) {
            return `<span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>`;
        }

        function isUserOnline(lastSeen) {
            if (!lastSeen) return false;
            try {
                const diff = (Date.now() - new Date(lastSeen).getTime()) / 1000;
                return diff < 120;
            } catch { return false; }
        }

        function withVerified(name, user) {
            if (user && (user.is_verified || user.is_bot || user.username === "lumi")) {
                return escapeHtml(name) + ' <span class="verified">' + VERIFIED_SVG + '</span>';
            }
            return escapeHtml(name);
        }

        function showToast(title, body, onClick) {
            const stack = document.getElementById("toastStack");
            if (!stack) return;
            const el = document.createElement("div");
            el.className = "toast";
            el.innerHTML = "<strong>" + escapeHtml(title) + "</strong><span>" + escapeHtml(body || "") + "</span>";
            el.onclick = () => { el.remove();
                if (onClick) onClick(); };
            stack.appendChild(el);
            setTimeout(() => { try { el.remove(); } catch {} }, 5000);
        }

        function playNotify() {
            try {
                if (!notifyAudio) {
                    notifyAudio = new Audio(
                        "https://cdn.pixabay.com/download/audio/2022/05/22/audio_04e0e1b2c3.mp3");
                }
                notifyAudio.currentTime = 0;
                notifyAudio.play().catch(() => {});
            } catch {}
        }

        function playSend() {
            try {

        // ============================================================

        // ============================================================
        async function req(url, opts = {}) {
            const headers = { ...opts.headers };
            if (token) headers["Authorization"] = "Bearer " + token;
            if (opts.body && !(opts.body instanceof FormData)) {
                headers["Content-Type"] = "application/json";
            }
            if (opts.body instanceof FormData) {
                delete headers["Content-Type"];
            }
            opts.headers = headers;
            return fetch(API + url, opts);
        }

        async function safeJson(res) {
            try { return await res.json(); } catch { return {}; }
        }

        // ============================================================
        // WEBSOCKET
        // ============================================================
        function connectWS() {
            if (!token || !currentUser) return;
            try {
                const proto = location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(proto + "//" + location.host + "/ws?token=" + encodeURIComponent(token));
                ws.onmessage = async (e) => {
                    let data;
                    try { data = JSON.parse(e.data); } catch { return; }
                    if (data.type === "call_signal") { await handleCallSignal(data); return; }
                    if (data.type === "message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "private");
                        if (selectedUserId && (Number(data.message.sender_id) === Number(selectedUserId) ||
                                Number(data.message.receiver_id) === Number(selectedUserId))) {
                            await loadMessages(selectedUserId);
                        }
                        await loadDialogs();
                        return;
                    }
                    if (data.type === "group_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "group");
                        if (selectedGroupId && Number(selectedGroupId) === Number(data.message.group_id)) {
                            await loadGroupMessages(selectedGroupId);
                        }
                        return;
                    }
                    if (data.type === "channel_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "channel");
                        if (selectedChannelId && Number(selectedChannelId) === Number(data.message.channel_id)) {
                            await loadChannelMessages(selectedChannelId);
                        }
                        return;
                    }
                    if (data.type === "community_message" && data.message) {
                        playNotify();
                        notifyNewMessage(data.message, "community");
                        if (selectedCommunityChatId && Number(selectedCommunityChatId) === Number(data.message
                                .chat_id)) {
                            await loadCommunityChatMessages(selectedCommunityChatId);
                        }
                        return;
                    }
                    if (data.type === "typing" && selectedUserId && data.user_id == selectedUserId) {
                        document.getElementById("chatStatus").innerHTML =
                            '<span class="typing">печатает...</span>';
                        clearTimeout(window.typingTimeout);
                        window.typingTimeout = setTimeout(() => {
                            updateChatStatus(currentChatPeer);
                        }, 3000);
                        return;
                    }
                    if (selectedUserId) {
                        await loadMessages(selectedUserId);
                    } else if (selectedGroupId) {
                        await loadGroupMessages(selectedGroupId);
                    } else if (selectedChannelId) {
                        await loadChannelMessages(selectedChannelId);
                    } else if (selectedCommunityChatId) {
                        await loadCommunityChatMessages(selectedCommunityChatId);
                    }
                };
                ws.onclose = () => { if (token) setTimeout(connectWS, 3000); };
            } catch {}
        }

        async function loadUsers(query) {
            const container = document.getElementById("users");
            if (!container) return;
            const id = ++searchId;
            container.innerHTML = "";
            if (!query) {
                if (id !== searchId) return;
                await refreshSidebar();
                return;
            }
            const res = await req("/api/search?q=" + encodeURIComponent(query));
            if (id !== searchId) return;
            if (!res.ok) { await refreshSidebar(); return; }
            const data = await safeJson(res);
            if (id !== searchId) return;
            container.innerHTML = "";
            const users = (data.users || []).filter(u => Number(u.id) !== Number(currentUser.id));
            const channels = data.channels || [];
            const groups = data.groups || [];
            const communities = data.communities || [];
            if (!users.length && !channels.length && !groups.length && !communities.length) {
                const empty = document.createElement("div");
                empty.style.cssText = "padding:20px;text-align:center;color:#6a6a7a;font-size:14px";
                empty.textContent = "Ничего не найдено";
                container.appendChild(empty);
                return;
            }
            if (users.length || channels.length || groups.length || communities.length) {
                container.appendChild(sectionHeader("Результаты поиска"));
            }
            users.forEach(u => {
                container.appendChild(userItem(u));
            });
            channels.forEach(ch => {
                const div = document.createElement("div");
                div.className = "user-item";
                div.innerHTML =
                    `<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:#2a2a38">📢</div><div class="info"><div class="name">${escapeHtml(ch.name)}</div><div class="sub">@${escapeHtml(ch.username)}${ch.joined ? " · подписан" : ""}</div></div>`;
                div.onclick = async () => {
                    if (!ch.joined) {
                        const r = await req("/api/channels/" + ch.id + "/join", { method: "POST" });
                        if (!r.ok) { const e = await safeJson(r);

                    `<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:#2a2a38">🌐</div><div class="info"><div class="name">${escapeHtml(c.name)}</div><div class="sub">сообщество</div></div>`;
                div.onclick = () => openCommunity(c.id, c.name);

        // ============================================================
        // CHAT
        // ============================================================
        async function openChat(user) {
            selectedUserId = Number(user.id);
            selectedGroupId = null;
            selectedChannelId = null;
            selectedChannelIsOwner = false;
            selectedCommunityId = null;
            selectedCommunityChatId = null;
            currentChatPeer = user;
            favoritePickMode = false;
            setComposerEnabled(true);
            showOnly("chatView");
            setPageTitle(null, "💬 " + (user.display_name || user.username));
            document.getElementById("chatAvatar").src = user.avatar_url ? mediaUrl(user.avatar_url) : "";
            document.getElementById("chatName").innerHTML = withVerified(user.display_name || user.username, user);
            updateChatStatus(user);
            const actions = document.getElementById("chatActions");
            actions.style.display = "flex";
            const isBot = user.is_bot || user.username === "lumi";
            actions.querySelectorAll("button").forEach(b => b.style.display = "");
            if (isBot) {
                actions.querySelector('[onclick*="startCall"]')?.remove();
                actions.querySelector('[onclick*="startCall(true)"]')?.remove();
            }
            try {
                const sres = await req("/api/chats/" + selectedUserId + "/settings");
                if (sres.ok) {
                    const s = await safeJson(sres);
                    if (s.alias) {
                        document.getElementById("chatName").textContent = s.alias;
                    }
                    applyChatWallpaper(s.wallpaper_url, s.wallpaper_blur);
                }
            } catch {}
            await loadMessages(selectedUserId);
            await refreshBlockedUI();
            await loadDialogs();
        }

        function updateChatStatus(user) {
            const el = document.getElementById("chatStatus");
            if (!el) return;
            if (!user) { el.textContent = ""; return; }
            if (user.is_bot || user.username === "lumi") { el.textContent = "🤖 Бот"; return; }
            if (Number(user.id) === Number(currentUser?.id)) { el.textContent = "Это вы"; return; }
            const online = isUserOnline(user.last_seen);
            el.textContent = online ? "🟢 в сети" : "⚫ оффлайн";
            if (online) {
                el.style.color = "#2ecc71";
            } else {
                el.style.color = "#6a6a7a";
            }
        }

        function applyChatWallpaper(url, blur) {
            const chat = document.querySelector(".chat-container");
            if (!chat) return;
            if (!url) { chat.style.background = ""; return; }
            chat.style.backgroundImage = `url(${url})`;
            chat.style.backgroundSize = "cover";
            chat.style.backgroundPosition = "center";
            const msgs = document.getElementById("messages");
            if (msgs) {
                msgs.style.backdropFilter = blur ? "blur(8px)" : "";
                msgs.style.background = blur ? "rgba(10,10,15,0.6)" : "transparent";
            }

                btn.style.opacity = enabled ? "1" : "0.4"; }

        async function loadMessages(userId) {

            container.innerHTML = "";

        function renderMessage(msg) {
            const container = document.getElementById("messages");
            const mine = Number(msg.sender_id) === Number(currentUser.id);
            const row = document.createElement("div");
            row.className = "message-row " + (mine ? "mine" : "theirs");
            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.dataset.id = msg.id;
            const text = document.createElement("div");
            if (msg.deleted) {
                text.className = "deleted";
                text.textContent = "Сообщение удалено";
            } else {
                text.textContent = msg.text || "";
            }
            bubble.appendChild(text);
            if (msg.media_url && !msg.deleted) {
                const url = mediaUrl(msg.media_url);
                if (msg.media_type === "image") {
                    const img = document.createElement("img");
                    img.className = "media";
                    img.src = url;
                    img.onclick = () => window.open(url, "_blank");
                    bubble.appendChild(img);
                } else if (msg.media_type === "voice") {
                    const audio = document.createElement("audio");
                    audio.className = "media-audio";
                    audio.controls = true;
                    audio.src = url;
                    bubble.appendChild(audio);
                } else {
                    const a = document.createElement("a");
                    a.className = "media-file";
                    a.href = url;
                    a.target = "_blank";
                    a.textContent = "📎 Файл";
                    bubble.appendChild(a);
                }
            }
            if (msg.invite_id && msg.invite_status === "pending" && !mine) {
                const box = document.createElement("div");
                box.style.cssText = "display:flex;gap:8px;margin-top:8px";
                const acc = document.createElement("button");
                acc.style.cssText =
                    "padding:6px 14px;border-radius:8px;background:#5865f2;color:#fff;border:none;cursor:pointer;font-weight:600";
                acc.textContent = "Вступить";
                acc.onclick = (e) => { e.stopPropagation();
                    respondInvite(msg.invite_id, "accept"); };
                const dec = document.createElement("button");
                dec.style.cssText =
                    "padding:6px 14px;border-radius:8px;background:#2a2a38;color:#fff;border:none;cursor:pointer";
                dec.textContent = "Отказаться";
                dec.onclick = (e) => { e.stopPropagation();
                    respondInvite(msg.invite_id, "decline"); };
                box.appendChild(acc);
                box.appendChild(dec);
                bubble.appendChild(box);
            } else if (msg.invite_status && msg.invite_status !== "pending") {
                const st = document.createElement("div");
                st.style.cssText = "font-size:12px;opacity:0.7;margin-top:4px";
                st.textContent = msg.invite_status === "accepted" ? "✓ Принято" : "✗ Отклонено";
                bubble.appendChild(st);
            }
            const meta = document.createElement("div");
            meta.className = "meta";
            const time = document.createElement("span");
            const d = new Date(msg.created_at);
            time.textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            meta.appendChild(time);
            if (mine) {
                const st = document.createElement("span");
                st.className = "status " + (msg.is_read ? "read" : "unread");
                st.textContent = msg.is_read ? "✓✓" : "✓";
                meta.appendChild(st);
            }
            bubble.appendChild(meta);
            row.appendChild(bubble);
            container.appendChild(row);
            if (mine && !msg.deleted) {
                bubble.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (favoritePickMode) {
                        req("/api/messages/" + msg.id + "/favorite", { method: "POST" }).then(() => alert(
                        "Добавлено в избранное"));
                        return;
                    }
                    openMessageContext(msg, bubble);
                });
            } else if (!mine && !msg.deleted) {
                bubble.addEventListener("click", (e) => {
                    if (favoritePickMode) {
                        e.stopPropagation();
                        req("/api/messages/" + msg.id + "/favorite", { method: "POST" }).then(() => alert(
                            "Добавлено в избранное"));
                    }
                });
            }
        }

        function openMessageContext(msg, el) {
            closeContext();
            const menu = document.createElement("div");
            menu.className = "context-menu";
            const edit = document.createElement("button");

            const copy = document.createElement("button");

            copy.onclick = async () => { try { await navigator.clipboard.writeText(msg.text || ""); } catch {}
                closeContext(); };
            const del = document.createElement("button");
            del.className = "danger";
            del.textContent = "🗑️ Удалить";
            del.onclick = () => { closeContext();
                selectedMessageId = msg.id;
                deleteSelectedMessage(); };
            menu.appendChild(edit);
            menu.appendChild(copy);
            menu.appendChild(del);
            document.body.appendChild(menu);
            const rect = el.getBoundingClientRect();
            let left = rect.left,
                top = rect.bottom + 6;
            if (left + 200 > window.innerWidth) left = window.innerWidth - 210;
            if (top + 130 > window.innerHeight) top = rect.top - 135;
            menu.style.left = Math.max(6, left) + "px";
            menu.style.top = Math.max(6, top) + "px";
            setTimeout(() => document.addEventListener("click", closeContext, { once: true }), 0);
        }

        function renderPost(post, container) {
            const div = document.createElement("div");
            div.className = "post";
            div.dataset.id = post.id;
            const head = document.createElement("div");
            head.className = "head";
            const avatar = document.createElement("img");
            avatar.className = "avatar";
            if (post.avatar_url) avatar.src = mediaUrl(post.avatar_url);
            avatar.onclick = () => openUserProfile(post.author_id);
            const author = document.createElement("span");
            author.className = "author";
            author.innerHTML = withVerified(post.display_name || post.username, post);
            author.onclick = () => openUserProfile(post.author_id);
            const uname = document.createElement("span");
            uname.className = "username";
            uname.textContent = "@" + post.username;
            head.appendChild(avatar);
            head.appendChild(author);
            head.appendChild(uname);
            div.appendChild(head);
            if (post.text) {
                const txt = document.createElement("div");
                txt.className = "text";
                txt.textContent = post.text;
                div.appendChild(txt);
            }
            if (post.media_url) {
                const media = document.createElement(post.media_type === "video" ? "video" : "img");
                media.className = "media";
                media.src = mediaUrl(post.media_url);
                if (post.media_type === "video") media.controls = true;
                div.appendChild(media);
            }
            const actions = document.createElement("div");
            actions.className = "actions";
            const like = document.createElement("button");
            like.textContent = "❤️ " + (post.likes || 0);
            like.onclick = async () => {
                const r = await req("/api/posts/" + post.id + "/like", { method: "POST" });
                const d = await safeJson(r);
                if (r.ok) like.textContent = "❤️ " + d.likes;
            };
            const comments = document.createElement("button");
            comments.textContent = "💬 " + (post.comments_count || 0);
            comments.onclick = () => toggleComments(post.id, div, comments);
            const share = document.createElement("button");
            share.textContent = "🔗 Поделиться";
            share.onclick = () => sharePost(post);
            actions.appendChild(like);
            actions.appendChild(comments);
            actions.appendChild(share);
            if (Number(post.author_id) === Number(currentUser.id)) {
                const del = document.createElement("button");
                del.textContent = "🗑️";
                del.onclick = async () => {
                    if (!confirm("Удалить пост?")) return;
                    const r = await req("/api/posts/" + post.id, { method: "DELETE" });
                    if (r.ok) div.remove();
                };
                actions.appendChild(del);
            }
            div.appendChild(actions);
            const commentsBox = document.createElement("div");
            commentsBox.className = "comments-box";
            commentsBox.style.display = "none";
            commentsBox.id = "comments-" + post.id;
            div.appendChild(commentsBox);
            container.appendChild(div);

        async function toggleComments(postId, article, btn) {
            const box = document.getElementById("comments-" + postId);
            if (!box) return;
            if (box.style.display !== "none") { box.style.display = "none"; return; }
            box.style.display = "block";
            box.innerHTML = "<div style='color:#6a6a7a;padding:8px 0'>Загрузка...</div>";
            const res = await req("/api/posts/" + postId + "/comments");
            if (!res.ok) { box.innerHTML = "<div style='color:#e74c4c'>Ошибка</div>"; return; }
            const comments = await safeJson(res);
            box.innerHTML = "";
            if (!comments.length) {
                box.innerHTML = "<div style='color:#6a6a7a;padding:8px 0'>Комментариев пока нет</div>";
            }
            comments.forEach(c => {
                const d = document.createElement("div");
                d.className = "comment";
                const reply = c.reply_to_username ?
                    `<span style="color:#5865f2">@${escapeHtml(c.reply_to_username)}</span> ` : "";
                d.innerHTML =
                    `<span class="cname" onclick="openUserProfile(${c.user_id})">${escapeHtml(c.display_name||c.username)}</span><span class="ctime">${new Date(c.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span><br>${reply}${escapeHtml(c.text)}`;
                if (Number(c.user_id) === Number(currentUser.id)) {
                    const del = document.createElement("button");
                    del.textContent = "🗑️";
                    del.style.cssText =
                        "background:none;border:none;color:#e74c4c;cursor:pointer;font-size:12px;margin-left:8px";
                    del.onclick = async () => {
                        if (!confirm("Удалить комментарий?")) return;
                        await req("/api/comments/" + c.id, { method: "DELETE" });
                        box.style.display = "none";
                        toggleComments(postId, article, btn);
                        const num = Math.max(0, (parseInt(btn.textContent.replace(/\D/g, "")) || 1) - 1);
                        btn.textContent = "💬 " + num;
                    };
                    d.appendChild(del);
                }
                box.appendChild(d);
            });
            const form = document.createElement("div");
            form.className = "comment-form";
            form.innerHTML =
                `<input id="commentInput-${postId}" placeholder="Написать комментарий..."><button onclick="sendComment(${postId})">➤</button>`;
            box.appendChild(form);
        }

        async function sendComment(postId) {
            const input = document.getElementById("commentInput-" + postId);
            const text = (input?.value || "").trim();
            if (!text) return;
            const res = await req("/api/posts/" + postId + "/comments", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });
            if (!res.ok) { const d = await safeJson(res);
                alert(d.detail || "Ошибка"); return; }
            const article = document.querySelector(`.post[data-id="${postId}"]`);
            const btn = article?.querySelector(".actions button:nth-child(2)");
            if (btn) {
                const cur = parseInt(btn.textContent.replace(/\D/g, "")) || 0;
                btn.textContent = "💬 " + (cur + 1);
            }
            if (article && btn) {
                const box = document.getElementById("comments-" + postId);
                if (box) box.style.display = "none";
                toggleComments(postId, article, btn);
            }
        }

        async function sharePost(post) {
            const url = location.origin + location.pathname + "?post=" + post.id;
            if (navigator.share) {
                try { await navigator.share({ title: "Пост", text: (post.text || "").slice(0, 100), url });
                    return; } catch {}
            }
            try { await navigator.clipboard.writeText(url);
                alert("Ссылка скопирована!"); } catch { prompt("Скопируй ссылку:", url); }
        }

        function renderGroupMessages(messages) {
            const container = document.getElementById("messages");
            container.innerHTML = "";
            if (!messages.length) {
                container.innerHTML =
                    "<div style='color:#6a6a7a;text-align:center;padding:20px'>Пока нет сообщений</div>";
                return;
            }
            messages.forEach(msg => {
                const mine = Number(msg.sender_id) === Number(currentUser.id);
                const row = document.createElement("div");
                row.className = "message-row " + (mine ? "mine" : "theirs");
                const bubble = document.createElement("div");
                bubble.className = "message-bubble";
                if (!mine && (msg.sender_name || msg.username)) {
                    const name = document.createElement("div");
                    name.style.cssText = "font-size:12px;font-weight:600;color:#8a8a9a;margin-bottom:3px";
                    name.textContent = msg.sender_name || msg.username || "";
                    bubble.appendChild(name);
                }
                const text = document.createElement("div");
                if (msg.deleted) {
                    text.className = "deleted";
                    text.textContent = "Сообщение удалено";
                } else {
                    text.textContent = msg.text || "";
                }
                bubble.appendChild(text);
                const meta = document.createElement("div");
                meta.className = "meta";
                const time = document.createElement("span");
                const d = new Date(msg.created_at);
                time.textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                meta.appendChild(time);
                bubble.appendChild(meta);
                row.appendChild(bubble);
                container.appendChild(row);
            });
            scrollMessages();
        }

        function notifyNewMessage(message, kind) {
            if (!message || Number(message.sender_id) === Number(currentUser?.id)) return;
            const chatKind = kind || message.chat_kind || "private";
            if (chatKind === "private" && selectedUserId && Number(selectedUserId) === Number(message.sender_id)) {
                loadDialogs();
                return;
            }
            if (chatKind === "group" && selectedGroupId && Number(selectedGroupId) === Number(message.group_id))
            return;
            if (chatKind === "channel" && selectedChannelId && Number(selectedChannelId) === Number(message.channel_id))
                return;
            if (chatKind === "community" && selectedCommunityChatId && Number(selectedCommunityChatId) === Number(
                    message.chat_id)) return;

            let preview = message.text || "";
            if (message.media_type === "voice") preview = "🎤 Голосовое";
            else if (message.media_type === "image") preview = "📷 Фото";
            else if (message.media_type === "file") preview = "📎 Файл";
            if (preview.length > 100) preview = preview.slice(0, 100) + "…";

            const uname = message.sender_name || message.sender_username || "user";
            let title = "",
                body = "";
            if (chatKind === "group") {
                title = message.group_name || "Группа";
                body = uname + ": " + preview;
            } else if (chatKind === "channel") {
                title = message.channel_name || "Канал";
                body = preview;
            } else if (chatKind === "community") {
                title = (message.community_name || "Сообщество") + " · " + (message.chat_name || "Чат");
                body = uname + ": " + preview;
            } else {
                title = uname;
                body = preview;
            }
            showToast(title, body, () => {
                if (chatKind === "private") {
                    openChat({ id: message.sender_id, username: message.sender_username || "user",
                        display_name: uname, is_bot: false, last_seen: null });
                } else if (chatKind === "group" && message.group_id) {
                    openGroupChat(message.group_id, message.group_name || "Группа");
                } else if (chatKind === "channel" && message.channel_id) {
                    openChannelChat(message.channel_id, message.channel_name || "Канал", false);
                } else if (chatKind === "community" && message.chat_id) {
                    openCommunityChat(message.chat_id, message.chat_name || "Чат", message.community_name || "");
                }
            });
            if (typeof Notification !== "undefined" && Notification.permission === "granted") {
                try {
                    const n = new Notification(title, { body, silent: true });
                    n.onclick = () => window.focus();
                } catch {}
            }
            loadDialogs();
        }

        // Voice
        async function startVoice() {
            if (!selectedUserId || isRecording) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                voiceStream = stream;
                voiceChunks = [];
                const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" :
                    "audio/webm";
                mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) voiceChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    try { stream.getTracks().forEach(t => t.stop()); } catch {}
                    const duration = Date.now() - voiceStart;
                    if (duration < 300 || voiceChunks.length === 0) return;
                    const blob = new Blob(voiceChunks, { type: mime });
                    const ext = mime.includes("ogg") ? "ogg" : "webm";
                    const file = new File([blob], "voice." + ext, { type: mime.split(";")[0] });
                    await uploadMedia(file, "");
                    voiceChunks = [];
                };
                voiceStart = Date.now();
                mediaRecorder.start(100);
                isRecording = true;
                document.getElementById("voiceBtn").classList.add("recording");
            } catch (err) { alert("Нет доступа к микрофону"); }
        }

        function stopVoice() {
            if (!isRecording) return;
            isRecording = false;
            document.getElementById("voiceBtn").classList.remove("recording");
            try { if (mediaRecorder && mediaRecorder.state !== "inactive") { mediaRecorder.stop(); } } catch {}
        }
