<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>MyMessenger</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --bg: #07111d;
    --panel: rgba(15, 28, 43, .92);
    --panel2: #122235;
    --border: rgba(255,255,255,.08);
    --text: #f4f8fc;
    --muted: #8294a8;
    --blue: #2998f5;
    --blue2: #1676d2;
    --danger: #e84d5b;
    --green: #35d07f;
    --shadow: 0 20px 60px rgba(0,0,0,.35);
}

body.light {
    --bg: #eef3f8;
    --panel: rgba(255,255,255,.94);
    --panel2: #f5f7fa;
    --border: rgba(0,0,0,.08);
    --text: #18202a;
    --muted: #6e7c8c;
}

body.blue {
    --bg: #071827;
    --panel: #0b2740;
    --panel2: #103451;
}

body.midnight {
    --bg: #020307;
    --panel: #080b12;
    --panel2: #10141e;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(42,145,240,.12),
            transparent 35%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        Arial,
        sans-serif;
    height: 100vh;
    overflow: hidden;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}


/* AUTH */

#auth {
    width: 400px;
    max-width: calc(100% - 30px);
    margin: 90px auto;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
}

#auth h1 {
    text-align: center;
    margin-top: 0;
}

#auth input {
    width: 100%;
    margin: 7px 0;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 13px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.auth-button {
    width: 100%;
    border: 0;
    padding: 14px;
    margin-top: 8px;
    border-radius: 13px;
    color: white;
    background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );
}


/* APP */

#app {
    display: none;
    height: 100vh;
}

.sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(20px);
}

.logo {
    padding: 22px;
    font-size: 21px;
    font-weight: 800;
}

.search {
    margin: 0 14px 14px;
    padding: 13px 15px;
    border: 1px solid var(--border);
    border-radius: 14px;
    outline: none;
    background: var(--panel2);
    color: var(--text);
}

.users {
    overflow-y: auto;
}

.user {
    padding: 13px 15px;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    transition: .15s;
}

.user:hover {
    background: rgba(255,255,255,.06);
}

.avatar {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
    background: var(--blue);
    border: 2px solid rgba(255,255,255,.1);
}

.user-name {
    font-weight: 700;
}

.user-username {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}


/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 68px;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
}

.top-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 11px;
    padding: 9px 12px;
}

.content {
    flex: 1;
    min-height: 0;
}

.view {
    height: 100%;
    overflow-y: auto;
    padding: 20px;
}


/* CHAT */

.chat {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.chat-header {
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.messages {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.message-row {
    display: flex;
    margin: 5px 0;
}

.message-row.mine {
    justify-content: flex-end;
}

.message {
    position: relative;
    max-width: min(70%, 650px);
    padding: 10px 13px;
    background: var(--panel2);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.message.mine .message {
    background: linear-gradient(
        135deg,
        #237fc7,
        #1767aa
    );
}

.message-text {
    white-space: pre-wrap;
    word-break: break-word;
}

.message.deleted {
    opacity: .55;
    font-style: italic;
}

.message-time {
    font-size: 10px;
    color: rgba(255,255,255,.6);
    text-align: right;
    margin-top: 5px;
}

.message-actions {
    position: absolute;
    right: 4px;
    top: -35px;
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    box-shadow: var(--shadow);
}

.message:hover .message-actions {
    display: flex;
}

.message-actions button {
    border: 0;
    background: transparent;
    color: var(--text);
    padding: 5px 7px;
}

.composer {
    display: flex;
    gap: 9px;
    padding: 13px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.composer input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.send {
    width: 52px;
    border: 0;
    border-radius: 14px;
    color: white;
    background: var(--blue);
}


/* FEED */

.feed {
    max-width: 760px;
    margin: auto;
}

.post-box,
.post,
.settings-card,
.profile-card,
.modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.12);
}

.post-box {
    padding: 16px;
    margin-bottom: 16px;
}

.post-box textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}

.post-tools {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.primary {
    border: 0;
    padding: 10px 14px;
    border-radius: 11px;
    color: white;
    background: var(--blue);
}

.post {
    padding: 17px;
    margin-bottom: 16px;
}

.post-header {
    display: flex;
    gap: 10px;
    align-items: center;
}

.post-author {
    font-weight: 800;
}

.post-username {
    color: var(--muted);
    font-size: 12px;
}

.post-text {
    white-space: pre-wrap;
    margin: 15px 0;
}

.post-media {
    width: 100%;
    max-height: 600px;
    object-fit: contain;
    border-radius: 15px;
    background: #000;
}

.post-actions {
    display: flex;
    gap: 7px;
    margin-top: 12px;
}

.post-actions button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
}

.comments {
    margin-top: 14px;
}

.comment {
    padding: 10px;
    border-radius: 11px;
    background: var(--panel2);
    margin-top: 7px;
}

.comment-reply {
    margin-left: 25px;
    border-left: 2px solid var(--blue);
}

.comment-meta {
    color: var(--muted);
    font-size: 12px;
}

.comment-actions {
    display: flex;
    gap: 5px;
    margin-top: 5px;
}

.comment-actions button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
}

.comment-input {
    display: flex;
    gap: 7px;
    margin-top: 9px;
}

.comment-input input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
}


/* SETTINGS */

.settings {
    max-width: 800px;
    margin: auto;
}

.settings-card {
    padding: 22px;
    margin-bottom: 14px;
}

.settings-card h2 {
    margin-top: 0;
}

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
    border-bottom: 0;
}

.setting-row select,
.setting-row input {
    padding: 9px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
}

.danger {
    border: 0;
    color: white;
    background: var(--danger);
    padding: 11px 15px;
    border-radius: 11px;
}


/* PROFILE */

.profile {
    max-width: 600px;
    margin: auto;
}

.profile-card {
    padding: 25px;
    text-align: center;
}

.big-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
}

.profile input,
.profile textarea {
    width: 100%;
    margin: 6px 0;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel2);
    color: var(--text);
    outline: none;
}


/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-card {
    width: 430px;
    max-width: 100%;
    padding: 25px;
}

.modal-card input,
.modal-card textarea {
    width: 100%;
    margin: 6px 0;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
}

.modal-buttons {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

@media(max-width:750px) {

    .sidebar {
        width: 78px;
    }

    .logo {
        font-size: 11px;
        padding: 12px 4px;
        text-align: center;
    }

    .search {
        margin: 5px;
        width: calc(100% - 10px);
    }

    .user {
        justify-content: center;
        padding: 9px 4px;
    }

    .user > div:last-child {
        display: none;
    }

    .view {
        padding: 10px;
    }

    .message {
        max-width: 86%;
    }
}

</style>

</head>

<body>


<!-- AUTH -->

<div id="auth">

    <h1>💬 MyMessenger</h1>

    <input
        id="username"
        placeholder="Username"
    >

    <input
        id="password"
        type="password"
        placeholder="Пароль"
    >

    <button
        class="auth-button"
        onclick="login()"
    >
        Войти
    </button>

    <button
        class="auth-button"
        onclick="register()"
    >
        Создать аккаунт
    </button>

    <p id="authError"></p>

</div>


<!-- APP -->

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            💬 MyMessenger
        </div>

        <input
            class="search"
            id="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div
            class="users"
            id="users"
        ></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong id="pageTitle">
                📰 Лента
            </strong>

            <div class="top-actions">

                <button
                    class="icon-button"
                    onclick="showFeed()"
                >
                    📰
                </button>

                <button
                    class="icon-button"
                    onclick="showFavorites()"
                >
                    📌
                </button>

                <button
                    class="icon-button"
                    onclick="showProfile()"
                >
                    👤
                </button>

                <button
                    class="icon-button"
                    onclick="showSettings()"
                >
                    ⚙️
                </button>

            </div>

        </div>


        <div class="content">


            <!-- FEED -->

            <section
                class="view"
                id="feedView"
            >

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button
                                class="primary"
                                onclick="publishPost()"
                            >
                                📝 Опубликовать
                            </button>

                            <label class="primary">

                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                >

                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- CHAT -->

            <section
                class="view hidden"
                id="chatView"
                style="padding:0"
            >

                <div class="chat">

                    <div
                        class="chat-header"
                        id="chatHeader"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        class="messages"
                        id="messages"
                    ></div>

                    <div class="composer">

                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- PROFILE -->

            <section
                class="view hidden"
                id="profileView"
            >

                <div class="profile">

                    <div class="profile-card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            src=""
                        >

                        <h2>👤 Профиль</h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>🖼️ Новый аватар</p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить
                        </button>

                    </div>

                </div>

            </section>


            <!-- SETTINGS -->

            <section
                class="view hidden"
                id="settingsView"
            >

                <div class="settings">

                    <div class="settings-card">

                        <h2>⚙️ Расширенные настройки</h2>

                        <div class="setting-row">

                            <span>🌐 Язык</span>

                            <select
                                id="language"
                                onchange="saveSettings()"
                            >
                                <option value="ru">
                                    Русский
                                </option>

                                <option value="en">
                                    English
                                </option>
                            </select>

                        </div>

                        <div class="setting-row">

                            <span>🎨 Тема</span>

                            <select
                                id="theme"
                                onchange="saveSettings()"
                            >
                                <option value="dark">
                                    Тёмная
                                </option>

                                <option value="light">
                                    Светлая
                                </option>

                                <option value="blue">
                                    Синяя
                                </option>

                                <option value="midnight">
                                    Midnight
                                </option>

                            </select>

                        </div>

                        <div class="setting-row">

                            <span>🔔 Уведомления</span>

                            <input
                                type="checkbox"
                                id="notifications"
                                onchange="saveSettings()"
                            >

                        </div>

                        <div class="setting-row">

                            <span>👁️ Последний визит</span>

                            <select
                                id="privacy"
                                onchange="saveSettings()"
                            >

                                <option value="everyone">
                                    Все
                                </option>

                                <option value="nobody">
                                    Никто
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="settings-card">

                        <h2>👥 Аккаунты</h2>

                        <div
                            id="accounts"
                        ></div>

                        <button
                            class="primary"
                            onclick="addAccount()"
                        >
                            ➕ Добавить аккаунт
                        </button>

                        <br><br>

                        <button
                            class="danger"
                            onclick="logout()"
                        >
                            🚪 Выйти из аккаунта
                        </button>

                    </div>


                    <div class="settings-card">

                        <h2>👥 Группы</h2>

                        <button
                            class="primary"
                            onclick="createGroup()"
                        >
                            ➕ Создать группу
                        </button>

                        <div id="groups"></div>

                    </div>


                    <div class="settings-card">

                        <h2>📢 Каналы</h2>

                        <button
                            class="primary"
                            onclick="createChannel()"
                        >
                            ➕ Создать канал
                        </button>

                        <div id="channels"></div>

                    </div>

                </div>

            </section>


            <!-- FAVORITES -->

            <section
                class="view hidden"
                id="favoritesView"
            >

                <div class="feed">

                    <div class="settings-card">

                        <h2>📌 Избранные сообщения</h2>

                        <div id="favorites"></div>

                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<!-- PROFILE MODAL -->

<div
    class="modal hidden"
    id="profileModal"
    onclick="closeModal(event)"
>

    <div
        class="modal-card"
        id="profileModalContent"
    ></div>

</div>


<script>


// =========================================================
// CONFIG
// =========================================================

const API = "";

const DEFAULT_AVATAR =
    "https://i.imgur.com/7NFHga3.png";

let token =
    localStorage.getItem("token");

let currentUser = null;
let selectedUser = null;
let socket = null;
let replyCommentId = null;


// =========================================================
// REQUEST
// =========================================================

function api(path) {
    return API + path;
}


async function request(
    path,
    options = {}
) {

    options.headers =
        options.headers || {};

    if (token) {

        options.headers.Authorization =
            "Bearer " + token;

    }

    return fetch(
        api(path),
        options
    );
}


// =========================================================
// AUTH
// =========================================================

async function register() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/register"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok)
            throw new Error(data.detail);

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        saveAccountToken(
            username,
            token
        );

        await startApp();

    } catch (e) {

        document.getElementById(
            "authError"
        ).innerText = e.message;

    }
}


async function login() {

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    try {

        const response =
            await fetch(
                api("/api/login"),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok)
            throw new Error(data.detail);

        token = data.token;

        localStorage.setItem(
            "token",
            token
        );

        saveAccountToken(
            username,
            token
        );

        await startApp();

    } catch (e) {

        document.getElementById(
            "authError"
        ).innerText = e.message;

    }
}


// =========================================================
// START
// =========================================================

async function startApp() {

    try {

        const response =
            await request("/api/me");

        if (!response.ok) {

            localStorage.removeItem(
                "token"
            );

            token = null;

            document.getElementById(
                "auth"
            ).style.display = "block";

            return;
        }

        currentUser =
            await response.json();

        document.getElementById(
            "auth"
        ).style.display = "none";

        document.getElementById(
            "app"
        ).style.display = "flex";

        applySettings();

        connectWebSocket();

        searchUsers();

        showFeed();

    } catch {

        logout();

    }
}


// =========================================================
// ACCOUNTS
// =========================================================

function getAccounts() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "accounts"
            ) || "[]"
        );

    } catch {

        return [];

    }
}


function saveAccountToken(
    username,
    tokenValue
) {

    const accounts =
        getAccounts();

    const existing =
        accounts.find(
            x => x.username === username
        );

    if (existing) {

        existing.token = tokenValue;

    } else {

        accounts.push({
            username,
            token: tokenValue
        });

    }

    localStorage.setItem(
        "accounts",
        JSON.stringify(accounts)
    );

}


function renderAccounts() {

// =========================================================
// WEBSOCKET
// =========================================================

function connectWebSocket() {

    if (!currentUser) return;

    let base;

    if (API) {

        base = API;

    } else {

        base =
            location.protocol === "https:"
            ? "https://" + location.host
            : "http://" + location.host;

    }

    const ws =
        base
        .replace("https://", "wss://")
        .replace("http://", "ws://");

    socket =
        new WebSocket(
            ws +
            "/ws/" +
            currentUser.id
        );

    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );

            if (
                data.type === "message"
            ) {

                if (
                    selectedUser &&
                    (
                        (
                            data.message.sender_id ===
                            currentUser.id &&
                            data.message.receiver_id ===
                            selectedUser.id
                        )
                        ||
                        (
                            data.message.sender_id ===
                            selectedUser.id &&
                            data.message.receiver_id ===
                            currentUser.id
                        )
                    )
                ) {

                    renderMessage(
                        data.message
                    );

                }

            }

            if (
                data.type ===
                "message_edited"
            ) {

                if (
                    selectedUser
                ) {

                    loadMessages();

                }

            }

            if (
                data.type ===
                "message_deleted"
            ) {

                if (
                    selectedUser
                ) {

                    loadMessages();

                }

            }

        };

    socket.onclose =
        () => {

            setTimeout(
                connectWebSocket,
                3000
            );

        };

}

function renderMessage(message) {

    const container =
        document.getElementById(
            "messages"
        );

    const row =
        document.createElement(
            "div"
        );

    const mine =
        message.sender_id ===
        currentUser.id;

    row.className =
        "message-row " +
        (
            mine
            ? "mine"
            : ""
        );

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message";

    if (message.is_deleted)
        bubble.classList.add(
            "deleted"
        );

    let actions = "";

    if (mine && !message.is_deleted) {

        actions = `

            <div class="message-actions">

                <button
                    onclick="editMessage(${message.id}, '${escapeJs(message.text)}')"
                >
                    ✏️
                </button>

                <button
                    onclick="deleteMessage(${message.id})"
                >
                    🗑️
                </button>

                <button
                    onclick="copyText('${escapeJs(message.text)}')"
                >
                    📋
                </button>

                <button
                    onclick="favoriteMessage(${message.id})"
                >
                    📌
                </button>

            </div>
        `;

    } else if (!message.is_deleted) {

        actions = `

            <div class="message-actions">

                <button
                    onclick="copyText('${escapeJs(message.text)}')"
                >
                    📋
                </button>

                <button
                    onclick="favoriteMessage(${message.id})"
                >
                    📌
                </button>

            </div>
        `;

    }

    const date =
        new Date(
            message.created_at
        );

    bubble.innerHTML = `

        ${actions}

        <div class="message-text">
            ${escapeHtml(
                message.text
            )}
        </div>

        <div class="message-time">

            ${date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            )}

            ${
                message.edited_at &&
                !message.is_deleted
                ? " · изменено"
                : ""
            }

            ${
                mine
                ? " ✓✓"
                : ""
            }

        </div>
    `;

    row.appendChild(
        bubble
    );

    container.appendChild(
        row
    );

    container.scrollTop =
        container.scrollHeight;

}

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify(data)
            }
        );

    if (response.ok) {

        Object.assign(
            currentUser,
            data
        );

        applySettings();

    }

}


function applySettings() {

    document.body.classList.remove(
        "light",
        "blue",
        "midnight"
    );

    if (
        currentUser &&
        currentUser.theme !==
        "dark"
    ) {

        document.body.classList.add(
            currentUser.theme
        );

    }

    if (
        currentUser &&
        currentUser.language ===
        "en"
    ) {

        document.documentElement.lang =
            "en";

    } else {

        document.documentElement.lang =
            "ru";

    }

}

// =========================================================

async function createGroup() {

    const title =
        prompt(
            "Название группы:"
        );

    if (!title)
        return;

    const description =
        prompt(
            "Описание группы:"
        ) || "";

    const response =
        await request(
            "/api/groups",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    title,
                    description
                })
            }
        );

    if (!response.ok) {

        const data =
            await response.json();

        alert(data.detail);

        return;

    }

    loadGroups();

}


async function loadGroups() {

    const response =
        await request(
            "/api/groups"
        );

    if (!response.ok)
        return;

    const groups =
        await response.json();

    const container =
        document.getElementById(
            "groups"
        );

    container.innerHTML = "";

    groups.forEach(
        group => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "comment";

            div.innerHTML = `
                👥 <b>
                    ${escapeHtml(
                        group.title
                    )}
                </b>
                <br>
                <small>
                    ${escapeHtml(
                        group.description || ""
                    )}
                </small>
            `;

            container.appendChild(
                div
            );

        }
    );

}

// =========================================================

// =========================================================

function hideViews() {

    document
        .querySelectorAll(".view")
        .forEach(
            view =>
                view.classList.add(
                    "hidden"
                )
        );

}


// =========================================================
// CLIPBOARD
// =========================================================

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(
            text
        );

        alert(
            "Скопировано!"
        );

    } catch {

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value =
            text;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

    }

}


// =========================================================
// HELPERS
// =========================================================

function mediaUrl(url) {

    if (!url)
        return "";

    if (
        url.startsWith("http")
    )
        return url;

    return API + url;

}


function escapeHtml(text) {

    return String(text ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeAttr(text) {

    return escapeHtml(text)
        .replaceAll(
            "`",
            "&#096;"
        );

}


function escapeJs(text) {

    return String(text ?? "")
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        )
        .replaceAll(
            "\n",
            "\\n"
        )
        .replaceAll(
            "\r",
            "\\r"
        );

}
