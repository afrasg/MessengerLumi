<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Messenger Lumi</title>
<style>
:root {
    --bg: #101114;
    --card: #1a1c22;
    --border: #2a2d36;
    --text: #f0f2f5;
    --muted: #9095a3;
    --accent: #6c5ce7;
    --danger: #e74c3c;
    --success: #2ecc71;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}
.hidden { display: none !important; }
#app { display: flex; height: 100vh; }
.auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100%;
}
.auth-card {
    background: var(--card);
    padding: 32px;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--border);
}
.auth-card h1 { text-align: center; margin-bottom: 24px; font-size: 24px; }
.auth-card input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    font-size: 15px;
}
.auth-card button { width: 100%; margin-top: 8px; }
.error { color: var(--danger); font-size: 13px; margin-top: 12px; text-align: center; }
.sidebar {
    width: 280px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}
.logo {
    padding: 18px 16px;
    font-weight: 700;
    font-size: 18px;
    border-bottom: 1px solid var(--border);
}
.search {
    margin: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    font-size: 14px;
}
.users { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.user-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
}
.user-item:hover { background: #252830; }
.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #2a2d36;
    flex-shrink: 0;
    cursor: pointer;
}
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
}
.top-actions { display: flex; gap: 6px; }
.icon-button {
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
}
.icon-button:hover { background: #252830; }
.content { flex: 1; overflow-y: auto; }
.view { padding: 20px; }
.feed { max-width: 640px; margin: 0 auto; }
.post-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
}
.post-box textarea {
    width: 100%;
    min-height: 80px;
    background: #12141a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    resize: vertical;
    font-size: 15px;
    margin-bottom: 12px;
}
.post-tools { display: flex; gap: 10px; flex-wrap: wrap; }
.post {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
}
.post-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}
.post-head .avatar { cursor: pointer; }
.post-author { cursor: pointer; }
.post-author:hover strong { text-decoration: underline; }
.post-text { margin-bottom: 12px; white-space: pre-wrap; line-height: 1.45; }
.post-media {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 12px;
    max-height: 420px;
    object-fit: contain;
    background: #000;
}
.post-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}
.post-actions button {
    background: #252830;
    border: none;
    color: var(--text);
    padding: 7px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}
.post-actions button:hover { background: #2f333d; }
.comments-section {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
}
.comment {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    padding: 8px;
    border-radius: 10px;
    background: #16181e;
}
.comment .avatar { width: 32px; height: 32px; }
.comment-body { flex: 1; min-width: 0; }
.comment-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.comment-text { font-size: 14px; white-space: pre-wrap; }
.comment-actions { margin-top: 4px; }
.comment-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    margin-right: 10px;
}
.comment-actions button:hover { color: var(--text); }
.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}
.comment-form input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    font-size: 14px;
}
.primary, .secondary, .send, .danger-button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
}
.primary { background: var(--accent); color: #fff; }
.primary:hover { filter: brightness(1.1); }
.secondary { background: #252830; color: var(--text); }
.send { background: var(--accent); color: #fff; white-space: nowrap; }
.danger-button { background: transparent; color: var(--danger); border: 1px solid var(--danger); width: 100%; margin-top: 8px; }
.chat { display: flex; flex-direction: column; height: 100%; }
.chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    font-weight: 600;
}
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.message {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    position: relative;
}
.message.mine {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
}
.message.theirs {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
}
.message.deleted { opacity: .6; font-style: italic; }
.composer {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--card);
}
.composer input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    font-size: 15px;
}
.profile { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
}
.card h2, .card h3 { margin-bottom: 16px; }
.card input, .card textarea, .card select {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    font-size: 14px;
}
.card textarea { min-height: 90px; resize: vertical; }
.big-avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    background: #2a2d36;
    display: block;
    margin: 0 auto 16px;
}
.setting { margin-bottom: 14px; }
.setting label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
}
.modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
}
.modal h2 { margin-bottom: 16px; }
.modal input, .modal textarea {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
}
.user-profile-modal .big-avatar { margin-bottom: 12px; }
.user-profile-modal .bio { color: var(--muted); margin: 12px 0; white-space: pre-wrap; }
.user-profile-modal .meta { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #2ecc71;
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 720px) {
    .sidebar { width: 72px; }
    .logo { font-size: 0; padding: 14px; }
    .logo::before { content: "💬"; font-size: 22px; }
    .search { display: none; }
    .user-item span, .user-item div:last-child { display: none; }
}
</style>
</head>
<body>
<div id="authScreen" class="auth-screen">
    <div class="auth-card">
        <h1>💬 Messenger Lumi</h1>
        <input id="username" placeholder="Username" autocomplete="username">
        <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
        <button class="primary" onclick="login()">Войти</button>
        <button class="secondary" onclick="register()">Создать аккаунт</button>
        <p id="authError" class="error"></p>
    </div>
</div>

<div id="app" class="hidden">
    <aside class="sidebar">
        <div class="logo">💬 Messenger Lumi</div>
        <input id="search" class="search" placeholder="Поиск..." oninput="searchUsers()">
        <div id="users" class="users"></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <strong id="pageTitle">📰 Лента</strong>
            <div class="top-actions">
                <button class="icon-button" onclick="showFeed()" title="Лента">📰</button>
                <button class="icon-button" onclick="showFavorites()" title="Избранное">⭐</button>
                <button class="icon-button" onclick="showSettings()" title="Настройки">⚙️</button>
                <button class="icon-button" onclick="showProfile()" title="Профиль">👤</button>
            </div>
        </div>

        <div class="content">
            <!-- FEED -->
            <section id="feedView" class="view">
                <div class="feed">
                    <div class="post-box">
                        <textarea id="postText" placeholder="Что нового?"></textarea>
                        <div class="post-tools">
                            <button class="primary" onclick="publishPost()">📝 Опубликовать</button>
                            <label class="primary" style="cursor:pointer;display:inline-flex;align-items:center;">
                                📷 Фото / видео
                                <input id="mediaFile" type="file" accept="image/*,video/*" hidden onchange="publishMediaPost()">
                            </label>
                        </div>
                    </div>
                    <div id="feed"></div>
                </div>
            </section>

            <!-- CHAT -->
            <section id="chatView" class="view hidden" style="padding:0">
                <div class="chat">
                    <div id="chatHeader" class="chat-header">Выберите пользователя</div>
                    <div id="messages" class="messages"></div>
                    <div class="composer">
                        <input id="messageInput" placeholder="Сообщение..." onkeydown="messageKey(event)">
                        <button class="send" onclick="sendMessage()">Отправить ➤</button>
                    </div>
                </div>
            </section>

            <!-- PROFILE -->
            <section id="profileView" class="view hidden">
                <div class="profile">
                    <div class="card">
                        <img id="bigAvatar" class="big-avatar" alt="">
                        <h2>👤 Профиль</h2>
                        <input id="profileUsername" placeholder="Username">
                        <input id="profileName" placeholder="Имя">
                        <textarea id="profileBio" placeholder="О себе"></textarea>
                        <p style="margin-bottom:8px">🖼️ Аватар</p>
                        <input id="avatarFile" type="file" accept="image/*">
                        <button class="primary" onclick="saveProfile()">Сохранить</button>
                    </div>
                    <div class="card">
                        <h3>👥 Аккаунт</h3>
                        <button class="primary" style="width:100%" onclick="openCreateAccount()">➕ Добавить аккаунт</button>
                        <button class="primary" style="width:100%;margin-top:8px" onclick="switchAccount()">🔄 Переключить аккаунт</button>
                        <button class="danger-button" onclick="logout()">🚪 Выйти</button>
                        <button class="danger-button" onclick="deleteAccount()">🗑️ Удалить этот аккаунт</button>
                    </div>
                </div>
            </section>

            <!-- SETTINGS -->
            <section id="settingsView" class="view hidden">
                <div class="profile">
                    <div class="card">
                        <h2>⚙️ Настройки</h2>
                        <div class="setting">
                            <label>
                                <span>🌐 Язык</span>
                                <select id="language" onchange="saveSettings()">
                                    <option value="ru">Русский</option>
                                    <option value="en">English</option>
                                    <option value="be">Беларуская</option>
                                    <option value="kk">Қазақша</option>
                                </select>
                            </label>
                        </div>
                        <div class="setting">
                            <label>
                                <span>🎨 Тема</span>
                                <select id="theme" onchange="saveSettings()">
                                    <option value="dark">Тёмная</option>
                                    <option value="light">Светлая</option>
                                    <option value="blue">Синяя</option>
                                </select>
                            </label>
                        </div>
                        <div class="setting">
                            <label>
                                🔔 Уведомления
                                <input id="notifications" type="checkbox" onchange="saveSettings()">
                            </label>
                        </div>
                        <div class="setting">
                            <label>
                                🟢 Показывать онлайн
                                <input id="showOnline" type="checkbox" onchange="saveSettings()">
                            </label>
                        </div>
                        <div class="setting">
                            <label>
                                🕒 Показывать время последнего визита
                                <input id="showLastSeen" type="checkbox" onchange="saveSettings()">
                            </label>
                        </div>
                    </div>
                    <div class="card">
                        <h3>👥 Группы</h3>
                        <button class="primary" onclick="openCreateGroup()">➕ Создать группу</button>
                        <div id="groups" style="margin-top:12px"></div>
                    </div>
                    <div class="card">
                        <h3>📢 Каналы</h3>
                        <button class="primary" onclick="openCreateChannel()">➕ Создать канал</button>
                        <div id="channels" style="margin-top:12px"></div>
                    </div>
                </div>
            </section>

            <!-- FAVORITES -->
            <section id="favoritesView" class="view hidden">
                <div class="profile">
                    <div class="card">
                        <h2>⭐ Избранные сообщения</h2>
                        <div id="favorites"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>

<div id="modalBg" class="modal-bg hidden" onclick="closeModal(event)">
    <div id="modal" class="modal" onclick="event.stopPropagation()"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const API = "";
let token = localStorage.getItem("token") || "";
let currentUser = null;
let selectedUserId = null;
let selectedMessageId = null;
let ws = null;

/* =====================================================
   AUTH
===================================================== */

async function checkAuth() {
    if (!token) {
        showAuth();
        return;
    }
    try {
        const response = await request("/api/me");
        if (!response.ok) {
            token = "";
            localStorage.removeItem("token");
            showAuth();
            return;
        }
        currentUser = await safeJson(response);
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");
        await loadSettings();
        await searchUsers();
        showFeed();
        connectWebSocket();
    } catch (e) {
        showAuth();
    }
}

function showAuth() {
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
}

async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("authError");
    errorEl.textContent = "";

    const response = await fetch(API + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const data = await safeJson(response);
    if (!response.ok) {
        errorEl.textContent = data.detail || "Ошибка входа";
        return;
    }
    // cookie-based, но на всякий случай сохраняем флаг
    token = "cookie";
    localStorage.setItem("token", token);
    location.reload();
}

async function register() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("authError");
    errorEl.textContent = "";

    const response = await fetch(API + "/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
    });
    const data = await safeJson(response);
    if (!response.ok) {
        errorEl.textContent = data.detail || "Ошибка регистрации";
        return;
    }
    token = "cookie";
    localStorage.setItem("token", token);
    location.reload();
}

/* =====================================================
   REQUEST HELPERS
===================================================== */

async function request(url, options = {}) {
    const opts = { ...options, credentials: "include" };
    if (!opts.headers) opts.headers = {};
    return fetch(API + url, opts);
}

async function safeJson(response) {
    try {
        return await response.json();
    } catch {
        return {};
    }
}

/* =====================================================
   USERS / SEARCH
===================================================== */

async function searchUsers() {
    const q = document.getElementById("search").value.trim();
    const response = await request("/api/users?q=" + encodeURIComponent(q));
    if (!response.ok) return;
    const users = await safeJson(response);
    const container = document.getElementById("users");
    container.innerHTML = "";

    users.forEach(user => {
        const div = document.createElement("div");
        div.className = "user-item";
        div.onclick = () => openChat(user);

        const img = document.createElement("img");
        img.className = "avatar";
        if (user.avatar_url) img.src = mediaUrl(user.avatar_url);
        img.onclick = (e) => {
            e.stopPropagation();
            openUserProfile(user.id);
        };

        const info = document.createElement("div");
        info.innerHTML =
            "<strong>" + escapeHtml(user.display_name || user.username) + "</strong>" +
            "<div style='color:#9095a3;font-size:12px'>@" + escapeHtml(user.username) + "</div>";

        div.appendChild(img);
        div.appendChild(info);
        container.appendChild(div);
    });
}

async function openChat(user) {
    selectedUserId = user.id;
    showOnly("chatView");
    document.getElementById("pageTitle").textContent = "💬 Чат";
    document.getElementById("chatHeader").textContent =
        (user.display_name || user.username) + " (@" + user.username + ")";
    await loadMessages(user.id);
}

async function loadMessages(otherId) {
    const response = await request("/api/messages/" + otherId);
    if (!response.ok) return;
    const messages = await safeJson(response);
    const container = document.getElementById("messages");
    container.innerHTML = "";

    messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = "message " + (msg.sender_id === currentUser.id ? "mine" : "theirs");
        if (msg.deleted) {
            div.classList.add("deleted");
            div.textContent = "Сообщение удалено";
        } else {
            div.textContent = msg.text;
            if (msg.sender_id === currentUser.id) {
                div.oncontextmenu = (e) => {
                    e.preventDefault();
                    selectedMessageId = msg.id;
                    openModal(`
                        <h2>Сообщение</h2>
                        <button class="primary" style="width:100%;margin-bottom:8px" onclick="editSelectedMessage()">✏️ Изменить</button>
                        <button class="danger-button" onclick="deleteSelectedMessage()">🗑️ Удалить</button>
                    `);
                };
            }
        }
        container.appendChild(div);
    });
    scrollMessages();
}

function messageKey(e) {
    if (e.key === "Enter") sendMessage();
}

async function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text || !selectedUserId) return;

    const response = await request("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ receiver_id: selectedUserId, text })
    });
    if (response.ok) {
        input.value = "";
        await loadMessages(selectedUserId);
    }
}

function editSelectedMessage() {
    openModal(`
        <h2>Изменить сообщение</h2>
        <textarea id="editText" style="width:100%;min-height:100px;padding:10px;border-radius:10px;border:1px solid #2a2d36;background:#12141a;color:#fff"></textarea>
        <button class="primary" style="margin-top:10px;width:100%" onclick="saveEditedMessage()">Сохранить</button>
    `);
}

async function saveEditedMessage() {
    const text = document.getElementById("editText").value.trim();
    if (!text) return;
    const response = await request("/api/messages/" + selectedMessageId, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
    });
    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Ошибка");
        return;
    }
    closeModal();
    await loadMessages(selectedUserId);
}

async function deleteSelectedMessage() {
    if (!selectedMessageId) return;
    if (!confirm("Удалить сообщение?")) return;
    const response = await request("/api/messages/" + selectedMessageId, { method: "DELETE" });
    if (!response.ok) {
        const data = await safeJson(response);
        alert(data.detail || "Ошибка");
        return;
    }

}

/* =====================================================
   FEED + POSTS + COMMENTS + SHARE
===================================================== */

async function loadFeed() {
    const response = await request("/api/feed");
    if (!response.ok) return;
    const posts = await safeJson(response);
    const container = document.getElementById("feed");
    container.innerHTML = "";
    posts.forEach(renderPost);
}

function renderPost(post) {
    const container = document.getElementById("feed");
    const article = document.createElement("article");
    article.className = "post";
    article.dataset.postId = post.id;

    // HEAD
    const head = document.createElement("div");
    head.className = "post-head";

    const avatar = document.createElement("img");
    avatar.className = "avatar";
    if (post.avatar_url) avatar.src = mediaUrl(post.avatar_url);
    avatar.title = "Открыть профиль";
    avatar.onclick = () => openUserProfile(post.author_id);

    const author = document.createElement("div");
    author.className = "post-author";
    author.onclick = () => openUserProfile(post.author_id);
    author.innerHTML =
        "<strong>" + escapeHtml(post.display_name || post.username) + "</strong>" +
        "<div style='color:#9095a3;font-size:12px'>@" + escapeHtml(post.username) + "</div>";

    head.appendChild(avatar);
    head.appendChild(author);
    article.appendChild(head);

    // TEXT
    if (post.text) {
        const text = document.createElement("div");
        text.className = "post-text";
        text.textContent = post.text;
        article.appendChild(text);
    }

    // MEDIA
    if (post.media_url) {
        if (post.media_type === "video") {
            const video = document.createElement("video");
            video.className = "post-media";
            video.controls = true;
            video.src = mediaUrl(post.media_url);
            article.appendChild(video);
        } else {
            const img = document.createElement("img");
            img.className = "post-media";
            img.src = mediaUrl(post.media_url);
            article.appendChild(img);
        }
    }

    // ACTIONS
    const actions = document.createElement("div");
    actions.className = "post-actions";

    // Like
    const like = document.createElement("button");
    like.textContent = "❤️ " + (post.likes || 0);
    like.onclick = async () => {
        const response = await request("/api/posts/" + post.id + "/like", { method: "POST" });
        const data = await safeJson(response);
        if (response.ok) like.textContent = "❤️ " + data.likes;
    };
    actions.appendChild(like);

    // Comments toggle
    const commentsBtn = document.createElement("button");
    commentsBtn.textContent = "💬 " + (post.comments || 0);
    commentsBtn.onclick = () => toggleComments(article, post.id, commentsBtn);
    actions.appendChild(commentsBtn);

    // Copy link
    const copyBtn = document.createElement("button");
    copyBtn.textContent = "🔗 Копировать";
    copyBtn.onclick = () => copyPostLink(post.id);
    actions.appendChild(copyBtn);

    // Share
    const shareBtn = document.createElement("button");
    shareBtn.textContent = "📤 Поделиться";
    shareBtn.onclick = () => sharePost(post);
    actions.appendChild(shareBtn);

    // Delete (own)
    if (Number(post.author_id) === Number(currentUser.id)) {
        const del = document.createElement("button");
        del.textContent = "🗑️";
        del.onclick = async () => {
            if (!confirm("Удалить пост?")) return;
            const response = await request("/api/posts/" + post.id, { method: "DELETE" });
            if (response.ok) article.remove();
        };
        actions.appendChild(del);
    }

    article.appendChild(actions);

    // Comments container (hidden by default)
    const commentsSection = document.createElement("div");
    commentsSection.className = "comments-section hidden";
    commentsSection.id = "comments-" + post.id;
    article.appendChild(commentsSection);

    container.appendChild(article);
}

function getPostLink(postId) {
    return location.origin + location.pathname + "#post/" + postId;
}

function copyPostLink(postId) {
    const link = getPostLink(postId);
    navigator.clipboard.writeText(link).then(() => {
        showToast("Ссылка скопирована");
    }).catch(() => {
        prompt("Скопируй ссылку:", link);
    });
}

async function sharePost(post) {
    const link = getPostLink(post.id);
    const text = (post.text || "").slice(0, 100) + (post.text && post.text.length > 100 ? "…" : "");
    if (navigator.share) {
        try {
            await navigator.share({
                title: "Пост в Messenger Lumi",
                text: text || "Смотри пост",
                url: link
            });
        } catch (e) {
            if (e.name !== "AbortError") copyPostLink(post.id);
        }
    } else {
        copyPostLink(post.id);
    }
}

async function toggleComments(article, postId, btn) {
    const section = article.querySelector("#comments-" + postId);
    if (!section) return;

    if (!section.classList.contains("hidden")) {
        section.classList.add("hidden");
        return;
    }

    section.classList.remove("hidden");
    section.innerHTML = "<div style='color:#9095a3;font-size:13px'>Загрузка…</div>";

    const response = await request("/api/posts/" + postId + "/comments");
    if (!response.ok) {
        section.innerHTML = "<div style='color:#e74c3c'>Не удалось загрузить комментарии</div>";
        return;
    }
    const comments = await safeJson(response);
    renderComments(section, postId, comments, btn);
}

function renderComments(section, postId, comments, countBtn) {
    section.innerHTML = "";

    const list = document.createElement("div");
    comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment";

        const av = document.createElement("img");
        av.className = "avatar";
        if (c.avatar_url) av.src = mediaUrl(c.avatar_url);
        av.onclick = () => openUserProfile(c.user_id);

        const body = document.createElement("div");
        body.className = "comment-body";

        let replyInfo = "";
        if (c.parent_id && c.reply_to_username) {
            replyInfo = " → @" + escapeHtml(c.reply_to_username);
        }

        body.innerHTML =
            "<div class='comment-meta'>" +
            "<strong style='cursor:pointer' onclick='openUserProfile(" + c.user_id + ")'>" +
            escapeHtml(c.display_name || c.username) + "</strong> " +
            "<span style='color:#9095a3'>@" + escapeHtml(c.username) + replyInfo + "</span> · " +
            formatTime(c.created_at) +
            "</div>" +
            "<div class='comment-text'>" + escapeHtml(c.text) + "</div>";

        const actions = document.createElement("div");
        actions.className = "comment-actions";

        const replyBtn = document.createElement("button");
        replyBtn.textContent = "Ответить";
        replyBtn.onclick = () => {
            const input = section.querySelector(".comment-input");
            if (input) {
                input.dataset.parentId = c.id;
                input.placeholder = "Ответ @" + c.username + "…";
                input.focus();
            }
        };
        actions.appendChild(replyBtn);

        if (Number(c.user_id) === Number(currentUser.id)) {
            const delBtn = document.createElement("button");
            delBtn.textContent = "Удалить";
            delBtn.onclick = async () => {
                if (!confirm("Удалить комментарий?")) return;
                const res = await request("/api/comments/" + c.id, { method: "DELETE" });
                if (res.ok) {
                    // перезагружаем комментарии
                    const r2 = await request("/api/posts/" + postId + "/comments");
                    if (r2.ok) {
                        const fresh = await safeJson(r2);
                        renderComments(section, postId, fresh, countBtn);
                        if (countBtn) countBtn.textContent = "💬 " + fresh.length;
                    }
                }
            };
            actions.appendChild(delBtn);
        }

        body.appendChild(actions);
        div.appendChild(av);
        div.appendChild(body);
        list.appendChild(div);
    });

    section.appendChild(list);

    // form
    const form = document.createElement("div");
    form.className = "comment-form";

    const input = document.createElement("input");
    input.className = "comment-input";
    input.placeholder = "Написать комментарий…";
    input.dataset.parentId = "";

    const sendBtn = document.createElement("button");
    sendBtn.className = "primary";
    sendBtn.textContent = "➤";
    sendBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text) return;
        const parentId = input.dataset.parentId ? Number(input.dataset.parentId) : null;

        const response = await request("/api/posts/" + postId + "/comments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, parent_id: parentId })
        });
        if (!response.ok) {
            const data = await safeJson(response);
            alert(data.detail || "Ошибка");
            return;
        }
        input.value = "";
        input.dataset.parentId = "";
        input.placeholder = "Написать комментарий…";

        const r2 = await request("/api/posts/" + postId + "/comments");
        if (r2.ok) {
            const fresh = await safeJson(r2);
            renderComments(section, postId, fresh, countBtn);
            if (countBtn) countBtn.textContent = "💬 " + fresh.length;
        }
    };

    input.onkeydown = (e) => {
        if (e.key === "Enter") sendBtn.onclick();
    };

    form.appendChild(input);
    form.appendChild(sendBtn);
    section.appendChild(form);
}

async function publishPost() {
    const textarea = document.getElementById("postText");
    const text = textarea.value.trim();
    if (!text) return;

    const response = await request("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
    });
    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Ошибка");
        return;
    }
    textarea.value = "";
    await loadFeed();
}

async function publishMediaPost() {
    const fileInput = document.getElementById("mediaFile");
    const file = fileInput.files[0];
    if (!file) return;

    const text = document.getElementById("postText").value.trim();
    const form = new FormData();
    form.append("text", text);
    form.append("file", file);

    const response = await request("/api/posts/media", {
        method: "POST",
        body: form
    });
    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Ошибка загрузки");
        return;

    document.getElementById("postText").value = "";
    fileInput.value = "";
    await loadFeed();
}

async function openUserProfile(userId) {
    const response = await request("/api/users/" + userId);
    if (!response.ok) {
        alert("Пользователь не найден");
        return;
    }
    const user = await safeJson(response);

    const avatarHtml = user.avatar_url
        ? `<img class="big-avatar" src="${mediaUrl(user.avatar_url)}" alt="">`
        : `<div class="big-avatar" style="display:flex;align-items:center;justify-content:center;font-size:36px;background:#2a2d36">👤</div>`;

    const created = user.created_at ? formatDate(user.created_at) : "—";
    const lastSeen = user.last_seen ? formatDate(user.last_seen) : "—";

    openModal(`
        <div class="user-profile-modal">
            ${avatarHtml}
            <h2 style="text-align:center;margin-bottom:4px">${escapeHtml(user.display_name || user.username)}</h2>
            <div style="text-align:center;color:#9095a3;margin-bottom:12px">@${escapeHtml(user.username)}</div>
            ${user.bio ? `<div class="bio">${escapeHtml(user.bio)}</div>` : ""}
            <div class="meta">
                📅 Регистрация: ${created}<br>
                🕒 Был(а): ${lastSeen}
            </div>
            ${Number(user.id) !== Number(currentUser.id) ? `
                <button class="primary" style="width:100%" onclick="startChatFromProfile(${user.id}, '${escapeHtml(user.display_name || user.username)}', '${escapeHtml(user.username)}')">
                    💬 Написать сообщение
                </button>
            ` : `
                <button class="secondary" style="width:100%" onclick="closeModal(); showProfile()">
                    Редактировать свой профиль
                </button>
            `}
        </div>
    `);
}

function startChatFromProfile(id, displayName, username) {
    closeModal();
    openChat({ id, display_name: displayName, username });
}

async function saveProfile() {
    const username = document.getElementById("profileUsername").value.trim();
    const display_name = document.getElementById("profileName").value.trim();
    const bio = document.getElementById("profileBio").value.trim();

    const response = await request("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, display_name, bio })
    });
    const data = await safeJson(response);
    if (!response.ok) {
        alert(data.detail || "Ошибка");
        return;
    }

    const file = document.getElementById("avatarFile").files[0];
    if (file) {
        const form = new FormData();
        form.append("file", file);
        const avatarResponse = await request("/api/avatar", { method: "POST", body: form });
        if (!avatarResponse.ok) {
            const avatarData = await safeJson(avatarResponse);
            alert(avatarData.detail || "Ошибка аватара");
            return;
        }
    }

    alert("Профиль сохранён");
    location.reload();
}

    document.getElementById("theme").value = data.theme || "dark";

    document.getElementById("showOnline").checked = Boolean(data.show_online);
    document.getElementById("showLastSeen").checked = Boolean(data.show_last_seen);

async function saveSettings() {
    const data = {
        language: document.getElementById("language").value,
        theme: document.getElementById("theme").value,
        notifications: document.getElementById("notifications").checked,
        show_online: document.getElementById("showOnline").checked,
        show_last_seen: document.getElementById("showLastSeen").checked

    await request("/api/settings", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

function applyTheme(theme) {
    if (theme === "light") {
        document.body.style.background = "#f1f3f7";
        document.body.style.color = "#111";
    } else if (theme === "blue") {
        document.body.style.background = "#081421";
        document.body.style.color = "#fff";
    } else {
        document.body.style.background = "#101114";
        document.body.style.color = "#fff";
    }
}

/* =====================================================
   HELPERS
===================================================== */

function scrollMessages() {
    const container = document.getElementById("messages");
    container.scrollTop = container.scrollHeight;
}

function mediaUrl(url) {
    if (!url) return "";
    if (url.startsWith("http://") || url.startsWith("https://")) return url;
    return API + url;
}

function escapeHtml(text) {
    return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatTime(value) {
    if (!value) return "";
    let date = new Date(value);
    if (Number.isNaN(date.getTime())) date = new Date(value + "Z");
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function formatDate(value) {
    if (!value) return "";
    let date = new Date(value);
    if (Number.isNaN(date.getTime())) date = new Date(value + "Z");
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString([], {
        day: "2-digit", month: "2-digit", year: "numeric",
        hour: "2-digit", minute: "2-digit"
    });
}
