                    body: form
                });
                if (r.ok) alert("Аватар группы обновлён");
                else alert("Ошибка");
            };
            input.click();
        }

        // ============================================================
        // ЗВОНКИ (WEBRTC)
        // ============================================================

        let pc = null;
        let localStream = null;
        let callTargetId = null;
        let callIsVideo = false;
        let micMuted = false;
        let peerMuted = false;
        let callStartTime = null;
        let callDurationInterval = null;
        let incomingCallData = null;
        let isCaller = false;

        async function startCall(video) {
            if (!selectedUserId) return;
            if (callTargetId) {
                alert("Уже есть активный звонок");
                return;
            }
            isCaller = true;
            callIsVideo = !!video;
            callTargetId = selectedUserId;
            showCallOverlay();
            try {
                const res = await request("/api/users/" + selectedUserId);
                if (res.ok) {
                    const user = await safeJson(res);
                    document.getElementById("callTitle").textContent = user.display_name || user.username;
                    const avatar = document.getElementById("callAvatar");
                    if (user.avatar_url) avatar.src = mediaUrl(user.avatar_url);
                    else avatar.src = "";
                }
            } catch {}
            document.getElementById("callStatus").textContent = "Вызов...";
            document.getElementById("callDuration").textContent = "00:00";
            await request("/api/calls/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    target_id: callTargetId,
                    signal_type: "offer-request",
                    payload: { video: callIsVideo }
                })
            });
            playCallRing();
            await setupCall(true);
        }

        async function setupCall(isCallerSide) {
            try {
                if (!callTargetId) return;
                const constraints = { audio: true };
                if (callIsVideo) {
                    constraints.video = { width: { ideal: 640 }, height: { ideal: 480 } };
                }
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (callIsVideo) {
                    const localVideo = document.getElementById("localVideo");
                    localVideo.srcObject = localStream;
                    localVideo.style.display = "block";
                }
                const config = {
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" },
                        { urls: "stun:stun1.l.google.com:19302" }
                    ]
                };
                pc = new RTCPeerConnection(config);
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
                pc.ontrack = (event) => {
                    const remoteStream = event.streams[0];
                    if (remoteStream) {
                        if (callIsVideo) {
                            const remoteVideo = document.getElementById("remoteVideo");
                            remoteVideo.srcObject = remoteStream;
                            remoteVideo.style.display = "block";
                        } else {
                            const remoteAudio = document.getElementById("remoteAudio");
                            remoteAudio.srcObject = remoteStream;
                        }
                        document.getElementById("callStatus").textContent = "В разговоре";
                        startCallDuration();
                    }
                };
                pc.onicecandidate = (event) => {
                    if (event.candidate && callTargetId) {
                        request("/api/calls/signal", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                target_id: callTargetId,
                                signal_type: "ice",
                                payload: { candidate: event.candidate }
                            })
                        }).catch(() => {});
                    }
                };
                pc.oniceconnectionstatechange = () => {
                    if (pc) {
                        const state = pc.iceConnectionState;
                        if (state === "connected" || state === "completed") {
                            document.getElementById("callStatus").textContent = "Соединено";
                        } else if (state === "disconnected" || state === "failed") {
                            if (document.getElementById("callStatus").textContent !== "Завершено") {
                                document.getElementById("callStatus").textContent =
                                    "Соединение потеряно";
                                setTimeout(() => endCall(true), 3000);
                            }
                        }
                    }
                };
                if (isCallerSide) {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    await request("/api/calls/signal", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            target_id: callTargetId,
                            signal_type: "offer",
                            payload: { sdp: offer, video: callIsVideo }
                        })
                    });
                }
            } catch (err) {
                console.error("setupCall error:", err);
                alert("Ошибка доступа к микрофону/камере");
                endCall(true);
            }
        }

        async function handleCallSignal(data) {
            const fromId = data.from_id;
            const signalType = data.signal_type;
            const payload = data.payload || {};
            if (fromId === currentUser?.id) return;
            if (signalType === "offer-request") {
                if (callTargetId) {
                    await request("/api/calls/signal", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            target_id: fromId,
                            signal_type: "busy",
                            payload: {}
                        })
                    });
                    return;
                }
                incomingCallData = { fromId: fromId, video: payload.video || false };
                try {
                    const res = await request("/api/users/" + fromId);
                    if (res.ok) {
                        const user = await safeJson(res);
                        document.getElementById("incomingCallTitle").textContent = user.display_name ||
                            user.username;
                        const avatar = document.getElementById("incomingCallAvatar");
                        if (user.avatar_url) avatar.src = mediaUrl(user.avatar_url);
                        else avatar.src = "";
                        document.getElementById("incomingCallSub").textContent = (payload.video ?
                            "📹 Видеозвонок" : "🎧 Аудиозвонок") + " от " + (user.display_name ||
                            user.username);
                    }
                } catch {}
                document.getElementById("incomingCallOverlay").classList.remove("hidden");
                playCallRing();
                setTimeout(() => {
                    if (document.getElementById("incomingCallOverlay").classList.contains("hidden"))
                        return;
                    declineIncomingCall();
                }, 30000);
                return;
            }
            if (signalType === "busy") {
                stopCallRing();
                document.getElementById("callStatus").textContent = "Абонент занят";
                setTimeout(() => endCall(true), 2000);
                return;
            }
            if (signalType === "offer") {
                if (!incomingCallData) return;
                isCaller = false;
                callTargetId = fromId;
                callIsVideo = payload.video || false;
                document.getElementById("incomingCallOverlay").classList.add("hidden");
                stopCallRing();
                showCallOverlay();
                try {
                    const res = await request("/api/users/" + fromId);
                    if (res.ok) {
                        const user = await safeJson(res);
                        document.getElementById("callTitle").textContent = user.display_name || user
                            .username;
                        const avatar = document.getElementById("callAvatar");
                        if (user.avatar_url) avatar.src = mediaUrl(user.avatar_url);
                        else avatar.src = "";
                    }
                } catch {}
                document.getElementById("callStatus").textContent = "Соединение...";
                await setupCall(false);
                if (pc && payload.sdp) {
                    try {
                        await pc.setRemoteDescription(payload.sdp);
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        await request("/api/calls/signal", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                target_id: fromId,
                                signal_type: "answer",
                                payload: { sdp: answer }
                            })
                        });
                    } catch (err) { console.error("Error handling offer:", err); }
                }
                return;
            }
            if (signalType === "answer") {
                stopCallRing();
                if (pc && payload.sdp) {
                    try {
                        await pc.setRemoteDescription(payload.sdp);
                        document.getElementById("callStatus").textContent = "Соединено";
                        startCallDuration();
                    } catch (err) { console.error("Error handling answer:", err); }
                }
                return;
            }
            if (signalType === "ice") {
                if (pc && payload.candidate) {
                    try { await pc.addIceCandidate(payload.candidate); } catch (err) { console
                            .error("Error adding ICE candidate:", err); }
                }
                return;
            }
            if (signalType === "hangup") {
                if (!document.getElementById("incomingCallOverlay").classList.contains("hidden")) {
                    document.getElementById("incomingCallOverlay").classList.add("hidden");
                    stopCallRing();
                }
                document.getElementById("callStatus").textContent = "Собеседник завершил звонок";
                setTimeout(() => endCall(false), 2000);
                return;
            }
        }

        function showCallOverlay() {
            const overlay = document.getElementById("callOverlay");
            overlay.classList.remove("hidden");
            if (!callIsVideo) {
                document.getElementById("remoteVideo").style.display = "none";
                document.getElementById("localVideo").style.display = "none";
            }
        }

        function startCallDuration() {
            callStartTime = Date.now();
            if (callDurationInterval) clearInterval(callDurationInterval);
            callDurationInterval = setInterval(() => {
                if (!callStartTime) return;
                const diff = Math.floor((Date.now() - callStartTime) / 1000);
                const mins = String(Math.floor(diff / 60)).padStart(2, "0");
                const secs = String(diff % 60).padStart(2, "0");
                document.getElementById("callDuration").textContent = mins + ":" + secs;
            }, 1000);
        }

        function stopCallDuration() {
            if (callDurationInterval) {
                clearInterval(callDurationInterval);
                callDurationInterval = null;
            }
        }

        function toggleMuteMic() {
            if (!localStream) return;
            micMuted = !micMuted;
            localStream.getAudioTracks().forEach(t => t.enabled = !micMuted);
            const btn = document.getElementById("btnMuteMic");
            btn.textContent = micMuted ? "🔇" : "🎤";
            btn.classList.toggle("active", micMuted);
        }

        function toggleMutePeer() {
            peerMuted = !peerMuted;
            const audio = document.getElementById("remoteAudio");
            if (audio) audio.muted = peerMuted;
            const btn = document.getElementById("btnMutePeer");
            btn.textContent = peerMuted ? "🔇" : "🔊";
            btn.classList.toggle("active", peerMuted);
        }

        function declineIncomingCall() {
            if (!incomingCallData) return;
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            stopCallRing();
            request("/api/calls/signal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    target_id: incomingCallData.fromId,
                    signal_type: "hangup",
                    payload: {}
                })
            }).catch(() => {});
            incomingCallData = null;
        }

        function answerIncomingCall() {
            if (!incomingCallData) return;
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            stopCallRing();
            if (incomingCallData) {
                callTargetId = incomingCallData.fromId;
                callIsVideo = incomingCallData.video || false;
                isCaller = false;
                showCallOverlay();
                try {
                    const res = request("/api/users/" + incomingCallData.fromId);
                    if (res.ok) {
                        res.then(async (r) => {
                            const user = await safeJson(r);
                            document.getElementById("callTitle").textContent = user.display_name ||
                                user.username;
                            const avatar = document.getElementById("callAvatar");
                            if (user.avatar_url) avatar.src = mediaUrl(user.avatar_url);
                            else avatar.src = "";
                        });
                    }
                } catch {}
                document.getElementById("callStatus").textContent = "Соединение...";
            }
            incomingCallData = null;
        }

        function endCall(notify = true) {
            stopCallRing();
            document.getElementById("incomingCallOverlay").classList.add("hidden");
            const overlay = document.getElementById("callOverlay");
            overlay.classList.add("hidden");
            stopCallDuration();
            if (notify && callTargetId) {
                request("/api/calls/signal", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        target_id: callTargetId,
                        signal_type: "hangup",
                        payload: {}
                    })
                }).catch(() => {});
            }
            if (pc) { try { pc.close(); } catch {} }
            pc = null;
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            document.getElementById("localVideo").srcObject = null;
            document.getElementById("remoteVideo").srcObject = null;
            document.getElementById("remoteAudio").srcObject = null;
            document.getElementById("localVideo").style.display = "none";
            document.getElementById("remoteVideo").style.display = "none";
            callTargetId = null;
            callStartTime = null;
            incomingCallData = null;
            isCaller = false;
            micMuted = false;
            peerMuted = false;
            const muteBtn = document.getElementById("btnMuteMic");
            if (muteBtn) { muteBtn.textContent = "🎤";
                muteBtn.classList.remove("active"); }
            const peerBtn = document.getElementById("btnMutePeer");
            if (peerBtn) { peerBtn.textContent = "🔊";
                peerBtn.classList.remove("active"); }
        }

        // ============================================================
        // ОТВЕТ НА ПРИГЛАШЕНИЕ
        // ============================================================

        async function respondInvite(inviteId, action) {
            const response = await request("/api/invites/" + inviteId + "/respond", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action })
            });
            if (!response.ok) {
                const d = await safeJson(response);
                alert(d.detail || "Ошибка");
                return;
            }
            if (selectedUserId) await loadMessages(selectedUserId);
        }

        // Патч для отправки файлов
        (function patchSend() {
            const prev = sendMessage;
            sendMessage = async function() {
                if (pendingDmFile && selectedUserId) {
                    const text = document.getElementById("messageInput").value.trim();
                    await uploadDmMedia(pendingDmFile, text);
                    document.getElementById("messageInput").value = "";
                    return;
                }
                return prev.apply(this, arguments);
            };
        })();

        // Патч для превью медиа в посте
        (function patchPostMedia() {
            const input = document.getElementById("mediaFile");
            if (!input) return;
            input.setAttribute("onchange", "previewPostMedia()");
        })();

        function previewPostMedia() {
            const input = document.getElementById("mediaFile");
            const file = input.files[0];
            const box = document.getElementById("postMediaPreview");
            if (!file || !box) return;
            box.classList.remove("hidden");
            if (file.type.startsWith("image/")) {
                const url = URL.createObjectURL(file);
                box.innerHTML =
                    `<img src="${url}" style="max-height:180px;border-radius:10px;margin-bottom:8px"><div style="display:flex;gap:8px"><button class="primary" onclick="publishMediaPost()">Отправить</button><button class="secondary" onclick="clearPostPreview()">Отмена</button></div>`;
            } else if (file.type.startsWith("video/")) {
                const url = URL.createObjectURL(file);
                box.innerHTML =
                    `<video src="${url}" controls style="max-height:180px;border-radius:10px;width:100%"></video><div style="display:flex;gap:8px;margin-top:8px"><button class="primary" onclick="publishMediaPost()">Отправить</button><button class="secondary" onclick="clearPostPreview()">Отмена</button></div>`;
            } else {
                box.innerHTML =
                    `<div>📎 ${escapeHtml(file.name)}</div><button class="primary" onclick="publishMediaPost()">Отправить</button>`;
            }
        }

        function clearPostPreview() {
            const input = document.getElementById("mediaFile");
            if (input) input.value = "";
            const box = document.getElementById("postMediaPreview");
            if (box) { box.innerHTML = "";
                box.classList.add("hidden"); }
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================

        checkAuth();
    </script>
</body>
