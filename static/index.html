<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MyMessenger</title>

<style>
:root{
    --bg:#0b1118;
    --panel:#111a24;
    --panel2:#172330;
    --panel3:#202f3d;
    --border:#263746;
    --text:#f4f7fa;
    --muted:#8495a5;
    --blue:#229ed9;
    --blue2:#168ac1;
    --danger:#e05252;
    --green:#39c46a;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

.auth{
    width:390px;
    max-width:calc(100% - 30px);
    margin:80px auto;
    background:linear-gradient(145deg,#172330,#101922);
    padding:30px;
    border-radius:22px;
    box-shadow:0 20px 70px #0008;
}

.auth h1{
    text-align:center;
    margin-top:0;
}

.auth input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid var(--border);
    border-radius:12px;
    background:#202d39;
    color:white;
    outline:none;
}

.auth input:focus{
    border-color:var(--blue);
}

.auth button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:var(--blue);
    color:white;
}

.auth button:hover{
    background:var(--blue2);
}

#authError{
    color:#ff7777;
    min-height:20px;
}

/* APP */

#app{
    display:none;
    height:100vh;
}

.sidebar{
    width:310px;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
}

.logo{
    padding:20px;
    font-size:21px;
    font-weight:bold;
}

.search{
    margin:0 12px 12px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#202d39;
    color:white;
    outline:none;
}

.users{
    overflow-y:auto;
}

.user{
    padding:13px;
    display:flex;
    gap:11px;
    align-items:center;
    cursor:pointer;
    transition:.15s;
}

.user:hover{
    background:#1d2b38;
}

.avatar{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    object-fit:cover;
    background:linear-gradient(135deg,#249fd7,#7167ff);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.user-name{
    font-weight:bold;
}

.user-username{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.user-status{
    color:var(--green);
    font-size:11px;
    margin-top:3px;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:64px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-button{
    border:0;
    background:var(--panel3);
    color:white;
    border-radius:10px;
    padding:9px 12px;
}

.icon-button:hover{
    background:#2a3b4b;
}

.content{
    flex:1;
    overflow:hidden;
}

.view{
    height:100%;
    overflow-y:auto;
    padding:20px;
}

/* CHAT */

.chat{
    height:100%;
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:15px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
}

.chat-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.chat-user img{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.chat-user-info small{
    display:block;
    color:var(--muted);
    margin-top:2px;
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto;
}

.message-row{
    display:flex;
    margin:7px 0;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:70%;
    background:#182533;
    padding:9px 12px;
    border-radius:13px;
    position:relative;
}

.message.mine .message{
    background:#28557d;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
}

.message-edited{
    color:#b8cad8;
    font-size:10px;
    margin-left:4px;
}

.time{
    color:#a8bac8;
    font-size:11px;
    text-align:right;
    margin-top:4px;
}

.message-menu{
    display:flex;
    gap:4px;
    margin-top:6px;
}

.message-menu button{
    border:0;
    background:#ffffff14;
    color:white;
    border-radius:6px;
    padding:4px 7px;
    font-size:11px;
}

.composer{
    display:flex;
    gap:8px;
    padding:12px;
    background:var(--panel);
}

.composer input{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#202d39;
    color:white;
    outline:none;
}

.send{
    width:52px;
    border:0;
    border-radius:12px;
    background:var(--blue);
    color:white;
}

/* FEED */

.feed{
    max-width:720px;
    margin:auto;
}

.post-box,
.post{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:15px;
    margin-bottom:15px;
}

.post-box textarea{
    width:100%;
    resize:vertical;
    min-height:90px;
    border:0;
    border-radius:11px;
    padding:12px;
    background:#202d39;
    color:white;
    outline:none;
}

.post-tools{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.primary{
    background:var(--blue);
    border:0;
    color:white;
    padding:10px 14px;
    border-radius:10px;
}

.post-header{
    display:flex;
    gap:10px;
    align-items:center;
}

.post-author{
    font-weight:bold;
}

.post-username{
    color:var(--muted);
    font-size:12px;
}

.post-text{
    white-space:pre-wrap;
    margin:14px 0;
    word-break:break-word;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:12px;
    background:#090e13;
}

.post-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
    flex-wrap:wrap;
}

.post-actions button{
    border:0;
    border-radius:9px;
    background:#243342;
    color:white;
    padding:8px 12px;
}

.post-actions button:hover{
    background:#304353;
}

.comments{
    margin-top:12px;
}

.comment{
    background:#202d39;
    padding:9px;
    border-radius:9px;
    margin-top:6px;
}

.comment-meta{
    font-size:12px;
    margin-bottom:4px;
}

.comment-meta span{
    color:var(--muted);
}

.comment-input{
    display:flex;
    gap:6px;
    margin-top:8px;
}

.comment-input input{
    flex:1;
    background:#242f3a;
    border:0;
    padding:9px;
    color:white;
    border-radius:8px;
}

.comment-input button{
    border:0;
    background:var(--blue);
    color:white;
    border-radius:8px;
}

/* PROFILE / SETTINGS */

.profile{
    max-width:700px;
    margin:auto;
}

.profile-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:25px;
}

.big-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:linear-gradient(135deg,#249fd7,#7167ff);
    display:block;
    margin:0 auto 15px;
}

.profile input,
.profile textarea,
.settings input,
.settings select{
    width:100%;
    margin:7px 0;
    border:1px solid var(--border);
    padding:12px;
    border-radius:10px;
    background:#202d39;
    color:white;
    outline:none;
}

.settings-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    margin-bottom:12px;
}

.settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.settings-row:last-child{
    border-bottom:0;
}

.settings-row button{
    border:0;
    border-radius:9px;
    padding:9px 13px;
    background:#243342;
    color:white;
}

.danger{
    background:var(--danger)!important;
    border:0;
    color:white;
    padding:11px 15px;
    border-radius:9px;
    margin-top:10px;
}

/* URL BUTTON */

.url-button{
    position:relative;
    overflow:hidden;
    border:0;
    border-radius:12px;
    color:white;
    padding:11px 16px;
    background:
        linear-gradient(#229ed9dd,#168ac1dd),
        url("https://i.imgur.com/7NFHga3.png") center/cover;
    box-shadow:0 5px 20px #0005;
}

.url-button:hover{
    filter:brightness(1.12);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:#0009;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal-box{
    width:420px;
    max-width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.modal-box h2{
    margin-top:0;
}

.modal-box input,
.modal-box textarea{
    width:100%;
    margin:6px 0;
    padding:11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#202d39;
    color:white;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-actions button{
    flex:1;
    border:0;
    padding:10px;
    border-radius:9px;
    background:var(--blue);
    color:white;
}

/* MOBILE */

@media(max-width:750px){
    .sidebar{
        width:80px;
    }

    .logo{
        font-size:12px;
        padding:12px 5px;
    }

    .user{
        padding:10px 5px;
        justify-content:center;
    }

    .user>div:not(.avatar){
        display:none;
    }

    .search{
        margin:5px;
    }

    .view{
        padding:10px;
    }

    .message{
        max-width:86%;
    }

    .topbar{
        padding:0 9px;
    }
}
</style>
</head>

<body>

<div class="auth" id="auth">
    <h1>💬 MyMessenger</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Создать аккаунт</button>

    <p id="authError"></p>
</div>

<div id="app">

<aside class="sidebar">

    <div class="logo">💬 MyMessenger</div>

    <input
        class="search"
        id="search"
        placeholder="Поиск..."
        oninput="searchUsers()"
    >

    <div class="users" id="users"></div>

</aside>

<main class="main">

<div class="topbar">

    <strong id="pageTitle">📰 Лента</strong>

    <div class="top-actions">

        <button class="icon-button" onclick="showFeed()">📰</button>
        <button class="icon-button" onclick="showSettings()">⚙️</button>

    </div>

</div>

<div class="content">

<!-- FEED -->

<section class="view" id="feedView">

<div class="feed">

<div class="post-box">

<textarea
    id="postText"
    placeholder="Что нового?"
></textarea>

<div class="post-tools">

<button class="primary" onclick="publishPost()">
📝 Опубликовать
</button>

<label class="url-button">
📷 Фото / видео
<input
    id="mediaFile"
    type="file"
    accept="image/*,video/*"
    hidden
>
</label>

</div>
</div>

<div id="feed"></div>

</div>
</section>

<!-- CHAT -->

<section
    class="view"
    id="chatView"
    style="display:none;padding:0"
>

<div class="chat">

<div class="chat-header" id="chatHeader">
    Выберите пользователя
</div>

<div class="messages" id="messages"></div>

<div class="composer">

<input
    id="messageInput"
    placeholder="Сообщение..."
    onkeydown="messageKey(event)"
>

<button class="send" onclick="sendMessage()">➤</button>

</div>
</div>
</section>

<!-- PROFILE -->

<section
    class="view"
    id="profileView"
    style="display:none"
>

<div class="profile">

<div class="profile-card">

<img id="bigAvatar" class="big-avatar">

<h2>👤 Профиль</h2>

<input id="profileUsername" placeholder="Username">
<input id="profileName" placeholder="Имя">

<textarea id="profileBio" placeholder="О себе"></textarea>

<p>🖼️ Новый аватар</p>

<input
    id="avatarFile"
    type="file"
    accept="image/*"
>

<button class="primary" onclick="saveProfile()">
Сохранить профиль
</button>

</div>
</div>
</section>

<!-- SETTINGS -->

<section
    class="view"
    id="settingsView"
    style="display:none"
>

<div class="profile settings">

<h2>⚙️ Настройки</h2>

<div class="settings-card">

<h3>👤 Аккаунт</h3>

<div class="settings-row">
<span>Текущий аккаунт</span>
<strong id="settingsAccount"></strong>
</div>

<div class="settings-row">
<span>Создать второй аккаунт</span>
<button onclick="showCreateAccount()">➕ Создать</button>
</div>

<div class="settings-row">
<span>Выйти</span>
<button class="danger" onclick="logout()">🚪 Выйти</button>
</div>

</div>

<div class="settings-card">

<h3>🎨 Интерфейс</h3>

<div class="settings-row">
<span>Язык</span>

<select id="languageSelect" onchange="changeLanguage()">
<option value="ru">Русский</option>
<option value="en">English</option>
</select>

</div>

<div class="settings-row">
<span>Тема</span>

<select id="themeSelect" onchange="changeTheme()">
<option value="dark">Тёмная</option>
<option value="blue">Синяя</option>
<option value="black">Чёрная</option>
</select>

</div>

</div>

<div class="settings-card">

<h3>🔔 Уведомления</h3>

<div class="settings-row">
<span>Уведомления</span>
<input
    style="width:auto"
    type="checkbox"
    id="notifications"
    onchange="saveSettings()"
>
</div>

<div class="settings-row">
<span>Звуки</span>
<input
    style="width:auto"
    type="checkbox"
    id="sounds"
    onchange="saveSettings()"
>
</div>

</div>

<div class="settings-card">

<h3>🔒 Приватность</h3>

<div class="settings-row">
<span>Показывать статус онлайн</span>
<input
    style="width:auto"
    type="checkbox"
    id="showOnline"
    onchange="saveSettings()"
>
</div>

</div>

<div class="settings-card">

<h3>✨ Дополнительно</h3>

<button class="url-button" onclick="openOfficialImage()">
🌐 Открыть URL
</button>

</div>

</div>

</section>

</div>
</main>
</div>

<!-- USER MODAL -->

<div class="modal hidden" id="userModal">

<div class="modal-box">

<h2 id="modalUserName"></h2>

<p id="modalUserUsername"></p>

<p id="modalUserBio"></p>

<button class="primary" onclick="modalOpenChat()">
💬 Написать
</button>

<button class="danger" onclick="closeModal()">
Закрыть
</button>

</div>
</div>

<!-- CREATE ACCOUNT MODAL -->

<div class="modal hidden" id="accountModal">

<div class="modal-box">

<h2>➕ Новый аккаунт</h2>

<input id="newUsername" placeholder="Username">

<input
    id="newPassword"
    type="password"
    placeholder="Пароль"
>

<div class="modal-actions">

<button onclick="createSecondAccount()">
Создать
</button>

<button onclick="closeAccountModal()">
Отмена
</button>

</div>

</div>
</div>

<script>

const API = "";

let token = localStorage.getItem("token");
let currentUser = null;
let selectedUser = null;
let socket = null;

const renderedMessageIds = new Set();

function api(path){
    return API + path;
}

async function request(path,options={}){
    options.headers = options.headers || {};

    if(token){
        options.headers.Authorization = "Bearer " + token;
    }

    return fetch(api(path),options);
}

/* AUTH */

async function register(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value;

    try{

        const response=await fetch(api("/api/register"),{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password})
        });

        const data=await safeJson(response);

        if(!response.ok) throw new Error(data.detail || "Ошибка");

        token=data.token;

        localStorage.setItem("token",token);

        await startApp();

    }catch(error){
        document.getElementById("authError").innerText=error.message;
    }
}

async function login(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value;

    try{

        const response=await fetch(api("/api/login"),{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password})
        });

        const data=await safeJson(response);

        if(!response.ok) throw new Error(data.detail || "Ошибка");

        token=data.token;

        localStorage.setItem("token",token);

        await startApp();

    }catch(error){
        document.getElementById("authError").innerText=error.message;
    }
}

async function safeJson(response){

    const text=await response.text();

    if(!text){
        return {};
    }

    try{
        return JSON.parse(text);
    }catch{
        return {};
    }
}

/* START */

async function startApp(){

    const response=await request("/api/me");

    if(!response.ok){
        logout();
        return;
    }

    currentUser=await response.json();

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="flex";

    connectWebSocket();
    searchUsers();
    showFeed();
}

/* LOGOUT */

function logout(){

    if(socket){
        try{
            socket.close();
        }catch{}
    }

    localStorage.removeItem("token");

    token=null;
    currentUser=null;

    location.reload();
}

/* WEBSOCKET */

function connectWebSocket(){

    if(!currentUser) return;

    let base;

    if(API){
        base=API;
    }else{
        base=location.origin;
    }

    const wsBase=base
        .replace("https://","wss://")
        .replace("http://","ws://");

    socket=new WebSocket(
        wsBase+"/ws/"+currentUser.id
    );

    socket.onopen=()=>{
        socket.send(JSON.stringify({
            type:"ping"
        }));
    };

    socket.onmessage=event=>{

        let data;

        try{
            data=JSON.parse(event.data);
        }catch{
            return;
        }

        if(data.type==="message"){
            handleIncomingMessage(data.message);
        }
    };

    socket.onclose=()=>{

        if(token){
            setTimeout(connectWebSocket,3000);
        }
    };
}

function handleIncomingMessage(message){

    if(renderedMessageIds.has(message.id)){
        return;
    }

    if(
        selectedUser &&
        (
            (
                message.sender_id===currentUser.id &&
                message.receiver_id===selectedUser.id
            )
            ||
            (
                message.sender_id===selectedUser.id &&
                message.receiver_id===currentUser.id
            )
        )
    ){
        addMessage(message);
    }
}

/* USERS */

async function searchUsers(){

    const q=document.getElementById("search").value;

    const response=await request(
        "/api/users?q="+encodeURIComponent(q)
    );

    if(!response.ok) return;

    const users=await response.json();

    const container=document.getElementById("users");

    container.innerHTML="";

    users.forEach(user=>{

        const element=document.createElement("div");

        element.className="user";

        element.innerHTML=`

            ${
                user.avatar_url
                ?
                `<img class="avatar"
                    src="${mediaUrl(user.avatar_url)}"
                >`
                :
                `<div class="avatar">👤</div>`
            }

            <div>
                <div class="user-name">
                    ${escapeHtml(user.display_name || user.username)}
                </div>

                <div class="user-username">
                    @${escapeHtml(user.username)}
                </div>

                ${
                    isOnline(user.last_seen)
                    ?
                    `<div class="user-status">● в сети</div>`
                    :
                    ""
                }
            </div>
        `;

        element.onclick=()=>openChat(user);

        const avatar=element.querySelector(".avatar");

        if(avatar){
            avatar.onclick=e=>{
                e.stopPropagation();
                openUserProfile(user);
            };
        }

        container.appendChild(element);
    });
}

function isOnline(lastSeen){

    if(!lastSeen) return false;

    return Date.now()-
        new Date(lastSeen+"Z").getTime()
        < 60000;
}

/* CHAT */

async function openChat(user){

    selectedUser=user;

    renderedMessageIds.clear();

    document.getElementById("feedView").style.display="none";
    document.getElementById("profileView").style.display="none";
    document.getElementById("settingsView").style.display="none";
    document.getElementById("chatView").style.display="block";

    document.getElementById("pageTitle").innerText=
        "💬 "+(user.display_name || user.username);

    document.getElementById("chatHeader").innerHTML=`

        <div class="chat-user">

            ${
                user.avatar_url
                ?
                `<img src="${mediaUrl(user.avatar_url)}">`
                :
                `<div class="avatar">👤</div>`
            }

            <div class="chat-user-info">

                <strong>
                    ${escapeHtml(user.display_name || user.username)}
                </strong>

                <small>
                    @${escapeHtml(user.username)}
                    ${isOnline(user.last_seen) ? " · в сети":""}
                </small>

            </div>

        </div>
    `;

    const response=await request(
        "/api/messages/"+user.id
    );

    if(!response.ok) return;

    const history=await response.json();

    const messages=document.getElementById("messages");

    messages.innerHTML="";

    history.forEach(addMessage);
}

function addMessage(message){

    if(renderedMessageIds.has(message.id)){
        return;
    }

    renderedMessageIds.add(message.id);

    const container=document.getElementById("messages");

    const row=document.createElement("div");

    const mine=message.sender_id===currentUser.id;

    row.className=
        "message-row "+
        (mine?"mine":"");

    const element=document.createElement("div");

    element.className="message";

    const date=new Date(
        message.created_at.endsWith("Z")
        ?message.created_at
        :message.created_at+"Z"
    );

    element.innerHTML=`

        <div class="message-text">
            ${escapeHtml(message.text)}
            ${message.edited ? `<span class="message-edited">изменено</span>`:""}
        </div>

        <div class="time">
            ${date.toLocaleTimeString([],{
                hour:"2-digit",
                minute:"2-digit"
            })}
            ${mine?" ✓✓":""}
        </div>

        <div class="message-menu">

            <button onclick="copyText(
                ${JSON.stringify(message.text)}
            )">
                📋
            </button>

            ${
                mine
                ?
                `
                <button onclick="editMessage(${message.id},${JSON.stringify(message.text)})">
                    ✏️
                </button>

                <button onclick="deleteMessage(${message.id})">
                    🗑️
                </button>
                `
                :
                ""
            }

        </div>
    `;

    row.appendChild(element);

    container.appendChild(row);

    container.scrollTop=container.scrollHeight;
}

async function sendMessage(){

    if(!selectedUser){
        alert("Выбери пользователя");
        return;
    }

    const input=document.getElementById("messageInput");

    const text=input.value.trim();

    if(!text) return;

    input.value="";

    const response=await request(
        "/api/messages",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                receiver_id:selectedUser.id,
                text
            })
        }
    );

    const data=await safeJson(response);

    if(!response.ok){
        alert(data.detail || "Ошибка");
        return;
    }

    /*
       ВАЖНО:
       здесь НЕ вызываем addMessage().
       Сервер сам отправляет сообщение через WebSocket.
       Это устраняет дубли.
    */
}

function messageKey(event){

    if(
        event.key==="Enter" &&
        !event.shiftKey
    ){
        event.preventDefault();
        sendMessage();
    }
}

async function editMessage(id,oldText){

    const text=prompt(
        "Изменить сообщение:",
        oldText
    );

    if(text===null) return;

    const clean=text.trim();

    if(!clean) return;

    const response=await request(
        "/api/messages/"+id,
        {
            method:"PUT",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                text:clean
            })
        }
    );

    if(response.ok){
        await reloadCurrentChat();
    }
}

async function deleteMessage(id){

    if(!confirm("Удалить сообщение?")) return;

    const response=await request(
        "/api/messages/"+id,
        {
            method:"DELETE"
        }
    );

    if(response.ok){
        await reloadCurrentChat();
    }
}

async function reloadCurrentChat(){

    if(!selectedUser) return;

    renderedMessageIds.clear();

    const response=await request(
        "/api/messages/"+selectedUser.id
    );

    if(!response.ok) return;

    const history=await response.json();

    const messages=document.getElementById("messages");

    messages.innerHTML="";

    history.forEach(addMessage);
}

/* FEED */

function showFeed(){

    document.getElementById("feedView").style.display="block";
    document.getElementById("chatView").style.display="none";
    document.getElementById("profileView").style.display="none";
    document.getElementById("settingsView").style.display="none";

    document.getElementById("pageTitle").innerText="📰 Лента";

    loadFeed();
}

async function loadFeed(){

    const response=await request("/api/feed");

    if(!response.ok) return;

    const posts=await response.json();

    const container=document.getElementById("feed");

    container.innerHTML="";

    posts.forEach(renderPost);
}

function renderPost(post){

    const container=document.getElementById("feed");

    const element=document.createElement("article");

    element.className="post";

    const avatar=post.avatar_url
        ?
        `<img class="avatar" src="${mediaUrl(post.avatar_url)}">`
        :
        `<div class="avatar">👤</div>`;

    let media="";

    if(post.media_url && post.media_type==="image"){
        media=`
            <img
                class="post-media"
                src="${mediaUrl(post.media_url)}"
            >
        `;
    }

    if(post.media_url && post.media_type==="video"){
        media=`
            <video
                class="post-media"
                controls
                src="${mediaUrl(post.media_url)}"
            ></video>
        `;
    }

    element.innerHTML=`

        <div class="post-header">

            ${avatar}

            <div>

                <div class="post-author">
                    ${escapeHtml(post.display_name || post.username)}
                </div>

                <div class="post-username">
                    @${escapeHtml(post.username)}
                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="post-text">
                ${escapeHtml(post.text)}
            </div>`
            :""
        }

        ${media}

        <div class="post-actions">

            <button onclick="likePost(${post.id})">
                ❤️ ${post.likes}
            </button>

            <button onclick="showComments(${post.id})">
                💬 ${post.comments}
            </button>

            <button onclick="sharePost(${post.id})">
                🔗 Поделиться
            </button>

            ${
                post.author_id===currentUser.id
                ?
                `<button onclick="deletePost(${post.id})">
                    🗑️
                </button>`
                :""
            }

        </div>

        <div
            class="comments"
            id="comments-${post.id}"
        ></div>
    `;

    const postAvatar=element.querySelector(".post-header .avatar");

    if(postAvatar){
        postAvatar.onclick=()=>{
            openUserProfile({
                id:post.author_id,
                username:post.username,
                display_name:post.display_name,
                avatar_url:post.avatar_url
            });
        };
    }

    container.appendChild(element);
}

async function publishPost(){

    const text=document.getElementById("postText").value.trim();

    const file=document.getElementById("mediaFile").files[0];

    if(!text && !file){
        alert("Добавь текст, фото или видео");
        return;
    }

    try{

        if(file){

            const form=new FormData();

            form.append("file",file);
            form.append("text",text);

            const response=await request(
                "/api/posts/media",
                {
                    method:"POST",
                    body:form
                }
            );

            const data=await safeJson(response);

            if(!response.ok){
                throw new Error(data.detail || "Ошибка");
            }

        }else{

            const response=await request(
                "/api/posts",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({text})
                }
            );

            const data=await safeJson(response);

            if(!response.ok){
                throw new Error(data.detail || "Ошибка");
            }
        }

        document.getElementById("postText").value="";
        document.getElementById("mediaFile").value="";

        loadFeed();

    }catch(error){
        alert(error.message);
    }
}

/* LIKE */

async function likePost(id){

    await request(
        "/api/posts/"+id+"/like",
        {method:"POST"}
    );

    loadFeed();
}

/* COMMENTS */

async function showComments(postId){

    const container=document.getElementById(
        "comments-"+postId
    );

    if(container.dataset.open==="1"){
        container.innerHTML="";
        container.dataset.open="0";
        return;
    }

    const response=await request(
        "/api/posts/"+postId+"/comments"
    );

    if(!response.ok) return;

    const comments=await response.json();

    container.innerHTML=`

        <div class="comment-input">

            <input
                id="comment-${postId}"
                placeholder="Написать комментарий..."
            >

            <button onclick="sendComment(${postId})">
                ➤
            </button>

        </div>
    `;

    container.dataset.open="1";

    comments.forEach(comment=>{

        const div=document.createElement("div");

        div.className="comment";

        const replyText=
            comment.reply_to_username
            ?
            `@${escapeHtml(comment.username)}-@${escapeHtml(comment.reply_to_username)}`
            :
            `@${escapeHtml(comment.username)}`;

        div.innerHTML=`

            <div class="comment-meta">

                <b>${replyText}</b>

                <span>
                    ${escapeHtml(
                        comment.display_name ||
                        comment.username
                    )}
                </span>

            </div>

            <div>
                ${escapeHtml(comment.text)}
            </div>

            <div class="post-actions">

                <button onclick="copyText(
                    ${JSON.stringify(comment.text)}
                )">
                    📋 Копировать
                </button>

                <button onclick="replyComment(
                    ${comment.id},
                    ${JSON.stringify(comment.username)},
                    ${postId}
                )">
                    ↩️ Ответить
                </button>

                ${
                    comment.user_id===currentUser.id
                    ?
                    `<button onclick="deleteComment(
                        ${comment.id},
                        ${postId}
                    )">
                        🗑️ Удалить
                    </button>`
                    :""
                }

            </div>
        `;

        container.appendChild(div);
    });
}

let replyState={};

function replyComment(commentId,username,postId){

    replyState={
        commentId,
        username,
        postId
    };

    const input=document.getElementById(
        "comment-"+postId
    );

    input.placeholder=
        "Ответить @"+username+"...";

    input.focus();
}

async function sendComment(postId){

    const input=document.getElementById(
        "comment-"+postId
    );

    const text=input.value.trim();

    if(!text) return;

    const body={
        text
    };

    if(
        replyState.postId===postId &&
        replyState.commentId
    ){
        body.reply_to_id=replyState.commentId;
    }

    const response=await request(
        "/api/posts/"+postId+"/comments",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(body)
        }
    );

    const data=await safeJson(response);

    if(!response.ok){
        alert(data.detail || "Ошибка");
        return;
    }

    replyState={};

    showComments(postId);

    setTimeout(()=>{
        showComments(postId);
    },50);
}

async function deleteComment(id,postId){

    if(!confirm("Удалить комментарий?")) return;

    const response=await request(
        "/api/comments/"+id,
        {
            method:"DELETE"
        }
    );

    if(response.ok){

        const container=document.getElementById(
            "comments-"+postId
        );

        container.innerHTML="";

        container.dataset.open="0";

        showComments(postId);
    }
}

        "profileUsername"
    ).value.trim();

        "profileName"

/* SETTINGS */

function showSettings(){

    document.getElementById("feedView").style.display="none";
    document.getElementById("chatView").style.display="none";
    document.getElementById("profileView").style.display="none";
    document.getElementById("settingsView").style.display="block";

    document.getElementById("pageTitle").innerText="⚙️ Настройки";

    document.getElementById("settingsAccount").innerText=
        "@"+currentUser.username;

    loadSettings();
}

function getSettings(){

    try{
        return JSON.parse(
            localStorage.getItem("settings") || "{}"
        );
    }catch{
        return {};
    }
}

function loadSettings(){

    const settings=getSettings();

    document.getElementById("languageSelect").value=
        settings.language || "ru";

    document.getElementById("themeSelect").value=
        settings.theme || "dark";

    document.getElementById("notifications").checked=
        settings.notifications ?? true;

    document.getElementById("sounds").checked=
        settings.sounds ?? true;

    document.getElementById("showOnline").checked=
        settings.showOnline ?? true;

    applyTheme(settings.theme || "dark");
}

function saveSettings(){

    const settings=getSettings();

    settings.language=
        document.getElementById("languageSelect").value;

    settings.theme=
        document.getElementById("themeSelect").value;

    settings.notifications=
        document.getElementById("notifications").checked;

    settings.sounds=
        document.getElementById("sounds").checked;

    settings.showOnline=
        document.getElementById("showOnline").checked;

    localStorage.setItem(
        "settings",
        JSON.stringify(settings)
    );

    applyTheme(settings.theme);
}

function changeLanguage(){

    saveSettings();

    const lang=document.getElementById(
        "languageSelect"
    ).value;

    if(lang==="en"){
        alert("English interface setting saved.");
    }else{
        alert("Русский язык сохранён.");
    }
}

function changeTheme(){
    saveSettings();
}

function applyTheme(theme){

    if(theme==="blue"){
        document.documentElement.style.setProperty(
            "--blue",
            "#3d8bfd"
        );
    }else if(theme==="black"){
        document.documentElement.style.setProperty(
            "--bg",
            "#000"
        );

        document.documentElement.style.setProperty(
            "--panel",
            "#050505"
        );
    }else{
        document.documentElement.style.setProperty(
            "--blue",
            "#229ed9"
        );

        document.documentElement.style.setProperty(
            "--bg",
            "#0b1118"
        );

        document.documentElement.style.setProperty(
            "--panel",
            "#111a24"
        );
    }
}

        "accountModal"

async function createSecondAccount(){

    const username=document.getElementById(
        "newUsername"
    ).value.trim();

    const password=document.getElementById(
        "newPassword"
    ).value;

    if(!username || !password){
        alert("Заполни оба поля");
        return;
    }

    const response=await fetch(
        api("/api/register"),
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        }
    );

    const data=await safeJson(response);

    if(!response.ok){
        alert(data.detail || "Ошибка");
        return;
    }

    /*
       Аккаунт создан.
       Не переключаем текущий аккаунт автоматически.
       Сохраняем его локально для быстрого переключения.
    */

    const accounts=JSON.parse(
        localStorage.getItem("accounts") || "[]"
    );

    accounts.push({
        username,
        token:data.token
    });

    localStorage.setItem(
        "accounts",
        JSON.stringify(accounts)
    );

    alert(
        "Аккаунт создан. Для входа в него выйди из текущего аккаунта."
    );

    closeAccountModal();
}

/* COPY */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(text);

        return true;

    }catch{

        const area=document.createElement("textarea");

        area.value=text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        return true;
    }
}

/* HELPERS */

function mediaUrl(url){

    if(!url) return "";

    if(url.startsWith("http")){
        return url;
    }

    return API+url;
}

function escapeHtml(text){

    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}
