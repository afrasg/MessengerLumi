<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger Lumi</title>

    <style>
        /* ========== RESET / BASE ========== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #101114;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        button {
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            color: #fff;
        }

        input,
        textarea,
        select {
            background: #1c1d22;
            border: 1px solid #2c2d34;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            color: #fff;
            width: 100%;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6c6fff;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .hidden {
            display: none !important;
        }

        .error {
            color: #ff5c5c;
            font-size: 13px;
            margin-top: 6px;
        }

        /* ========== AUTH ========== */

        .auth-card {
            max-width: 360px;
            margin: auto;
            padding: 30px;
            background: #181a20;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #2c2d34;
        }

        .auth-card h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .auth-card input {
            margin-bottom: 12px;
        }

        .auth-card .primary {
            width: 100%;
            margin-top: 6px;
        }

        .auth-card .secondary {
            margin-top: 8px;
            color: #9095a3;
            background: transparent;
            border: none;
            font-size: 14px;
        }

        .auth-card .secondary:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* ========== SIDEBAR ========== */

        .sidebar {
            width: 300px;
            min-width: 300px;
            background: #141518;
            border-right: 1px solid #25262b;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0 14px 14px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            padding: 16px 0 12px;
            color: #6c6fff;
        }

        .search {
            margin-bottom: 12px;
        }

        .users {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .user-item:hover {
            background: #1c1d22;
        }

        .user-item .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2d34;
            flex-shrink: 0;
        }

        .user-item .info {
            flex: 1;
            overflow: hidden;
        }

        .user-item .name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-item .username {
            font-size: 12px;
            color: #9095a3;
        }

        .user-item .status {
            font-size: 11px;
            color: #6c6fff;
        }

        .user-item .status.offline {
            color: #555a68;
        }

        /* ========== MAIN ========== */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #25262b;
            background: #141518;
            flex-shrink: 0;
        }

        .topbar strong {
            font-size: 18px;
        }

        .top-actions {
            display: flex;
            gap: 4px;
        }

        .icon-button {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.15s;
        }

        .icon-button:hover {
            background: #25262b;
        }

        .content {
            flex: 1;
            overflow: hidden;
        }

        .view {
            height: 100%;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .view.hidden {
            display: none;
        }

        /* ========== FEED ========== */

        .feed {
            max-width: 620px;
            margin: 0 auto;
        }

        .post-box {
            background: #181a20;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #25262b;
            margin-bottom: 20px;
        }

        .post-box textarea {
            background: #141518;
            border-color: #2c2d34;
            margin-bottom: 10px;
        }

        .post-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .post-tools .primary {
            flex: 1;
            text-align: center;
        }

        .post-tools label.primary {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            background: #25262b;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
            text-align: center;
            flex: 1;
        }

        .post-tools label.primary:hover {
            background: #2c2d34;
        }

        .post {
            background: #181a20;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #25262b;
            margin-bottom: 14px;
        }

        .post-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .post-head .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2d34;
            flex-shrink: 0;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .post-head .avatar:hover {
            opacity: 0.8;
        }

        .post-text {
            margin-bottom: 10px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .post-media {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .post-actions button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 14px;
            background: #1c1d22;
            transition: background 0.15s;
            color: #fff;
        }

        .post-actions button:hover {
            background: #25262b;
        }

        .post-actions .comment-btn {
            background: transparent;
            color: #9095a3;
        }

        .post-actions .comment-btn:hover {
            color: #fff;
            background: transparent;
        }

        /* ========== COMMENTS ========== */

        .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #25262b;
        }

        .comments-section .comment-form {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .comments-section .comment-form input {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            background: #141518;
            border-color: #2c2d34;
        }

        .comments-section .comment-form button {
            padding: 8px 16px;
            border-radius: 8px;
            background: #6c6fff;
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            white-space: nowrap;
        }

        .comments-section .comment-form button:hover {
            background: #5a5de0;
        }

        .comment {
            padding: 8px 0 8px 12px;
            border-left: 2px solid #2c2d34;
            margin-bottom: 6px;
        }

        .comment .comment-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .comment .comment-head .avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2d34;
            cursor: pointer;
        }

        .comment .comment-head .author {
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
        }

        .comment .comment-head .author:hover {
            color: #6c6fff;
        }

        .comment .comment-head .time {
            font-size: 11px;
            color: #555a68;
        }

        .comment .comment-text {
            font-size: 14px;
            word-wrap: break-word;
            padding-left: 30px;
        }

        .comment .comment-actions {
            padding-left: 30px;
            margin-top: 2px;
        }

        .comment .comment-actions button {
            font-size: 12px;
            color: #555a68;
            background: transparent;
            padding: 2px 6px;
        }

        .comment .comment-actions button:hover {
            color: #fff;
        }

        .comment .replies {
            margin-left: 20px;
        }

        /* ========== CHAT ========== */

        .chat {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0 16px 16px;
        }

        .chat-header {
            padding: 12px 0 8px;
            font-weight: 500;
            border-bottom: 1px solid #25262b;
            flex-shrink: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 0;
        }

        .msg {
            max-width: 70%;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 14px;
            word-wrap: break-word;
            position: relative;
        }

        .msg.sent {
            align-self: flex-end;
            background: #6c6fff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            align-self: flex-start;
            background: #1c1d22;
            color: #fff;
            border-bottom-left-radius: 4px;
        }

        .msg .time {
            font-size: 10px;
            opacity: 0.6;
            margin-left: 8px;
        }

        .msg .deleted-text {
            font-style: italic;
            opacity: 0.5;
        }

        .msg .msg-actions {
            margin-top: 4px;
            display: flex;
            gap: 8px;
            font-size: 12px;
        }

        .msg .msg-actions button {
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            padding: 0;
            font-size: 12px;
        }

        .msg .msg-actions button:hover {
            color: #fff;
        }

        .composer {
            display: flex;
            gap: 8px;
            padding: 8px 0 0;
            border-top: 1px solid #25262b;
            flex-shrink: 0;
        }

        .composer input {
            flex: 1;
            padding: 10px 14px;
            background: #141518;
            border-color: #2c2d34;
        }

        .composer .send {
            padding: 10px 18px;
            border-radius: 8px;
            background: #6c6fff;
            color: #fff;
            font-weight: 500;
            white-space: nowrap;
        }

        .composer .send:hover {
            background: #5a5de0;
        }

        /* ========== PROFILE / SETTINGS ========== */

        .profile {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: #181a20;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #25262b;
            margin-bottom: 16px;
        }

        .card h2,
        .card h3 {
            margin-bottom: 12px;
        }

        .card input,
        .card textarea,
        .card select {
            margin-bottom: 10px;
            background: #141518;
        }

        .big-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2d34;
            display: block;
            margin: 0 auto 12px;
        }

        .setting {
            margin-bottom: 10px;
        }

        .setting label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .setting label input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .setting label select {
            width: auto;
            min-width: 120px;
        }

        .primary {
            background: #6c6fff;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.15s;
        }

        .primary:hover {
            background: #5a5de0;
        }

        .secondary {
            background: #25262b;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .secondary:hover {
            background: #2c2d34;
        }

        .danger-button {
            background: #c0392b;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.15s;
            margin-top: 8px;
            width: 100%;
            text-align: center;
        }

        .danger-button:hover {
            background: #a93226;
        }

        /* ========== MODAL ========== */

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .modal-bg.hidden {
            display: none;
        }

        .modal {
            background: #181a20;
            border-radius: 16px;
            padding: 28px;
            max-width: 460px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #2c2d34;
        }

        .modal input,
        .modal textarea,
        .modal select {
            background: #141518;
            border-color: #2c2d34;
            margin-bottom: 10px;
        }

        .modal .close-modal {
            float: right;
            font-size: 24px;
            color: #555a68;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal .close-modal:hover {
            color: #fff;
        }

        /* ========== SCROLLBAR ========== */

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2c2d34;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3c3d44;
        }

        /* ========== RESPONSIVE ========== */

        @media (max-width: 700px) {
            .sidebar {
                width: 200px;
                min-width: 200px;
                padding: 0 8px 8px;
            }

            .logo {
                font-size: 14px;
                padding: 12px 0 8px;
            }

            .post-actions {
                gap: 6px;
            }

            .post-actions button {
                font-size: 12px;
                padding: 4px 8px;
            }
        }

        @media (max-width: 520px) {
            .sidebar {
                display: none;
            }

            .main {
                width: 100%;
            }

            .topbar {
                padding: 10px 12px;
            }

            .topbar strong {
                font-size: 15px;
            }

            .view {
                padding: 12px 12px;
            }

            .msg {
                max-width: 85%;
            }
        }

        /* ========== THEME OVERRIDES ========== */

        body.light {
            background: #f1f3f7;
            color: #111;
        }

        body.light .sidebar,
        body.light .topbar {
            background: #fff;
            border-color: #e0e2e8;
        }

        body.light .post,
        body.light .card,
        body.light .post-box,
        body.light .modal {
            background: #fff;
            border-color: #e0e2e8;
        }

        body.light input,
        body.light textarea,
        body.light select {
            background: #f1f3f7;
            border-color: #d0d2d8;
            color: #111;
        }

        body.light .user-item:hover {
            background: #f1f3f7;
        }

        body.light .msg.received {
            background: #e8eaef;
            color: #111;
        }

        body.light .comment {
            border-left-color: #d0d2d8;
        }

        body.blue {
            background: #081421;
            color: #fff;
        }

        body.blue .sidebar,
        body.blue .topbar {
            background: #0b1929;
            border-color: #1a2a3a;
        }

        body.blue .post,
        body.blue .card,
        body.blue .post-box,
        body.blue .modal {
            background: #0b1929;
            border-color: #1a2a3a;
        }

        body.blue input,
        body.blue textarea,
        body.blue select {
            background: #081421;
            border-color: #1a2a3a;
            color: #fff;
        }

        body.blue .user-item:hover {
            background: #0b1929;
        }

        body.blue .msg.received {
            background: #0b1929;
            color: #fff;
        }

        body.blue .comment {
            border-left-color: #1a2a3a;
        }
    </style>
</head>

<body>

    <div id="app">

        <!-- ========== AUTH ========== -->

        <div id="authContainer" class="auth-card">
            <h1>💬 Messenger Lumi</h1>

            <input id="username" placeholder="Username" autocomplete="username" />
            <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />

            <button class="primary" onclick="login()">Войти</button>
            <button class="secondary" onclick="register()">Создать аккаунт</button>

            <p id="authError" class="error"></p>
        </div>

        <!-- ========== APP ========== -->

        <div id="appContainer" class="hidden" style="display:none;width:100%;height:100vh;">

            <!-- SIDEBAR -->

            <aside class="sidebar">
                <div class="logo">💬 Messenger Lumi</div>

                <input id="search" class="search" placeholder="Поиск..." oninput="searchUsers()" />

                <div id="users" class="users"></div>
            </aside>

            <!-- MAIN -->

            <main class="main">

                <div class="topbar">
                    <strong id="pageTitle">📰 Лента</strong>

                    <div class="top-actions">
                        <button class="icon-button" onclick="showFeed()" title="Лента">📰</button>
                        <button class="icon-button" onclick="showFavorites()" title="Избранное">⭐</button>
                        <button class="icon-button" onclick="showSettings()" title="Настройки">⚙️</button>
                        <button class="icon-button" onclick="showProfile()" title="Профиль">👤</button>
                    </div>
                </div>

                <div class="content">

                    <!-- FEED -->

                    <section id="feedView" class="view">
                        <div class="feed">
                            <div class="post-box">
                                <textarea id="postText" placeholder="Что нового?"></textarea>

                                <div class="post-tools">
                                    <button class="primary" onclick="publishPost()">📝 Опубликовать</button>

                                    <label class="primary">
                                        📷 Фото / видео
                                        <input id="mediaFile" type="file" accept="image/*,video/*" hidden onchange="publishMediaPost()" />
                                    </label>
                                </div>
                            </div>

                            <div id="feed"></div>
                        </div>
                    </section>

                    <!-- CHAT -->

                    <section id="chatView" class="view hidden" style="padding:0">
                        <div class="chat">
                            <div id="chatHeader" class="chat-header">Выберите пользователя</div>

                            <div id="messages" class="messages"></div>

                            <div class="composer">
                                <input id="messageInput" placeholder="Сообщение..." onkeydown="messageKey(event)" />
                                <button class="send" onclick="sendMessage()">Отправить ➤</button>
                            </div>
                        </div>
                    </section>

                    <!-- PROFILE -->

                    <section id="profileView" class="view hidden">
                        <div class="profile">
                            <div class="card">
                                <img id="bigAvatar" class="big-avatar" alt="" />

                                <h2>👤 Профиль</h2>

                                <input id="profileUsername" placeholder="Username" />
                                <input id="profileName" placeholder="Имя" />
                                <textarea id="profileBio" placeholder="О себе"></textarea>

                                <p>🖼️ Аватар</p>
                                <input id="avatarFile" type="file" accept="image/*" />

                                <button class="primary" onclick="saveProfile()">Сохранить</button>
                            </div>

                            <div class="card">
                                <h3>👥 Аккаунты</h3>

                                <button class="primary" style="width:100%" onclick="openCreateAccount()">
                                    ➕ Добавить аккаунт
                                </button>

                                <button class="primary" style="width:100%;margin-top:8px" onclick="switchAccount()">
                                    🔄 Переключить аккаунт
                                </button>

                                <button class="danger-button" onclick="logout()">🚪 Выйти</button>
                                <button class="danger-button" onclick="deleteAccount()">🗑️ Удалить этот аккаунт</button>
                            </div>
                        </div>
                    </section>

                    <!-- SETTINGS -->

                    <section id="settingsView" class="view hidden">
                        <div class="profile">
                            <div class="card">
                                <h2>⚙️ Настройки</h2>

                                <div class="setting">
                                    <label>
                                        <span>🌐 Язык</span>
                                        <select id="language" onchange="saveSettings()">
                                            <option value="ru">Русский</option>
                                            <option value="en">English</option>
                                            <option value="be">Беларуская</option>
                                            <option value="kk">Қазақша</option>
                                        </select>
                                    </label>
                                </div>

                                <div class="setting">
                                    <label>
                                        <span>🎨 Тема</span>
                                        <select id="theme" onchange="saveSettings()">
                                            <option value="dark">Тёмная</option>
                                            <option value="light">Светлая</option>
                                            <option value="blue">Синяя</option>
                                        </select>
                                    </label>
                                </div>

                                <div class="setting">
                                    <label>
                                        🔔 Уведомления
                                        <input id="notifications" type="checkbox" onchange="saveSettings()" />
                                    </label>
                                </div>

                                <div class="setting">
                                    <label>
                                        🟢 Показывать онлайн
                                        <input id="showOnline" type="checkbox" onchange="saveSettings()" />
                                    </label>
                                </div>

                                <div class="setting">
                                    <label>
                                        🕒 Показывать время последнего визита
                                        <input id="showLastSeen" type="checkbox" onchange="saveSettings()" />
                                    </label>
                                </div>
                            </div>

                            <div class="card">
                                <h3>👥 Группы</h3>

                                <button class="primary" onclick="openCreateGroup()">➕ Создать группу</button>
                                <div id="groups"></div>
                            </div>

                            <div class="card">
                                <h3>📢 Каналы</h3>

                                <button class="primary" onclick="openCreateChannel()">➕ Создать канал</button>
                                <div id="channels"></div>
                            </div>
                        </div>
                    </section>

                    <!-- FAVORITES -->

                    <section id="favoritesView" class="view hidden">
                        <div class="profile">
                            <div class="card">
                                <h2>⭐ Избранные сообщения</h2>
                                <div id="favorites"></div>
                            </div>
                        </div>
                    </section>

                </div>

            </main>

        </div>

    </div>

    <!-- ========== MODAL ========== -->

    <div id="modalBg" class="modal-bg hidden" onclick="closeModal(event)">
        <div id="modal" class="modal" onclick="event.stopPropagation()"></div>
    </div>

    <!-- ========== SCRIPTS ========== -->

    <script>
        const API = '';

        let token = localStorage.getItem('token') || '';
        let currentUser = null;
        let ws = null;
        let selectedUserId = null;
        let selectedMessageId = null;
        let editingMessageId = null;

        // =========================================================
        // REQUEST
        // =========================================================

        async function request(url, options = {}) {
            const headers = {
                ...options.headers,
            };

            if (!(options.body instanceof FormData)) {
                headers['Content-Type'] = headers['Content-Type'] || 'application/json';
            }

            return fetch(API + url, {
                ...options,
                headers,
                credentials: 'include',
            });
        }

        async function safeJson(response) {
            try {
                return await response.json();
            } catch {
                return {};
            }
        }

        // =========================================================
        // AUTH
        // =========================================================

        async function register() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const error = document.getElementById('authError');
            error.textContent = '';

            if (!username || !password) {
                error.textContent = 'Заполните все поля';
                return;
            }

            const response = await request('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                error.textContent = data.detail || 'Ошибка регистрации';
                return;
            }

            location.reload();
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            const error = document.getElementById('authError');
            error.textContent = '';

            if (!username || !password) {
                error.textContent = 'Заполните все поля';
                return;
            }

            const response = await request('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                error.textContent = data.detail || 'Ошибка входа';
                return;
            }

            location.reload();
        }

        // =========================================================
        // CHECK AUTH
        // =========================================================

        async function checkAuth() {
            const response = await request('/api/me');

            if (!response.ok) {
                document.getElementById('authContainer').style.display = 'block';
                document.getElementById('appContainer').style.display = 'none';
                return;
            }

            const user = await safeJson(response);
            currentUser = user;

            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';

            // Загружаем настройки темы
            await loadSettings();

            // Загружаем пользователей
            await searchUsers();

            // Показываем ленту
            await showFeed();

            // Подключаем WebSocket
            connectWebSocket();
        }

        // =========================================================
        // USERS
        // =========================================================

        async function searchUsers() {
            const q = document.getElementById('search').value.trim();

            const response = await request('/api/users?q=' + encodeURIComponent(q));

            if (!response.ok) return;

            const users = await safeJson(response);

            const container = document.getElementById('users');
            container.innerHTML = '';

            // Всегда показываем свой профиль в списке
            const me = document.createElement('div');
            me.className = 'user-item';
            me.innerHTML = `
                <img class="avatar" src="${currentUser.avatar_url ? mediaUrl(currentUser.avatar_url) : ''}" onerror="this.style.display='none'" />
                <div class="info">
                    <div class="name">${escapeHtml(currentUser.display_name || currentUser.username)} (я)</div>
                    <div class="username">@${escapeHtml(currentUser.username)}</div>
                </div>
            `;
            me.onclick = () => showProfile();
            container.appendChild(me);

            for (const user of users) {
                const div = document.createElement('div');
                div.className = 'user-item';

                const avatar = user.avatar_url ? mediaUrl(user.avatar_url) : '';

                div.innerHTML = `
                    <img class="avatar" src="${avatar}" onerror="this.style.display='none'" />
                    <div class="info">
                        <div class="name">${escapeHtml(user.display_name || user.username)}</div>
                        <div class="username">@${escapeHtml(user.username)}</div>
                        <div class="status ${user.last_seen ? 'online' : 'offline'}">${user.last_seen ? '🟢 онлайн' : '○ офлайн'}</div>
                    </div>
                `;

                div.onclick = () => openChat(user.id);

                container.appendChild(div);
            }
        }

        // =========================================================
        // CHAT
        // =========================================================

        function openChat(userId) {
            selectedUserId = userId;
            showOnly('chatView');

            document.getElementById('pageTitle').textContent = '💬 Чат';

            loadMessages(userId);

            // Подгружаем имя собеседника
            request('/api/users/' + userId)
                .then(r => r.json())
                .then(user => {
                    document.getElementById('chatHeader').textContent =
                        `${escapeHtml(user.display_name || user.username)} (@${escapeHtml(user.username)})`;
                })
                .catch(() => {});
        }

        async function loadMessages(otherUserId) {
            const response = await request('/api/messages/' + otherUserId);

            if (!response.ok) return;

            const messages = await safeJson(response);

            const container = document.getElementById('messages');
            container.innerHTML = '';

            for (const msg of messages) {
                const div = document.createElement('div');
                div.className = 'msg ' + (msg.sender_id === currentUser.id ? 'sent' : 'received');

                let text = msg.deleted ? '<span class="deleted-text">Сообщение удалено</span>' : escapeHtml(msg.text);

                div.innerHTML = `
                    ${text}
                    <span class="time">${formatTime(msg.created_at)}</span>
                    ${msg.edited_at ? ' <span style="font-size:10px;opacity:0.5;">(ред.)</span>' : ''}
                    ${msg.sender_id === currentUser.id && !msg.deleted ? `
                        <div class="msg-actions">
                            <button onclick="openEditMessage(${msg.id}, '${escapeHtml(msg.text)}')">✏️</button>
                            <button onclick="deleteSelectedMessage(${msg.id})">🗑️</button>
                        </div>
                    ` : ''}
                `;

                container.appendChild(div);
            }

            scrollMessages();
        }

        function messageKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            if (!selectedUserId) return;

            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text) return;

            const response = await request('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    receiver_id: selectedUserId,
                    text,
                }),
            });

            if (!response.ok) return;

            input.value = '';
            await loadMessages(selectedUserId);
        }

        function openEditMessage(messageId, text) {
            selectedMessageId = messageId;

            openModal(`
                <h2>✏️ Редактировать сообщение</h2>

                <textarea id="editText" rows="3">${text}</textarea>

                <button class="primary" style="margin-top:10px;width:100%" onclick="saveEditedMessage()">
                    Сохранить
                </button>
            `);
        }

        async function saveEditedMessage() {
            const text = document.getElementById('editText').value.trim();

            if (!text) return;

            const response = await request('/api/messages/' + selectedMessageId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            closeModal();
            await loadMessages(selectedUserId);
        }

        async function deleteSelectedMessage(messageId) {
            if (!messageId) return;

            if (!confirm('Удалить сообщение?')) return;

            const response = await request('/api/messages/' + messageId, {
                method: 'DELETE',
            });

            if (!response.ok) return;

            await loadMessages(selectedUserId);
        }

        // =========================================================
        // FEED
        // =========================================================

        async function loadFeed() {
            const response = await request('/api/feed');

            if (!response.ok) return;

            const posts = await safeJson(response);

            const container = document.getElementById('feed');
            container.innerHTML = '';

            for (const post of posts) {
                renderPost(post);
            }
        }

        function renderPost(post) {
            const container = document.getElementById('feed');

            const article = document.createElement('article');
            article.className = 'post';

            // HEAD
            const head = document.createElement('div');
            head.className = 'post-head';

            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            if (post.avatar_url) {
                avatar.src = mediaUrl(post.avatar_url);
            }
            avatar.onerror = () => avatar.style.display = 'none';
            avatar.onclick = () => viewUserProfile(post.author_id);

            const author = document.createElement('div');
            author.innerHTML = `
                <strong>${escapeHtml(post.display_name || post.username)}</strong>
                <div style="color:#9095a3;font-size:12px">@${escapeHtml(post.username)}</div>
            `;
            author.style.cursor = 'pointer';
            author.onclick = () => viewUserProfile(post.author_id);

            head.appendChild(avatar);
            head.appendChild(author);
            article.appendChild(head);

            // TEXT
            if (post.text) {
                const text = document.createElement('div');
                text.className = 'post-text';
                text.textContent = post.text;
                article.appendChild(text);
            }

            // MEDIA
            if (post.media_url) {
                if (post.media_type === 'video') {
                    const video = document.createElement('video');
                    video.className = 'post-media';
                    video.controls = true;
                    video.src = mediaUrl(post.media_url);
                    article.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.className = 'post-media';
                    img.src = mediaUrl(post.media_url);
                    article.appendChild(img);
                }
            }

            // ACTIONS
            const actions = document.createElement('div');
            actions.className = 'post-actions';

            // Like
            const like = document.createElement('button');
            like.textContent = '❤️ ' + (post.likes || 0);
            like.onclick = async () => {
                const response = await request('/api/posts/' + post.id + '/like', { method: 'POST' });
                const data = await safeJson(response);
                if (response.ok) {
                    like.textContent = '❤️ ' + data.likes;
                }
            };
            actions.appendChild(like);

            // Comments button
            const commentBtn = document.createElement('button');
            commentBtn.className = 'comment-btn';
            commentBtn.textContent = '💬 ' + (post.comments || 0);
            commentBtn.onclick = () => toggleComments(post.id, article);
            actions.appendChild(commentBtn);

            // Copy link
            const copyBtn = document.createElement('button');
            copyBtn.textContent = '🔗';
            copyBtn.title = 'Копировать ссылку на пост';
            copyBtn.onclick = () => copyPostLink(post.id);
            actions.appendChild(copyBtn);

            // Delete (if owner)
            if (Number(post.author_id) === Number(currentUser.id)) {
                const del = document.createElement('button');
                del.textContent = '🗑️';
                del.onclick = async () => {
                    if (!confirm('Удалить пост?')) return;
                    const response = await request('/api/posts/' + post.id, { method: 'DELETE' });
                    if (response.ok) article.remove();
                };
                actions.appendChild(del);
            }

            article.appendChild(actions);

            // Comments container
            const commentsContainer = document.createElement('div');
            commentsContainer.className = 'comments-section hidden';
            commentsContainer.id = 'comments-' + post.id;
            article.appendChild(commentsContainer);

            container.appendChild(article);
        }

        function toggleComments(postId, article) {
            const container = document.getElementById('comments-' + postId);

            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                loadComments(postId, container);
            } else {
                container.classList.add('hidden');
            }
        }

        async function loadComments(postId, container) {
            const response = await request('/api/posts/' + postId + '/comments');

            if (!response.ok) return;

            const comments = await safeJson(response);

            container.innerHTML = '';

            // Comment form
            const form = document.createElement('div');
            form.className = 'comment-form';
            form.innerHTML = `
                <input id="commentInput-${postId}" placeholder="Написать комментарий..." />
                <button onclick="addComment(${postId})">Отправить</button>
            `;
            container.appendChild(form);

            // Comments list
            const list = document.createElement('div');
            list.className = 'comments-list';

            // Build thread
            const byId = {};
            const topLevel = [];

            for (const c of comments) {
                byId[c.id] = { ...c, replies: [] };
            }

            for (const c of comments) {
                if (c.parent_id && byId[c.parent_id]) {
                    byId[c.parent_id].replies.push(c);
                } else {
                    topLevel.push(c);
                }
            }

            const renderComment = (comment, depth = 0) => {
                const div = document.createElement('div');
                div.className = 'comment';
                if (depth > 0) div.style.marginLeft = '20px';

                const head = document.createElement('div');
                head.className = 'comment-head';

                const avatar = document.createElement('img');
                avatar.className = 'avatar';
                if (comment.avatar_url) {
                    avatar.src = mediaUrl(comment.avatar_url);
                }
                avatar.onerror = () => avatar.style.display = 'none';
                avatar.onclick = () => viewUserProfile(comment.user_id);

                const name = document.createElement('span');
                name.className = 'author';
                name.textContent = escapeHtml(comment.display_name || comment.username);
                name.onclick = () => viewUserProfile(comment.user_id);

                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = formatTime(comment.created_at);

                if (comment.reply_to_username) {
                    const replyTo = document.createElement('span');
                    replyTo.style.cssText = 'font-size:12px;color:#555a68;';
                    replyTo.textContent = ' → @' + escapeHtml(comment.reply_to_username);
                    head.append(avatar, name, replyTo, time);
                } else {
                    head.append(avatar, name, time);
                }

                div.appendChild(head);

                const text = document.createElement('div');
                text.className = 'comment-text';
                text.textContent = comment.text;
                div.appendChild(text);

                // Reply button
                const actions = document.createElement('div');
                actions.className = 'comment-actions';

                const replyBtn = document.createElement('button');
                replyBtn.textContent = 'Ответить';
                replyBtn.onclick = () => {
                    const input = document.getElementById('commentInput-' + postId);
                    if (input) {
                        input.value = '@' + comment.username + ' ';
                        input.focus();
                        // Store parent id for reply
                        input.dataset.parentId = comment.id;
                    }
                };
                actions.appendChild(replyBtn);

                // Delete own comment
                if (Number(comment.user_id) === Number(currentUser.id)) {
                    const del = document.createElement('button');
                    del.textContent = '🗑️';
                    del.onclick = async () => {
                        if (!confirm('Удалить комментарий?')) return;
                        const response = await request('/api/comments/' + comment.id, { method: 'DELETE' });
                        if (response.ok) {
                            loadComments(postId, container);
                        }
                    };
                    actions.appendChild(del);
                }

                div.appendChild(actions);

                // Replies
                if (comment.replies && comment.replies.length) {
                    const repliesDiv = document.createElement('div');
                    repliesDiv.className = 'replies';
                    for (const reply of comment.replies) {
                        repliesDiv.appendChild(renderComment(reply, depth + 1));
                    }
                    div.appendChild(repliesDiv);
                }

                return div;
            };

            for (const c of topLevel) {
                list.appendChild(renderComment(c));
            }

            container.appendChild(list);
        }

        async function addComment(postId) {
            const input = document.getElementById('commentInput-' + postId);
            const text = input.value.trim();

            if (!text) return;

            const parentId = input.dataset.parentId ? parseInt(input.dataset.parentId) : null;

            const response = await request('/api/posts/' + postId + '/comments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, parent_id: parentId }),
            });

            if (response.ok) {
                input.value = '';
                delete input.dataset.parentId;
                loadComments(postId, document.getElementById('comments-' + postId));
            }
        }

        function copyPostLink(postId) {
            const url = window.location.origin + '/?post=' + postId;
            navigator.clipboard?.writeText(url).then(() => {
                alert('Ссылка на пост скопирована: ' + url);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                alert('Ссылка на пост скопирована: ' + url);
            });
        }

        // =========================================================
        // USER PROFILE POPUP
        // =========================================================

        async function viewUserProfile(userId) {
            const response = await request('/api/users/' + userId);

            if (!response.ok) return;

            const user = await safeJson(response);

            openModal(`
                <div style="text-align:center">
                    <img src="${user.avatar_url ? mediaUrl(user.avatar_url) : ''}"
                         style="width:80px;height:80px;border-radius:50%;object-fit:cover;background:#2c2d34;margin-bottom:10px;"
                         onerror="this.style.display='none'" />

                    <h2>${escapeHtml(user.display_name || user.username)}</h2>
                    <div style="color:#9095a3">@${escapeHtml(user.username)}</div>

                    ${user.bio ? `<div style="margin:10px 0;padding:10px;background:#141518;border-radius:8px;">${escapeHtml(user.bio)}</div>` : ''}

                    <div style="font-size:13px;color:#555a68;margin-top:6px">
                        Зарегистрирован: ${new Date(user.created_at).toLocaleDateString()}
                    </div>

                    <button class="primary" style="margin-top:16px;width:100%" onclick="closeModal();openChat(${user.id})">
                        💬 Написать сообщение
                    </button>
                </div>
            `);
        }

        // =========================================================
        // PUBLISH POST
        // =========================================================

        async function publishPost() {
            const textarea = document.getElementById('postText');
            const text = textarea.value.trim();

            if (!text) return;

            const response = await request('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            textarea.value = '';
            await loadFeed();
        }

        async function publishMediaPost() {
            const fileInput = document.getElementById('mediaFile');
            const file = fileInput.files[0];

            if (!file) return;

            const text = document.getElementById('postText').value.trim();

            const form = new FormData();
            form.append('text', text);
            form.append('file', file);

            const response = await request('/api/posts/media', {
                method: 'POST',
                body: form,
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка загрузки');
                return;
            }

            document.getElementById('postText').value = '';
            fileInput.value = '';
            await loadFeed();
        }

        // =========================================================
        // PROFILE
        // =========================================================

        async function showProfile() {
            showOnly('profileView');
            document.getElementById('pageTitle').textContent = '👤 Профиль';

            const response = await request('/api/me');

            if (!response.ok) return;

            const user = await safeJson(response);

            document.getElementById('profileUsername').value = user.username || '';
            document.getElementById('profileName').value = user.display_name || '';
            document.getElementById('profileBio').value = user.bio || '';

            const avatar = document.getElementById('bigAvatar');
            if (user.avatar_url) {
                avatar.src = mediaUrl(user.avatar_url);
            } else {
                avatar.removeAttribute('src');
            }
        }

        async function saveProfile() {
            const username = document.getElementById('profileUsername').value.trim();
            const display_name = document.getElementById('profileName').value.trim();
            const bio = document.getElementById('profileBio').value.trim();

            const response = await request('/api/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, display_name, bio }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            const file = document.getElementById('avatarFile').files[0];

            if (file) {
                const form = new FormData();
                form.append('file', file);

                const avatarResponse = await request('/api/avatar', {
                    method: 'POST',
                    body: form,
                });

                if (!avatarResponse.ok) {
                    const avatarData = await safeJson(avatarResponse);
                    alert(avatarData.detail || 'Ошибка аватара');
                    return;
                }
            }

            alert('Профиль сохранён');
            location.reload();
        }

        // =========================================================
        // SETTINGS
        // =========================================================

        async function showSettings() {
            showOnly('settingsView');
            document.getElementById('pageTitle').textContent = '⚙️ Настройки';

            await loadSettings();
            await loadGroups();
            await loadChannels();
        }

        async function loadSettings() {
            const response = await request('/api/settings');

            if (!response.ok) return;

            const data = await safeJson(response);

            document.getElementById('language').value = data.language || 'ru';
            document.getElementById('theme').value = data.theme || 'dark';
            document.getElementById('notifications').checked = Boolean(data.notifications);
            document.getElementById('showOnline').checked = Boolean(data.show_online);
            document.getElementById('showLastSeen').checked = Boolean(data.show_last_seen);

            applyTheme(data.theme || 'dark');
        }

        async function saveSettings() {
            const data = {
                language: document.getElementById('language').value,
                theme: document.getElementById('theme').value,
                notifications: document.getElementById('notifications').checked,
                show_online: document.getElementById('showOnline').checked,
                show_last_seen: document.getElementById('showLastSeen').checked,
            };

            applyTheme(data.theme);

            await request('/api/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });
        }

        function applyTheme(theme) {
            document.body.className = theme;
        }

        // =========================================================
        // GROUPS
        // =========================================================

        function openCreateGroup() {
            openModal(`
                <h2>👥 Новая группа</h2>

                <input id="newGroupName" placeholder="Название" />
                <textarea id="newGroupDescription" placeholder="Описание"></textarea>

                <button class="primary" style="margin-top:10px;width:100%" onclick="createGroup()">
                    Создать
                </button>
            `);
        }

        async function createGroup() {
            const name = document.getElementById('newGroupName').value.trim();
            const description = document.getElementById('newGroupDescription').value.trim();

            const response = await request('/api/groups', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            closeModal();
            loadGroups();
        }

        async function loadGroups() {
            const response = await request('/api/groups');

            if (!response.ok) return;

            const groups = await safeJson(response);

            const container = document.getElementById('groups');
            container.innerHTML = '';

            for (const group of groups) {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <b>👥 ${escapeHtml(group.name)}</b>
                    <div>${escapeHtml(group.description || '')}</div>
                `;
                container.appendChild(div);
            }
        }

        // =========================================================
        // CHANNELS
        // =========================================================

        function openCreateChannel() {
            openModal(`
                <h2>📢 Новый канал</h2>

                <input id="newChannelName" placeholder="Название" />
                <input id="newChannelUsername" placeholder="username канала" />
                <textarea id="newChannelDescription" placeholder="Описание"></textarea>

                <button class="primary" style="margin-top:10px;width:100%" onclick="createChannel()">
                    Создать
                </button>
            `);
        }

        async function createChannel() {
            const name = document.getElementById('newChannelName').value.trim();
            const username = document.getElementById('newChannelUsername').value.trim();
            const description = document.getElementById('newChannelDescription').value.trim();

            const response = await request('/api/channels', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, username, description }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            closeModal();
            loadChannels();
        }

        async function loadChannels() {
            const response = await request('/api/channels');

            if (!response.ok) return;

            const channels = await safeJson(response);

            const container = document.getElementById('channels');
            container.innerHTML = '';

            for (const channel of channels) {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <b>📢 ${escapeHtml(channel.name)}</b>
                    <div>@${escapeHtml(channel.username)}</div>
                    <div>${escapeHtml(channel.description || '')}</div>
                `;
                container.appendChild(div);
            }
        }

        // =========================================================
        // ACCOUNTS
        // =========================================================

        function openCreateAccount() {
            openModal(`
                <h2>➕ Новый аккаунт</h2>

                <input id="secondUsername" placeholder="Username" />
                <input id="secondPassword" type="password" placeholder="Пароль" />

                <button class="primary" style="width:100%" onclick="createSecondAccount()">
                    Создать
                </button>
            `);
        }

        async function createSecondAccount() {
            const username = document.getElementById('secondUsername').value.trim();
            const password = document.getElementById('secondPassword').value;

            const response = await fetch(API + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Ошибка');
                return;
            }

            // Сохраняем аккаунт в localStorage
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');

            // Получаем токен из кук
            const token = document.cookie.split('; ').find(row => row.startsWith('mm_session='));
            const tokenValue = token ? token.split('=')[1] : '';

            accounts.push({ username, token: tokenValue });

            localStorage.setItem('accounts', JSON.stringify(accounts));

            alert('Аккаунт создан');
            closeModal();
        }

        function switchAccount() {
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');

            if (!accounts.length) {
                alert('Дополнительных аккаунтов пока нет');
                return;
            }

            openModal(`
                <h2>🔄 Переключение аккаунта</h2>
                <div id="accountList"></div>
            `);

            const list = document.getElementById('accountList');

            for (const account of accounts) {
                const button = document.createElement('button');
                button.className = 'primary';
                button.style.width = '100%';
                button.style.margin = '5px 0';
                button.textContent = '@' + account.username;
                button.onclick = () => {
                    // Устанавливаем токен в куку
                    document.cookie = 'mm_session=' + account.token + '; path=/; max-age=2592000';
                    location.reload();
                };
                list.appendChild(button);
            }
        }

        // =========================================================
        // DELETE ACCOUNT
        // =========================================================

        async function deleteAccount() {
            if (!confirm('Удалить этот аккаунт навсегда?')) return;

            const password = prompt('Введите пароль для подтверждения:');
            if (password === null) return;

            const response = await request('/api/account', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password }),
            });

            const data = await safeJson(response);

            if (!response.ok) {
                alert(data.detail || 'Не удалось удалить аккаунт');
                return;
            }

            // Убираем текущий аккаунт из сохранённых
            const accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
            const filtered = accounts.filter(a => a.token !== token);
            localStorage.setItem('accounts', JSON.stringify(filtered));

            localStorage.removeItem('token');
            token = '';
            location.reload();
        }

        // =========================================================
        // LOGOUT
        // =========================================================

        function logout() {
            token = '';
            localStorage.removeItem('token');

            if (ws) {
                try { ws.close(); } catch {}
            }

            location.reload();
        }

        // =========================================================
        // FAVORITES
        // =========================================================

        async function showFavorites() {
            showOnly('favoritesView');
            document.getElementById('pageTitle').textContent = '⭐ Избранное';

            const response = await request('/api/favorites');

            if (!response.ok) return;

            const data = await safeJson(response);

            const container = document.getElementById('favorites');
            container.innerHTML = '';

            if (!data.length) {
                container.textContent = 'Избранных сообщений пока нет.';
                return;
            }

            for (const message of data) {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div>${escapeHtml(message.text)}</div>
                    <small style="color:#9095a3">${formatTime(message.created_at)}</small>
                `;
                container.appendChild(div);
            }
        }

        // =========================================================
        // NAVIGATION
        // =========================================================

        function showOnly(id) {
            const views = ['feedView', 'chatView', 'profileView', 'settingsView', 'favoritesView'];

            for (const viewId of views) {
                const element = document.getElementById(viewId);
                if (element) {
                    element.classList.toggle('hidden', viewId !== id);
                }
            }
        }

        function showFeed() {
            showOnly('feedView');
            document.getElementById('pageTitle').textContent = '📰 Лента';
            loadFeed();
        }

        // =========================================================
        // MODALS
        // =========================================================

        function openModal(html) {
            document.getElementById('modal').innerHTML = html;
            document.getElementById('modalBg').classList.remove('hidden');
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalBg')) {
                return;
            }

            document.getElementById('modalBg').classList.add('hidden');
            document.getElementById('modal').innerHTML = '';
            selectedMessageId = null;
        }

        // =========================================================
        // WEBSOCKET
        // =========================================================

        function connectWebSocket() {
            if (!token || !currentUser) return;

            try {
                const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

                ws = new WebSocket(
                    protocol + '//' + location.host + '/ws?token=' + encodeURIComponent(token)
                );

                ws.onmessage = async (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'pong') return;

                        // Обновляем текущий чат при новом сообщении
                        if (selectedUserId) {
                            await loadMessages(selectedUserId);
                        }

                        // Если есть новые сообщения, обновляем список пользователей
                        await searchUsers();
                    } catch {}
                };

                ws.onclose = () => {
                    if (token) {
                        setTimeout(connectWebSocket, 3000);
                    }
                };

            } catch {}
        }

        // =========================================================
        // HELPERS
        // =========================================================

        function scrollMessages() {
            const container = document.getElementById('messages');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function mediaUrl(url) {
            if (!url) return '';
            if (url.startsWith('http://') || url.startsWith('https://')) {
                return url;
            }
            return API + url;
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatTime(value) {
            if (!value) return '';

            let date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                date = new Date(value + 'Z');
            }

            if (Number.isNaN(date.getTime())) {
                return '';
            }

            return date.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
            });
        }

        // =========================================================
        // INIT
        // =========================================================

        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>

</body>
