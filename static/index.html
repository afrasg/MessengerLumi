<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMessenger</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0e1621;
    color:#fff
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.hidden{display:none!important}

.auth{
    width:380px;
    max-width:calc(100% - 30px);
    margin:70px auto;
    background:#17212b;
    padding:30px;
    border-radius:18px
}

.auth h1{text-align:center}

.auth input{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:10px;
    background:#242f3a;
    color:#fff;
    outline:none
}

.auth button{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#2aabee;
    color:#fff
}

#app{
    display:none;
    height:100vh
}

.sidebar{
    width:300px;
    background:#17212b;
    border-right:1px solid #263746;
    display:flex;
    flex-direction:column
}

.logo{
    padding:18px;
    font-size:21px;
    font-weight:bold
}

.search{
    margin:0 12px 12px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#242f3a;
    color:#fff;
    outline:none
}

.users{overflow-y:auto}

.user{
    padding:12px;
    display:flex;
    gap:10px;
    align-items:center;
    cursor:pointer
}

.user:hover{background:#202f3d}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    object-fit:cover;
    background:#2aabee;
    display:flex;
    align-items:center;
    justify-content:center
}

.user-name{font-weight:bold}

.user-username{
    color:#8295a5;
    font-size:12px;
    margin-top:3px
}

.online{
    color:#42d77d;
    font-size:12px
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0
}

.topbar{
    height:62px;
    background:#17212b;
    border-bottom:1px solid #263746;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px
}

.top-actions{
    display:flex;
    gap:7px
}

.icon-button{
    border:0;
    background:#243342;
    color:#fff;
    border-radius:9px;
    padding:9px 12px
}

.content{
    flex:1;
    overflow:hidden;
    position:relative
}

.view{
    height:100%;
    overflow-y:auto;
    padding:20px
}

.chat{
    height:100%;
    display:flex;
    flex-direction:column
}

.chat-header{
    padding:13px 20px;
    background:#17212b;
    border-bottom:1px solid #263746;
    cursor:pointer
}

.chat-status{
    color:#8295a5;
    font-size:12px;
    margin-top:3px
}

.typing{
    color:#2aabee
}

.messages{
    flex:1;
    padding:20px;
    overflow-y:auto
}

.message-wrap{
    position:relative;
    margin:7px 0;
    max-width:70%
}

.message-wrap.mine{
    margin-left:auto
}

.message{
    width:fit-content;
    max-width:100%;
    background:#182533;
    padding:9px 12px;
    border-radius:12px
}

.message.mine{
    margin-left:auto;
    background:#2b5278
}

.message-image{
    max-width:320px;
    max-height:400px;
    border-radius:10px;
    display:block
}

.time{
    color:#a8bac8;
    font-size:11px;
    text-align:right;
    margin-top:4px
}

.message-actions{
    display:none;
    position:absolute;
    right:0;
    top:-34px;
    background:#17212b;
    border:1px solid #304352;
    border-radius:8px;
    padding:3px
}

.message-wrap:hover .message-actions{
    display:flex
}

.message-actions button{
    border:0;
    background:transparent;
    color:#fff;
    padding:6px
}

.editing{
    display:flex;
    gap:6px;
    margin-top:6px
}

.editing input{
    background:#242f3a;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:7px
}

.composer{
    display:flex;
    gap:8px;
    padding:12px;
    background:#17212b
}

.composer input{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px;
    background:#242f3a;
    color:#fff;
    outline:none
}

.send{
    width:52px;
    border:0;
    border-radius:12px;
    background:#2aabee;
    color:#fff
}

.attach{
    width:45px;
    border:0;
    border-radius:12px;
    background:#243342;
    color:#fff
}

.feed{
    max-width:700px;
    margin:auto
}

.post-box,.post{
    background:#17212b;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px
}

.post-box textarea{
    width:100%;
    resize:vertical;
    min-height:80px;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#242f3a;
    color:#fff;
    outline:none
}

.post-tools{
    display:flex;
    gap:8px;
    margin-top:10px
}

.post-tools button{
    border:0;
    background:#2aabee;
    color:#fff;
    padding:9px 13px;
    border-radius:9px
}

.post-header{
    display:flex;
    gap:10px;
    align-items:center
}

.post-header .avatar{
    cursor:pointer
}

.post-author{
    font-weight:bold;
    cursor:pointer
}

.post-username{
    color:#8295a5;
    font-size:12px
}

.post-text{
    white-space:pre-wrap;
    margin:14px 0
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:12px;
    background:#0e1621
}

.post-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px
}

.post-actions button{
    border:0;
    border-radius:8px;
    background:#243342;
    color:#fff;
    padding:8px 12px
}

.comments{
    margin-top:12px
}

.comment{
    background:#202d39;
    padding:9px;
    border-radius:8px;
    margin-top:6px
}

.comment-top{
    display:flex;
    justify-content:space-between;
    gap:10px
}

.comment-author{
    font-weight:bold;
    cursor:pointer
}

.comment-reply{
    color:#8295a5;
    font-size:12px
}

.comment-buttons{
    display:flex;
    gap:5px
}

.comment-buttons button{
    border:0;
    background:transparent;
    color:#8295a5
}

.comment-input{
    display:flex;
    gap:6px;
    margin-top:8px
}

.comment-input input{
    flex:1;
    background:#242f3a;
    border:0;
    padding:9px;
    color:#fff;
    border-radius:8px
}

.comment-input button{
    border:0;
    background:#2aabee;
    color:#fff;
    border-radius:8px
}

.reply-box{
    color:#2aabee;
    font-size:12px;
    margin-top:6px;
    cursor:pointer
}

.profile{
    max-width:600px;
    margin:auto
}

.profile-card,.settings-card{
    background:#17212b;
    border-radius:16px;
    padding:25px;
    margin-bottom:15px
}

.big-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    background:#2aabee;
    display:block;
    margin:auto;
    cursor:pointer
}

.profile input,.profile textarea,
.settings-card input,.settings-card select{
    width:100%;
    margin:7px 0;
    border:0;
    padding:12px;
    border-radius:9px;
    background:#242f3a;
    color:#fff;
    outline:none
}

.primary{
    background:#2aabee;
    border:0;
    color:#fff;
    padding:11px 15px;
    border-radius:9px
}

.danger{
    background:#d84a4a;
    border:0;
    color:#fff;
    padding:11px 15px;
    border-radius:9px;
    margin-top:10px
}

.settings-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid #263746
}

.settings-item:last-child{border-bottom:0}

.account-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px;
    background:#202d39;
    border-radius:10px;
    margin-top:8px
}

.account-left{
    display:flex;
    align-items:center;
    gap:10px
}

.profile-user-card{
    max-width:500px;
    margin:auto;
    background:#17212b;
    border-radius:16px;
    padding:25px;
    text-align:center
}

.profile-user-card .big-avatar{
    cursor:default
}

.back-button{
    border:0;
    background:#243342;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:10px
}

@media(max-width:750px){
    .sidebar{width:75px}
    .logo{font-size:11px;padding:12px 4px}
    .user{padding:10px 5px;justify-content:center}
    .user>div:last-child{display:none}
    .search{margin:5px}
    .view{padding:10px}
    .message-wrap{max-width:85%}
    .top-actions .icon-button{padding:7px}
}
</style>
</head>

<body>

<div class="auth" id="auth">
    <h1>💬 MyMessenger</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Пароль">

    <button onclick="login()">Войти</button>
    <button onclick="register()">Создать аккаунт</button>

    <p id="authError"></p>
</div>


<div id="app">

    <aside class="sidebar">

        <div class="logo">💬 MyMessenger</div>

        <input
            class="search"
            id="search"
            placeholder="Поиск..."
            oninput="searchUsers()"
        >

        <div class="users" id="users"></div>

    </aside>


    <main class="main">

        <div class="topbar">

            <strong id="pageTitle">📰 Лента</strong>

            <div class="top-actions">

                <button class="icon-button" onclick="showFeed()">📰</button>

                <button class="icon-button" onclick="showSettings()">⚙️</button>

            </div>

        </div>


        <div class="content">

            <!-- FEED -->

            <section class="view" id="feedView">

                <div class="feed">

                    <div class="post-box">

                        <textarea
                            id="postText"
                            placeholder="Что нового?"
                        ></textarea>

                        <div class="post-tools">

                            <button onclick="publishPost()">
                                📝 Опубликовать
                            </button>

                            <label class="primary">
                                📷 Фото / видео

                                <input
                                    id="mediaFile"
                                    type="file"
                                    accept="image/*,video/*"
                                    hidden
                                >
                            </label>

                        </div>

                    </div>

                    <div id="feed"></div>

                </div>

            </section>


            <!-- CHAT -->

            <section
                class="view"
                id="chatView"
                style="display:none;padding:0"
            >

                <div class="chat">

                    <div
                        class="chat-header"
                        id="chatHeader"
                        onclick="openSelectedProfile()"
                    >
                        Выберите пользователя
                    </div>

                    <div
                        class="messages"
                        id="messages"
                    ></div>

                    <div
                        class="typing"
                        id="typing"
                        style="padding:0 15px 5px"
                    ></div>

                    <div class="composer">

                        <label class="attach">
                            📷
                            <input
                                id="chatFile"
                                type="file"
                                accept="image/*"
                                hidden
                                onchange="sendChatImage()"
                            >
                        </label>

                        <input
                            id="messageInput"
                            placeholder="Сообщение..."
                            onkeydown="messageKey(event)"
                            oninput="typingEvent()"
                        >

                        <button
                            class="send"
                            onclick="sendMessage()"
                        >
                            ➤
                        </button>

                    </div>

                </div>

            </section>


            <!-- SETTINGS -->

            <section
                class="view"
                id="settingsView"
                style="display:none"
            >

                <div class="profile">

                    <div class="settings-card">

                        <h2>⚙️ Настройки</h2>

                        <div class="settings-item">

                            <span>🌐 Язык</span>

                            <select
                                id="languageSelect"
                                onchange="changeLanguage()"
                            >
                                <option value="ru">Русский</option>
                                <option value="en">English</option>
                            </select>

                        </div>

                        <div class="settings-item">

                            <span>👤 Профиль</span>

                            <button
                                class="primary"
                                onclick="showProfile()"
                            >
                                Изменить
                            </button>

                        </div>

                    </div>


                    <div class="settings-card">

                        <h2>👥 Аккаунты</h2>

                        <p>
                            Здесь можно добавить второй аккаунт
                            и переключаться между ними.
                        </p>

                        <div id="accountsList"></div>

                        <button
                            class="primary"
                            onclick="createAnotherAccount()"
                        >
                            ➕ Добавить аккаунт
                        </button>

                        <br>

                        <button
                            class="danger"
                            onclick="logoutCurrentAccount()"
                        >
                            🚪 Выйти из этого аккаунта
                        </button>

                    </div>

                </div>

            </section>


            <!-- PROFILE -->

            <section
                class="view"
                id="profileView"
                style="display:none"
            >

                <div class="profile">

                    <div class="profile-card">

                        <img
                            id="bigAvatar"
                            class="big-avatar"
                            src=""
                        >

                        <h2>👤 Профиль</h2>

                        <input
                            id="profileUsername"
                            placeholder="Username"
                        >

                        <input
                            id="profileName"
                            placeholder="Имя"
                        >

                        <textarea
                            id="profileBio"
                            placeholder="О себе"
                        ></textarea>

                        <p>🖼️ Новый аватар</p>

                        <input
                            id="avatarFile"
                            type="file"
                            accept="image/*"
                        >

                        <button
                            class="primary"
                            onclick="saveProfile()"
                        >
                            Сохранить профиль
                        </button>

                    </div>

                </div>

            </section>


            <!-- OTHER PROFILE -->

            <section
                class="view"
                id="otherProfileView"
                style="display:none"
            >

                <div class="profile-user-card">

                    <button
                        class="back-button"
                        onclick="goBackFromProfile()"
                    >
                        ← Назад
                    </button>

                    <img
                        id="otherBigAvatar"
                        class="big-avatar"
                    >

                    <h2 id="otherName"></h2>

                    <p id="otherUsername"></p>

                    <p id="otherBio"></p>

                    <button
                        class="primary"
                        onclick="messageOtherUser()"
                    >
                        💬 Написать сообщение
                    </button>

                </div>

            </section>

        </div>

    </main>

</div>


<script>

const API = "";

let token = localStorage.getItem("token");
let currentUser = null;
let selectedUser = null;
let socket = null;
let typingTimer = null;
let currentReplyComment = null;
let previousView = "feedView";


// ========================================================
// HELPERS
// ========================================================

function api(path){
    return API + path;
}

function mediaUrl(url){

    if(!url) return "";

    if(url.startsWith("http"))
        return url;

    return API + url;
}

function escapeHtml(text){

    return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function request(path,options={}){

    options.headers = options.headers || {};

    if(token){
        options.headers.Authorization =
            "Bearer " + token;
    }

    return fetch(api(path),options);
}


// ========================================================
// AUTH
// ========================================================

async function register(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try{

        const response = await fetch(
            api("/api/register"),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if(!response.ok)
            throw new Error(data.detail);

        token = data.token;

        localStorage.setItem("token",token);

        saveAccountToken(username,token);

        await startApp();

    }catch(error){

        document.getElementById("authError").innerText =
            error.message;
    }
}


async function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try{

        const response = await fetch(
            api("/api/login"),
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if(!response.ok)
            throw new Error(data.detail);

        token = data.token;

        localStorage.setItem("token",token);

        saveAccountToken(
            data.user.username,
            token
        );

        await startApp();

    }catch(error){

        document.getElementById("authError").innerText =
            error.message;
    }
}


// ========================================================
// MULTI ACCOUNTS
// ========================================================

function getAccounts(){

    try{
        return JSON.parse(
            localStorage.getItem("accounts") || "[]"
        );
    }catch{
        return [];
    }
}

function saveAccounts(accounts){

    localStorage.setItem(
        "accounts",
        JSON.stringify(accounts)
    );
}

function saveAccountToken(username,token){

    const accounts = getAccounts();

    const index = accounts.findIndex(
        x => x.username === username
    );

    if(index >= 0){
        accounts[index].token = token;
    }else{
        accounts.push({
            username,
            token
        });
    }

    saveAccounts(accounts);
}

function renderAccounts(){

    const container =
        document.getElementById("accountsList");

    if(!container) return;

    const accounts = getAccounts();

    container.innerHTML = "";

    accounts.forEach(account => {

        const div =
            document.createElement("div");

        div.className = "account-item";

        div.innerHTML = `
            <div class="account-left">
                <div class="avatar">👤</div>
                <b>@${escapeHtml(account.username)}</b>
            </div>

            <button
                class="icon-button"
                onclick="switchAccount('${escapeHtml(account.username)}')"
            >
                ${currentUser &&
                  currentUser.username === account.username
                  ? "✓"
                  : "Переключить"}
            </button>
        `;

        container.appendChild(div);
    });
}

function createAnotherAccount(){

    if(socket){
        try{socket.close()}catch{}
    }

    currentUser = null;
    selectedUser = null;

    token = null;

    localStorage.removeItem("token");

    document.getElementById("app").style.display = "none";
    document.getElementById("auth").style.display = "block";

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";

    document.getElementById("authError").innerText =
        "Создай новый аккаунт. Старый сохранён.";

}

function switchAccount(username){

    const account =
        getAccounts().find(
            x => x.username === username
        );

    if(!account) return;

    if(socket){
        try{socket.close()}catch{}
    }

    token = account.token;

    localStorage.setItem("token",token);

    startApp();
}

function logoutCurrentAccount(){

    if(!currentUser) return;

    const accounts = getAccounts()
        .filter(
            x => x.username !== currentUser.username
        );

    saveAccounts(accounts);

    if(socket){
        try{socket.close()}catch{}
    }

    token = null;

    localStorage.removeItem("token");

    currentUser = null;

    location.reload();
}


// ========================================================
// START
// ========================================================

async function startApp(){

    const response =
        await request("/api/me");

    if(!response.ok){

        localStorage.removeItem("token");

        token = null;

        document.getElementById("app").style.display =
            "none";

        document.getElementById("auth").style.display =
            "block";

        return;
    }

    currentUser = await response.json();

    saveAccountToken(
        currentUser.username,
        token
    );

    document.getElementById("auth").style.display =
        "none";

    document.getElementById("app").style.display =
        "flex";

    connectWebSocket();

    searchUsers();

    showFeed();
}


// ========================================================
// WEBSOCKET
// ========================================================

function connectWebSocket(){

    if(!currentUser) return;

    let base;

    if(API){
        base = API;
    }else{
        base =
            location.protocol === "https:"
            ? "https://" + location.host
            : "http://" + location.host;
    }

    const wsBase =
        base
            .replace("https://","wss://")
            .replace("http://","ws://");

    socket = new WebSocket(
        wsBase +
        "/ws/" +
        currentUser.id
    );

    socket.onmessage = event => {

        let data;

        try{
            data = JSON.parse(event.data);
        }catch{
            return;
        }

        if(data.type === "message"){

            const message = data.message;

            if(
                selectedUser &&
                (
                    (
                        message.sender_id === currentUser.id &&
                        message.receiver_id === selectedUser.id
                    )
                    ||
                    (
                        message.sender_id === selectedUser.id &&
                        message.receiver_id === currentUser.id
                    )
                )
            ){

                loadChatMessages();

            }
        }

        if(data.type === "message_updated"){
            loadChatMessages();
        }

        if(data.type === "message_deleted"){
            loadChatMessages();
        }

        if(data.type === "typing"){

            if(
                selectedUser &&
                data.user_id === selectedUser.id
            ){

                document.getElementById("typing")
                    .innerText =
                    data.typing
                    ? "печатает..."
                    : "";
            }
        }
    };

    socket.onclose = () => {

        setTimeout(
            connectWebSocket,
            3000
        );
    };
}


// ========================================================
// USERS
// ========================================================

async function searchUsers(){

    const q =
        document.getElementById("search").value;

    const response =
        await request(
            "/api/users?q=" +
            encodeURIComponent(q)
        );

    if(!response.ok) return;

    const users = await response.json();

    const container =
        document.getElementById("users");

    container.innerHTML = "";

    users.forEach(user => {

        const element =
            document.createElement("div");

        element.className = "user";

        let avatar = user.avatar_url
            ? `<img class="avatar"
                    src="${mediaUrl(user.avatar_url)}">`
            : `<div class="avatar">👤</div>`;

        element.innerHTML = `
            ${avatar}

            <div>
                <div class="user-name">
                    ${escapeHtml(
                        user.display_name ||
                        user.username
                    )}
                </div>

                <div class="user-username">
                    @${escapeHtml(user.username)}
                </div>

                <div class="online">
                    ${isOnline(user.last_seen)
                        ? "● в сети"
                        : "был(а) недавно"}
                </div>
            </div>
        `;

        element.onclick =
            () => openChat(user);

        const avatarElement =
            element.querySelector(".avatar");

        avatarElement.onclick = event => {

            event.stopPropagation();

            openUserProfile(user);
        };

        container.appendChild(element);
    });
}

function isOnline(lastSeen){

    if(!lastSeen) return false;

    const time =
        new Date(
            lastSeen.endsWith("Z")
            ? lastSeen
            : lastSeen + "Z"
        ).getTime();

    return Date.now() - time < 90000;
}


// ========================================================
// CHAT
// ========================================================

async function openChat(user){

    selectedUser = user;

    previousView = "feedView";

    document.getElementById("feedView")
        .style.display = "none";

    document.getElementById("settingsView")
        .style.display = "none";

    document.getElementById("profileView")
        .style.display = "none";

    document.getElementById("otherProfileView")
        .style.display = "none";

    document.getElementById("chatView")
        .style.display = "block";

    document.getElementById("pageTitle")
        .innerText =
        "💬 " +
        (
            user.display_name ||
            user.username
        );

    updateChatHeader();

    loadChatMessages();
}

function updateChatHeader(){

    if(!selectedUser) return;

    document.getElementById("chatHeader")
        .innerHTML = `
            <div>
                👤
                <b>
                    ${escapeHtml(
                        selectedUser.display_name ||
                        selectedUser.username
                    )}
                </b>
            </div>

            <div class="chat-status">
                ${isOnline(selectedUser.last_seen)
                    ? "🟢 в сети"
                    : "был(а) недавно"}
            </div>
        `;
}

async function loadChatMessages(){

    if(!selectedUser) return;

    const response =
        await request(
            "/api/messages/" +
            selectedUser.id
        );

    if(!response.ok) return;

    const history =
        await response.json();

    const messages =
        document.getElementById("messages");

    messages.innerHTML = "";

    history.forEach(addMessage);

    messages.scrollTop =
        messages.scrollHeight;
}

function addMessage(message){

    const container =
        document.getElementById("messages");

    const wrap =
        document.createElement("div");

    const mine =
        message.sender_id === currentUser.id;

    wrap.className =
        "message-wrap " +
        (mine ? "mine" : "");

    let content = "";

    if(message.media_url){

        content += `
            <img
                class="message-image"
                src="${mediaUrl(message.media_url)}"
            >
        `;
    }

    if(message.text){

        content += `
            <div>
                ${escapeHtml(message.text)}
            </div>
        `;
    }

    const date =
        new Date(
            message.created_at.endsWith("Z")
            ? message.created_at
            : message.created_at + "Z"
        );

    wrap.innerHTML = `

        <div class="message">

            ${content}

            <div class="time">

                ${date.toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                )}

                ${
                    mine
                    ? (message.is_read ? " ✓✓" : " ✓")
                    : ""
                }

                ${
                    message.edited
                    ? " · изменено"
                    : ""
                }

            </div>

        </div>

        ${
            mine && !message.media_url
            ?
            `
            <div class="message-actions">

                <button
                    onclick="editMessage(${message.id},'${escapeHtml(message.text)}')"
                >
                    ✏️
                </button>

                <button
                    onclick="deleteMessage(${message.id})"
                >
                    🗑️
                </button>

            </div>
            `
            :
            ""
        }
    `;

    container.appendChild(wrap);
}


async function sendMessage(){

    if(!selectedUser){

        alert("Выбери пользователя");

        return;
    }

    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();

    if(!text) return;

    input.value = "";

    const response =
        await request(
            "/api/messages",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    receiver_id:selectedUser.id,
                    text
                })
            }
        );

    if(!response.ok){

        const data = await response.json();

        alert(
            data.detail ||
            "Ошибка"
        );
    }
}

async function sendChatImage(){

    if(!selectedUser) return;

    const input =
        document.getElementById("chatFile");

    const file =
        input.files[0];

    if(!file) return;

    const form = new FormData();

    form.append("file",file);

    const response =
        await request(
            "/api/messages/media",
            {
                method:"POST",
                body:form
            }
        );

    input.value = "";

    if(!response.ok){

        const data = await response.json();

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    loadChatMessages();
}


async function editMessage(id,text){

    const newText =
        prompt(
            "Изменить сообщение:",
            text
        );

    if(
        newText === null ||
        !newText.trim()
    ) return;

    const response =
        await request(
            "/api/messages/" + id,
            {
                method:"PUT",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({
                    text:newText.trim()
                })
            }
        );

    if(!response.ok){

        const data = await response.json();

        alert(data.detail || "Ошибка");

        return;
    }

    loadChatMessages();
}


async function deleteMessage(id){

    if(!confirm("Удалить сообщение?"))
        return;

    const response =
        await request(
            "/api/messages/" + id,
            {
                method:"DELETE"
            }
        );

    if(!response.ok){

        const data = await response.json();

        alert(data.detail || "Ошибка");

        return;
    }

    loadChatMessages();
}


function messageKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();
    }
}


function typingEvent(){

    if(!socket || !selectedUser) return;

    socket.send(
        JSON.stringify({
            type:"typing",
            receiver_id:selectedUser.id,
            typing:true
        })
    );

    clearTimeout(typingTimer);

    typingTimer =
        setTimeout(() => {

            if(socket){

                socket.send(
                    JSON.stringify({
                        type:"typing",
                        receiver_id:selectedUser.id,
                        typing:false
                    })
                );
            }

        },1000);
}

// PROFILE

function showProfile(){

    hideViews();

    document.getElementById("profileView")
        .style.display = "block";

    document.getElementById("pageTitle")
        .innerText = "⚙️ Профиль";

    document.getElementById("profileUsername")
        .value = currentUser.username;

}


function setAvatar(url){

    const image =
        document.getElementById("bigAvatar");

    if(url){

        image.src =
            mediaUrl(url);

    }else{

        image.removeAttribute("src");
    }
}


async function saveProfile(){

    const username =
        document.getElementById(
            "profileUsername"
        ).value.trim();

    const display_name =
        document.getElementById(
            "profileName"
        ).value.trim();

    const bio =
        document.getElementById(
            "profileBio"
        ).value.trim();

    try{

        const response =
            await request(
                "/api/profile",
                {
                    method:"PUT",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        username,
                        display_name,
                        bio
                    })
                }
            );

        if(!response.ok){

            const data =
                await response.json();

            throw new Error(
                data.detail
            );
        }

        const file =
            document.getElementById(
                "avatarFile"
            ).files[0];

        if(file){

            const form =
                new FormData();

            form.append("file",file);

            const avatarResponse =
                await request(
                    "/api/avatar",
                    {
                        method:"POST",
                        body:form
                    }
                );

            if(!avatarResponse.ok){

                const data =
                    await avatarResponse.json();

                throw new Error(
                    data.detail
                );
            }
        }

        const me =
            await request("/api/me");

        currentUser =
            await me.json();

        saveAccountToken(
            currentUser.username,
            token
        );

        alert("Профиль сохранён!");

        searchUsers();

        showProfile();

    }catch(error){

        alert(error.message);
    }
}

        .innerText =

}


function openSelectedProfile(){

}


function messageOtherUser(){

// ========================================================
// FEED
// ========================================================

function hideViews(){

    [
        "feedView",
        "chatView",
        "settingsView",
        "profileView",
        "otherProfileView"
    ].forEach(id => {

        document.getElementById(id)
            .style.display = "none";
    });
}


function showFeed(){

    hideViews();

    document.getElementById("feedView")
        .style.display = "block";

    document.getElementById("pageTitle")
        .innerText = "📰 Лента";

    loadFeed();
}


async function loadFeed(){

    const response =
        await request("/api/feed");

    if(!response.ok) return;

    const posts =
        await response.json();

    const container =
        document.getElementById("feed");

    container.innerHTML = "";

    posts.forEach(renderPost);
}


function renderPost(post){

    const container =
        document.getElementById("feed");

    const element =
        document.createElement("article");

    element.className = "post";

    const avatar =
        post.avatar_url
        ?
        `<img
            class="avatar"
            src="${mediaUrl(post.avatar_url)}"
        >`
        :
        `<div class="avatar">👤</div>`;

    let media = "";

    if(
        post.media_url &&
        post.media_type === "image"
    ){

        media = `
            <img
                class="post-media"
                src="${mediaUrl(post.media_url)}"
            >
        `;
    }

    if(
        post.media_url &&
        post.media_type === "video"
    ){

        media = `
            <video
                class="post-media"
                controls
                src="${mediaUrl(post.media_url)}"
            ></video>
        `;
    }

    element.innerHTML = `

        <div class="post-header">

            ${avatar}

            <div>

                <div class="post-author">
                    ${escapeHtml(
                        post.display_name ||
                        post.username
                    )}
                </div>

                <div class="post-username">
                    @${escapeHtml(post.username)}
                </div>

            </div>

        </div>

        ${
            post.text
            ?
            `<div class="post-text">
                ${escapeHtml(post.text)}
            </div>`
            :
            ""
        }

        ${media}

        <div class="post-actions">

            <button
                onclick="likePost(${post.id})"
            >
                ❤️ ${post.likes}
            </button>

            <button
                onclick="showComments(${post.id})"
            >
                💬 ${post.comments}
            </button>

            <button
                onclick="sharePost(${post.id})"
            >
                🔗 Поделиться
            </button>

            ${
                post.author_id === currentUser.id
                ?
                `<button
                    onclick="deletePost(${post.id})"
                >
                    🗑️
                </button>`
                :
                ""
            }

        </div>

        <div
            class="comments"
            id="comments-${post.id}"
        ></div>

    `;

    container.appendChild(element);

    const avatarElement =
        element.querySelector(".post-header .avatar");

    avatarElement.onclick = () => {

        openUserProfile({
            id:post.author_id,
            username:post.username,
            display_name:post.display_name,
            avatar_url:post.avatar_url,
            bio:post.author_bio || ""
        });
    };

    element.querySelector(".post-author")
        .onclick = () => {

            openUserProfile({
                id:post.author_id,
                username:post.username,
                display_name:post.display_name,
                avatar_url:post.avatar_url,
                bio:post.author_bio || ""
            });
        };
}


async function publishPost(){

    const text =
        document.getElementById("postText")
            .value.trim();

    const file =
        document.getElementById("mediaFile")
            .files[0];

    if(!text && !file){

        alert(
            "Добавь текст, фото или видео"
        );

        return;
    }

    try{

        if(file){

            const form =
                new FormData();

            form.append("file",file);
            form.append("text",text);

            const response =
                await request(
                    "/api/posts/media",
                    {
                        method:"POST",
                        body:form
                    }
                );

            if(!response.ok){

                const data =
                    await response.json();

                throw new Error(
                    data.detail
                );
            }

        }else{

            const response =
                await request(
                    "/api/posts",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            text
                        })
                    }
                );

            if(!response.ok){

                const data =
                    await response.json();

                throw new Error(
                    data.detail
                );
            }
        }

        document.getElementById("postText")
            .value = "";

        document.getElementById("mediaFile")
            .value = "";

        loadFeed();

    }catch(error){

        alert(error.message);
    }
}


// ========================================================
// LIKE / SHARE
// ========================================================

async function likePost(postId){

    await request(
        "/api/posts/" +
        postId +
        "/like",
        {
            method:"POST"
        }
    );

    loadFeed();
}


async function sharePost(postId){

    const url =
        location.origin +
        location.pathname +
        "?post=" +
        postId;

    try{

        await navigator.clipboard.writeText(url);

        alert("🔗 Ссылка скопирована!");

    }catch{

        prompt(
            "Скопируй ссылку:",
            url
        );
    }
}


// ========================================================
// COMMENTS + REPLIES
// ========================================================

async function showComments(postId){

    const container =
        document.getElementById(
            "comments-" + postId
        );

    if(container.dataset.open === "1"){

        container.innerHTML = "";

        container.dataset.open = "0";

        return;
    }

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments"
        );

    if(!response.ok) return;

    const comments =
        await response.json();

    container.innerHTML = `
        <div class="comment-input">

            <input
                id="comment-${postId}"
                placeholder="Написать комментарий..."
            >

            <button
                onclick="sendComment(${postId})"
            >
                ➤
            </button>

        </div>
    `;

    container.dataset.open = "1";

    comments.forEach(
        comment =>
            renderComment(
                postId,
                comment,
                container
            )
    );
}


function renderComment(postId,comment,container){

    const div =
        document.createElement("div");

    div.className = "comment";

    const replyText =
        comment.reply_to_username
        ?
        `
        <div class="comment-reply">
            ${escapeHtml(comment.username)}
            →
            ${escapeHtml(comment.reply_to_username)}
        </div>
        `
        :
        "";

    div.innerHTML = `

        <div class="comment-top">

            <div>

                <span
                    class="comment-author"
                >
                    ${escapeHtml(
                        comment.display_name ||
                        comment.username
                    )}
                </span>

                ${replyText}

            </div>

            <div class="comment-buttons">

                <button
                    onclick="replyComment(
                        ${postId},
                        ${comment.id},
                        '${escapeHtml(comment.username)}'
                    )"
                >
                    ↩️
                </button>

                ${
                    comment.user_id === currentUser.id
                    ?
                    `
                    <button
                        onclick="deleteComment(
                            ${postId},
                            ${comment.id}
                        )"
                    >
                        🗑️
                    </button>
                    `
                    :
                    ""
                }

            </div>

        </div>

        <div>
            ${escapeHtml(comment.text)}
        </div>

    `;

    container.appendChild(div);
}


function replyComment(
    postId,
    commentId,
    username
){

    currentReplyComment = {
        id:commentId,
        username
    };

    const input =
        document.getElementById(
            "comment-" + postId
        );

    if(input){

        input.placeholder =
            "Ответ @" + username;

        input.focus();
    }
}


async function sendComment(postId){

    const input =
        document.getElementById(
            "comment-" + postId
        );

    const text =
        input.value.trim();

    if(!text) return;

    const body = {
        text
    };

    if(currentReplyComment){

        body.reply_to_id =
            currentReplyComment.id;
    }

    const response =
        await request(
            "/api/posts/" +
            postId +
            "/comments",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify(body)
            }
        );

    if(!response.ok){

        const data =
            await response.json();

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    currentReplyComment = null;

    input.value = "";

    showComments(postId);

    setTimeout(
        () => showComments(postId),
        30
    );
}


async function deleteComment(
    postId,
    commentId
){

    if(!confirm("Удалить комментарий?"))
        return;

    const response =
        await request(
            "/api/comments/" +
            commentId,
            {
                method:"DELETE"
            }
        );

    if(!response.ok){

        const data =
            await response.json();

        alert(
            data.detail ||
            "Ошибка"
        );

        return;
    }

    const container =
        document.getElementById(
            "comments-" + postId
        );

    container.innerHTML = "";
    container.dataset.open = "0";

    showComments(postId);
}


// ========================================================
// DELETE POST
// ========================================================

async function deletePost(postId){

    if(!confirm("Удалить этот пост?"))
        return;

    await request(
        "/api/posts/" +
        postId,
        {
            method:"DELETE"
        }
    );

    loadFeed();
}
